me":"增材制造技术","type":"mcq","q":"SLM用金属粉末含氧量过高时，主要危害是（　）","options":["提高粉末流动性","降低液态金属润湿性，导致分层和裂纹","使激光波长变短","使粉末密度无限增大"],"ans":"B","id":"mz23","orig":-1,"ansText":"降低液态金属润湿性，导致分层和裂纹"},{"ch":"增材制造","chname":"增材制造技术","type":"mcq","q":"SLM工艺流程的正确顺序是（　）","options":["模型准备→材料准备→加工→工作腔准备→后处理","加工→材料准备→模型准备→工作腔准备→后处理","材料准备→工作腔准备→模型准备→加工→后处理","后处理→材料准备→工作腔准备→模型准备→加工"],"ans":"C","id":"mz24","orig":-1,"ansText":"材料准备→工作腔准备→模型准备→加工→后处理"},{"ch":"增材制造","chname":"增材制造技术","type":"fill","q":"增材制造依据三维CAD设计数据，采用离散材料逐层累加制造实体零件，是一种“____”的材料累加制造过程。","ans":"自下而上","id":"fz01","orig":-1},{"ch":"增材制造","chname":"增材制造技术","type":"fill","q":"从加工过程中材料量的变化看，制造技术可分为材料去除（减材制造）、材料成形（等材制造）和____。","ans":"增材制造","id":"fz02","orig":-1},{"ch":"增材制造","chname":"增材制造技术","type":"fill","q":"增材制造的工作过程可划分为数据处理和____两个阶段。","ans":"叠层制作","id":"fz03","orig":-1},{"ch":"增材制造","chname":"增材制造技术","type":"fill","q":"光固化法国际上通称stereo lithography，简称____。","ans":"SL（或SLA）","id":"fz04","orig":-1},{"ch":"增材制造","chname":"增材制造技术","type":"fill","q":"光固化系统光源主要采用波长为____nm的紫外光。","ans":"325~355","id":"fz05","orig":-1},{"ch":"增材制造","chname":"增材制造技术","type":"fill","q":"光固化成形全过程一般分为前处理、分层叠加成形和____三个主要步骤。","ans":"后处理","id":"fz06","orig":-1},{"ch":"增材制造","chname":"增材制造技术","type":"fill","q":"紫外光照射光固化树脂时，被照射部分发生____反应而固化。","ans":"聚合","id":"fz07","orig":-1},{"ch":"增材制造","chname":"增材制造技术","type":"fill","q":"SLM利用高能激光将金属粉末____后快速冷却凝固，得到高致密度、高精度零件。","ans":"完全熔化","id":"fz08","orig":-1},{"ch":"增材制造","chname":"增材制造技术","type":"fill","q":"用于SLM成形的金属粉末，其氧含量一般要求在____ppm以下。","ans":"1000","id":"fz09","orig":-1},{"ch":"增材制造","chname":"增材制造技术","type":"fill","q":"SLM技术适合采用____组分体系级配，以达到较高的铺粉致密度。","ans":"二","id":"fz10","orig":-1},{"ch":"增材制造","chname":"增材制造技术","type":"fill","q":"激光波长越____，金属对激光的吸收率越高。","ans":"短","id":"fz11","orig":-1},{"ch":"增材制造","chname":"增材制造技术","type":"fill","q":"SLM工艺流程包括材料准备、工作腔准备、模型准备、加工及____。","ans":"零件后处理","id":"fz12","orig":-1},{"ch":"增材制造","chname":"增材制造技术","type":"term","q":"增材制造","ans":"依据三维CAD设计数据，采用液体、粉末、丝等离散材料逐层累加制造实体零件的制造技术；与传统减材、等材制造不同，是“自下而上”的材料累加过程。","id":"tz01","orig":-1},{"ch":"增材制造","chname":"增材制造技术","type":"term","q":"光固化法（SLA）","ans":"利用光能的化学和热作用使液态光敏树脂固化，控制光能形状逐层固化树脂、堆积成形三维实体的方法；国际上通称stereolithography（SL），常按设备名称称为SLA法。","id":"tz02","orig":-1},{"ch":"增材制造","chname":"增材制造技术","type":"term","q":"层间台阶效应","ans":"光固化成形中因分层制造在制件曲面留下的台阶状痕迹，SLA制件表面一般约为0.05～0.1mm，需通过打磨等后处理改善表面质量。","id":"tz03","orig":-1},{"ch":"增材制造","chname":"增材制造技术","type":"term","q":"激光选区熔化（SLM）","ans":"利用高能激光热源将金属粉末完全熔化后快速冷却凝固，逐层成形高致密度、高精度金属零部件的增材制造技术。","id":"tz04","orig":-1},{"ch":"增材制造","chname":"增材制造技术","type":"term","q":"振实密度","ans":"粉末经振动摇实后的密度。SLM铺粉时铺粉辊有振动和轻压作用，采用振实密度比松装密度更合理；铺粉密度越高，成形件致密度通常越高。","id":"tz05","orig":-1},{"ch":"增材制造","chname":"增材制造技术","type":"term","q":"粒径分布","ans":"不同粒径颗粒在粉末中所占的分量。SLM可通过二组分体系级配优化粒径分布，提高铺粉致密度和成形件致密度。","id":"tz06","orig":-1},{"id":"ez01","ch":"增材制造","chname":"增材制造技术","type":"essay","q":"增材制造的定义是什么？它与减材制造、等材制造有何区别？工作过程分为哪两个阶段？","ans":"增材制造是依据三维CAD设计数据，采用液体、粉末、丝等离散材料逐层累加制造实体零件的制造技术，是一种“自下而上”的材料累加过程。与减材制造利用刀具或电化学方法去除毛坯材料、等材制造利用模具使液体或固体材料成形不同，增材制造以材料逐层累加为本质特征。其工作过程分为两个阶段：数据处理阶段对三维CAD模型进行分层“切片”，把三维数据分解为若干二维轮廓数据；叠层制作阶段按二维数据逐层制作与分层厚度相同的薄片实体，并将薄片自下而上叠加成三维实体。","anstext":"增材制造是依据三维CAD设计数据，采用液体、粉末、丝等离散材料逐层累加制造实体零件的制造技术，是一种“自下而上”的材料累加过程。与减材制造利用刀具或电化学方法去除毛坯材料、等材制造利用模具使液体或固体材料成形不同，增材制造以材料逐层累加为本质特征。其工作过程分为两个阶段：数据处理阶段对三维CAD模型进行分层“切片”，把三维数据分解为若干二维轮廓数据；叠层制作阶段按二维数据逐层制作与分层厚度相同的薄片实体，并将薄片自下而上叠加成三维实体。","src":"课件","srcnote":"第四章 增材制造技术 4.1.1/4.1.2","full":8,"pts":[{"t":"增材制造依据三维CAD设计数据，采用液体、粉末、丝等离散材料逐层累加制造实体零件，是“自下而上”的材料累加过程。","k":["三维CAD","离散材料","逐层累加","自下而上"]},{"t":"减材制造是材料去除，等材制造是通过模具使材料成形（材料变形）；增材制造是材料逐层累加，三者材料量变化方式不同。","k":["减材制造","材料去除","等材制造","模具","增材制造"]},{"t":"工作过程分两个阶段：数据处理——对三维CAD模型分层切片，分解为二维轮廓数据；叠层制作——按二维数据逐层制作薄片并叠加成三维实体。","k":["数据处理","切片","二维轮廓","叠层制作","三维实体"]}],"basis":"第四章 4.1 增材制造概念与工作过程","orig":-1},{"id":"ez02","ch":"增材制造","chname":"增材制造技术","type":"essay","q":"光固化成形的工作原理是什么？成形全过程包括哪些步骤？后处理为什么必须排出残留树脂？","ans":"光固化法利用光能的化学和热作用使液态光敏树脂固化，控制光能的形状逐层固化树脂，堆积成形出所需的三维实体零件；国际上通称stereolithography（SL），也常称为SLA法。成形全过程分为前处理、分层叠加成形和后处理：前处理包括三维模型构造、模型近似处理、选择成形方向、切片处理和生成支撑结构；分层叠加成形由模型断面逐层制作并叠加；后处理包括取出制件、排出未固化树脂、表面清洗、后固化、去除支撑、机械加工和打磨。必须排出残留树脂，是因为残留树脂会在后固化或储存过程中发生暗反应，固化收缩并引起制件变形；内部封闭时应设计排液孔或成形后钻孔排液。SLA制件表面还会留下约0.05～0.1mm的层间台阶，需要打磨。","anstext":"光固化法利用光能的化学和热作用使液态光敏树脂固化，控制光能的形状逐层固化树脂，堆积成形出所需的三维实体零件；国际上通称stereolithography（SL），也常称为SLA法。成形全过程分为前处理、分层叠加成形和后处理：前处理包括三维模型构造、模型近似处理、选择成形方向、切片处理和生成支撑结构；分层叠加成形由模型断面逐层制作并叠加；后处理包括取出制件、排出未固化树脂、表面清洗、后固化、去除支撑、机械加工和打磨。必须排出残留树脂，是因为残留树脂会在后固化或储存过程中发生暗反应，固化收缩并引起制件变形；内部封闭时应设计排液孔或成形后钻孔排液。SLA制件表面还会留下约0.05～0.1mm的层间台阶，需要打磨。","src":"课件","srcnote":"第四章 增材制造技术 4.2.1/4.2.3","full":10,"pts":[{"t":"利用光能的化学和热作用使液态光敏树脂固化，控制光能形状逐层固化树脂，堆积成形三维实体；国际上通称stereolithography（SL/SLA）。","k":["光能","光敏树脂","固化","逐层","SLA"]},{"t":"全过程分前处理、分层叠加成形、后处理：前处理包括建模、近似处理、选择成形方向、切片、生成支撑；分层叠加由模型断面逐层制作并叠加。","k":["前处理","分层叠加","后处理","切片","支撑"]},{"t":"后处理包括取出制件、排出未固化树脂、表面清洗、后固化、去除支撑、机械加工和打磨；层间台阶约0.05~0.1mm。","k":["排出","清洗","后固化","去支撑","打磨","0.05"]},{"t":"必须排出残留树脂，因为残留树脂在后固化或储存中发生暗反应，固化收缩引起制件变形；内部封闭时需在设计时开排液孔或成形后钻孔。","k":["暗反应","收缩","变形","排液孔"]}],"basis":"第四章 4.2 光固化制造技术","orig":-1},{"id":"ez03","ch":"增材制造","chname":"增材制造技术","type":"essay","q":"SLM对金属粉末有哪些主要要求？粉末的球形度、粒径分布、流动性和含氧量如何影响成形质量？","ans":"SLM对金属粉末的堆积特性、粒径分布、颗粒形状、流动性、含氧量和激光吸收率均有较严格的要求。铺粉时宜采用振实密度；颗粒球形度增加、表面更光滑时，粉末床孔隙率降低。气雾化粉末接近球形，旋转电极法制备的粉末球形度更高、表面更光洁、孔隙率更低。采用二组分体系级配可提高铺粉致密度；旋转电极粉末颗粒间以滚动摩擦为主，流动性好，与气雾化粉混合可利用滚珠效应改善流动性。粉末含氧量一般要求≤1000ppm；表面氧化膜会降低液态金属与基板或已凝固部分的润湿性，导致制件分层和裂纹、降低致密度。激光波长越短，金属对激光的吸收率越高。","anstext":"SLM对金属粉末的堆积特性、粒径分布、颗粒形状、流动性、含氧量和激光吸收率均有较严格的要求。铺粉时宜采用振实密度；颗粒球形度增加、表面更光滑时，粉末床孔隙率降低。气雾化粉末接近球形，旋转电极法制备的粉末球形度更高、表面更光洁、孔隙率更低。采用二组分体系级配可提高铺粉致密度；旋转电极粉末颗粒间以滚动摩擦为主，流动性好，与气雾化粉混合可利用滚珠效应改善流动性。粉末含氧量一般要求≤1000ppm；表面氧化膜会降低液态金属与基板或已凝固部分的润湿性，导致制件分层和裂纹、降低致密度。激光波长越短，金属对激光的吸收率越高。","src":"课件","srcnote":"第四章 增材制造技术 4.3.1/4.3.2","full":10,"pts":[{"t":"SLM对粉末的堆积特性、粒径分布、颗粒形状、流动性、含氧量和激光吸收率均有较严格要求。","k":["堆积特性","粒径分布","颗粒形状","流动性","含氧量","吸收率"]},{"t":"铺粉宜用振实密度；球形度增加、表面更光滑时孔隙率降低；气雾化粉接近球形，旋转电极粉球形度更高、表面更光洁、孔隙率更低。","k":["振实密度","球形度","孔隙率","气雾化","旋转电极"]},{"t":"采用二组分粒径级配可提高铺粉致密度；旋转电极粉滚动摩擦小、流动性好，混合后可利用滚珠效应改善流动性。","k":["二组分","级配","流动性","滚珠效应"]},{"t":"粉末含氧量一般要求≤1000ppm；氧化膜降低液态金属与基板/已凝固部分的润湿性，导致分层和裂纹、降低致密度；激光波长越短，金属吸收率越高。","k":["1000ppm","氧化膜","润湿性","分层","裂纹","波长"]}],"basis":"第四章 4.3 激光选区熔化技术","orig":-1},{"id":"ez04","ch":"增材制造","chname":"增材制造技术","type":"essay","q":"增材制造技术有哪些主要特点和局限？其发展趋势是什么？","ans":"增材制造的主要特点：适合复杂结构的快速制造，把三维实体加工变为若干二维平面加工，可制造传统方法难加工甚至无法加工的结构；适合个性化定制和小批量生产；适合高附加值产品的制造。主要局限：技术成熟度低于传统机加工、铸锻焊和模具工艺；材料种类有限、制件精度较低；加工速率较低、零件尺寸受限（最大约2m）、成本高、稳定性差；目前难以替代传统制造工艺，而是传统技术的发展和补充。发展趋势：由快速原型向功能零件制造发展；由常规尺度制造向微纳和大型化等多尺度制造拓展；由工业应用型向日常消费型发展。","anstext":"增材制造的主要特点：适合复杂结构的快速制造，把三维实体加工变为若干二维平面加工，可制造传统方法难加工甚至无法加工的结构；适合个性化定制和小批量生产；适合高附加值产品的制造。主要局限：技术成熟度低于传统机加工、铸锻焊和模具工艺；材料种类有限、制件精度较低；加工速率较低、零件尺寸受限（最大约2m）、成本高、稳定性差；目前难以替代传统制造工艺，而是传统技术的发展和补充。发展趋势：由快速原型向功能零件制造发展；由常规尺度制造向微纳和大型化等多尺度制造拓展；由工业应用型向日常消费型发展。","src":"课件","srcnote":"第四章 增材制造技术 4.1.3/4.1.6","full":10,"pts":[{"t":"特点：适合复杂结构快速制造，将三维加工变为二维平面加工，可制造传统方法难加工或无法加工的结构；适合个性化定制和小批量；适合高附加值产品。","k":["复杂结构","二维平面","个性化","小批量","高附加值"]},{"t":"局限：技术成熟度低于传统机加工、铸锻焊和模具工艺；材料种类有限、制件精度较低；加工速率低、尺寸受限、成本高、稳定性差。","k":["成熟度","材料种类","精度","尺寸","成本","稳定性"]},{"t":"增材制造目前难以替代传统制造工艺，而是传统技术的发展和补充。","k":["难以替代","补充"]},{"t":"趋势：由快速原型向功能零件制造发展；由常规尺度向微纳和大型化等多尺度拓展；由工业应用型向日常消费型发展。","k":["快速原型","功能零件","微纳","大型化","日常消费"]}],"basis":"第四章 4.1 增材制造特点与发展趋势","orig":-1}]
const SPEED_DATA = ["焊冶是“再熔炼”，普冶是“提炼”；原材料和目的均不同。","焊条加热三大热源：电阻热、电弧热、化学反应热（仅占1%～3%，可忽略）。","碱性焊条以短路过渡+大颗粒过渡为主，酸性焊条以细颗粒过渡+附壁过渡为主。","保护方式五种：渣保护、气保护、气渣联合保护、真空保护、自保护。","反应区三段：药皮（先蒸发水分）→熔滴（1800～2400℃、10³～10⁴cm²/kg、0.01～0.1s）→熔池（1600～1900℃、3～130cm²/kg、3～8s）。","氮源空气、氢源水分；控氮靠保护+Ti/Al/Zr，控氢靠烘干+氟化物，控氧靠工艺+冶金。","氢脆是暂态现象（可时效消除）；氢白点（鱼眼）直径0.5～3mm；氢致冷裂纹三要素：H、M、R。","熔渣碱度B＞1碱性、B＜1酸性；CaF2降粘度、降表面张力；表面张力金属键最大。","脱氧三步：先期（药皮固态加热，Al、Ti大量烧损）→沉淀（熔滴与熔池）→扩散（降温、酸性渣有利）。","硫害热裂（Fe+FeS共晶985℃），磷害冷脆热裂（Fe+Fe3P共晶1050℃）；脱硫常用Mn。","合金过渡系数η：元素越活泼越低、沸点低越低；Kb↑η↓；I↑η↓；氩弧焊η较大。","E4303（J422）钛钙型酸性、气渣联合保护；E5015（J507）低氢型碱性、塑韧性好、用于重要结构。","药皮“七剂”：稳弧、造渣、造气、脱氧、合金、粘结、增塑。","立、仰、横焊要“短渣”——凝固温度范围窄、快速凝固；氧化铁型长渣不行。","飞溅影响因素：粘度↑、电流↑、水分↑、电压↑、交流＞直流、大颗粒过渡。","焊剂=焊条药皮、焊丝=焊条焊芯；焊剂三种制造方法：熔炼、粘结（陶质，400℃以下）、烧结（400～1000℃）。","焊剂质量：含水量≤0.10%、机械夹杂物≤0.30%、S≤0.060%、P≤0.080%。","熔池凝固五特点：过热度大、过冷度大、烧损大、结晶速度快、运动态结晶。","结晶五形态随成分过冷增大：平面→胞状→胞状树枝→树枝→等轴。","偏析三种：显微（枝晶间）、区域（杂质推向中心）、层状（结晶潜热周期性变化）。","气孔三兄弟：氢-表面喇叭口、氮-表面蜂窝成堆、CO-内部条虫沿柱状晶。","铁素体四类：PF晶界、FSP侧板条（无碳贝氏体）、AF针状（500℃）、FGF细晶（贝氏铁素体）。","上贝羽毛状、下贝针状强韧；板条马氏体位错、片状马氏体孪晶（C≥0.4%）。","焊接缺欠六类：裂纹、孔穴、固体夹杂、未熔合及未焊透、形状和尺寸不良、其他；裂纹最危险、绝对不允许存在。","热循环四参数：加热速度、最高温度、相变以上停留时间、冷却速度（t8/5等）。","手工焊高温停留4～20s、埋弧自动焊30～100s；加热快几十到几百倍、温度高100～200℃。","45钢CCT右移（淬硬↑，无碳化物溶解+组织粗化）；40Cr CCT左移（淬硬↓，Cr未充分溶入奥氏体）。","不易淬火钢HAZ分区：熔合区（窄）、过热区（韧性低）、相变重结晶区（细）、不完全重结晶区（不均）。","碳当量公式适用性：CE(IIW)适用σb=400～700MPa，Ceq(WES)适用σb=500～1000MPa，Pcm适用C≤0.17%。","HAZ脆化六类：粗晶、组织、析出、热应变时效（动应变时效200～400℃）、氢、石墨；M-A组元是组织脆化主因之一。","动应变时效脆化在200～400℃；调质钢回火温度越低、焊后软化越严重。","增材制造：三维CAD→分层切片→离散材料逐层累加，是“自下而上”的材料累加；与减材、等材并列。","五种常规增材制造：SLA 1986 Hull；LOM 1988 Feygin；SLS 1989 Deckard；FDM 1992 Crump；3DP 1993 Sachs。","光固化：紫外光325~355nm使光敏树脂聚合；XY扫描便宜且可大幅面但慢，振镜快但贵、范围小；后处理排残树脂防暗反应变形，层间台阶0.05~0.1mm。","SLM粉末：铺粉用振实密度；球形度↑孔隙率↓；气雾化粉近球形、旋转电极粉更光洁；二组分体系级配；氧≤1000ppm；短波长吸收率高。","SLM流程：材料准备→工作腔准备→模型准备（STL切片）→加工→后处理；优点细晶高致密，缺点球化/翘曲/裂纹、尺寸受限、参数复杂。"];
const NOTES_HTML = "<h1 class=\"n1\">材料连接与增材制造原理</h1><p>第一至四章及增材制造技术 知识点梳理与快速复习题库（依据课程PPT整理）</p><p>使用说明：本资料依据《材料连接与增材制造原理》课程第1至4章及增材制造技术PPT整理，包含三部分——各章知识点梳理、快速复习题（单项选择题与填空题）以及各章参考答案，书末附高频考点一句话速记。建议先通读知识点，再闭卷完成练习并对照答案，最后用速记表快速回顾。</p><h1 class=\"n1\">第一部分　各章知识点梳理</h1><h2 class=\"n2\">第一章　焊接化学冶金</h2><h3 class=\"n3\">§1　焊接化学冶金过程的特点</h3><p>焊接化学冶金过程：熔化焊时，焊接区内各种物质（气体、液态金属、熔渣）之间在高温下相互作用的过程；焊缝相当于“高炉”，是金属在焊接条件下的再熔炼过程。</p><p>与普通化学冶金比较：相同点——均属金属冶炼加工；不同点——原材料不同（普冶用矿石、焦炭、废钢铁，焊冶用焊条、焊丝、焊剂），目的不同（普冶提炼金属，焊冶再熔炼以满足构件性能）。</p><p>焊条加热的三类热源：电阻热（电流通过焊芯产生）、电弧热（电弧传给焊条端部）、化学反应热（药皮化学物质反应产生，仅占1%～3%，可忽略）。</p><p>熔滴过渡形式：短路过渡（短路→电弧熄灭→熔滴过渡→电弧重燃）；颗粒状过渡（电弧足够长、不短路）；附壁过渡（熔滴沿药皮套筒壁向熔池过渡）；渣保护过渡（埋弧焊渣壁过渡）。</p><p>按熔滴尺寸分：颗粒过渡（熔滴尺寸大于焊丝直径）、喷射过渡（熔滴尺寸等于或小于焊丝直径）。碱性焊条以短路过渡和大颗粒过渡为主；酸性焊条以细颗粒过渡和附壁过渡为主。</p><p>短路过渡特点：燃弧、短路交替进行；电弧稳定、飞溅较小、过渡频率高（每秒几十次至一百多次）、焊缝成形良好；用于φ1.6mm以下细丝CO2气体保护焊或低电压小电流的碱性焊条焊条电弧焊，广泛用于薄板结构及全位置焊接。</p><p>熔滴特征：温度高（实测碳钢焊条2100～2700K，电流增大温度升高、焊丝直径增大温度降低）；比表面积大；存在时间短（0.01～0.1s）；与熔渣强烈混合。</p><p>熔池特征：质量轻、体积小（手工焊0.6～16g）；温度不均匀；液态金属不断运动；存在时间短（几秒至几十秒）；周围散热条件好。</p><div class=\"tbl\"><table><thead><tr><th>保护方式</th><th>典型焊接方法</th></tr></thead><tbody><tr><td>渣保护</td><td>埋弧焊、电渣焊</td></tr><tr><td>气保护</td><td>气焊、TIG焊</td></tr><tr><td>气渣联合保护</td><td>具有造气成分的焊条和药芯焊丝</td></tr><tr><td>真空保护</td><td>真空电子束焊接</td></tr><tr><td>自保护</td><td>含脱氧、脱氮剂的自保护焊丝</td></tr></tbody></table></div><div class=\"tbl\"><table><thead><tr><th>冶金反应区</th><th>温度</th><th>比表面积</th><th>反应时间</th></tr></thead><tbody><tr><td>药皮反应区</td><td>T&gt;100℃水分蒸发；有机物分解生成CO、CO2、H2；碳酸盐和高价氧化物分解生成CO2、O2；铁合金氧化</td><td>—</td><td>—</td></tr><tr><td>熔滴反应区</td><td>1800～2400℃</td><td>10³～10⁴ cm²/kg</td><td>0.01～0.1s</td></tr><tr><td>熔池反应区</td><td>1600～1900℃</td><td>3～130 cm²/kg</td><td>SMAW 3～8s；SAW 6～25s</td></tr></tbody></table></div><p>熔合比θ：焊缝金属中局部熔化的母材所占比例。焊接电流增大，熔滴停留时间缩短、熔滴变细，冶金反应不充分；焊接电压增大，熔滴停留时间增长、熔滴变粗，冶金反应充分。</p><h3 class=\"n3\">§2　气相对金属的作用</h3><p>焊接区气体来源：焊接材料；气体介质；焊丝和母材表面的油锈等杂质；金属和熔渣蒸发产生的气体。</p><p>有机物分解：淀粉、纤维素、糊精受热热氧化分解；纤维素烘干温度不超过200℃，一般150℃左右。碳酸盐分解：CaCO3、MgCO3、BaCO3、白云石CaMg(CO3)2，碳酸盐烘干温度≤450℃、白云石≤300℃，粒度小易分解。</p><p>简单气体分解：N2、H2、O2；复杂气体分解：CO2、H2O。</p><p>氮的作用：来源主要是空气。Cu、Ni不与氮作用，可用N作保护气；Fe、Ti与氮作用（能溶解氮并形成氮化物），须防止焊缝氮化。</p><p>氮的危害：气孔（温度降低溶解度下降）；脆化和时效脆化（N与Fe生成Fe4N脆化，Ti、V与N生成TiN、VN可消除时效脆化）；有利一面——可作为合金元素提高钢的强度（如15MnVN）。</p><p>控制焊缝含氮量：加强保护（药皮重量系数Kb增大保护效果增强）；电流增大、过渡频率增大则含氮量降低，电压增大含氮量增大；直流正接含氮量增大；增加含碳量（降低N溶解度、生成CO/CO2加强保护、熔池沸腾利于N逸出）；Ti、Al、Zr和稀土形成稳定氮化物并减少NO分压。</p><p>氢的作用：来源为焊接材料（药皮、焊剂、药芯）中水分、含氢物质及电弧周围空气水分。Zr、Ti、V、Ta、Nb形成稳定氢化物（放热反应）；Al、Fe、Ni、Cu、Cr、Mo不形成稳定氢化物（吸热反应）。</p><p>影响氢在钢中溶解度：温度升高溶解度增大；Ti、Zr、Nb等使溶解度增大，C、Si、Al、O等使溶解度降低；面心立方晶格中的溶解度大于体心立方晶格；位错等缺陷和应力也有影响。</p><p>氢的存在形式：扩散氢（原子或质子形式，可在晶格中自由扩散）；残余氢（聚集到晶格缺陷、显微裂纹和非金属夹杂边缘空隙，结合成分子不能自由扩散）。总含氢量=扩散氢+剩余氢；放置时间延长，扩散氢减少、残余氢增多。</p><p>扩散氢测定：甘油法；水银法较准确。扩散氢系数D：铁素体＞马氏体＞奥氏体，故选用奥氏体焊缝可防止氢致裂纹。</p><p>氢的危害：氢脆（室温附近氢溶于晶格使钢塑性严重下降，δ、ψ降低，加载快不造成氢脆）；氢白点（鱼眼，肉眼可见直径0.5～3mm，中心有气孔或小夹渣、外围有塑性断裂痕迹，铁素体中扩散快不出现、奥氏体中不出现，碳钢及Cr、Ni、Mo合金化焊缝敏感）；气孔；氢致裂纹（冷裂纹，三要素为H含氢多、M马氏体结构、R拘束度）。</p><p>控制氢的措施：限制氢来源（药皮、焊剂、工件、焊丝中的水分，焊前烘干）；冶金措施（药皮和焊剂中加入氟化物、控制材料氧化势、脱氢处理）；清除焊丝和焊件表面杂质；控制焊接工艺参数；焊后脱氢处理（350℃×1h或250℃×6h）。</p><p>氧的作用：Mg、Al不溶解氧但焊接时剧烈氧化；Fe、Ni、Cu、Ti有限溶解氧且焊接时也氧化。液态铁中氧以原子氧和FeO形式存在；温度升高含氧量增大，合金元素使含氧量降低；α-Fe中氧几乎不溶解。</p><p>氧化还原方向判据：分解压pO2与实际分压比较。CO2对金属的氧化：温度升高氧化性增强，可用Si、Mn脱氧；H2O温度升高氧化性越强。</p><p>氧的危害：力学性能下降（强度、塑性、韧性降低）；工艺性能变差（CO气孔、飞溅）；合金氧化（烧损有益合金元素）。控制氧：限制氧来源；工艺条件（电压增大含氧量增大、电流增大含氧量降低）；冶金处理。</p><h3 class=\"n3\">§3　熔渣及其对金属的作用</h3><p>熔渣作用：机械保护作用（防止氧化和氮化）；改善焊接工艺性能（加低电离势物质易引弧）；冶金处理作用（脱O、S、P，去H，合金化）。</p><p>熔渣分类：盐型（氟盐、氯盐和不含氧的化合物，如NaCl、KCl）；盐—氧化物型（氟化物和强金属氧化物，如CaO、Al2O3）；氧化物型（金属氧化物，氧化性强）。</p><p>熔渣结构理论：分子理论（液态熔渣由化合物分子组成，氧化物及其复合物处于平衡状态，只有自由氧化物才能参加反应，(FeO)2·SiO2中的FeO不能参加反应）；离子理论（液态熔渣由阴阳离子组成电中性溶液，离子分布聚集取决于综合矩，综合矩越大静电场越强，熔渣与金属作用是原子和离子交换电荷的过程）。</p><p>熔渣碱度：分子理论B＞1（1.3）为碱性、B=1中性、B＜1酸性；离子理论以自由氧离子浓度（活度）定义碱度，自由氧离子浓度越高，碱性越强。</p><p>熔渣粘度：温度升高粘度降低；长渣凝固温度范围大、短渣凝固温度范围小；含SiO2的酸性渣粘度下降较慢；酸性渣SiO2增多粘度增大、CaO增多粘度降低，碱性渣反之；无论酸碱性，CaF2均使粘度降低。</p><p>熔渣表面张力：金属键最大、离子键较大、共价键最小；碱性渣加入CaO、MgO（综合矩大）表面张力增大；酸性渣SiO2使表面张力降低；CaF2使表面张力降低；温度升高表面张力降低。</p><p>熔渣熔点：造渣温度为药皮开始熔化的温度；熔渣熔点比焊缝金属熔点低200～450℃，一般为1150～1350℃。</p><p>活性熔渣氧化两种形式：扩散氧化（分配常数随温度升高而降低，发生在高温液态区——熔滴阶段和熔池前部；碱性焊条对铁锈氧化皮敏感因FeO活度大，但碱性焊条焊缝含氧量低于酸性焊条，因其氧化势小）；置换氧化（熔滴阶段最剧烈、在熔池前部高温区；焊缝增氧的同时也增Si、Mn，起合金化作用）。</p><p>焊剂活度AF：大于0.6为高活性，0.6～0.3为活性，0.3～0.1为低活性，不大于0.1为惰性；活度越大焊缝含氧量越高。</p><p>脱氧目的：减少焊缝含氧量。脱氧剂选取原则：对氧的亲和力比被焊金属大（Al、Ti、Si、Mn等可作铁基合金脱氧剂）；脱氧产物不溶于液态金属且密度小于液态金属，利于上浮；考虑对焊缝成分、性能和焊接工艺的影响。</p><p>脱氧过程三种方式：先期脱氧（药皮固态加热阶段进行，Al、Ti对氧亲和力大、绝大部分烧损）；沉淀脱氧（在熔滴阶段和熔池内进行，脱氧剂与液态金属中FeO直接反应、产物浮出）；扩散脱氧（温度降低易进行，酸性渣中SiO2、TiO2与FeO生成复合物减小FeO活度利于脱氧，碱性渣中FeO活度大、脱氧能力较差；脱氧反应放热，在熔池后部进行）。</p><p>硫的危害：FeS液态互溶、固态基本不溶，易偏析并在晶界析出片状低熔点共晶；Fe+FeS共晶熔点985℃、Fe+FeO共晶940℃，引起热裂、热脆；高镍合金钢中NiS+Ni共晶熔点644℃更低；含碳量增大促进硫的偏析。控制：控制原料含硫；冶金脱硫选择对S亲和力比Fe大的元素（常用Mn）；渣中碱性氧化物脱硫；温度降低利于脱硫。</p><p>磷的危害：Fe2P、Fe3P液态互溶、固态基本不溶，易偏析并在晶界析出低熔点共晶；Fe+Fe3P共晶熔点1050℃、Fe+Ni3P共晶熔点880℃，引起冷脆、热裂。控制：控制来源；冶金脱磷分两步进行（先使P氧化成P2O5，再使P2O5生成稳定复合物进入熔渣）。</p><h3 class=\"n3\">§4　合金过渡</h3><p>合金过渡目的：补偿合金元素损失；消除焊接缺陷、改善组织和性能；获得具有特殊性能的堆焊金属。</p><p>合金化方式：合金焊丝或带极；药芯焊丝或药芯焊条；合金药皮或焊剂；合金粉末。</p><p>合金过渡系数η=熔敷金属中某合金含量/焊接材料中该合金总量（焊芯+药皮）。影响因素：元素活泼、沸点低则过渡系数低；合金元素含量增大过渡系数增大并趋于定值；合金剂粒度大过渡系数增大；药皮或焊剂氧化势增大过渡系数降低；合金元素与其氧化物与渣的酸碱性相同时过渡系数增大；药皮重量系数Kb增大过渡系数降低；焊接电流增大过渡系数降低；氩弧焊过渡系数较大。</p><p>1600℃下各种合金元素对氧的亲和力由左到右增强：Cu、Ni、Co、Fe、W、Mo、Cr、Mn、V、Si、Ti、Zr、Al。</p><p>本章小结：以手工电弧焊焊接低碳钢和低合金钢的冶金问题为重点，从热力学角度阐明焊接化学冶金的一般规律，并讨论熔渣对金属的作用及合金过渡的几种形式与影响因素。</p><h2 class=\"n2\">第二章　焊接材料</h2><h3 class=\"n3\">§1　焊条</h3><p>焊条分类：按用途分（结构钢、钼和铬钼耐热钢、不锈钢、堆焊、低温钢、铸铁、镍及镍合金、铜及铜合金、铝及铝合金、特殊用途焊条）；按焊接熔渣的酸碱度分（酸性焊条E4303、碱性焊条E5015）；按药皮类型分（氧化钛型、钛钙型、钛铁矿型、氧化铁型、纤维素型、低氢型，另有石墨型、盐基型）。</p><p>焊条组成：焊芯+药皮。焊芯作用：导电、填充金属；焊芯材料用量最多的是H08、H08A，还有H08E。</p><p>药皮作用：机械保护作用（产生熔渣和气体，保护熔滴、熔池和焊接区，隔离空气）；冶金处理作用（去除有害杂质，保护或添加有益合金元素，提高焊缝抗气孔性和抗裂性）；工艺性能良好（电弧易引燃、稳定燃烧，飞溅小，成形美观，易脱渣，适于各种位置施焊）。</p><div class=\"tbl\"><table><thead><tr><th>药皮类型</th><th>主要组成特点</th><th>典型用途</th></tr></thead><tbody><tr><td>氧化钛型（钛型）</td><td>35%以上TiO2、硅酸盐、锰铁，少量有机物</td><td>工艺性好</td></tr><tr><td>氧化钛钙型（钛钙型）</td><td>30%以上TiO2、20%以下碳酸盐，硅酸盐、锰铁</td><td>应用最广</td></tr><tr><td>钛铁矿型</td><td>30%以上钛铁矿、硅酸盐、锰铁，少量有机物</td><td>—</td></tr><tr><td>氧化铁型</td><td>大量铁矿石、硅酸盐、锰铁和少量有机物</td><td>长渣，不宜立仰横焊</td></tr><tr><td>纤维素型</td><td>15%以上有机物、一定量造渣物质和锰铁</td><td>适于全位置、向下焊</td></tr><tr><td>低氢型</td><td>大量碳酸盐、萤石、铁合金及TiO2</td><td>重要结构、低合金钢</td></tr><tr><td>石墨型</td><td>大量石墨，配低碳钢芯或铸铁焊芯</td><td>铸铁焊条</td></tr><tr><td>盐基型</td><td>氟盐和氯盐组成</td><td>铝及铝合金焊条</td></tr></tbody></table></div><p>药皮原材料四类：矿物类（钛铁矿、赤铁矿、金红石、大理石、白云石、萤石、长石、白泥、云母等）；金属及铁合金类（Cr、Ni、锰铁、硅铁、钛铁、钼铁、钒铁等）；化工产品类（钛白粉、纯碱、碳酸钾、碳酸钡、粘结剂水玻璃）；有机物类（淀粉、木粉、纤维素、酚醛树脂等）。</p><div class=\"tbl\"><table><thead><tr><th>药皮组分</th><th>作用与常用材料</th></tr></thead><tbody><tr><td>稳弧剂</td><td>含低电离位元素，改善引弧与稳弧：碳酸钾、大理石、长石、金红石等</td></tr><tr><td>造渣剂</td><td>形成熔渣保护：钛铁矿、金红石、大理石、石英砂、长石、云母、萤石等</td></tr><tr><td>造气剂</td><td>形成保护气体：木粉、淀粉、大理石、菱苦土等</td></tr><tr><td>脱氧剂</td><td>对O亲和力比Fe大：锰铁、钛铁、硅铁、铝粉等</td></tr><tr><td>合金剂</td><td>过渡合金元素：锰铁、硅铁、钼铁等</td></tr><tr><td>粘结剂</td><td>钠水玻璃、钾钠水玻璃等</td></tr><tr><td>增塑剂</td><td>改善压涂塑性：白泥、云母、钛白粉、糊精等</td></tr></tbody></table></div><p>电弧稳定性：电离电位低可提高电弧稳定性；药皮熔点过高或药皮太厚易形成长套筒、电弧易熄灭。碱性焊条J507稳弧性差，因药皮含较多萤石（CaF2），氟电离势高（18.6V）且与电子亲和力大，夺取电弧中电子形成负离子，恶化电弧稳定性；J506加入低电离势的K、Na可用交直流，但K、Na与F亲和力大，KF、NaF有毒。酸性焊条含SiO2、TiO2、CaO及K2O、Na2O等，稳弧性好。</p><p>焊缝成形：熔渣凝固温度过高产生“压铁水”现象成形差，过低熔渣不能均匀覆盖；高温熔渣粘度在1500℃时为0.1～0.2Pa·s；表面张力一般为0.3～0.4N/m，可保证熔渣均匀覆盖焊缝表面。</p><p>全位置焊接：立、仰、横焊的难点是重力作用下熔滴不易过渡、熔池金属和熔渣下流。解决办法：适当增加电弧吹力、调整药皮熔点和厚度使焊条端部产生适当长度的套筒、药皮中加一定数量造气剂；熔渣的物理性能要适应——凝固温度范围窄（短渣）能快速凝固的焊条才能立、仰、横焊。氧化铁型为长渣，不适应横、立、仰焊。</p><div class=\"tbl\"><table><thead><tr><th>焊条类型</th><th>熔渣凝固温度/℃</th><th>凝固温度范围/℃</th></tr></thead><tbody><tr><td>纤维素型</td><td>1200～1290</td><td>90</td></tr><tr><td>钛型</td><td>1320～1420</td><td>100</td></tr><tr><td>氧化铁型</td><td>1180～1350</td><td>170</td></tr></tbody></table></div><p>飞溅：产生原因——熔池内部气体逸出、熔滴爆炸、电弧作用力、短路过渡电弧再燃。影响因素——粘度增大飞溅增大、电流增大飞溅增大、药皮水分增大飞溅增大、电压增大飞溅增大、交流飞溅大于直流、大颗粒过渡飞溅增大。</p><p>CO2气体保护焊飞溅原因：熔池中飞溅（温度升高CO2分解为CO+O，CO体积膨胀，外逸受阻时局部爆破产生细颗粒飞溅）；电弧斑点压力飞溅（直流正极性时焊丝为阴极、斑点压力大，产生粗大熔滴并被顶偏形成非轴向过渡）；熔滴过渡（自由过渡在斑点压力下熔滴上翘形成大滴状飞溅；短路过渡发生在短路小桥破断瞬间，飞溅多少取决于电爆炸能量，与短路电流和小桥直径有关）。</p><p>脱渣性：焊后熔渣壳从焊缝表面清除的难易程度。影响因素——熔渣线膨胀系数（金属与熔渣膨胀系数相差越大，收缩内应力越大，脱渣性越好）；熔渣氧化性（太强则焊缝表面氧化生成氧化膜，脱渣困难）；熔渣松脆性（越松脆越易清除）。钛型焊条脱渣性最好，低氢型焊条脱渣性最差。</p><p>焊条熔化速度：熔化系数αp反映熔化速度；考虑飞溅损失后，真正反映焊接生产率的指标是熔敷系数αH（单位时间内熔敷在焊件上的金属重量）；损失系数ψ为飞溅、氧化、蒸发损失与熔化焊芯质量之比。</p><p>药皮发红：焊条使用到后半段，药皮温升过高而发红、开裂或脱落。原因是焊芯电阻大、熔化系数小，熔化时间长、电阻热多。解决办法：调整药皮配方、改善熔滴过渡形态、提高熔化系数、减少电阻热以降低焊条表面温升。</p><p>焊接烟尘：焊条端部液态金属和熔渣、熔池和熔滴表面蒸发，高温蒸汽被氧化冷凝成细小固态粒子。气体毒性分两种——锰中毒（细微蒸发锰的毒性）；氟中毒（药皮含大量萤石时析出HF，有人认为NaF、KF更易中毒）。低氢型焊条烟尘含氟10%以上。</p><div class=\"tbl\"><table><thead><tr><th>对比项</th><th>钛钙型焊条 E4303（J422）</th><th>低氢型焊条 E5015（J507）</th></tr></thead><tbody><tr><td>渣系</td><td>TiO2-CaO-SiO2</td><td>CaF2-CaO-SiO2</td></tr><tr><td>碱度</td><td>B1=0.76，酸性</td><td>B1=1.89，碱性</td></tr><tr><td>保护方式/氧化性</td><td>气渣联合保护</td><td>氧化性小，对铁锈、油污、水分敏感</td></tr><tr><td>焊缝含氢量</td><td>—</td><td>极低，塑韧性好，适合重要结构和大多数低合金钢</td></tr><tr><td>脱硫脱磷</td><td>用Mn脱硫；脱磷两步</td><td>脱硫靠碱性氧化物；脱磷利用CaO，含大理石多、脱磷效果优于钛钙型</td></tr><tr><td>合金过渡</td><td>Mo、V、W不易氧化过渡好</td><td>MnO为碱性氧化物，碱度增大Mn过渡系数增大，焊缝Mn%要求低于1.6%、Si%低于0.75%</td></tr><tr><td>工艺性</td><td>工艺性好、成形美观、发尘量少</td><td>稳弧性、脱渣性差，烟尘大、含KF、NaF危害较大</td></tr></tbody></table></div><p>焊条设计：原则——技术上满足设计任务、达到各项技术指标，制造工艺切实可行，经济效益好，卫生指标先进；依据——被焊母材化学成分与力学性能、焊件工作条件、施工现场焊接设备情况、焊条制造生产工艺条件；方法——传统配方基础上的改进与创新、计算化学成分配比、计算机优化设计；步骤——选定焊芯（多用H08A）、选定药皮类型渣系及配方、通过试验调整。</p><p>焊条制造流程：焊芯制备→焊条药皮材料制备→水玻璃制备→配料、混拌及压涂→焊条烘焙→检验合格后包装、入库、出厂。</p><h3 class=\"n3\">§2　焊剂</h3><p>焊剂和焊丝是埋弧焊、电渣焊使用的焊接材料；焊剂相当于焊条药皮，焊丝相当于焊条焊芯。焊剂作用：隔离空气、保护焊接区金属不受空气侵害，并进行冶金处理。</p><p>焊剂分类：按用途（被焊材料：钢用、有色金属用；工艺方法：埋弧焊、电渣焊）；按制造方法（熔炼焊剂、粘结焊剂、烧结焊剂）；按化学成分（酸性、中性、碱性；按SiO2含量分高硅、中硅、低硅；按MnO含量分高锰、中锰、低锰、无锰；按CaF2含量分高氟、中氟、低氟）；按化学性质（氧化性、弱氧化性、惰性焊剂）；按颗粒结构（玻璃状、结晶状、浮石状）。</p><div class=\"tbl\"><table><thead><tr><th>制造方法</th><th>工艺要点</th><th>备注</th></tr></thead><tbody><tr><td>熔炼焊剂</td><td>配料在炉内熔炼，经水冷粒化、烘干、筛选</td><td>传统焊剂</td></tr><tr><td>粘结焊剂（陶质焊剂）</td><td>粉状配料加粘结剂混合搅拌、粒化，低温（400℃以下）烘干</td><td>—</td></tr><tr><td>烧结焊剂</td><td>粉状配料加粘结剂混合搅拌后，经高温（400～1000℃）烧结成块、粉碎、筛选</td><td>—</td></tr></tbody></table></div><p>焊剂型号（GB/T 5293-1999《埋弧焊用碳钢焊丝和焊剂》，课件按此版讲解，该标准已被GB/T 5293-2018代替）：焊丝-焊剂组合型号中，“F”表示焊剂；第1位数字表示熔敷金属抗拉强度最小值；第2位字母表示试件热处理状态（A为焊态、P为焊后热处理态）；第3位数字表示熔敷金属冲击吸收功不小于27J时的最低试验温度；“-”后为焊丝牌号。</p><p>焊剂质量要求：冶金性能好；工艺性能好；颗粒度符合要求；含水量不大于0.10%；机械夹杂物含量不大于0.30%；含硫量不大于0.060%、含磷量不大于0.080%。</p><p>熔炼焊剂：高硅焊剂以硅酸盐为主（SiO2＞30%），有通过焊剂向焊缝过渡硅的作用，按MnO含量分为高硅高锰、高硅中锰、高硅低锰、高硅无锰焊剂；中硅焊剂SiO2较少、CaO和MgO含量较高、碱度高，属弱氧化性焊剂，焊缝含氢量较高、抗冷裂纹能力弱，加FeO提高氧化性可减少含氢量，焊缝韧性高，用于焊接高强钢；低硅焊剂由CaO、Al2O3、MgO、CaF2等组成，对基本金属无氧化作用，配合相应焊丝焊接高合金钢（不锈钢、热强钢等）。</p><p>烧结焊剂优缺点：可连续生产、劳动条件好、成本低；碱度可在较大范围内调节；可获得较好的强度、塑性和韧性配合；加脱氧剂脱氧充分；加合金剂合金化强；松装密度较小、焊接时消耗量较小；颗粒圆滑、回收阻力小；抗气孔能力比熔炼焊剂强，但对焊接参数变动敏感、会引起焊缝化学成分不均匀；吸湿性大、易增加焊缝含氢量。</p><h3 class=\"n3\">§3　焊丝</h3><p>焊丝分类：按适用的焊接方法（埋弧焊焊丝、CO2焊焊丝、钨极氩弧焊焊丝、自保护焊焊丝、电渣焊焊丝）；按形状结构（实心焊丝、药芯焊丝、活性焊丝）；按适用的金属材料（低碳钢、低合金钢焊丝，硬质合金堆焊焊丝，以及铝、铜与铸铁焊丝等）。</p><p>实心焊丝：埋弧焊用实心焊丝、CO2焊实心焊丝、其他用途实心焊丝；药芯焊丝：按分类、截面形状和特性选用。</p><h2 class=\"n2\">第三章　熔池凝固和焊缝固态相变</h2><h3 class=\"n3\">§1　熔池凝固</h3><p>熔池凝固特点：熔池过热度大；过冷度大；合金元素烧损大；结晶速度大；运动态结晶（运动、搅拌）。</p><p>结晶一般规律：液→固结晶包括形核和长大两阶段。熔池中主要为非自发形核；两种现成表面——合金元素或杂质的悬浮质点，熔合区附近半熔化状态基本金属的晶粒表面。</p><p>晶粒生长有方向性：沿最大温度梯度方向最有利于晶粒长大，可形成粗大柱状晶；晶粒成长方向与结晶等温面正交。</p><p>结晶线速度vc与焊接速度v的关系：熔合线处θ=90°、vc=0；熔池中心θ=0°、vc=v（最大）；焊接速度增大、θ增大，柱状晶趋向垂直于中心线，易产生热裂纹。</p><p>纯金属结晶形态：柱状晶（正温度梯度G＞0成长缓慢为平面晶；负温度梯度G＜0过冷度大、成长快为树枝晶）、等轴晶。</p><p>固溶体合金结晶形态（成分过冷）：平面结晶（过冷度等于0、无成分过冷）；胞状结晶（过冷度很小，断面六角形、细胞或蜂窝状）；胞状树枝结晶（过冷度稍大，主干四周伸出短小二次横枝）；树枝状结晶（过冷度较大，主枝长、二次横枝发达）；等轴结晶（过冷度大、成分过冷区很宽，可自发生核、自由长大的等轴树枝晶）。</p><div class=\"tbl\"><table><thead><tr><th>条件</th><th>成分过冷</th><th>结晶形态变化</th></tr></thead><tbody><tr><td>R、G一定，C0增大</td><td>增大</td><td>平面晶→等轴晶过渡</td></tr><tr><td>C0一定，R增大</td><td>增大</td><td>平面晶→等轴晶过渡</td></tr><tr><td>C0、R一定，G增大</td><td>减小</td><td>等轴晶→平面晶过渡</td></tr></tbody></table></div><p>焊接条件下的凝固形态：焊缝边界G大、R小，平面晶得到发展；焊缝中心G小、R大，倾向于获得等轴晶。溶质浓度影响：99.99%纯Al焊缝熔合线附近为平面晶、中心为胞状晶，99.6%纯Al中心为等轴晶；焊接速度增大，熔池中心出现等轴晶；电流小为胞状晶、电流较大为胞状树枝晶、电流大出现粗大胞状树枝晶。</p><p>焊缝金属化学不均匀性（偏析）：显微偏析（先结晶固相较纯、后结晶溶质浓度较高，发生在晶粒边界、亚晶界或树枝晶晶枝之间）；区域偏析（柱状晶把杂质推向熔池中心，最后凝固部位偏析较严重）；层状偏析（结晶潜热和熔滴过渡热能输入周期性变化引起化学成分不均匀，形成颜色深浅不同的分层）。</p><p>熔合区：不是一条线而是一个区（热传播不均匀、晶粒传热方向不同）；宽度取决于材料液固温度范围、热物理性质和组织状态，一般0.0n～0.nmm，奥氏体钢电弧焊时约0.06～0.12mm；合金元素在液相中的溶解度大于固相，界面附近溶质浓度波动大。</p><p>熔合区不均匀性：化学不均匀性+物理不均匀性（空位——不平衡冷却时空位过饱和，熔合线附近空位密度最大，空位聚合可能是熔合区延迟断裂原因之一；残余应力——导热系数、膨胀系数、屈服强度、弹性模量不均匀引起）。熔合区是焊接接头的薄弱环节。</p><h3 class=\"n3\">§2　焊缝固态相变</h3><p>低碳钢焊缝组织：铁素体+少量珠光体；铁素体先沿原奥氏体边界析出、晶粒粗大，部分呈魏氏组织形态（铁素体在晶界网状析出，或从晶粒内部沿一定方向呈针状、片条状析出）；多层焊或热处理可获得细小铁素体和少量珠光体，柱状晶被破坏；冷却速度越大珠光体越多、组织细化、硬度升高。</p><p>低合金钢焊缝组织：以铁素体为主，珠光体、贝氏体、马氏体占次要地位；可能出现铁素体转变、珠光体转变、贝氏体转变、马氏体转变四种组织转变。</p><div class=\"tbl\"><table><thead><tr><th>铁素体类型</th><th>形成温度</th><th>特征</th></tr></thead><tbody><tr><td>先共析铁素体PF（粒界铁素体GBF）</td><td>T＞750℃</td><td>晶界析出，细条状或块状</td></tr><tr><td>侧板条铁素体FSP（无碳贝氏体）</td><td>700～550℃</td><td>从奥氏体晶界PF侧面以板条状向晶内成长</td></tr><tr><td>针状铁素体AF</td><td>500℃左右</td><td>晶粒内针状分布，常以质点为核心放射性成长</td></tr><tr><td>细晶铁素体FGF（贝氏铁素体）</td><td>500℃以下</td><td>晶粒内形成，450℃左右可转变为上贝氏体</td></tr></tbody></table></div><p>珠光体转变：发生在Ar1～550℃，是扩散型相变；珠光体是铁素体和渗碳体的层状混合物，领先相为Fe3C；焊接状态为非平衡转变、珠光体量少；含B、Ti合金元素时珠光体转变可被全部抑制；分类有层状珠光体、细珠光体（索氏体）、粒状珠光体（屈氏体）。</p><p>贝氏体转变：上贝氏体Bu（形成于550～500℃，光学显微镜下呈羽毛状，沿奥氏体晶界析出，平行条状铁素体间分布渗碳体）；下贝氏体BL（形成于450℃～Ms，针状、强韧组织）；M-A组元（块状铁素体形成后，富碳岛状奥氏体转变为富碳马氏体和残余奥氏体；粒状分布称粒状贝氏体BG，条状分布称条状贝氏体Be）。</p><p>马氏体转变：焊缝含碳量偏高或合金元素较复杂、快冷至Ms以下时发生。板条马氏体（位错马氏体）——低碳低合金焊缝、转变温度较高，板条内部存在大量位错，韧性好、强度高；片状马氏体（孪晶马氏体、高碳马氏体）——含碳较高（≥0.4%）、转变温度偏低，初形成马氏体粗大、往往贯穿晶粒，亚结构为孪晶。</p><h3 class=\"n3\">§3　焊缝中的气孔和夹杂</h3><p>气孔两类：一类是高温时溶解、凝固和相变时溶解度骤降、来不及逸出而残留在焊缝内部的气体（H2、N2）；另一类是冶金反应产生的不溶于金属的气体（CO、H2O）。</p><div class=\"tbl\"><table><thead><tr><th>气孔类型</th><th>分布与形状特征</th><th>形成原因</th></tr></thead><tbody><tr><td>氢气孔</td><td>表面气孔为主，少数内部；断面螺钉状、喇叭口形，四周内壁光滑</td><td>H2O多、有机物多；高温熔池吸氢，冷却结晶时氢溶解度急剧下降来不及逸出</td></tr><tr><td>氮气孔</td><td>表面气孔，多数呈蜂窝状成堆出现</td><td>保护不好、空气侵入熔池</td></tr><tr><td>CO气孔</td><td>内部气孔，条虫状或蠕虫状，沿柱状晶方向分布</td><td>CO不溶于液态金属，高温冶金反应生成，熔池结晶时粘度增大不易逸出</td></tr></tbody></table></div><p>气孔形成机理：生核→长大→逸出。条件：液态金属中有过饱和气体；要消耗一定能量（有现成表面可大大降低能量消耗）。熔池中大量现成表面：分布不均的溶质质点、熔渣与液态金属的接触表面、熔池底部成长的树枝状晶粒；树枝晶间凹陷处和母材未熔化晶粒界面Aa/A比值最大、最易形核。</p><p>气泡上浮：浸润角θ＜90°利于气泡上浮逸出；θ＞90°时需形成细颈、结晶速度大时形成气孔。结晶速度R小，气泡有充分时间逸出无气孔；R大，气泡可能残留在焊缝内部。气泡半径增大、液体金属密度增大、粘度降低、结晶速度降低，均利于气泡浮出。</p><p>影响气孔的因素：熔渣氧化性大则CO气孔倾向增大、还原性大则H2气孔倾向增大；药皮和焊剂中CaF2、SiO2降低氢气孔倾向；铁锈含较多Fe2O3和H2O引起CO、H2气孔，氧化皮（主要Fe3O4）引起CO气孔。工艺因素：电流增大气孔倾向增大（熔滴变细、比表面积增大、吸收气体多）；电压增大空气侵入、氮气孔增多；焊速增大结晶速度增大、气体残留形成气孔；气孔倾向交流大于直流正接、直流正接大于直流反接；焊前清理、焊条焊剂烘干、短弧摆动可防气孔。</p><p>焊缝中的夹杂物：氧化物（SiO2、MnO、TiO2、Al2O3，密集块状或片状分布时引起热裂、层状撕裂）；氮化物（Fe4N，脆硬相，硬度增大、韧性降低，引起热裂、冷裂）；硫化物（MnS、FeS，主要是FeS，沿晶界析出并形成低熔点Fe+FeS（985℃）或FeO+FeS（940℃）共晶，引起热裂）。</p><p>防止夹杂物的措施：选用合理规范以利于熔渣浮出；多层焊时清渣；焊条摆动；保护熔池、防止空气侵入。</p><h3 class=\"n3\">§4　焊缝性能的控制（自学）</h3><p>控制焊缝性能是控制焊接质量的主要目标。常规焊接构件焊后多不再进行热处理，应尽可能保证焊缝凝固并经相变后即具有良好的性能。改善焊缝金属性能的途径主要是焊缝的固溶强化、变质处理（微合金化）和调整焊接工艺。</p><h3 class=\"n3\">§5　焊接缺欠</h3><p>焊接缺欠：泛指焊接接头中的不连续性、不均匀性以及其他不健全性的欠缺（GB/T 6417.1-2005定义为因焊接产生的金属不连续、不致密或连接不良的现象）。焊接缺陷：不符合具体焊接产品使用性能要求的焊接缺欠，即超过规定限值的缺欠，标志判废或必须返修。</p><p>质量标准：QA为用于质量管理的质量标准，达到QA的产品为优质品；QB为基于合于使用的质量标准，是最低合用的验收标准；QA与QB之间的缺欠属一般质量、不必修补；达不到QB标准的产品必须修补，否则判废。判别缺欠是否为缺陷按相关标准规定的容限执行。</p><p>缺欠对承载强度的影响：成串或密集气孔使承载截面积减小、明显降低承载强度，成串气孔比单个气孔危险；气孔使承载截面积减小10%时疲劳强度下降可达50%；咬边对疲劳强度的影响比气孔和夹杂大得多（带咬边接头在10⁶次循环下疲劳强度约为致密接头的40%）；未熔合和未焊透比气孔和夹渣更有害，在一定条件下成为脆性断裂的引发点；裂纹被认为最危险、易造成断裂，焊接产品及结构中绝对不允许存在。</p><p>应力集中：裂纹、未熔合和未焊透比气孔和夹渣危害大；裂纹尖端存在缺口效应、易诱发三向应力状态，导致裂纹失稳扩展，是焊接结构中最危险的缺陷。单个球状气孔和单一夹杂周围应力集中并不严重，但密集气孔或夹杂连通时应力区扩大、应力值急剧上升。</p><p>对脆性断裂的影响：裂纹尖端尖锐度最大，对脆性断裂影响最大；气孔、夹渣等体积类缺欠小于5%且工作温度不低于材料韧脆转变温度时，对结构安全影响较小。应力腐蚀开裂通常从表面开始，焊接接头应力腐蚀裂纹扩展和腐蚀疲劳破坏大都是从焊趾处开始。</p><p>缺欠分类方法：按存在位置分表面缺欠和内部缺欠；按分布区域分焊缝、熔合区、热影响区及母材缺欠；按成形及性能分成形、连接及性能缺欠；按产生原因分构造、工艺及冶金缺欠；按影响断裂机制分平面缺欠（裂纹、未熔合、线状夹渣等）和非平面缺欠（气孔、圆形夹渣等）。</p><p>按GB/T 6417.1-2005，熔焊接头缺欠按性质、特征分为6类：裂纹、孔穴、固体夹杂、未熔合及未焊透、形状和尺寸不良、其他缺欠。</p><p>裂纹类：纵向裂纹（基本与焊缝轴线平行）、横向裂纹（基本垂直）、放射状裂纹（具有公共点，小裂纹称星形裂纹）、弧坑裂纹、间断裂纹群、枝状裂纹。</p><p>孔穴类：气孔（球形、均布、局部密集、链状、条状、虫形、表面气孔）；缩孔（结晶缩孔、弧坑缩孔、末端弧坑缩孔）；微型缩孔（微型结晶缩孔、微型穿晶缩孔）。</p><p>固体夹杂类：夹渣、焊剂夹渣、氧化物夹杂（铝合金焊接时因熔池保护不善和湍流产生的氧化膜称“皱褶”）、金属夹杂（钨、铜等外来金属颗粒）。未熔合及未焊透：未熔合是焊缝金属与母材或各焊层之间未结合（分侧壁、焊道间、根部未熔合）；未焊透是实际熔深与公称熔深之间的差异。</p><p>形状和尺寸不良类：咬边（母材或前一道熔敷金属在焊趾处因焊接产生的不规则缺口）、凸度过大、下塌、焊缝形面不良、焊瘤、错边、下垂、烧穿、未焊满、表面不规则、焊缝接头不良、焊缝尺寸不正确等。其他缺欠：电弧擦伤、飞溅（包括钨飞溅）、表面撕裂、磨痕、凿痕、打磨过量、定位焊缺欠、回火色、表面鳞片、焊剂残留物等。</p><h2 class=\"n2\">第四章　焊接热影响区的组织和性能</h2><h3 class=\"n3\">§1　焊接热循环</h3><p>热影响区（HAZ）：焊缝两侧发生组织和性能变化的区域，又称近缝区。焊接热循环：焊件上某点温度由低而高、达到最高值后又由高而低随时间变化的过程；距焊缝不同距离的各点所经历的热循环不同，焊接方法不同热循环曲线形状也不同。</p><p>焊接热循环主要参数：加热速度ωH（比热处理条件下快得多）；加热的最高温度Tm（很高，高于热处理温度时晶粒易长大）；相变温度以上的停留时间tH（停留时间延长有利于奥氏体均质化，但温度太高会导致晶粒严重长大）；冷却速度ωc和冷却时间（t8/5、t8/3、t100等）。</p><p>焊接热循环特点：加热温度高（比热处理加热温度高100～200℃）；加热速度快（是热处理加热速度的几十倍甚至几百倍）；高温停留时间短（手工焊约4～20s、埋弧自动焊约30～100s）；自然冷却（冷却速度快、低温转变增多）；局部加热（局部集中加热产生复杂应力，组织转变在复杂应力下完成）。</p><p>多层焊热循环：相邻层间彼此具有热处理作用，多层焊比单层焊优越。长段多层焊——每道焊缝长度1m以上，焊下一层时前一层已冷至100～200℃以下，不适于淬硬倾向大的钢种；短段多层焊——每道焊缝长度约50～400mm，焊下层时前层温度较高。</p><h3 class=\"n3\">§2　焊接热循环条件下的金属组织转变特点</h3><p>加热过程：加热速度增大，扩散相变滞后，Ac1、Ac3及（Ac3-Ac1）升高；含碳化物合金元素（Cr、W、Mo、V等）时加热速度影响更大；快速加热时奥氏体均质化过程不完全；Tm很大、近缝区晶粒易长大。</p><p>合金元素分类（按与碳亲和力大小）：碳化物形成元素Zr、Nb、Ti、V、W、Mo、Cr、Mn、Fe；强碳化物形成元素Ti、V、Nb（与C形成的碳化物比Fe3C稳定）；弱碳化物形成元素Mn；非碳化物形成元素Ni、Co、Cu、Si、Al、N、B。</p><p>45钢：相同冷却速度下，焊接条件比热处理条件下淬硬倾向增大、CCT曲线右移，原因是焊接条件下不存在碳化物溶解过程且HAZ组织粗化；40Cr：淬硬倾向降低、CCT曲线左移，原因是Cr等碳化物形成元素在焊接条件下高温停留时间短、未充分向奥氏体内溶解，奥氏体稳定性降低。</p><p>CCT图：用焊接热模拟试验装置建立某种钢的焊接CCT图；意义——在大量钢种试验前可预先估计热影响区的组织性能，或作为制定工艺、确定焊接线能量的依据；应用——通过CCT图可得到不同冷却速度下的组织。影响CCT图的因素：母材化学成分、冷却速度、峰值温度、晶粒粗化、应力应变。</p><h3 class=\"n3\">§3　焊接热影响区的组织和性能</h3><p>焊接结构钢按热处理特性分两类：不易淬火钢（低碳钢及某些不易淬硬的低合金钢，如16Mn、15MoV、15MnTi）；易淬火钢（低碳调质高强钢18MnMoNb、中碳钢45钢、中碳调质高强钢30CrMnSi等）。HAZ组织分布与母材焊前热处理状态有关。</p><div class=\"tbl\"><table><thead><tr><th>HAZ分区</th><th>温度范围</th><th>组织与性能特点</th></tr></thead><tbody><tr><td>熔合区</td><td>TL～TS（半熔化区）</td><td>范围很窄</td></tr><tr><td>过热区</td><td>TS～1100℃</td><td>奥氏体晶粒粗大，冷却后得到粗大组织，韧性很低</td></tr><tr><td>相变重结晶区</td><td>A3～1000℃</td><td>发生重结晶，焊后得到均匀细小组织，塑性和韧性较好</td></tr><tr><td>不完全重结晶区</td><td>Ac1～Ac3</td><td>一部分发生相变重结晶、另一部分保留并粗化，组织性能不均匀</td></tr></tbody></table></div><p>易淬火钢HAZ分区：完全淬火区（Ac3以上，淬硬倾向大，焊后得到粗大马氏体）；不完全淬火区（Ac1～Ac3，快速加热时铁素体很少溶入奥氏体，快冷时原铁素体保持不变并有不同程度长大，最后形成马氏体-铁素体组织）；回火区（母材焊前为调质态时可能存在不同程度的回火处理）。</p><p>注意问题：熔合区、过热区晶粒严重长大，是焊接接头的薄弱地带；低碳钢的不完全重结晶区在急冷急热条件下会表现出高碳钢的行为；成分偏析严重、C、P、S高时易产生淬硬组织和裂纹。</p><p>HAZ硬化：常用硬度变化判定热影响区性能变化；测热影响区（一般在熔合区）的最高硬度Hmax可间接估计热影响区的强度、塑性和裂纹倾向。碳当量：把钢中合金元素（包括碳）对其淬硬（包括冷裂、脆化）的影响程度折合成碳的相当含量。</p><div class=\"tbl\"><table><thead><tr><th>碳当量公式</th><th>适用钢种</th></tr></thead><tbody><tr><td>CE（IIW，国际焊接学会）</td><td>中等强度的非调质低合金钢（σb=400～700MPa）</td></tr><tr><td>Ceq（WES，日本焊接协会）</td><td>强度级别较高的低合金高强钢（σb=500～1000MPa）</td></tr><tr><td>Pcm（伊藤公式）</td><td>含碳量≤0.17%、σb=400～900MPa的低合金高强钢</td></tr><tr><td>CEN（Suzuki、Yurioka）</td><td>C≥0.18%时近似CE（IIW）；C≤0.17%时CE近似Pcm</td></tr></tbody></table></div><p>注意：CE（IIW）和Ceq（WES）不适用于含碳量0.17%以下的钢种。结论：随钢种碳当量（Pcm、CE（IIW））增加，最高硬度Hmax随之增加、淬硬倾向增加。最高硬度计算：国产钢公式中τM100为HAZ组织全部为马氏体时的t8/5，此时硬度达饱和值、与冷却时间无关、只与含碳量有关；另有铃木（Suzuki）公式适用于日本低合金高强钢。</p><p>HAZ脆化类型：粗晶脆化、析出脆化、组织脆化、热应变时效脆化、氢脆化、石墨脆化。</p><p>粗晶脆化：产生于HAZ靠近熔合线附近和过热区；不易淬火钢主要因晶粒长大（Ti、Nb、V、W、Mo等合金元素的碳、氮化物阻碍晶界迁移、防止晶粒长大）；易淬火钢由脆性组织（孪晶马氏体、非平衡态粒状贝氏体等）产生；线能量、峰值温度升高、t8/5增大均使晶粒粗化加剧。粗晶脆化在化学成分、组织状态不均匀的非平衡条件下形成，常与组织脆化叠加，脆化更严重。</p><p>组织脆化：低碳低合金高强钢HAZ组织脆化主要由于出现M-A组元（常伴粒状贝氏体）、上贝氏体、粗大魏氏组织以及“组织遗传”等造成。M-A组元脆化出现在焊缝和HAZ中等冷速条件下：冷却速度大全部转变成高碳马氏体；冷却速度小奥氏体转变成铁素体和渗碳体；中等淬硬倾向钢种合金化高、奥氏体稳定不分解；在上贝氏体形成温度范围内经中温转变形成。</p><p>析出脆化：固溶态的强碳化物或氮化物形成元素，因焊接热循环影响（时效或回火）析出碳化物Cm和氮化物Nm，使强度硬度升高、冲击韧性AkV降低而脆化；沉淀相细小弥散分布于晶内时不易析出、有利于韧性，存在于相界或晶界、聚集或沿晶界薄膜状分布时会导致脆化。</p><p>遗传脆化（组织遗传）：厚板多层焊时粗晶区组织未得到改善、仍保留粗晶组织和结晶学的位相关系；条件为原始组织（非平衡）及晶界上出现等轴细晶（“晶粒边界效应”）；致脆原因是粗大晶粒脆化和组织变化。</p><p>热应变时效脆化（HSE）：静应变时效脆化（室温或低温下，含C、N自由间隙原子时产生）；动应变时效脆化（较高温度，特别是200～400℃温度范围）。</p><p>HAZ韧化途径：母材原始组织（多元合金化、微合金化、韧化相——针状铁素体、下贝氏体、低碳马氏体等）；韧化处理（焊后热处理、预热等）；控制焊接工艺（线能量的控制）。</p><p>HAZ软化：调质钢焊前经调质处理，回火温度越低、焊后软化越严重；热处理强化合金发生过时效软化。</p><p>HAZ力学性能研究主要从两方面进行：HAZ不同部位的力学性能、熔合区附近的性能；对淬硬倾向不大的钢种（如16Mn钢）采用焊接热模拟技术研究HAZ不同部位的常规力学性能。</p><h3 class=\"n3\">§4　焊接热、力模拟试验方法的特点</h3><p>包括焊接热模拟技术发展的背景、焊接模拟技术发展的过程及其现状、焊接模拟试验的基本方法及意义；典型设备如Gleeble 3500热模拟试验机，用于焊接热影响区连续冷却曲线（SHCCT图）的测定。</p><h1 class=\"n1\">第二部分　快速复习题</h1><p>以下题目覆盖各章高频考点，全部为可直接快速作答的单项选择题与填空题，答案见各章末。</p><h2 class=\"n2\">第一章　焊接化学冶金　快速练习</h2><p>（一）单项选择题</p><p>焊接化学冶金过程是熔化焊时，焊接区内各种物质之间在高温下相互作用的过程，其作用对象不包括（　）A. 气体　B. 液态金属　C. 熔渣　D. 固态母材</p><p>焊条加热的三类热源中，可以忽略不计的是（　）A. 电阻热　B. 电弧热　C. 化学反应热　D. 等离子弧热</p><p>熔滴尺寸大于焊丝直径时的熔滴过渡称为（　）A. 喷射过渡　B. 颗粒过渡　C. 短路过渡　D. 附壁过渡</p><p>主要用于φ1.6mm以下细丝CO2气体保护焊的熔滴过渡形式是（　）A. 短路过渡　B. 颗粒过渡　C. 喷射过渡　D. 渣壁过渡</p><p>碱性焊条的熔滴过渡以（　）为主。A. 细颗粒过渡和附壁过渡　B. 短路过渡和大颗粒过渡　C. 喷射过渡　D. 渣壁过渡</p><p>实测手工电弧焊碳钢焊条熔滴的温度约为（　）A. 1600～1900K　B. 1800～2400K　C. 2100～2700K　D. 3000K以上</p><p>手工电弧焊熔池的质量约为（　）A. 0.6～16g　B. 30～130g　C. 0.5～1kg　D. 2～5kg</p><p>真空电子束焊对焊接区的保护方式属于（　）A. 渣保护　B. 气保护　C. 真空保护　D. 自保护</p><p>埋弧焊时熔滴通过熔渣之下的电弧完成过渡，属于（　）A. 短路过渡　B. 渣保护过渡　C. 喷射过渡　D. 附壁过渡</p><p>药皮反应区中，温度高于100℃时首先发生的反应是（　）A. 有机物分解　B. 吸附水蒸发　C. 碳酸盐分解　D. 铁合金氧化</p><p>熔滴反应区的反应时间约为（　）A. 0.01～0.1s　B. 3～8s　C. 6～25s　D. 1～2min</p><p>焊接电流增大时熔滴变细、停留时间缩短，冶金反应（　）A. 更充分　B. 不充分　C. 不受影响　D. 停止进行</p><p>（二）填空题</p><p>焊接化学冶金过程的对象包括气体、液态金属和＿＿。</p><p>焊条加热的热源有电阻热、电弧热和＿＿。</p><p>熔滴尺寸等于或小于焊丝直径时的过渡称为＿＿过渡。</p><p>短路过渡电弧稳定、飞溅小、过渡频率高，广泛用于＿＿结构及全位置焊接。</p><p>手工电弧焊的冶金反应区分为药皮反应区、＿＿和熔池反应区。</p><p>手工电弧焊（SMAW）熔池反应区的反应时间为＿＿s。</p><p>焊缝金属中局部熔化的母材所占比例称为＿＿。</p><p>纤维素药皮的烘干温度一般控制在＿＿℃左右（且不超过200℃）。</p><p>焊接区气体来源包括焊接材料、气体介质、焊丝和母材表面的＿＿以及金属和熔渣蒸发产生的气体。</p><p>氢以原子或质子形式存在于金属晶格中并可自由扩散的形式称为＿＿氢。</p><p>焊后脱氢处理可采用350℃保温1h或250℃保温＿＿h。</p><p>熔渣的结构理论包括分子理论和＿＿理论。</p><p class=\"ans\">参考答案</p><p>选择题：1.D　2.C　3.B　4.A　5.B　6.C　7.A　8.C　9.B　10.B　11.A　12.B</p><p>填空题：1.熔渣　2.化学反应热　3.喷射　4.薄板　5.熔滴反应区　6.3～8　7.熔合比　8.150　9.油锈等杂质　10.扩散　11.6　12.离子</p><h2 class=\"n2\">第二章　焊接材料　快速练习</h2><p>（一）单项选择题</p><p>按焊接熔渣的酸碱度分类，E4303属于（　）A. 酸性焊条　B. 碱性焊条　C. 中性焊条　D. 盐基型焊条</p><p>适合焊接重要结构、焊缝塑韧性高的低氢型焊条型号是（　）A. E4303　B. E5015　C. H08A　D. J422</p><p>焊芯的主要作用是（　）A. 稳弧　B. 导电和填充金属　C. 造气　D. 脱氧</p><p>焊条焊芯用量最多的牌号是（　）A. H08A　B. H08E　C. H10MnSi　D. H08Mn2Si</p><p>药皮中起稳定电弧作用、含低电离电位元素的组分是（　）A. 造渣剂　B. 稳弧剂　C. 造气剂　D. 增塑剂</p><p>含大量碳酸盐、萤石、铁合金及TiO2的药皮类型是（　）A. 钛钙型　B. 纤维素型　C. 低氢型　D. 石墨型</p><p>碱性焊条J507电弧稳定性较差，主要原因是药皮中含有较多的（　）A. 大理石　B. 萤石　C. 金红石　D. 锰铁</p><p>高温熔渣在1500℃时合适的粘度约为（　）A. 0.1～0.2Pa·s　B. 0.3～0.4Pa·s　C. 1～2Pa·s　D. 10Pa·s以上</p><p>因凝固温度范围大（长渣）而不能适应横、立、仰焊的焊条类型是（　）A. 纤维素型　B. 钛型　C. 氧化铁型　D. 低氢型</p><p>焊后熔渣壳从焊缝表面清除的难易程度称为（　）A. 脱渣性　B. 全位置焊接性　C. 药皮发红　D. 焊缝成形</p><p>考虑飞溅损失后，真正反映焊接生产率的指标是（　）A. 焊条熔化系数αp　B. 焊条熔敷系数αH　C. 损失系数ψ　D. 焊接电流</p><p>低氢型焊条焊接烟尘的含氟量（　）A. 10%以上　B. 5%以下　C. 不含氟　D. 30%以上</p><p>（二）填空题</p><p>焊条按熔渣酸碱度分为酸性焊条和＿＿焊条。</p><p>焊条由焊芯和＿＿组成。</p><p>药皮的作用包括机械保护、＿＿和改善焊接工艺性能。</p><p>低氢型焊条药皮含大量碳酸盐、萤石、铁合金及TiO2，又称＿＿焊条。</p><p>药皮中的粘结剂常用＿＿水玻璃。</p><p>焊条使用到后半段因药皮温升过高而发红、开裂或脱落的现象称为＿＿。</p><p>焊接烟尘的毒性主要有锰中毒和＿＿两种。</p><p>焊剂相当于＿＿，焊丝相当于焊条焊芯。</p><p>粘结焊剂又称陶质焊剂，其烘干温度在＿＿℃以下。</p><p>烧结焊剂的高温烧结温度范围为＿＿℃。</p><p>焊剂的质量要求中，含水量不得大于＿＿%。</p><p>焊剂中机械夹杂物的含量不得大于＿＿%。</p><p class=\"ans\">参考答案</p><p>选择题：1.A　2.B　3.B　4.A　5.B　6.C　7.B　8.A　9.C　10.A　11.B　12.A</p><p>填空题：1.碱性（低氢型）　2.药皮　3.冶金处理　4.低氢　5.钠（钾钠）　6.药皮发红　7.氟中毒　8.焊条药皮　9.400　10.400～1000　11.0.10　12.0.30</p><h2 class=\"n2\">第三章　熔池凝固和焊缝固态相变　快速练习</h2><p>（一）单项选择题</p><p>下列不属于熔池凝固特点的是（　）A. 过热度大　B. 过冷度大　C. 结晶速度小　D. 运动态结晶</p><p>熔池中晶核的形成以（　）为主。A. 自发形核　B. 非自发形核　C. 均匀形核　D. 均质形核</p><p>熔合线处θ=90°，此时结晶线速度vc与焊接速度v的关系是（　）A. vc=v　B. vc=0　C. vc=2v　D. vc=v/2</p><p>熔池中心处θ=0°，结晶线速度vc（　）A. 等于0　B. 等于焊接速度v（最大值）　C. 等于v/2　D. 大于v</p><p>过冷度等于零、无成分过冷时得到的结晶形态是（　）A. 平面结晶　B. 胞状结晶　C. 树枝状结晶　D. 等轴结晶</p><p>过冷度很大、成分过冷区很宽，结晶前沿可自发生核形成自由长大树枝晶的形态是（　）A. 胞状结晶　B. 胞状树枝结晶　C. 树枝状结晶　D. 等轴结晶</p><p>C0、R一定时，温度梯度G增大，成分过冷（　），结晶形态由等轴晶向平面晶过渡。A. 增大　B. 减小　C. 不变　D. 先增后减</p><p>焊接条件下，焊缝中心G小、R大，倾向于获得（　）A. 平面晶　B. 胞状晶　C. 等轴晶　D. 魏氏组织</p><p>先结晶的固相较纯、后结晶的溶质浓度较高的偏析属于（　）A. 区域偏析　B. 层状偏析　C. 显微偏析　D. 宏观偏析</p><p>由结晶潜热和熔滴过渡热能输入周期性变化引起的偏析是（　）A. 显微偏析　B. 区域偏析　C. 层状偏析　D. 晶界偏析</p><p>氢气孔的特征是（　）A. 内部条虫状　B. 表面喇叭口形、四周内壁光滑　C. 表面蜂窝状　D. 沿柱状晶分布</p><p>焊缝中的CO气孔呈（　）A. 球形　B. 螺钉状　C. 条虫状或蠕虫状、沿柱状晶分布　D. 蜂窝状</p><p>（二）填空题</p><p>熔池结晶过程包括形核和＿＿两个阶段。</p><p>熔池中非自发形核的现成表面包括合金元素或杂质的悬浮质点和熔合区附近＿＿状态基本金属的晶粒表面。</p><p>晶粒成长沿最大＿＿梯度方向最有利，可形成粗大的柱状晶。</p><p>焊接速度v增大、θ增大时，柱状晶趋向垂直于中心线，容易产生＿＿裂纹。</p><p>固溶体合金结晶除温度过冷外，还存在＿＿过冷。</p><p>焊接条件下，焊缝边界G大、R小，＿＿晶得到发展。</p><p>熔合区是焊接接头的＿＿环节。</p><p>低碳钢焊缝室温组织为铁素体加少量＿＿。</p><p>针状铁素体在＿＿℃左右于晶粒内形成，常以质点为核心放射性成长。</p><p>上贝氏体在光学显微镜下呈＿＿状，形成于550～500℃。</p><p>含碳量较高（≥0.4%）的焊缝快冷形成的片状马氏体又称＿＿马氏体（高碳马氏体）。</p><p>咬边是在＿＿处因焊接产生的不规则缺口。</p><p class=\"ans\">参考答案</p><p>选择题：1.C　2.B　3.B　4.B　5.A　6.D　7.B　8.C　9.C　10.C　11.B　12.C</p><p>填空题：1.长大　2.半熔化　3.温度　4.热　5.成分　6.平面　7.薄弱　8.珠光体　9.500　10.羽毛　11.孪晶　12.焊趾</p><h2 class=\"n2\">第四章　焊接热影响区的组织和性能　快速练习</h2><p>（一）单项选择题</p><p>热影响区（HAZ）又称（　）A. 熔合区　B. 近缝区　C. 过热区　D. 焊缝区</p><p>手工电弧焊时相变温度以上的高温停留时间约为（　）A. 4～20s　B. 30～100s　C. 1～5min　D. 0.01～0.1s</p><p>埋弧自动焊时高温停留时间约为（　）A. 4～20s　B. 30～100s　C. 1～2h　D. 数秒</p><p>焊接加热速度比热处理加热速度（　）A. 略快　B. 快几十倍甚至几百倍　C. 基本相同　D. 更慢</p><p>加热速度增大时，扩散相变滞后，Ac1、Ac3及（Ac3-Ac1）（　）A. 降低　B. 升高　C. 不变　D. 无规律</p><p>相同冷却速度下，45钢焊接条件下的淬硬倾向比热处理（　），CCT曲线右移。A. 增大　B. 减小　C. 不变　D. 先增后减</p><p>40Cr焊接条件下CCT曲线左移、淬硬倾向降低，原因是（　）A. 晶粒粗化　B. Cr等高温停留时间短、未充分溶入奥氏体，奥氏体稳定性降低　C. 含碳量高　D. 冷却速度过快</p><p>下列属于不易淬火钢的是（　）A. 18MnMoNb　B. 45钢　C. 16Mn　D. 30CrMnSi</p><p>不易淬火钢HAZ中晶粒粗大、韧性很低的区域是（　）A. 熔合区　B. 过热区　C. 相变重结晶区　D. 不完全重结晶区</p><p>易淬火钢完全淬火区（Ac3以上）焊后得到的组织是（　）A. 细小铁素体　B. 粗大马氏体　C. 珠光体　D. 上贝氏体</p><p>焊接接头中晶粒严重长大、属于薄弱地带的是（　）A. 焊缝中心　B. 熔合区和过热区　C. 相变重结晶区　D. 母材</p><p>动应变时效脆化主要发生的温度范围是（　）A. 室温附近　B. 200～400℃　C. 500～600℃　D. 800℃以上</p><p>（二）填空题</p><p>焊缝两侧发生组织和性能变化的区域称为＿＿，又称近缝区。</p><p>焊接热循环是指焊件上某点温度由低到高、达到最高值后又由高到低随＿＿变化的过程。</p><p>焊接热循环的主要参数包括加热速度、最高温度、相变温度以上停留时间和＿＿。</p><p>焊接加热的最高温度比热处理温度高＿＿℃。</p><p>长段多层焊每道焊缝的长度在＿＿以上。</p><p>短段多层焊每道焊缝的长度约为＿＿。</p><p>强碳化物形成元素如Ti、V、Nb与C形成的碳化物比＿＿稳定。</p><p>相同冷却速度下，45钢焊接条件下CCT曲线向＿＿移动。</p><p>不易淬火钢相变重结晶区的温度范围为A3～＿＿℃。</p><p>不完全重结晶区的温度范围为Ac1～＿＿。</p><p>把钢中合金元素（包括碳）对其淬硬影响折合成碳的相当含量称为＿＿。</p><p>伊藤Pcm公式适用于含碳量＿＿%以下的低合金高强钢。</p><p class=\"ans\">参考答案</p><p>选择题：1.B　2.A　3.B　4.B　5.B　6.A　7.B　8.C　9.B　10.B　11.B　12.B</p><p>填空题：1.热影响区　2.时间　3.冷却速度（冷却时间）　4.100～200　5.1m　6.50～400mm　7.Fe3C　8.右　9.1000　10.Ac3　11.碳当量　12.0.17</p>\n<h2 class=\"n2\">增材制造技术（新增章节）</h2>\n<h3 class=\"n3\">§1　增材制造技术概论</h3>\n<p><b>定义：</b>依据三维CAD设计数据，采用液体、粉末、丝等离散材料逐层累加制造实体零件；相对于材料去除和模具成形，是一种“自下而上”的材料累加过程。</p>\n<p><b>三类制造：</b>减材制造（材料去除）、等材制造（模具控形、材料变形）、增材制造（离散材料逐层累加）。</p>\n<p><b>两个阶段：</b>数据处理——对三维CAD模型分层“切片”，分解为二维轮廓数据；叠层制作——按二维数据逐层制作薄片并自下而上叠加为三维实体。</p>\n<p><b>发展：</b>1986年Hull发明SLA；1988年Feygin发明LOM；1989年Deckard发明SLS；1992年Crump发明FDM；1993年Sachs发明3DP。我国西安交大重点研究SLA，清华研究FDM/EBM/生物3DP，华中科大研究LOM/SLS/SLM，北京隆源研发销售SLS设备。</p>\n<p><b>特点与局限：</b>适合复杂结构快速制造、个性化定制和高附加值产品；但技术成熟度较低、材料种类有限、精度和尺寸受限、成本较高，暂不能替代传统工艺。</p>\n<p><b>材料与趋势：</b>高分子材料适用FDM、SLA、3DP、SLS；金属材料适用SLM、EBM、LENS。趋势为快速原型→功能零件、常规尺度→微纳和大型化、工业应用→日常消费。</p>\n<h3 class=\"n3\">§2　光固化制造技术</h3>\n<p><b>原理：</b>利用光能的化学和热作用使液态光敏树脂固化，控制光能形状逐层固化、堆积成形；国际上通称stereolithography（SL/SLA），树脂受紫外光照射发生聚合反应由液态变固态。</p>\n<p><b>曝光与扫描：</b>曝光方式有掩模面曝光、扫描头选择性曝光、投影曝光；扫描可用X-Y平面扫描（器件少、成本低、易大幅面，但速度慢）或振镜扫描（速度快、成本高、范围受限），目前常用振镜。</p>\n<p><b>树脂要求：</b>固化前稳定、黏度低、光敏性好、固化收缩小、溶胀小、最终产物强度/耐蚀/热稳定性好、毒性小。</p>\n<p><b>系统与流程：</b>激光器、光路、扫描照射、分层叠加固化成形系统；光源波长325~355nm。流程为前处理（建模、近似处理、选择方向、切片、加支撑）→分层叠加成形→后处理（取出、排残树脂、清洗、后固化、去支撑、机加工、打磨）。层间台阶约0.05~0.1mm，残留树脂会暗反应固化收缩，必须排出。</p>\n<h3 class=\"n3\">§3　激光选区熔化技术</h3>\n<p><b>原理：</b>高能激光将金属粉末完全熔化后快速冷却凝固，逐层得到高致密度、高精度金属零件；能量不足仅使颗粒软化，能量超过熔点则熔化，激光消失后快速冷却形成细晶。</p>\n<p><b>粉末要求：</b>堆积特性、粒径分布、颗粒形状、流动性、含氧量、激光吸收率。SLM铺粉宜用振实密度；球形度越高、表面越光滑，孔隙率越低；气雾化粉接近球形，旋转电极粉球形度更高、表面更光洁、孔隙率更低；二组分粒径级配可提高铺粉致密度；氧含量一般≤1000ppm，氧化膜降低润湿性，导致分层和裂纹；激光波长越短吸收率越高。</p>\n<p><b>流程：</b>材料准备→工作腔准备→模型准备（CAD转STL并切片）→加工（抽真空、通保护气、预热、设激光功率/扫描速度/层厚/扫描间距/路径）→零件后处理（喷砂或高压气清粉、去支撑、乙醇清洗）。</p>\n<p><b>优缺点：</b>材料广、晶粒细匀、力学性能好、致密度高、精度高；但球化、翘曲、裂纹等冶金缺陷，零件尺寸受限，工艺参数复杂，设备成本高且可靠性稳定性仍需提高。</p>\n<h1 class=\"n1\">附录　高频考点一句话速记</h1><p>焊冶是“再熔炼”，普冶是“提炼”；原材料和目的均不同。</p><p>焊条加热三大热源：电阻热、电弧热、化学反应热（仅占1%～3%，可忽略）。</p><p>碱性焊条以短路过渡+大颗粒过渡为主，酸性焊条以细颗粒过渡+附壁过渡为主。</p><p>保护方式五种：渣保护、气保护、气渣联合保护、真空保护、自保护。</p><p>反应区三段：药皮（先蒸发水分）→熔滴（1800～2400℃、10³～10⁴cm²/kg、0.01～0.1s）→熔池（1600～1900℃、3～130cm²/kg、3～8s）。</p><p>氮源空气、氢源水分；控氮靠保护+Ti/Al/Zr，控氢靠烘干+氟化物，控氧靠工艺+冶金。</p><p>氢脆是暂态现象（可时效消除）；氢白点（鱼眼）直径0.5～3mm；氢致冷裂纹三要素：H、M、R。</p><p>熔渣碱度B＞1碱性、B＜1酸性；CaF2降粘度、降表面张力；表面张力金属键最大。</p><p>脱氧三步：先期（药皮固态加热，Al、Ti大量烧损）→沉淀（熔滴与熔池）→扩散（降温、酸性渣有利）。</p><p>硫害热裂（Fe+FeS共晶985℃），磷害冷脆热裂（Fe+Fe3P共晶1050℃）；脱硫常用Mn。</p><p>合金过渡系数η：元素越活泼越低、沸点低越低；Kb↑η↓；I↑η↓；氩弧焊η较大。</p><p>E4303（J422）钛钙型酸性、气渣联合保护；E5015（J507）低氢型碱性、塑韧性好、用于重要结构。</p><p>药皮“七剂”：稳弧、造渣、造气、脱氧、合金、粘结、增塑。</p><p>立、仰、横焊要“短渣”——凝固温度范围窄、快速凝固；氧化铁型长渣不行。</p><p>飞溅影响因素：粘度↑、电流↑、水分↑、电压↑、交流＞直流、大颗粒过渡。</p><p>焊剂=焊条药皮、焊丝=焊条焊芯；焊剂三种制造方法：熔炼、粘结（陶质，400℃以下）、烧结（400～1000℃）。</p><p>焊剂质量：含水量≤0.10%、机械夹杂物≤0.30%、S≤0.060%、P≤0.080%。</p><p>熔池凝固五特点：过热度大、过冷度大、烧损大、结晶速度快、运动态结晶。</p><p>结晶五形态随成分过冷增大：平面→胞状→胞状树枝→树枝→等轴。</p><p>偏析三种：显微（枝晶间）、区域（杂质推向中心）、层状（结晶潜热周期性变化）。</p><p>气孔三兄弟：氢-表面喇叭口、氮-表面蜂窝成堆、CO-内部条虫沿柱状晶。</p><p>铁素体四类：PF晶界、FSP侧板条（无碳贝氏体）、AF针状（500℃）、FGF细晶（贝氏铁素体）。</p><p>上贝羽毛状、下贝针状强韧；板条马氏体位错、片状马氏体孪晶（C≥0.4%）。</p><p>焊接缺欠六类：裂纹、孔穴、固体夹杂、未熔合及未焊透、形状和尺寸不良、其他；裂纹最危险、绝对不允许存在。</p><p>热循环四参数：加热速度、最高温度、相变以上停留时间、冷却速度（t8/5等）。</p><p>手工焊高温停留4～20s、埋弧自动焊30～100s；加热快几十到几百倍、温度高100～200℃。</p><p>45钢CCT右移（淬硬↑，无碳化物溶解+组织粗化）；40Cr CCT左移（淬硬↓，Cr未充分溶入奥氏体）。</p><p>不易淬火钢HAZ分区：熔合区（窄）、过热区（韧性低）、相变重结晶区（细）、不完全重结晶区（不均）。</p><p>碳当量公式适用性：CE(IIW)适用σb=400～700MPa，Ceq(WES)适用σb=500～1000MPa，Pcm适用C≤0.17%。</p><p>HAZ脆化六类：粗晶、组织、析出、热应变时效、氢、石墨；M-A组元是组织脆化主因之一。</p><p>动应变时效脆化在200～400℃；调质钢回火温度越低、焊后软化越严重。</p>";
const FRAMEWORK_HTML = "<div class=\"fwgrid\">\n  <div class=\"fwcard c0\">\n    <div class=\"fw-hd\"><b>绪论 焊接概述</b><span>核心：焊接的实质、能源与热过程</span></div>\n    <div class=\"fw-bd\">\n      <div class=\"fw-sec\"><span class=\"fw-lb\">焊接定义与措施</span><ul>\n        <li>定义：加热或加压（或并用）、用或不用填充材料、原子间结合、永久性连接</li>\n        <li>加压措施：破坏表面氧化膜 + 增加有效接触面积；加热措施：去氧化膜、降变形阻力、增原子振动能、促扩散/再结晶/化学反应/结晶</li>\n        <li>按过程特点分：冷压焊、电阻焊、熔化焊</li>\n      </ul></div>\n      <div class=\"fw-sec\"><span class=\"fw-lb\">能源与热过程</span><ul>\n        <li>能源9种：电弧热、化学热、电阻热、高频感应热、摩擦热、等离子焰、电子束、激光束（+其他）</li>\n        <li>热过程两特征：局部性 + 瞬时性；加热区：活性斑点区 dA + 加热斑点区 dH</li>\n        <li>接头形成：加热→熔化→冶金反应→凝固→固态相变</li>\n      </ul></div>\n      <div class=\"fw-sec\"><span class=\"fw-lb\">温度场</span><ul>\n        <li>定义：焊件上某瞬时温度分布；分稳定 / 非稳定 / 准稳定</li>\n        <li>准稳定：对移动热源，静态坐标系非稳定、移动坐标系稳定</li>\n        <li>影响因素：热源性质、线能量、金属性质（λ、c、a）、板厚形状</li>\n      </ul></div>\n    </div>\n  </div>\n  <div class=\"fwcard c1\">\n    <div class=\"fw-hd\"><b>第一章 焊接化学冶金</b><span>核心：高温下气体·液态金属·熔渣的相互作用</span></div>\n    <div class=\"fw-bd\">\n      <div class=\"fw-sec\"><span class=\"fw-lb\">§1 冶金过程特点</span><ul>\n        <li>热源三来源：电阻热·电弧热·化学反应热（占1%~3%可忽略）</li>\n        <li>熔滴过渡：短路（细丝CO₂焊）/颗粒·喷射/附壁/渣保护；碱性=短路+大颗粒，酸性=细颗粒+附壁</li>\n        <li>保护五种：渣·气·气渣联合·真空·自保护</li>\n        <li>反应区三段：药皮→熔滴（0.01~0.1s）→熔池（SMAW 3~8s）；熔合比θ</li>\n      </ul></div>\n      <div class=\"fw-sec\"><span class=\"fw-lb\">§2 气相对金属的作用</span><ul>\n        <li>氮：源空气；Fe₄N脆化，Ti/V→TiN/VN除时效脆化；15MnVN增强</li>\n        <li>氢：氢脆、白点（鱼眼0.5~3mm）、冷裂纹（H·M·R）；烘干+氟化物防氢</li>\n        <li>氧：CO气孔·飞溅·烧损有益元素；控氧：限制来源+工艺+冶金</li>\n      </ul></div>\n      <div class=\"fw-sec\"><span class=\"fw-lb\">§3 熔渣 · §4 合金过渡</span><ul>\n        <li>碱度B&gt;1(1.3)碱 / B=1中 / B&lt;1酸；CaF₂降粘度降表面张力</li>\n        <li>氧化：扩散氧化·置换氧化；脱氧：先期·沉淀·扩散</li>\n        <li>硫（Fe+FeS 985℃热裂）磷（Fe+Fe₃P 1050℃冷脆）控制</li>\n        <li>过渡系数η：活泼元素↓、Kb↑↓、I↑↓、氩弧焊↑；对氧亲和力Cu→Al递增</li>\n      </ul></div>\n    </div>\n  </div>\n  <div class=\"fwcard c2\">\n    <div class=\"fw-hd\"><b>第二章 焊接材料</b><span>核心：焊条、焊剂、焊丝的选型与冶金性能</span></div>\n    <div class=\"fw-bd\">\n      <div class=\"fw-sec\"><span class=\"fw-lb\">§1 焊条</span><ul>\n        <li>组成：焊芯（导电+填充，多用H08A）+药皮（七剂：稳弧/造渣/造气/脱氧/合金/粘结/增塑）</li>\n        <li>E4303（J422）钛钙型·酸性·气渣联合；E5015（J507）低氢型·碱性·塑韧好</li>\n        <li>J507稳弧差因CaF₂氟电离势高（18.6V）夺电子；短渣才能立仰横焊</li>\n        <li>飞溅↑：粘度↑·I↑·水分↑·U↑·交流&gt;直流；钛型脱渣最好、低氢最差</li>\n      </ul></div>\n      <div class=\"fw-sec\"><span class=\"fw-lb\">§2 焊剂</span><ul>\n        <li>焊剂=焊条药皮、焊丝=焊条焊芯；作用：隔离空气+冶金处理</li>\n        <li>制造：熔炼 / 粘结（陶质，&lt;400℃）/ 烧结（400~1000℃）</li>\n        <li>质量：H₂O≤0.10%、夹杂≤0.30%、S≤0.060%、P≤0.080%；高硅焊剂SiO₂&gt;30%</li>\n      </ul></div>\n      <div class=\"fw-sec\"><span class=\"fw-lb\">§3 焊丝</span><ul>\n        <li>分类：按焊接方法 / 形状结构（实心·药芯·活性）/ 适用金属材料</li>\n      </ul></div>\n    </div>\n  </div>\n  <div class=\"fwcard c3\">\n    <div class=\"fw-hd\"><b>第三章 熔池凝固与焊缝固态相变</b><span>核心：结晶、组织转变、气孔夹杂与焊接缺欠</span></div>\n    <div class=\"fw-bd\">\n      <div class=\"fw-sec\"><span class=\"fw-lb\">§1 熔池凝固</span><ul>\n        <li>特点：过热度大·过冷度大·烧损大·速度快·运动结晶；以非自发形核为主</li>\n        <li>结晶五形态（成分过冷↑）：平面→胞状→胞状树枝→树枝→等轴</li>\n        <li>偏析三种：显微（枝晶间）·区域（推向中心）·层状（潜热周期）；熔合区=薄弱环节</li>\n      </ul></div>\n      <div class=\"fw-sec\"><span class=\"fw-lb\">§2 焊缝固态相变</span><ul>\n        <li>低碳钢：F+少量P；铁素体四类：PF（晶界）/FSP（侧板条）/AF（针状500℃）/FGF</li>\n        <li>上贝氏体羽毛状、下贝氏体针状强韧、M-A组元→粒状/条状贝氏体</li>\n        <li>板条M=位错M（韧性好）；片状M=孪晶M（C≥0.4%）</li>\n      </ul></div>\n      <div class=\"fw-sec\"><span class=\"fw-lb\">§3 气孔夹杂 · §5 焊接缺欠</span><ul>\n        <li>气孔：H₂表面喇叭口·N₂表面蜂窝·CO内部条虫沿柱状晶</li>\n        <li>夹杂：氧化物（层状撕裂）·氮化物Fe₄N·硫化物FeS（热裂）</li>\n        <li>缺欠六类（GB/T 6417.1-2005）：裂纹·孔穴·固体夹杂·未熔合未焊透·形状尺寸不良·其他；裂纹最危险</li>\n      </ul></div>\n    </div>\n  </div>\n  <div class=\"fwcard c4\">\n    <div class=\"fw-hd\"><b>第四章 焊接热影响区</b><span>核心：热循环、组织转变、HAZ分区与性能</span></div>\n    <div class=\"fw-bd\">\n      <div class=\"fw-sec\"><span class=\"fw-lb\">§1 焊接热循环</span><ul>\n        <li>四参数：加热速度·最高温度·相变以上停留时间·冷却速度（t8/5等）</li>\n        <li>特点：温度高100~200℃、速度快几十至几百倍、手工停留4~20s/埋弧30~100s</li>\n      </ul></div>\n      <div class=\"fw-sec\"><span class=\"fw-lb\">§2 组织转变特点</span><ul>\n        <li>45钢CCT右移（淬硬↑：无碳化物溶解+组织粗化）；40Cr左移（淬硬↓：Cr未充分溶入A）</li>\n        <li>合金元素按碳亲和力：强碳化物Ti/V/Nb、弱碳化物Mn、非碳化物Ni/Co/Cu/Si/Al等</li>\n      </ul></div>\n      <div class=\"fw-sec\"><span class=\"fw-lb\">§3 HAZ组织与性能</span><ul>\n        <li>不易淬火钢分区：熔合区·过热区（韧性低）·重结晶区（细）·不完全重结晶区（不均）</li>\n        <li>碳当量：CE(IIW) 400~700MPa / Ceq(WES) 500~1000 / Pcm C≤0.17%</li>\n        <li>脆化六类：粗晶·组织（M-A）·析出·热应变时效（200~400℃）·氢·石墨</li>\n        <li>韧化：母材组织+焊后热处理+控制线能量；调质钢回火温度越低软化越严重</li>\n      </ul></div>\n    </div>\n  </div>\n  <div class=\"fwcard c5\">\n    <div class=\"fw-hd\"><b>第五章 焊接裂纹</b><span>核心：裂纹分类、机理、判据与防治</span></div>\n    <div class=\"fw-bd\">\n      <div class=\"fw-sec\"><span class=\"fw-lb\">热裂纹</span><ul>\n        <li>按本质分：结晶裂纹（液态薄膜+拉应力；脆性温度区；CST↑敏感↓；S、P&lt;0.03~0.04%）、高温液化裂纹（近缝区/层间，&lt;0.5mm）、多边化裂纹（纯金属/单相奥氏体）</li>\n        <li>抗裂：Ti/Zr/RE高熔点硫化物（TiS 2000~2100℃、ZrS 2100℃、CeS 2450℃）、γ+δ双相</li>\n      </ul></div>\n      <div class=\"fw-sec\"><span class=\"fw-lb\">冷裂纹</span><ul>\n        <li>温度约100℃~-75℃、HAZ为主、断口发亮；延迟裂纹最普遍（焊趾/焊道下/根部）</li>\n        <li>三因素：淬硬倾向+含氢量及分布+拘束应力；致裂=冷至100℃残余扩散氢</li>\n        <li>判据：拘束度R/Rcr；试验：TRC/RRC/插销；防治：低氢材料、烘干、预热、后热350℃×1~2h</li>\n      </ul></div>\n      <div class=\"fw-sec\"><span class=\"fw-lb\">再热 · 层状撕裂 · SCC · 断口</span><ul>\n        <li>再热裂纹：HAZ粗晶沿晶；500~700℃敏感；二次沉淀+晶界杂质弱化；预热200~450℃</li>\n        <li>层状撕裂：平台+剪切壁；与夹杂有关；ψZ≥15%；条状硫化物/硅酸盐敏感</li>\n        <li>SCC：介质+拉应力；奥氏体不锈钢多APC、高强钢多HEC；焊后消除应力可降低敏感性</li>\n        <li>断口：韧窝DR / 解理CF（河流） / 准解理QC / 沿晶IG（冰糖状）</li>\n      </ul></div>\n    </div>\n  </div>\n  <div class=\"fwcard c6\">\n    <div class=\"fw-hd\"><b>第六章 钎焊</b><span>核心：润湿铺展、分类体系与缺陷</span></div>\n    <div class=\"fw-bd\">\n      <div class=\"fw-sec\"><span class=\"fw-lb\">定义与过程</span><ul>\n        <li>定义：低于母材熔点、高于钎料熔点加热；液态钎料润湿/铺展/毛细流动填缝、凝固结晶、原子间结合</li>\n        <li>过程：钎剂去氧化膜→钎料熔化排钎剂残渣→钎料与母材溶解扩散反应</li>\n        <li>优点：温度低影响小、变形小精度高、生产率高、异种金属及金属非金属连接</li>\n      </ul></div>\n      <div class=\"fw-sec\"><span class=\"fw-lb\">润湿与毛细</span><ul>\n        <li>润湿：固液界面取代固气界面自由能降低；θ=90°分界（&lt;90润湿、&gt;90不润湿、≈0漫流）；大多10~45°</li>\n        <li>毛细流动受：毛细管驱动力、金属密度、黏度、接头几何形状影响</li>\n        <li>接头间隙小→强度高（可超母材）；间隙增大→接近钎料自身强度</li>\n      </ul></div>\n      <div class=\"fw-sec\"><span class=\"fw-lb\">分类与缺陷</span><ul>\n        <li>按温度：软钎焊&lt;450℃ / 硬钎焊&gt;450℃ / 高温钎料&gt;950℃</li>\n        <li>按热源：火焰/炉中/感应/电阻/浸渍/气相/烙铁/超声波；按去膜：钎剂/无钎剂/自钎剂/气体保护/真空</li>\n        <li>缺陷：不致密性（气孔夹渣未填满）、母材自裂（液态钎料渗入微裂纹）、溶蚀（表面溶坑）</li>\n      </ul></div>\n    </div>\n  </div>\n  <div class=\"fwcard c7\">\n    <div class=\"fw-hd\"><b>增材制造技术</b><span>核心：逐层累加、光固化、SLM</span></div>\n    <div class=\"fw-bd\">\n      <div class=\"fw-sec\"><span class=\"fw-lb\">概念与体系</span><ul>\n        <li>定义：三维CAD→分层切片→离散材料逐层累加；与减材、等材并列</li>\n        <li>两阶段：数据处理（切片）→叠层制作（二维薄层叠成三维实体）</li>\n        <li>特点：复杂结构、个性化定制、高附加值；局限：成熟度/材料/尺寸/成本</li>\n      </ul></div>\n      <div class=\"fw-sec\"><span class=\"fw-lb\">光固化 SLA</span><ul>\n        <li>原理：紫外光→光敏树脂聚合固化；静态光斑固化形貌为旋转抛物面</li>\n        <li>扫描：X-Y平面（成本低、大幅面、慢）/振镜（快、贵、范围小），常用振镜</li>\n        <li>流程：前处理→分层叠加→后处理（排残树脂/清洗/后固化/去支撑/打磨0.05~0.1mm）</li>\n      </ul></div>\n      <div class=\"fw-sec\"><span class=\"fw-lb\">激光选区熔化 SLM</span><ul>\n        <li>原理：高能激光完全熔化金属粉→快冷→高致密高精度零件</li>\n        <li>粉末：振实密度、球形度↑孔隙率↓、二组分体系级配、氧≤1000ppm、短波长吸收率高</li>\n        <li>流程：材料/工作腔/模型准备→加工→后处理；优点细晶高致密，缺点球化/翘曲/裂纹、尺寸受限、参数复杂</li>\n      </ul></div>\n    </div>\n  </div>\n</div>";

<text x="34" y="226" class="sm">[Si] + O₂ → (SiO₂)</text>

</style><rect width="720" height="380" fill="#fbfdfe"/><text x="24" y="30" class="ttl">酸性 vs 碱性焊条：净化作用对比</text><rect x="24" y="52" width="672" height="38" fill="#1c5a86"/><text x="34" y="77" class="lbl2" fill="#fff">对比项</text><text x="190" y="77" class="lbl2" fill="#fff">酸性 E4303（J422）</text><text x="410" y="77" class="lbl2" fill="#fff">碱性 E5015（J507）</text><rect x="24" y="90" width="672" height="34" fill="#f7fbfd" stroke="#dbe7ee"/><text x="34" y="113" font-size="14" font-weight="700" fill="#1c5a86">渣系</text><text x="190" y="113" font-size="14" fill="#3f586a">TiO₂-CaO-SiO₂</text><text x="410" y="113" font-size="14" fill="#3f586a">CaF₂-CaO-SiO₂</text><rect x="24" y="124" width="672" height="34" fill="#fff" stroke="#dbe7ee"/><text x="34" y="147" font-size="14" font-weight="700" fill="#1c5a86">碱度</text><text x="190" y="147" font-size="14" fill="#3f586a">B1=0.76，酸性</text><text x="410" y="147" font-size="14" fill="#3f586a">B1=1.89，碱性</text><rect x="24" y="158" width="672" height="34" fill="#f7fbfd" stroke="#dbe7ee"/><text x="34" y="181" font-size="14" font-weight="700" fill="#1c5a86">氧化性</text><text x="190" y="181" font-size="14" fill="#3f586a">较强，FeO 活度高</text><text x="410" y="181" font-size="14" fill="#3f586a">较小，FeO 活度低</text><rect x="24" y="192" width="672" height="34" fill="#fff" stroke="#dbe7ee"/><text x="34" y="215" font-size="14" font-weight="700" fill="#1c5a86">脱硫脱磷</text><text x="190" y="215" font-size="14" fill="#3f586a">较弱，以 Mn 脱硫为主</text><text x="410" y="215" font-size="14" fill="#3f586a">较强，CaO 等碱性氧化物</text><rect x="24" y="226" width="672" height="34" fill="#f7fbfd" stroke="#dbe7ee"/><text x="34" y="249" font-size="14" font-weight="700" fill="#1c5a86">去氢</text><text x="190" y="249" font-size="14" fill="#3f586a">弱</text><text x="410" y="249" font-size="14" fill="#3f586a">CaF₂ 与 H 生成 HF，强</text><rect x="24" y="260" width="672" height="34" fill="#fff" stroke="#dbe7ee"/><text x="34" y="283" font-size="14" font-weight="700" fill="#1c5a86">焊缝 O/H/S/P</text><text x="190" y="283" font-size="14" fill="#3f586a">较高</text><text x="410" y="283" font-size="14" fill="#3f586a">较低</text><rect x="24" y="294" width="672" height="34" fill="#f7fbfd" stroke="#dbe7ee"/><text x="34" y="317" font-size="14" font-weight="700" fill="#1c5a86">塑韧性</text><text x="190" y="317" font-size="14" fill="#3f586a">较低</text><text x="410" y="317" font-size="14" fill="#3f586a">较高</text><rect x="24" y="328" width="672" height="34" fill="#fff" stroke="#dbe7ee"/><text x="34" y="351" font-size="14" font-weight="700" fill="#1c5a86">工艺性</text><text x="190" y="351" font-size="14" fill="#3f586a">好：稳弧、脱渣、成形</text><text x="410" y="351" font-size="14" fill="#3f586a">较差：稳弧/脱渣差，烟尘含氟</text><text x="30" y="366" class="tiny">结论：酸性焊条净化作用明显弱于碱性焊条；但酸性焊条工艺性好，一般结构常用；重要结构用碱性低氢焊条。</text></svg>`,

const ESSAY_AI = [{"id":"w01","ch":"第一章","chname":"第一章 焊接化学冶金","src":"真题","srcnote":"期中试题·简答1","full":10,"q":"分别叙述硫和磷对焊接的危害性及其控制措施。","pts":[{"t":"硫以 FeS 形式偏析于晶界，形成 Fe+FeS（985℃）、Fe+FeO（940℃）低熔点共晶，结晶后期晶界液膜在拉应力下开裂，产生热裂纹（热脆）。","k":["FeS","985","940","热裂纹","晶界"]},{"t":"控硫：限制母材、焊丝、药皮、焊剂含硫；用 Mn 脱硫生成 MnS 入渣（[FeS]+[Mn]→(MnS)+[Fe]），或用 CaO/MgO 碱性氧化物脱硫。","k":["Mn","MnS","CaO","限制"]},{"t":"磷以 Fe3P/Fe2P 偏析于晶界，形成 Fe+Fe3P（1050℃）、Fe+Ni3P（880℃）低熔点共晶，引起冷脆和热裂。","k":["Fe3P","1050","880","冷脆","热裂"]},{"t":"控磷：限制来源；脱磷分两步，先使 P 氧化成 P2O5，再与 CaO 生成稳定磷酸钙入渣。","k":["P2O5","CaO","两步","脱磷"]},{"t":"碱性渣、低氢焊条有利于脱硫脱磷；C、Ni 等促进偏析的元素应控制。","k":["碱性","低氢","C","Ni"]}],"ans":"硫：① 以 FeS 形式存在，液态互溶、固态基本不溶，偏析于晶界；与 Fe 形成 Fe+FeS 低熔点共晶（985℃），与 FeO 形成 Fe+FeO 共晶（940℃），高镍合金还有 NiS+Ni 共晶（644℃）。结晶后期晶界液膜在拉应力下开裂，即热裂纹（热脆）；C↑ 促进偏析。② 控制：限制母材、焊丝、药皮、焊剂含硫；冶金脱硫用 Mn（[FeS]+[Mn]→(MnS)+[Fe]，MnS 熔点 1610℃ 入渣，降温有利），或用 CaO/MgO 碱性氧化物脱硫。\n磷：① 以 Fe3P/Fe2P 存在，固态基本不溶，晶界形成 Fe+Fe3P 共晶（1050℃）或 Fe+Ni3P 共晶（880℃），引起冷脆和热裂，P 偏析严重。② 控制：限制来源；脱磷两步——先使 P 氧化成 P2O5，再与 CaO 生成稳定磷酸钙入渣（2[Fe3P]+5(FeO)+3CaO→(CaO)3·P2O5+11[Fe]）。碱性渣、低氢焊条有利于脱硫脱磷；同时控制 C、Ni 等促进偏析的元素。","figKey":"hot_crack","figcap":"硫、磷在晶界形成低熔点共晶液膜，结晶后期受拉应力→热裂纹；图中标出 Fe+FeS 985℃、Fe+Fe3P 1050℃。","basis":"CHAP1 §3 硫、磷的危害；期中试题 简答1"},{"id":"w02","ch":"第二章","chname":"第二章 焊接材料","src":"真题","srcnote":"期中试题·简答2 / 练习题2","full":15,"q":"对比说明酸性焊条对焊缝金属的净化作用。","pts":[{"t":"酸性焊条以 E4303（J422）为代表，渣系 TiO2-CaO-SiO2，B1=0.76，属酸性，气渣联合保护。","k":["E4303","TiO2","0.76","酸性","气渣联合"]},{"t":"熔渣氧化性较强、FeO 活度高，扩散脱氧能力弱；酸性氧化物多，自由氧离子少，脱硫脱磷能力弱。","k":["氧化性","FeO","脱氧","脱硫","脱磷"]},{"t":"碱性焊条以 E5015（J507）为代表，B1=1.89，CaO 等碱性氧化物脱硫脱磷强，CaF2 与 H/水生成 HF 去氢。","k":["E5015","1.89","CaO","CaF2","HF"]},{"t":"碱性焊条焊缝 O、H、S、P 低，净化作用强，塑韧性好；酸性焊条焊缝 O、H、S、P 较高，塑韧性较低。","k":["O","H","S","P","塑韧性"]},{"t":"结论：酸性焊条净化作用明显弱于碱性焊条；但酸性焊条稳弧、脱渣、成形好，一般结构常用，重要结构用碱性低氢焊条。","k":["净化作用弱","工艺性","稳弧","重要结构"]}],"ans":"酸性焊条以 E4303（J422）为代表，渣系 TiO2-CaO-SiO2，B1=0.76，属酸性，气渣联合保护。其熔渣氧化性较强、FeO 活度高，扩散脱氧能力弱；酸性氧化物多，自由氧离子少，脱硫脱磷能力弱，主要靠 Mn 脱硫，脱磷靠 FeO+CaO 但效果有限；CaF2 少，去氢能力弱。因此焊缝中 O、H、S、P 含量较高，塑韧性较低。\n碱性焊条以 E5015（J507）为代表，渣系 CaF2-CaO-SiO2，B1=1.89，属碱性，氧化性小；CaO 等碱性氧化物脱硫脱磷强，CaF2 与 H/水反应生成 HF 去氢；焊缝 O、H、S、P 低，净化作用强，塑韧性好。\n结论：酸性焊条对焊缝金属的净化作用明显弱于碱性焊条；但酸性焊条稳弧、脱渣、成形好，成本低，一般结构常用；重要结构用碱性低氢焊条。","figKey":"acidbase","figcap":"酸性 E4303 与碱性 E5015 的渣系、碱度、氧化性、脱硫脱磷、去氢和塑韧性对比。","basis":"CHAP2 §1 典型焊条；期中试题 简答2；练习题2"},{"id":"w03","ch":"第三章","chname":"第三章 熔池凝固和焊缝固态相变","src":"真题","srcnote":"期中试题·简答3","full":15,"q":"根据 16Mn 钢焊缝化学成分和冷却条件的不同，其固态相变组织可能有哪些？各自特征如何？","pts":[{"t":"16Mn 为低合金高强钢（C≈0.16%、Mn≈1.4%），焊缝可能出现铁素体、珠光体、贝氏体、马氏体四类组织，以铁素体为主。","k":["16Mn","低合金","铁素体","珠光体","贝氏体","马氏体"]},{"t":"铁素体四类：PF（>750℃晶界）、FSP（700~550℃侧板条/无碳贝氏体）、AF（约500℃晶内针状）、FGF（<500℃细晶/贝氏铁素体）。","k":["PF","FSP","AF","FGF","750","500"]},{"t":"珠光体：Ar1~550℃扩散型转变，F+Fe3C 层状；焊接非平衡冷却时量少，慢冷/预热/后热时增多。","k":["珠光体","Ar1","550","层状","慢冷"]},{"t":"贝氏体：上贝 550~500℃羽毛状；下贝 450℃~Ms 针状强韧；M-A 组元为富碳马氏体+残余奥氏体。","k":["上贝","下贝","羽毛","针状","M-A","Ms"]},{"t":"马氏体：含碳高或合金复杂、快冷到 Ms 以下；板条马氏体（位错、强韧），片状马氏体（C≥0.4%、孪晶、脆）。","k":["马氏体","板条","片状","0.4","位错","孪晶"]}],"ans":"16Mn 为低合金高强钢（C≈0.16%、Mn≈1.4%），焊缝为低合金钢焊缝，固态相变可能出现铁素体、珠光体、贝氏体、马氏体四类组织，以铁素体为主。\n① 铁素体：先共析铁素体 PF（>750℃，沿原奥氏体晶界细条/块状）；侧板条铁素体 FSP（700~550℃，由晶界向晶内板条状，无碳贝氏体）；针状铁素体 AF（约500℃，晶内针状、以质点为核心放射状）；细晶铁素体 FGF（<500℃，晶内细小，450℃左右可转上贝氏体）。\n② 珠光体：Ar1~550℃ 扩散型转变，F+Fe3C 层状；焊接非平衡冷却时量少，慢冷/预热/后热时增多。\n③ 贝氏体：上贝氏体 Bu（550~500℃，羽毛状，条状 F 间夹渗碳体）；下贝氏体 BL（450℃~Ms，针状，强韧）；M-A 组元为富碳马氏体+残余奥氏体。\n④ 马氏体：含碳高或合金复杂、快冷到 Ms 以下；板条马氏体（低碳低合金，位错亚结构，强韧）；片状马氏体（C≥0.4%，孪晶，脆）。\n16Mn 常规焊态以 PF+FSP+AF+FGF 为主，少量 P；冷速加快→B 增多；更快→M；慢冷/预热→P 增多。","figKey":"cct","figcap":"16Mn 低合金钢焊缝 CCT 示意：冷速↑，组织由 F+P→B→M 转变；常规焊态以 PF+FSP+AF+FGF 为主。","basis":"CHAP3 §2 焊缝固态相变；期中试题 简答3"},{"id":"w04","ch":"第二章","chname":"第二章 焊接材料","src":"真题","srcnote":"期中试题·简答4(1)","full":6,"q":"解释焊条型号 E5515-N5 P U H10 的含义。","pts":[{"t":"E 表示焊条；55 表示熔敷金属抗拉强度最小值 550MPa。","k":["E","焊条","55","550"]},{"t":"15 表示药皮为碱性、适用于全位置焊接、直流反接；-N5 表示熔敷金属化学成分分类代号。","k":["15","碱性","全位置","直流反接","N5","化学成分"]},{"t":"P 表示焊后状态（P=热处理态，无标记=焊态，AP=两种状态均可）；U 表示规定温度下冲击吸收能量≥47J；H10 表示扩散氢≤10mL/100g。","k":["P","热处理","U","47","H10","10"]}],"ans":"E5515-N5 P U H10：E—焊条；55—熔敷金属抗拉强度最小值 550MPa；15—药皮为碱性，适用于全位置焊接，直流反接；-N5—熔敷金属化学成分分类代号；P—焊后状态代号，P 为热处理态（无标记为焊态，AP 为焊态/焊后热处理态均可）；U—可选附加代号，规定温度下冲击吸收能量≥47J；H10—可选附加代号，熔敷金属扩散氢≤10mL/100g。","figKey":"e5515","figcap":"按 GB/T 5117 逐段读焊条型号：E / 55 / 15 / -N5 / P / U / H10。","basis":"CHAP2 §1 焊条型号图；期中试题 简答4(1)"},{"id":"w05","ch":"第二章","chname":"第二章 焊接材料","src":"真题","srcnote":"期中试题·简答4(2)","full":15,"q":"分析 E4303（J422）焊条的冶金性能。","pts":[{"t":"E4303（J422）为钛钙型酸性焊条，渣系 TiO2-CaO-SiO2，B1=0.76，气渣联合保护，抗拉强度≥430MPa，全位置焊接。","k":["E4303","钛钙","TiO2","0.76","430","全位置"]},{"t":"氧化性较强、FeO 活度高，扩散脱氧弱；靠 Mn 先期+沉淀脱氧、Si 沉淀脱氧、C 脱氧，并有 Si/Mn 还原过渡。","k":["氧化性","FeO","Mn","Si","C","还原"]},{"t":"脱硫主要靠 Mn；脱磷靠 P 氧化成 P2O5 后与 CaO 生成磷酸钙入渣，能力有限。","k":["Mn","脱硫","P2O5","CaO","脱磷"]},{"t":"合金化：锰铁主要脱氧脱硫，Mo、V、W 不易氧化、过渡好；熔渣氧化性↑→CO 气孔↑，还原性↑→H2 气孔↑。","k":["Mo","V","W","CO","H2"]},{"t":"工艺性好：稳弧、飞溅小、脱渣易、成形美观、发尘少；但焊缝 O、S、P 较高，塑韧性低于碱性焊条，用于一般结构。","k":["工艺性","稳弧","脱渣","塑韧性","一般结构"]}],"ans":"E4303（J422）为钛钙型酸性焊条，渣系 TiO2-CaO-SiO2，B1=0.76，气渣联合保护，抗拉强度≥430MPa，全位置焊接。\n冶金性能：① 氧化性较强，熔渣中 FeO 活度高，扩散脱氧弱；靠 Mn 先期+沉淀脱氧、Si 沉淀脱氧、C 脱氧，并有 Si/Mn 还原过渡。② 脱硫主要靠 Mn（[FeS]+[Mn]→[Fe]+(MnS)；[FeS]+(MnO)→[FeO]+(MnS)）；脱磷靠 P 氧化成 P2O5 后与 CaO 生成 3CaO·P2O5/4CaO·P2O5 入渣，能力有限。③ 合金化：锰铁主要脱氧脱硫，Mo、V、W 不易氧化、过渡好。④ 气孔敏感性：熔渣氧化性↑→CO 气孔↑；还原性↑→H2 气孔↑。\n性能：工艺性好，稳弧、飞溅小、脱渣易、成形美观，发尘量少；但焊缝 O、S、P 较高，塑韧性低于碱性焊条。用于一般低碳钢/低合金钢结构；重要结构应选 E5015 等碱性低氢焊条。","figKey":"acidbase","figcap":"酸性 E4303（J422）与碱性 E5015（J507）的净化能力和工艺性对比。","basis":"CHAP2 §1 E4303；期中试题 简答4(2)"},{"id":"w06","ch":"第一章","chname":"第一章 焊接化学冶金","src":"真题","srcnote":"期中试题·简答5","full":15,"q":"简述 Mn、Si、Nb、V、Mo 五种元素对焊缝性能的影响。","pts":[{"t":"Mn：脱氧、脱硫，使硫以 MnS 代替低熔点 FeS 薄膜，改善硫化物形态，提高强度；Mn/S 比按 C 控制，过量增加淬硬倾向。","k":["Mn","脱氧","脱硫","MnS","Mn/S","淬硬"]},{"t":"Si：脱氧、固溶强化、δ 相形成，利于抗热裂；但 Si>0.4% 易形成低熔点硅酸盐夹杂，热裂↑，并降低 H 溶解度。","k":["Si","脱氧","δ","0.4","硅酸盐","热裂"]},{"t":"Nb：强碳化物形成元素，NbC 比 Fe3C 稳定，细化晶粒、沉淀强化、提高强度；但增加再热裂纹敏感性。","k":["Nb","NbC","细化晶粒","沉淀强化","再热裂纹"]},{"t":"V：强碳化物形成元素，V(C,N) 细化晶粒、沉淀强化；V+N→VN 消除氮时效脆化；增加再热裂纹敏感性。","k":["V","V(C,N)","细化晶粒","VN","再热裂纹"]},{"t":"Mo：碳化物形成元素，提高淬透性、热强性、抗回火软化；Mo/V/W 不易氧化、过渡系数高；增加再热裂纹敏感性。","k":["Mo","淬透性","热强性","回火","再热裂纹"]}],"ans":"① Mn：脱氧、脱硫；使硫以 MnS 代替低熔点 FeS 薄膜，改善硫化物形态；固溶强化，提高强度。Mn/S 比需按含碳量控制，过量 Mn 会增加淬硬倾向。\n② Si：脱氧剂，固溶强化，δ 相形成元素，利于消除结晶裂纹；但 Si>0.4% 易形成低熔点硅酸盐夹杂，热裂倾向增大；Si 还降低氢在钢中的溶解度。\n③ Nb：强碳化物形成元素，形成比 Fe3C 更稳定的 NbC，细化晶粒、沉淀强化、提高强度；但增加再热裂纹敏感性。\n④ V：强碳化物形成元素，V(C,N) 细化晶粒、沉淀强化；V+N→VN 可消除氮的时效脆化；同样增加再热裂纹敏感性。\n⑤ Mo：碳化物形成元素，提高淬透性、热强性和抗回火软化能力；Mo、V、W 不易氧化、过渡系数高；但增加再热裂纹敏感性。\n总纲：微量合金化以细化晶粒+沉淀强化为主；Nb、V、Mo 会增加再热裂纹敏感性、应控制，Si 控≤0.4%，Mn/S 比按 C 匹配。","figKey":"alloy","figcap":"五种元素的主作用与注意点：Mn/Si 偏净化与固溶，Nb/V/Mo 偏细化晶粒/沉淀强化，但都需防再热裂纹。","basis":"CHAP1 §3/§4、CHAP5 再热裂纹；期中试题 简答5"},{"id":"w07","ch":"第二章","chname":"第二章 焊接材料","src":"课后","srcnote":"复习题2-1 / 练习题6","full":10,"q":"焊条工艺性能包括哪几个方面？影响因素有哪些？","pts":[{"t":"电弧稳定性：不断弧、不飘移、抗磁偏吹；稳弧剂含 K/Na 低电离位元素，CaF2 电离势高会降低稳弧性。","k":["电弧稳定性","稳弧剂","K","Na","CaF2"]},{"t":"焊缝成形与全位置焊接性：熔渣凝固温度、粘度、表面张力决定成形；短渣（凝固温度范围窄）适应立/仰/横焊，氧化铁型长渣不适应。","k":["焊缝成形","粘度","表面张力","短渣","全位置"]},{"t":"飞溅、脱渣性、熔化速度：粘度↑/电流↑/水分↑/电压↑/交流/大颗粒过渡使飞溅↑；线膨胀系数差大、渣松脆易脱渣；用 αp、αH=αp(1-ψ) 表征熔化/熔敷。","k":["飞溅","脱渣","αp","αH","线膨胀"]},{"t":"药皮发红与焊接烟尘：后半段药皮温升过高发红开裂；焊芯电阻大、熔化系数小、电阻热多；烟尘有锰中毒、氟中毒，低氢焊条烟尘含氟10%以上。","k":["药皮发红","电阻","烟尘","锰","氟"]}],"ans":"焊条工艺性能包括：① 电弧稳定性——不断弧、不飘移、抗磁偏吹；稳弧剂含 K/Na 低电离位元素，CaF2 电离势高会降低稳弧性。② 焊缝成形——表面光滑、波纹细密、几何尺寸和余高合格、无咬边；受熔渣凝固温度、粘度、表面张力影响（1500℃ 粘度 0.1~0.2Pa·s，表面张力 0.3~0.4N/m）。③ 全位置焊接性——立、仰、横焊时熔滴和熔渣不下流；短渣（凝固温度范围窄）有利，氧化铁型长渣不适应。④ 飞溅——粘度↑、电流↑、药皮水分↑、电压↑、交流、大颗粒过渡均增大飞溅。⑤ 脱渣性——熔渣与金属线膨胀系数差越大越好；氧化性太强难脱；渣松脆易脱；钛型最好、低氢最差。⑥ 熔化速度——用熔化系数 αp；考虑飞溅用熔敷系数 αH=αp(1-ψ)。⑦ 药皮发红——后半段药皮温升过高发红开裂脱落，与焊芯电阻、熔化系数、电阻热有关。⑧ 焊接烟尘——锰中毒、氟中毒；低氢焊条烟尘含氟10%以上。","figKey":"coating","figcap":"药皮七类组分与焊条工艺性能的关系；稳弧、造渣、造气、脱氧、合金、粘结、增塑共同决定工艺与冶金性能。","basis":"CHAP2 §1 焊条工艺性能；复习题2-1 / 练习题6"},{"id":"w08","ch":"第一章","chname":"第一章 焊接化学冶金","src":"课后","srcnote":"复习题2-2 / 练习题7","full":6,"q":"简述焊缝金属的脱氧途径。","pts":[{"t":"先期脱氧：药皮固态加热阶段，Al、Ti、Mn 与高价氧化物/碳酸盐分解产物反应，Al、Ti 大部分烧损。","k":["先期脱氧","药皮","Al","Ti","烧损"]},{"t":"沉淀脱氧：熔滴和熔池中，[Mn]/[Si] 与 [FeO] 直接反应，生成 MnO、SiO2 或 MnO·SiO2 上浮入渣。","k":["沉淀脱氧","Mn","Si","FeO","上浮"]},{"t":"扩散脱氧：[FeO]→(FeO)，降温有利；酸性渣 SiO2/TiO2 降低 FeO 活度，有利于扩散脱氧；碱性渣 FeO 活度高，效果差。","k":["扩散脱氧","酸性渣","FeO活度","碱性渣"]}],"ans":"① 先期脱氧：药皮固态加热阶段，Al、Ti、Mn 等对氧亲和力大，先与药皮中高价氧化物/碳酸盐分解产物反应，如 Fe2O3+Mn→MnO+2FeO、2CaCO3+Ti→2CaO+TiO2+2CO；Al、Ti 大部分烧损，产物进入熔渣。\n② 沉淀脱氧：熔滴和熔池中，脱氧剂与 [FeO] 直接反应，产物上浮入渣：[Mn]+[FeO]→[Fe]+(MnO)；[Si]+2[FeO]→2[Fe]+(SiO2)；Mn-Si 联合时 (MnO)+(SiO2)→(MnO·SiO2)，密度小、熔点低，易上浮。\n③ 扩散脱氧：[FeO]→(FeO)，温度降低有利，主要在熔池后部；酸性渣中 SiO2、TiO2 与 FeO 生成复合物，降低 FeO 活度，有利于扩散脱氧；碱性渣 FeO 活度高，扩散脱氧较差。\n实际以先期+沉淀为主，扩散为辅。","figKey":"deox","figcap":"三条脱氧途径按反应区排列：药皮反应区先期→熔滴/熔池沉淀→熔池后部扩散。","basis":"CHAP1 §3 脱氧；复习题2-2 / 练习题7"},{"id":"w09","ch":"第三章","chname":"第三章 熔池凝固和焊缝固态相变","src":"课后","srcnote":"复习题2-3 / 练习题8","full":6,"q":"说明焊接速度对结晶速度和结晶方向的影响。","pts":[{"t":"结晶线速度 vc=v cosθ，θ 为 vc 与焊接速度 v 的夹角；熔合线 θ=90°，vc=0；熔池中心 θ=0°，vc=v 最大。","k":["vc","cos","熔合线","90","中心"]},{"t":"焊速 v 增大→θ 增大→柱状晶趋向垂直于焊缝中心线，焊缝中心易产生热裂纹。","k":["焊速","θ","柱状晶","垂直","热裂纹"]},{"t":"v 减小→θ 减小→柱状晶偏向焊接方向，熔合线附近胞状/胞状树枝，中心为较细的胞状树枝晶，抗裂性改善。","k":["减小","偏向","胞状","抗裂"]}],"ans":"结晶线速度 vc=v cosθ，θ 为 vc 与焊接速度 v 的夹角。熔合线处 θ=90°，vc=0；熔池中心 θ=0°，vc=v 最大。\n焊接速度 v 增大→θ 增大→柱状晶成长方向趋向垂直于焊缝中心线，焊缝中心易产生热裂纹；v 减小→θ 减小→柱状晶偏向焊接方向，熔合线附近为胞状/胞状树枝晶，中心为较细的胞状树枝晶，抗裂性改善。\n实际焊接通过调节焊速控制柱状晶方向和组织。","figKey":"vc","figcap":"熔池俯视：熔合线 θ=90°、vc=0；中心 θ=0°、vc=v。焊速增大使柱状晶趋向垂直中心线。","basis":"CHAP3 §1 结晶线速度；复习题2-3 / 练习题8"},{"id":"w10","ch":"第三章","chname":"第三章 熔池凝固和焊缝固态相变","src":"课后","srcnote":"复习题2-4 / 练习题9","full":10,"q":"焊接气孔有哪些危害？如何防治？","pts":[{"t":"危害：减小承载截面积；成串/密集气孔更危险；承载面积减小10%时疲劳强度可下降约50%；降低塑韧性、致密性和耐蚀/密封性。","k":["承载","10","50","疲劳","塑韧性"]},{"t":"类型：H2 表面喇叭口/螺钉状、内壁光滑；N2 表面蜂窝状成堆；CO 内部条虫/蠕虫状、沿柱状晶分布。","k":["H2","喇叭口","N2","蜂窝","CO","条虫"]},{"t":"机理：过饱和气体→生核→长大→上浮；θ<90°易浮出，θ>90°且结晶速度大时残留；R 大、粘度大、气泡半径小都不利上浮。","k":["过饱和","生核","θ","结晶速度","上浮"]},{"t":"冶金防治：清理铁锈/油污/水分，焊条焊剂烘干；控制熔渣氧化性（氧化性大 CO↑，还原性大 H2↑）；CaF2、SiO2 降低氢气孔；脱氧脱氮。","k":["清理","烘干","氧化性","CaF2","脱氧"]},{"t":"工艺防治：合适电流/电压/焊速；加强保护防 N2；直流反接优于正接/交流；短弧、摆动、焊前清理。","k":["电流","电压","焊速","保护","短弧"]}],"ans":"危害：气孔减小承载截面积；成串/密集气孔比单个气孔危险；承载面积减小 10% 时疲劳强度可下降约 50%；气孔周围应力集中，降低塑韧性、致密性和耐蚀/密封性。\n类型：H2 气孔多在表面，断面喇叭口/螺钉状、内壁光滑；N2 气孔多在表面，蜂窝状成堆；CO 气孔在内部，条虫/蠕虫状，沿柱状晶分布。\n机理：液态金属过饱和气体→生核→长大→上浮；θ<90° 易浮出，θ>90° 且结晶速度大时残留；R 大、粘度大、气泡半径小都不利上浮。\n冶金防治：清理铁锈/油污/水分，焊条焊剂烘干；控制熔渣氧化性（氧化性大 CO↑，还原性大 H2↑）；CaF2、SiO2 降低氢气孔；脱氧脱氮。\n工艺防治：合适电流/电压/焊速；加强保护防 N2；直流反接优于正接/交流；短弧、摆动、焊前清理。","figKey":"pores","figcap":"三类气孔形态：H2 表面喇叭口、N2 表面蜂窝状、CO 内部条虫状沿柱状晶。","basis":"CHAP3 §3 气孔；CHAP3 补充 焊接缺欠；复习题2-4 / 练习题9"},{"id":"w11","ch":"第四章","chname":"第四章 焊接热影响区的组织和性能","src":"课后","srcnote":"复习题2-5 / 练习题10","full":10,"q":"论述易淬火钢热影响区的组织分布及对性能的影响。","pts":[{"t":"易淬火钢如 45钢、30CrMnSi、18MnMoNb，淬硬倾向大；HAZ 分布取决于焊前热处理状态。","k":["45","30CrMnSi","18MnMoNb","淬硬","焊前热处理"]},{"t":"完全淬火区（Ac3 以上）：A 晶粒粗大，焊后得粗大马氏体，硬度高、塑韧性低，冷裂敏感性最高。","k":["完全淬火区","Ac3","粗大马氏体","硬度","冷裂"]},{"t":"不完全淬火区（Ac1~Ac3）：快速加热时 F 很少溶入 A，快冷时 F 保留并长大，最后得 M+F，组织不均匀。","k":["不完全淬火区","Ac1","铁素体","马氏体","不均匀"]},{"t":"回火区（Ac1 以下）：母材焊前调质态，受热发生不同程度回火软化，软化程度取决于焊前回火温度。","k":["回火区","Ac1","调质","软化","回火温度"]},{"t":"性能：熔合区、过热区最薄弱；硬度↑、塑韧性↓；冷裂纹三要素 H+M+R。对策：预热、控制 t8/5、低氢焊材、后热/缓冷、焊后回火。","k":["熔合区","过热区","H","M","R","预热","t8/5"]}],"ans":"易淬火钢如 45钢、30CrMnSi、18MnMoNb，淬硬倾向大；HAZ 分布取决于焊前热处理状态。\n① 完全淬火区（Ac3 以上）：A 晶粒粗大，焊后得粗大马氏体，硬度高、塑韧性低，冷裂敏感性最高（过热区）。\n② 不完全淬火区（Ac1~Ac3）：快速加热时 F 很少溶入 A，快冷时 F 保留并长大，最后得 M+F，组织不均匀。\n③ 回火区（Ac1 以下）：母材焊前调质态，受热发生不同程度回火软化，软化程度取决于焊前回火温度。\n性能：熔合区、过热区最薄弱；硬度升高、塑韧性下降；冷裂纹三要素 H+M+R。对策：预热、控制 t8/5、低氢焊材、后热/缓冷、焊后回火。","figKey":"haz_quench","figcap":"易淬火钢 HAZ：完全淬火区（粗大 M）→不完全淬火区（M+F）→回火区（软化）→母材。","basis":"CHAP4 §3 易淬火钢 HAZ；复习题2-5 / 练习题10"},{"id":"w12","ch":"第二章","chname":"第二章 焊接材料","src":"课后","srcnote":"练习题1","full":12,"q":"按功能划分，举例说明焊条药皮有哪些组成？","pts":[{"t":"稳弧剂：含低电离位元素，如 K2CO3、大理石、长石、金红石。","k":["稳弧剂","K2CO3","长石","金红石"]},{"t":"造渣剂：钛铁矿、金红石、大理石、石英砂、长石、云母、萤石。","k":["造渣剂","钛铁矿","石英砂","萤石"]},{"t":"造气剂：木粉、淀粉、大理石、菱苦土。","k":["造气剂","木粉","淀粉","大理石"]},{"t":"脱氧剂与合金剂：锰铁、钛铁、硅铁、铝粉；锰铁、硅铁、钼铁。","k":["脱氧剂","锰铁","钛铁","硅铁","合金剂","钼铁"]},{"t":"粘结剂与增塑剂：钠水玻璃、钾钠水玻璃；白泥、云母、钛白粉、糊精。","k":["粘结剂","水玻璃","增塑剂","白泥","糊精"]},{"t":"药皮作用：机械保护、冶金处理（脱氧、脱硫磷、去氢、合金化）、改善工艺性能。","k":["机械保护","冶金处理","脱氧","合金化","工艺性能"]}],"ans":"按功能分七类：① 稳弧剂——含低电离位元素，如 K2CO3、大理石、长石、金红石；② 造渣剂——钛铁矿、金红石、大理石、石英砂、长石、云母、萤石；③ 造气剂——木粉、淀粉、大理石、菱苦土；④ 脱氧剂——锰铁、钛铁、硅铁、铝粉；⑤ 合金剂——锰铁、硅铁、钼铁；⑥ 粘结剂——钠水玻璃、钾钠水玻璃；⑦ 增塑剂——白泥、云母、钛白粉、糊精。\n药皮作用：机械保护、冶金处理（脱氧、脱硫磷、去氢、合金化）、改善工艺性能。","figKey":"coating","figcap":"焊条药皮七类组分：稳弧、造渣、造气、脱氧、合金、粘结、增塑。","basis":"CHAP2 §1 药皮组成；练习题1"},{"id":"w13","ch":"第一章","chname":"第一章 焊接化学冶金","src":"课后","srcnote":"练习题3","full":8,"q":"论述氧化性气体对金属的氧化作用。","pts":[{"t":"氧化性气体主要有 O2、CO2、H2O 及活性熔渣；判据：{pO2}>pO2* 氧化，=平衡，<还原。","k":["O2","CO2","H2O","pO2","氧化"]},{"t":"自由氧：Fe+1/2O2→FeO；C+1/2O2→CO；Si、Mn 氧化生成 SiO2、MnO，可能夹渣。","k":["Fe","O2","CO","Si","Mn"]},{"t":"CO2：CO2+[Fe]→CO+[FeO]，T↑ 向右、氧化性↑；可用 Si、Mn 脱氧；CO 不溶于液态金属→CO 气孔。","k":["CO2","CO","FeO","气孔"]},{"t":"H2O：H2O+[Fe]→H2+[FeO]，T↑ 氧化性↑，同时增氢；后果：强度塑韧性↓、CO 气孔/飞溅、合金烧损；控制：限制氧源、冶金脱氧、合适 I/U。","k":["H2O","H2","增氢","塑韧性","脱氧"]}],"ans":"焊接区氧化性气体主要有 O2、CO2、H2O，以及活性熔渣。判断方向：{pO2}>pO2* 氧化，=平衡，<还原。\n① 自由氧：Fe+1/2O2→FeO；C+1/2O2→CO；Si、Mn 氧化生成 SiO2、MnO，可能夹渣。\n② CO2：CO2+[Fe]→CO+[FeO]，温度升高反应向右，氧化性增强；可用 Si、Mn 脱氧；CO 不溶于液态金属，可能形成 CO 气孔。\n③ H2O：H2O+[Fe]→H2+[FeO]，温度升高氧化性增强，同时增氢，兼有氢气孔/冷裂纹风险。\n后果：强度、塑韧性下降；CO 气孔、飞溅；有益合金元素烧损。控制：限制氧源（烘干、清理、保护），冶金脱氧（Mn、Si、Ti、Al），合适 I/U（U↑ 含氧↑，I↑ 含氧↓）。","figKey":"oxidation","figcap":"氧化判据与 O2、CO2、H2O 三条氧化路径；H2O 同时增氢，CO2 可能带来 CO 气孔。","basis":"CHAP1 §2 氧的作用；练习题3"},{"id":"w14","ch":"第一章","chname":"第一章 焊接化学冶金","src":"课后","srcnote":"练习题4","full":10,"q":"论述氢对焊接质量的影响及控制措施。","pts":[{"t":"氢源：药皮/焊剂/药芯水分、含氢有机物、空气水分、焊丝和工件表面油锈水。","k":["药皮","焊剂","水分","有机物","油锈"]},{"t":"存在形式：扩散氢（原子/质子，可自由扩散）；残余氢（分子，聚集于缺陷，不能自由扩散）；总氢=扩散+残余。","k":["扩散氢","残余氢","总氢","缺陷"]},{"t":"危害：氢脆（室温塑性↓）；白点/鱼眼（0.5~3mm，中心气孔/夹渣）；H2 气孔；冷裂纹/延迟裂纹（H+M+R）。","k":["氢脆","白点","鱼眼","气孔","冷裂纹","H","M","R"]},{"t":"控制：限制氢源（烘干：有机物≤200℃、碳酸盐≤450℃；清理油锈）；CaF2 与 H 生成 HF；控制氧化势、脱氢处理。","k":["烘干","200","450","CaF2","HF","脱氢"]},{"t":"焊后脱氢 350℃×1h 或 250℃×6h；重要焊缝选奥氏体焊缝（D 最小）。","k":["350","1h","250","6h","奥氏体"]}],"ans":"来源：药皮/焊剂/药芯水分、含氢有机物、空气水分、焊丝和工件表面油锈水。\n存在形式：扩散氢（原子/质子，可自由扩散）；残余氢（分子，聚集于晶格缺陷/裂纹/夹杂边缘，不能自由扩散）；总氢=扩散氢+残余氢，放置时间延长扩散氢减少、残余氢增多。\n危害：① 氢脆——室温附近塑性严重下降，加载快时不明显；② 白点/鱼眼——直径 0.5~3mm，中心有气孔/夹渣，外围塑性断裂痕迹，碳钢及 Cr/Ni/Mo 合金化焊缝敏感；③ 气孔——H2 表面喇叭口；④ 冷裂纹/延迟裂纹——三要素 H+M+R。\n控制：限制氢源（烘干：有机物≤200℃、碳酸盐≤450℃；清理油锈）；冶金（CaF2 与 H 生成 HF、控制氧化势、脱氢处理）；工艺参数；焊后脱氢 350℃×1h 或 250℃×6h；重要焊缝选奥氏体焊缝（D 最小）。","figKey":"hydrogen","figcap":"氢源→扩散氢→氢脆/白点、H2 气孔、冷裂纹（H+M+R）；下方为烘干、CaF2 去氢和焊后脱氢措施。","basis":"CHAP1 §2 氢；练习题4"},{"id":"w15","ch":"第一章","chname":"第一章 焊接化学冶金","src":"课后","srcnote":"练习题5","full":6,"q":"焊缝金属合金化的目的是什么？","pts":[{"t":"补偿合金元素在焊接过程中的烧损、蒸发和飞溅损失。","k":["补偿","烧损","蒸发","飞溅"]},{"t":"消除焊接缺陷、改善组织和性能：脱氧、细化晶粒、提高强度塑韧性、抗裂性。","k":["脱氧","细化晶粒","强度","塑韧性","抗裂"]},{"t":"获得特殊性能堆焊金属（耐磨、耐蚀、耐热）；方式有合金焊丝/带极、药芯焊丝/药芯焊条、合金药皮/焊剂、合金粉末。","k":["耐磨","耐蚀","耐热","焊丝","药芯","药皮","粉末"]}],"ans":"① 补偿合金元素在焊接过程中的烧损、蒸发和飞溅损失；② 消除焊接缺陷、改善组织和性能——脱氧、细化晶粒、提高强度塑韧性、抗裂性；③ 获得具有特殊性能的堆焊金属，如耐磨、耐蚀、耐热。\n方式：合金焊丝/带极、药芯焊丝/药芯焊条、合金药皮/焊剂、合金粉末。\n过渡系数 η=熔敷金属中某合金含量/焊接材料中该合金总量；元素越活泼、沸点越低，η 越小；合金含量↑、粒度↑、药皮氧化势↓、Kb↓、I↓、氩弧焊，η 增大。","figKey":"alloy_route","figcap":"四条合金化路径：合金焊丝/带极、药芯焊丝/药芯焊条、合金药皮/焊剂、合金粉末。","basis":"CHAP1 §4 合金过渡；练习题5"},{"id":"w16","ch":"第四章","chname":"第四章 焊接热影响区的组织和性能","src":"课件","srcnote":"CHAP4 思考题1","full":10,"q":"焊接热循环对被焊金属近缝区的组织、性能有何影响？","pts":[{"t":"热循环四参数：加热速度 ωH、最高温度 Tm、相变温度以上停留时间 tH、冷却速度 ωc（常用 t8/5）。","k":["ωH","Tm","tH","ωc","t8/5"]},{"t":"ωH 大→扩散相变滞后，Ac1、Ac3 及 Ac3-Ac1 升高，A 均质化不完全。","k":["加热速度","Ac1","Ac3","均质化"]},{"t":"Tm 高→近缝区晶粒长大，过热区粗晶；tH 长→有利 A 均质化，但温度过高、时间过长会晶粒严重长大。","k":["Tm","晶粒长大","过热区","tH"]},{"t":"ωc 大→易得 M/B 硬组织，冷裂敏感性↑；ωc 小→晶粒粗大、软化。","k":["冷却速度","马氏体","贝氏体","冷裂","软化"]},{"t":"结果：HAZ 形成熔合区、过热区、正火区、不完全重结晶区的组织梯度；熔合区、过热区最薄弱；需控制线能量、预热、后热。","k":["熔合区","过热区","正火区","不完全重结晶区","线能量","预热"]}],"ans":"热循环四参数：加热速度 ωH、最高温度 Tm、相变温度以上停留时间 tH、冷却速度 ωc（常用 t8/5）。\n① ωH 大→扩散相变滞后，Ac1、Ac3 及 Ac3-Ac1 升高，A 均质化不完全；② Tm 高→近缝区晶粒长大，过热区粗晶；③ tH 长→有利于 A 均质化，但温度过高、时间过长会晶粒严重长大；④ ωc 大→易得 M/B 硬组织，冷裂敏感性↑；ωc 小→晶粒粗大、软化。\n结果：HAZ 形成熔合区、过热区、正火区、不完全重结晶区的组织梯度；熔合区、过热区最薄弱；需控制线能量、预热、后热。","figKey":"thermal","figcap":"焊接热循环四参数 ωH、Tm、tH、ωc；它们共同决定 HAZ 的晶粒尺寸、相变充分程度和冷却后组织。","basis":"CHAP4 §1/§3、思考题1"},{"id":"w17","ch":"第四章","chname":"第四章 焊接热影响区的组织和性能","src":"课件","srcnote":"CHAP4 思考题2","full":6,"q":"低合金钢焊接时，HAZ 粗晶区奥氏体的均质化程度对冷却时相变有何影响？","pts":[{"t":"粗晶区加热温度高、A 晶粒粗大；均质化程度取决于加热速度、峰值温度、高温停留时间及碳化物溶解。","k":["粗晶区","晶粒粗大","加热速度","峰值温度","碳化物"]},{"t":"均质化程度高→A 中 C/合金元素分布均匀，A 稳定性高、淬透性大，CCT 右移，易形成 M/B。","k":["均质化","稳定性","淬透性","CCT","马氏体","贝氏体"]},{"t":"均质化不完全→富碳/贫碳区，局部 Ms 不同，相变温度范围宽，组织不均匀，可能出现块状 F、M-A 组元；Cr/W/Mo/V 未充分溶解时 A 稳定性降低，40Cr CCT 左移，45钢 CCT 右移。","k":["不完全","富碳","Ms","M-A","40Cr","45"]}],"ans":"低合金钢 HAZ 粗晶区加热温度高、奥氏体晶粒粗大；均质化程度取决于加热速度、峰值温度、高温停留时间及碳化物溶解。\n① 均质化程度高：A 中 C 和合金元素分布均匀，A 稳定性高、淬透性大，CCT 右移，冷却时易形成 M/B，硬度高、冷裂敏感性大。\n② 均质化不完全：存在富碳/贫碳区，局部 Ms 不同，相变温度范围宽，组织不均匀，可能出现块状 F、M-A 组元。\n③ 焊接快速加热：Cr、W、Mo、V 等碳化物形成元素未充分溶解，A 稳定性降低（40Cr CCT 左移、淬硬倾向↓）；45钢无碳化物溶解且晶粒粗化，CCT 右移、淬硬倾向↑。\n结果：同一粗晶区因均质化差异可得到不同 M/B/F 比例，性能不均。","figKey":"haz_low","figcap":"HAZ 由熔合线向外温度递减；粗晶区靠近熔合线，峰值温度最高、晶粒最粗。","basis":"CHAP4 §2、思考题2"},{"id":"w18","ch":"第四章","chname":"第四章 焊接热影响区的组织和性能","src":"课件","srcnote":"CHAP4 思考题3","full":6,"q":"探讨低合金钢焊接 HAZ 受应力应变时对相变的影响。","pts":[{"t":"HAZ 受周围金属约束，产生热应力、组织应力、拘束应力，并伴随塑性应变。","k":["热应力","组织应力","拘束应力","塑性应变"]},{"t":"拉应力促进马氏体相变、使 Ms 升高，压应力抑制相变；三向拉应力促进裂纹形核扩展。","k":["拉应力","马氏体","Ms","压应力","裂纹"]},{"t":"塑性变形增加位错/空位密度，为相变提供形核位置、加速扩散，改变相变温度区间；相变体积膨胀可松弛部分热应力，但粗晶区+M+H+R 叠加时冷裂敏感性增大。","k":["位错","空位","形核","扩散","体积膨胀","冷裂"]}],"ans":"焊接 HAZ 在加热/冷却过程中受周围金属约束，产生热应力、组织应力和拘束应力，并伴随塑性应变。\n① 应力：拉应力促进马氏体相变、使 Ms 升高，压应力抑制相变；三向拉应力促进裂纹形核扩展。\n② 应变：塑性变形增加位错和空位密度，为相变提供形核位置、加速扩散，使相变温度区间变化；大应变还可诱发动态再结晶/软化。\n③ 焊接条件下应力应变与相变耦合：相变伴随体积膨胀可松弛部分热应力；但粗晶区+M+H+R 叠加时冷裂敏感性增大。\n结论：HAZ 组织转变不是单纯温度过程，应力应变会改变相变动力学、组织形态和裂纹倾向。","figKey":"haz_quench","figcap":"易淬火钢 HAZ 的完全淬火区、不完全淬火区和回火区；应力应变会改变这些区的相变动力学和裂纹倾向。","basis":"CHAP4 §2 应力应变、思考题3"},{"id":"w19","ch":"第四章","chname":"第四章 焊接热影响区的组织和性能","src":"课件","srcnote":"CHAP4 思考题4","full":8,"q":"焊接条件下组织转变与热处理条件下组织转变有何不同？","pts":[{"t":"加热速度快（几十~几百倍）：扩散相变滞后，Ac1、Ac3 及 Ac3-Ac1 升高，A 均质化不完全；热处理加热慢，接近平衡。","k":["加热速度快","Ac1","Ac3","均质化","平衡"]},{"t":"加热温度高（高100~200℃）：近缝区晶粒粗大；热处理温度较低、晶粒控制好。","k":["温度高","100","200","晶粒粗大"]},{"t":"高温停留短（手弧4~20s、埋弧30~100s）：扩散、碳化物溶解、A 均质化不充分；热处理保温时间长、组织均匀。","k":["停留时间","4","20","30","100","保温"]},{"t":"冷却快、非平衡：易得 M/B 淬硬组织；局部加热+复杂应力使 HAZ 组织梯度大；45钢 CCT 右移、40Cr CCT 左移。","k":["冷却快","马氏体","贝氏体","应力","45","40Cr"]}],"ans":"① 加热速度快（几十~几百倍）：扩散相变滞后，Ac1、Ac3 及 Ac3-Ac1 升高，A 均质化不完全；热处理加热慢，相变接近平衡。\n② 加热温度高（高 100~200℃）：近缝区晶粒粗大；热处理温度较低、晶粒控制好。\n③ 高温停留短（手弧 4~20s、埋弧 30~100s）：扩散、碳化物溶解、A 均质化不充分；热处理保温时间长，组织均匀。\n④ 冷却快、非平衡：易得 M/B 等淬硬组织；热处理可控制冷却得 F+P/贝氏体等平衡/近平衡组织。\n⑤ 局部加热+复杂应力：组织转变在应力应变下进行，HAZ 组织梯度大；热处理整体加热，组织均匀、应力小。\n典型：45钢焊接 CCT 右移、淬硬↑；40Cr 焊接 CCT 左移、淬硬↓。","figKey":"cct","figcap":"焊接 CCT 与热处理 CCT 的差异：焊接加热快、停留短、冷却非平衡，CCT 曲线和淬硬倾向随钢种不同而偏移。","basis":"CHAP4 §2 组织转变特点、思考题4"},{"id":"ez01","ch":"增材制造","chname":"增材制造技术","q":"增材制造的定义是什么？它与减材制造、等材制造有何区别？工作过程分为哪两个阶段？","ans":"增材制造是依据三维CAD设计数据，采用液体、粉末、丝等离散材料逐层累加制造实体零件的制造技术，是一种“自下而上”的材料累加过程。与减材制造利用刀具或电化学方法去除毛坯材料、等材制造利用模具使液体或固体材料成形不同，增材制造以材料逐层累加为本质特征。其工作过程分为两个阶段：数据处理阶段对三维CAD模型进行分层“切片”，把三维数据分解为若干二维轮廓数据；叠层制作阶段按二维数据逐层制作与分层厚度相同的薄片实体，并将薄片自下而上叠加成三维实体。","anstext":"增材制造是依据三维CAD设计数据，采用液体、粉末、丝等离散材料逐层累加制造实体零件的制造技术，是一种“自下而上”的材料累加过程。与减材制造利用刀具或电化学方法去除毛坯材料、等材制造利用模具使液体或固体材料成形不同，增材制造以材料逐层累加为本质特征。其工作过程分为两个阶段：数据处理阶段对三维CAD模型进行分层“切片”，把三维数据分解为若干二维轮廓数据；叠层制作阶段按二维数据逐层制作与分层厚度相同的薄片实体，并将薄片自下而上叠加成三维实体。","src":"课件","srcnote":"第四章 增材制造技术 4.1.1/4.1.2","full":8,"pts":[{"t":"增材制造依据三维CAD设计数据，采用液体、粉末、丝等离散材料逐层累加制造实体零件，是“自下而上”的材料累加过程。","k":["三维CAD","离散材料","逐层累加","自下而上"]},{"t":"减材制造是材料去除，等材制造是通过模具使材料成形（材料变形）；增材制造是材料逐层累加，三者材料量变化方式不同。","k":["减材制造","材料去除","等材制造","模具","增材制造"]},{"t":"工作过程分两个阶段：数据处理——对三维CAD模型分层切片，分解为二维轮廓数据；叠层制作——按二维数据逐层制作薄片并叠加成三维实体。","k":["数据处理","切片","二维轮廓","叠层制作","三维实体"]}],"basis":"第四章 4.1 增材制造概念与工作过程"},{"id":"ez02","ch":"增材制造","chname":"增材制造技术","q":"光固化成形的工作原理是什么？成形全过程包括哪些步骤？后处理为什么必须排出残留树脂？","ans":"光固化法利用光能的化学和热作用使液态光敏树脂固化，控制光能的形状逐层固化树脂，堆积成形出所需的三维实体零件；国际上通称stereolithography（SL），也常称为SLA法。成形全过程分为前处理、分层叠加成形和后处理：前处理包括三维模型构造、模型近似处理、选择成形方向、切片处理和生成支撑结构；分层叠加成形由模型断面逐层制作并叠加；后处理包括取出制件、排出未固化树脂、表面清洗、后固化、去除支撑、机械加工和打磨。必须排出残留树脂，是因为残留树脂会在后固化或储存过程中发生暗反应，固化收缩并引起制件变形；内部封闭时应设计排液孔或成形后钻孔排液。SLA制件表面还会留下约0.05～0.1mm的层间台阶，需要打磨。","anstext":"光固化法利用光能的化学和热作用使液态光敏树脂固化，控制光能的形状逐层固化树脂，堆积成形出所需的三维实体零件；国际上通称stereolithography（SL），也常称为SLA法。成形全过程分为前处理、分层叠加成形和后处理：前处理包括三维模型构造、模型近似处理、选择成形方向、切片处理和生成支撑结构；分层叠加成形由模型断面逐层制作并叠加；后处理包括取出制件、排出未固化树脂、表面清洗、后固化、去除支撑、机械加工和打磨。必须排出残留树脂，是因为残留树脂会在后固化或储存过程中发生暗反应，固化收缩并引起制件变形；内部封闭时应设计排液孔或成形后钻孔排液。SLA制件表面还会留下约0.05～0.1mm的层间台阶，需要打磨。","src":"课件","srcnote":"第四章 增材制造技术 4.2.1/4.2.3","full":10,"pts":[{"t":"利用光能的化学和热作用使液态光敏树脂固化，控制光能形状逐层固化树脂，堆积成形三维实体；国际上通称stereolithography（SL/SLA）。","k":["光能","光敏树脂","固化","逐层","SLA"]},{"t":"全过程分前处理、分层叠加成形、后处理：前处理包括建模、近似处理、选择成形方向、切片、生成支撑；分层叠加由模型断面逐层制作并叠加。","k":["前处理","分层叠加","后处理","切片","支撑"]},{"t":"后处理包括取出制件、排出未固化树脂、表面清洗、后固化、去除支撑、机械加工和打磨；层间台阶约0.05~0.1mm。","k":["排出","清洗","后固化","去支撑","打磨","0.05"]},{"t":"必须排出残留树脂，因为残留树脂在后固化或储存中发生暗反应，固化收缩引起制件变形；内部封闭时需在设计时开排液孔或成形后钻孔。","k":["暗反应","收缩","变形","排液孔"]}],"basis":"第四章 4.2 光固化制造技术"},{"id":"ez03","ch":"增材制造","chname":"增材制造技术","q":"SLM对金属粉末有哪些主要要求？粉末的球形度、粒径分布、流动性和含氧量如何影响成形质量？","ans":"SLM对金属粉末的堆积特性、粒径分布、颗粒形状、流动性、含氧量和激光吸收率均有较严格的要求。铺粉时宜采用振实密度；颗粒球形度增加、表面更光滑时，粉末床孔隙率降低。气雾化粉末接近球形，旋转电极法制备的粉末球形度更高、表面更光洁、孔隙率更低。采用二组分体系级配可提高铺粉致密度；旋转电极粉末颗粒间以滚动摩擦为主，流动性好，与气雾化粉混合可利用滚珠效应改善流动性。粉末含氧量一般要求≤1000ppm；表面氧化膜会降低液态金属与基板或已凝固部分的润湿性，导致制件分层和裂纹、降低致密度。激光波长越短，金属对激光的吸收率越高。","anstext":"SLM对金属粉末的堆积特性、粒径分布、颗粒形状、流动性、含氧量和激光吸收率均有较严格的要求。铺粉时宜采用振实密度；颗粒球形度增加、表面更光滑时，粉末床孔隙率降低。气雾化粉末接近球形，旋转电极法制备的粉末球形度更高、表面更光洁、孔隙率更低。采用二组分体系级配可提高铺粉致密度；旋转电极粉末颗粒间以滚动摩擦为主，流动性好，与气雾化粉混合可利用滚珠效应改善流动性。粉末含氧量一般要求≤1000ppm；表面氧化膜会降低液态金属与基板或已凝固部分的润湿性，导致制件分层和裂纹、降低致密度。激光波长越短，金属对激光的吸收率越高。","src":"课件","srcnote":"第四章 增材制造技术 4.3.1/4.3.2","full":10,"pts":[{"t":"SLM对粉末的堆积特性、粒径分布、颗粒形状、流动性、含氧量和激光吸收率均有较严格要求。","k":["堆积特性","粒径分布","颗粒形状","流动性","含氧量","吸收率"]},{"t":"铺粉宜用振实密度；球形度增加、表面更光滑时孔隙率降低；气雾化粉接近球形，旋转电极粉球形度更高、表面更光洁、孔隙率更低。","k":["振实密度","球形度","孔隙率","气雾化","旋转电极"]},{"t":"采用二组分粒径级配可提高铺粉致密度；旋转电极粉滚动摩擦小、流动性好，混合后可利用滚珠效应改善流动性。","k":["二组分","级配","流动性","滚珠效应"]},{"t":"粉末含氧量一般要求≤1000ppm；氧化膜降低液态金属与基板/已凝固部分的润湿性，导致分层和裂纹、降低致密度；激光波长越短，金属吸收率越高。","k":["1000ppm","氧化膜","润湿性","分层","裂纹","波长"]}],"basis":"第四章 4.3 激光选区熔化技术"},{"id":"ez04","ch":"增材制造","chname":"增材制造技术","q":"增材制造技术有哪些主要特点和局限？其发展趋势是什么？","ans":"增材制造的主要特点：适合复杂结构的快速制造，把三维实体加工变为若干二维平面加工，可制造传统方法难加工甚至无法加工的结构；适合个性化定制和小批量生产；适合高附加值产品的制造。主要局限：技术成熟度低于传统机加工、铸锻焊和模具工艺；材料种类有限、制件精度较低；加工速率较低、零件尺寸受限（最大约2m）、成本高、稳定性差；目前难以替代传统制造工艺，而是传统技术的发展和补充。发展趋势：由快速原型向功能零件制造发展；由常规尺度制造向微纳和大型化等多尺度制造拓展；由工业应用型向日常消费型发展。","anstext":"增材制造的主要特点：适合复杂结构的快速制造，把三维实体加工变为若干二维平面加工，可制造传统方法难加工甚至无法加工的结构；适合个性化定制和小批量生产；适合高附加值产品的制造。主要局限：技术成熟度低于传统机加工、铸锻焊和模具工艺；材料种类有限、制件精度较低；加工速率较低、零件尺寸受限（最大约2m）、成本高、稳定性差；目前难以替代传统制造工艺，而是传统技术的发展和补充。发展趋势：由快速原型向功能零件制造发展；由常规尺度制造向微纳和大型化等多尺度制造拓展；由工业应用型向日常消费型发展。","src":"课件","srcnote":"第四章 增材制造技术 4.1.3/4.1.6","full":10,"pts":[{"t":"特点：适合复杂结构快速制造，将三维加工变为二维平面加工，可制造传统方法难加工或无法加工的结构；适合个性化定制和小批量；适合高附加值产品。","k":["复杂结构","二维平面","个性化","小批量","高附加值"]},{"t":"局限：技术成熟度低于传统机加工、铸锻焊和模具工艺；材料种类有限、制件精度较低；加工速率低、尺寸受限、成本高、稳定性差。","k":["成熟度","材料种类","精度","尺寸","成本","稳定性"]},{"t":"增材制造目前难以替代传统制造工艺，而是传统技术的发展和补充。","k":["难以替代","补充"]},{"t":"趋势：由快速原型向功能零件制造发展；由常规尺度向微纳和大型化等多尺度拓展；由工业应用型向日常消费型发展。","k":["快速原型","功能零件","微纳","大型化","日常消费"]}],"basis":"第四章 4.1 增材制造特点与发展趋势"}];
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => String(s||'').replace(/[\s\u3000]/g,'').replace(/[⁰¹²³⁴⁵⁶⁷⁸⁹]/g, m=>'0123456789'['⁰¹²³⁴⁵⁶⁷⁸⁹'.indexOf(m)]).replace(/[×xX*]/g,'x').replace(/\^/g,'').replace(/[～~]/g,'~').replace(/[-－—]/g,'~').replace(/[（）()]/g,'').toLowerCase();
const core = s => { const m = String(s||'').split(/[（(]/)[0]; return m.trim(); };
let db = load();
function load(){
  let d; try{ const raw = localStorage.getItem(DB_KEY); if(raw) d = JSON.parse(raw); }catch(e){}
  if(!d) d = {answers:{}, stars:{}, mastery:{}, wrongs:{}};
  if(!d.wrongs) d.wrongs = {};
  const migrate = obj => { let touched=false; Object.keys(obj).forEach(k=>{ if(/^\d+$/.test(k)){ const nk='q'+k; if(obj[nk]===undefined){ obj[nk]=obj[k]; delete obj[k]; touched=true; } } }); return touched; };
  const changed = migrate(d.answers) | migrate(d.stars) | migrate(d.wrongs);
  if(changed) try{ localStorage.setItem(DB_KEY, JSON.stringify(d)); }catch(e){}
  return d;
}
function save(){ try{ localStorage.setItem(DB_KEY, JSON.stringify(db)); }catch(e){} }
function isCorrect(i){ const q = QUIZ_DATA[i]; const u = db.answers[q.id]; if(u===undefined||u==='') return null;
  if(q.type==='mcq') return u===q.ans;
  if(q.type==='term'||q.type==='essay') return u==='ok';
  const un=norm(u), an=norm(q.ans), cn=norm(core(q.ans));
  return un===an || un===cn || (un.length>=2 && an.includes(un)); }
function wrongIds(){ const r=[]; QUIZ_DATA.forEach((q,i)=>{ if(isCorrect(i)===false) r.push(i); }); return r; }
function answeredCount(){ return Object.keys(db.answers).filter(i=>db.answers[i]!=='').length; }
function accRate(){ const a=answeredCount(); if(!a) return 0; let c=0; QUIZ_DATA.forEach((_,i)=>{ if(isCorrect(i)) c++; }); return Math.round(c/a*100); }
function updateGauge(){
  const a=answeredCount(); $('g-done').textContent=a;
  $('g-total').textContent='/'+QUIZ_DATA.length;
  $('g-acc').textContent=accRate()+'%';
  const pct=a/QUIZ_DATA.length, R=16, C=2*Math.PI*R;
  $('g-ring').style.strokeDashoffset=C*(1-pct);
}
let session = null; // {list:[...], idx, title, wrongMode}
let filters = {ch:'全部', type:'全部', order:'顺序'};
let wfilter = {ch:'全部', type:'全部'};
let speedIdx = 0;
const IS_MOBILE = /Android|iPhone|iPad|iPod|Mobile|MicroMessenger|Opera Mini/i.test(navigator.userAgent) || innerWidth<=900;
if(IS_MOBILE && !location.hash){ filters.order='随机'; } // 移动端默认随机刷题
let route = location.hash.replace('#/','') || (IS_MOBILE ? 'quiz' : 'home');

function render(){
  const el = $('view');
  const wrongRunning = route==='quiz' && session && session.wrongMode;
  document.querySelectorAll('[data-route]').forEach(b=>b.classList.toggle('on', b.dataset.route===route || (b.dataset.route==='wrong' && wrongRunning)));
  document.querySelectorAll('.chfilter button').forEach(b=>b.classList.toggle('on', b.dataset.ch===filters.ch));
  document.querySelectorAll('.quicknav button').forEach(b=>b.classList.toggle('on', b.dataset.qroute===route));
  if(route==='home') el.innerHTML=viewHome();
  else if(route==='quiz') { if(!session) buildSession(false); el.innerHTML=viewQuiz(); bindQuiz(); }
  else if(route==='wrong') { el.innerHTML=viewWrong(); bindWrong(); }
  else if(route==='speed') { if(speedIdx>=SPEED_DATA.length)speedIdx=0; el.innerHTML=viewSpeed(); bindSpeed(); }
  else if(route==='stats') el.innerHTML=viewStats();
  else if(route==='notes') el.innerHTML=viewNotes();
  else if(route==='framework') el.innerHTML=viewFramework();
  else if(route==='stars') el.innerHTML=viewStars();
  else if(route==='essay'){ el.innerHTML=viewEssay(); bindEssay(); }
  updateGauge();
  updateTabs();
  document.querySelectorAll('[data-goto]').forEach(el=>el.addEventListener('click', ()=>{ route=el.dataset.goto; location.hash='#/'+route; render(); }));
  document.querySelectorAll('[data-goto-wrong]').forEach(el=>el.addEventListener('click', ()=>{ const wi=Number(el.dataset.gotoWrong); const wq=QUIZ_DATA[wi]; startWrongSession([wi], '单题 · '+(wq?wq.ch:'')); }));
  document.querySelectorAll('[data-goto-star]').forEach(el=>el.addEventListener('click', ()=>{ buildSession(false); session.list=[Number(el.dataset.gotoStar)]; session.idx=0; route='quiz'; location.hash='#/quiz'; render(); }));
}
function updateTabs(){
  document.querySelectorAll('.bottomnav button').forEach(b=>{
    let on=false;
    const wrongMode = route==='quiz' && session && session.wrongMode;
    if(b.dataset.tab==='random') on = (route==='quiz' && filters.order==='随机' && !wrongMode);
    else if(b.dataset.tab==='chapter') on = (route==='quiz' && filters.order!=='随机' && !wrongMode);
    else if(b.dataset.tab==='stars') on = (route==='stars');
    else if(b.dataset.route) on = (b.dataset.route===route || (b.dataset.route==='wrong' && wrongMode));
    b.classList.toggle('on', on);
  });
}
function openChPanel(){
  const grid=$('chgrid');
  grid.innerHTML = CHS.map(c=>{
