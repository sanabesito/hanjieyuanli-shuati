性越强。"],["p","熔渣性质三件事：粘度（温度升高降低；分长渣、短渣）、表面张力（金属键最大、共价键最小；CaF₂ 使其降低）、熔点（比焊缝金属低 200～450℃，一般 1150～1350℃）。"],["h","活性熔渣的两种氧化：__扩散氧化__（发生在高温区——熔滴阶段和熔池前部）与__置换氧化__（熔滴阶段最剧烈，增氧的同时增 Si、Mn）。"],["h","脱氧三条途径：__先期脱氧__（药皮固态加热阶段，Al、Ti 大量烧损）→ __沉淀脱氧__（熔滴与熔池内，与 FeO 直接反应）→ __扩散脱氧__（降温有利，酸性渣更有利）。"],["f","deox","脱氧的三条途径按反应区划分"],["t",["杂质","存在与危害","控制"],[["S","FeS 液态互溶、固态基本不溶，偏析于晶界；Fe+FeS 共晶 985℃、Fe+FeO 共晶 940℃ → 热裂、热脆","限制来源；用 Mn 脱硫；渣中碱性氧化物脱硫；降温有利"],["P","Fe₂P、Fe₃P 偏析于晶界；Fe+Fe₃P 共晶 1050℃ → 冷脆、热裂","限制来源；脱磷分两步：先氧化成 P₂O₅，再生成稳定复合物入渣"]]],["f","hot_crack","硫、磷在晶界形成低熔点共晶液膜 → 热裂纹"]]},{"t":"§4 合金过渡","items":[["n",["补偿合金元素的损失","消除缺陷、改善组织和性能","获得具有特殊性能的堆焊金属"]],["p","合金化四种方式：合金焊丝或带极；药芯焊丝或药芯焊条；合金药皮或焊剂；合金粉末。"],["f","alloy_route","合金化的四条路径与目的"],["k","合金过渡系数 η","η = 熔敷金属中某合金含量 / 焊接材料中该合金总量（焊芯 + 药皮）。"],["h","η 的影响：元素越活泼、沸点越低 → η 越__低__；合金含量↑、粒度↑ → η↑；药皮氧化势↑、重量系数 Kb↑、电流↑ → η__下降__；氩弧焊 η 较大。"],["p","1600℃ 下对氧亲和力由弱到强：Cu、Ni、Co、Fe、W、Mo、Cr、Mn、V、Si、Ti、Zr、Al。"]]}],"tip":[["三气体口诀","“氮靠保护氢靠烘，氧靠工艺加冶金。”"],["脱氧三步","“先期在药皮，沉淀在熔池，扩散靠降温（酸性渣更灵）。”"],["硫热磷冷","硫 → 热裂纹（985℃）；磷 → 冷脆 + 热裂（1050℃）。"]]},{"id":"c2","no":"二","tag":"第二章","title":"焊接材料","lv":2,"line":"一句话：焊条 = 焊芯 + 药皮，焊剂 = 药皮，焊丝 = 焊芯；核心是“__七剂__”与酸性/碱性焊条的选用。","secs":[{"t":"§1 焊条","items":[["k","组成","焊芯（导电、填充金属，最常用 H08、H08A）+ 药皮。"],["n",["药皮作用：机械保护（造气造渣，隔离空气）","冶金处理（去有害杂质、补有益元素）","改善工艺性能（易引弧、稳弧、飞溅小、成形好、易脱渣）"]],["f","coating","焊条药皮的七类组分与作用"],["t",["药皮类型","组成特点","备注"],[["氧化钛型（钛型）","TiO₂ >35%，硅酸盐、锰铁","工艺性好，脱渣最好"],["钛钙型","TiO₂ >30%，碳酸盐 <20%","应用最广（E4303）"],["钛铁矿型","钛铁矿 >30%","—"],["氧化铁型","大量铁矿石","长渣，不宜立、仰、横焊"],["纤维素型","有机物 >15%","全位置、向下焊"],["低氢型","大量碳酸盐、萤石、铁合金","重要结构、低合金钢（E5015）"],["石墨型 / 盐基型","大量石墨 / 氟盐氯盐","铸铁焊条 / 铝及铝合金焊条"]]],["h","型号读法：**E4303**——E 焊条；43 熔敷金属抗拉强度 ≥430MPa；0 全位置；3 钛钙型，交直流两用。**E5015**——50 即 500MPa；1 全位置；5 低氢钠型，__直流反接__。"],["p","工艺性能八项：电弧稳定性、焊缝成形、全位置焊接性、飞溅、脱渣性、熔化速度、药皮发红、焊接烟尘。"],["x","J507 稳弧差是因为含水分多","是因为药皮含较多萤石 CaF₂：氟电离势高（18.6V）且易俘获电子形成负离子，恶化电弧稳定性。"],["h","立、仰、横焊要“__短渣__”：凝固温度范围窄、能快速凝固；氧化铁型为长渣，不能用于横、立、仰焊。"],["p","脱渣性：熔渣与金属线膨胀系数差越大越好；熔渣氧化性太强则难脱；渣越松脆越易脱。__钛型最好，低氢型最差__。"],["p","熔化系数 αp 反映熔化速度；扣除飞溅等损失后，真正反映生产率的是__熔敷系数 αH__；损失系数 ψ 为飞溅、氧化、蒸发损失与熔化焊芯质量之比。"],["t",["对比项","E4303（J422）钛钙型","E5015（J507）低氢型"],[["渣系 / 碱度","TiO₂-CaO-SiO₂，B1=0.76，酸性","CaF₂-CaO-SiO₂，B1=1.89，碱性"],["氧化性","较强，对铁锈不敏感","小，对铁锈、油污、水分敏感"],["脱氧脱硫脱磷","主要靠 Mn，能力较弱","靠碱性氧化物，能力强"],["去氢","弱","强（CaF₂），焊缝含氢极低"],["工艺性","稳弧好、脱渣易、成形美观、发尘少","稳弧差、脱渣差、烟尘大"],["用途","一般结构","重要结构、低合金钢"]]],["p","设计流程：选焊芯（多用 H08A）→ 选药皮类型与渣系配方 → 试验调整。制造流程：焊芯制备 → 药皮材料制备 → 水玻璃制备 → 配料、混拌、压涂 → 烘焙 → 检验包装。"]]},{"t":"§2 焊剂","items":[["p","用于埋弧焊、电渣焊：焊剂相当于焊条药皮，焊丝相当于焊条焊芯；作用是隔离空气并进行冶金处理。"],["t",["制造方法","工艺要点"],[["熔炼焊剂","炉内熔炼 → 水冷粒化 → 烘干、筛选"],["粘结焊剂（陶质）","粉料 + 粘结剂，粒化后 __400℃ 以下__ 低温烘干"],["烧结焊剂","粉料 + 粘结剂，__400～1000℃__ 高温烧结后粉碎、筛选"]]],["p","型号（GB/T 5293-1999）：F 表示焊剂；第 1 位数字为熔敷金属抗拉强度最小值；第 2 位字母 A/P 为焊态/焊后热处理态；第 3 位数字为冲击吸收功 ≥27J 的最低试验温度；“-”后为焊丝牌号。"],["h","质量指标：含水量 __≤0.10%__；机械夹杂物 __≤0.30%__；S __≤0.060%__；P __≤0.080%__。"],["t",["按 SiO₂ 含量","特点","用途"],[["高硅焊剂","SiO₂>30%，向焊缝过渡硅","按 MnO 分高锰、中锰、低锰、无锰"],["中硅焊剂","SiO₂ 少、CaO/MgO 多，碱度高，弱氧化性","高强钢；焊缝含氢较高，抗冷裂弱"],["低硅焊剂","CaO、Al₂O₃、MgO、CaF₂，无氧化作用","配合相应焊丝焊高合金钢"]]],["p","烧结焊剂优点：可连续生产、碱度可调、强塑韧配合好、脱氧充分、合金化强、松装密度小、颗粒圆滑、抗气孔强；缺点：对参数敏感致成分不均、__吸湿性大__。"]]},{"t":"§3 焊丝","items":[["n",["按焊接方法：埋弧焊、CO₂ 焊、钨极氩弧焊、自保护、电渣焊焊丝","按形状结构：实心焊丝、药芯焊丝、活性焊丝","按适用材料：低碳钢/低合金钢、硬质合金堆焊、铝、铜、铸铁焊丝"]]]}],"tip":[["七剂口诀","“稳、造渣、造气、脱、合、粘、增”——稳弧、造渣、造气、脱氧、合金、粘结、增塑。"],["选条一句话","一般结构 J422（酸性、好用）；重要结构 J507（碱性低氢、要烘干）。"]]},{"id":"c3","no":"三","tag":"第三章","title":"熔池凝固和焊缝固态相变","lv":3,"line":"一句话：熔池先__凝固结晶__（偏析、气孔、夹杂），再__固态相变__（F、P、B、M）——组织决定焊缝性能。","secs":[{"t":"§1 熔池凝固","items":[["h","熔池凝固五大特点：__过热度大、过冷度大、合金元素烧损大、结晶速度大、运动态结晶__。"],["p","形核以__非自发形核__为主：现成表面是合金元素或杂质的悬浮质点，以及熔合区附近半熔化母材的晶粒表面。"],["h","晶粒沿__最大温度梯度__方向长大，与结晶等温面正交，形成粗大柱状晶。"],["k","结晶线速度","vc = v·cosθ。熔合线处 θ=90°，vc=0；熔池中心 θ=0°，vc=v（最大）。焊接速度增大 → 柱状晶趋向垂直于焊缝中心线 → 易产生__热裂纹__。"],["f","vc","熔池俯视：熔合线与熔池中心的结晶方向"],["h","结晶形态随成分过冷增大依次为：__平面 → 胞状 → 胞状树枝 → 树枝状 → 等轴__。"],["f","solidification","成分过冷增大 → 结晶形态演变"],["t",["条件变化","成分过冷","形态走向"],[["R、G 一定，C₀ 增大","增大","平面晶 → 等轴晶"],["C₀ 一定，R 增大","增大","平面晶 → 等轴晶"],["C₀、R 一定，G 增大","减小","等轴晶 → 平面晶"]]],["p","焊缝边界 G 大、R 小 → 平面晶发展；焊缝中心 G 小、R 大 → 倾向等轴晶。"],["t",["偏析类型","成因","位置"],[["显微偏析","先结晶的固相较纯，后结晶部分溶质浓度高","晶界、亚晶界、枝晶枝间"],["区域偏析","柱状晶把杂质推向熔池中心","最后凝固部位"],["层状偏析","结晶潜热与熔滴过渡热输入周期性变化","颜色深浅不同的分层"]]],["k","熔合区","不是一条线而是一个区（约 0.0n～0.nmm），存在化学不均匀性与物理不均匀性（空位过饱和、残余应力），是焊接接头的__薄弱环节__。"]]},{"t":"§2 焊缝固态相变","items":[["p","低碳钢焊缝：铁素体 + 少量珠光体；冷却快则珠光体多、组织细化、硬度升高；可能出现魏氏组织。多层焊或焊后热处理可细化晶粒。"],["t",["铁素体类型","形成温度","特征"],[["先共析铁素体 PF（晶界铁素体）",">750℃","沿晶界析出，细条状或块状"],["侧板条铁素体 FSP（无碳贝氏体）","700～550℃","从晶界向晶内长成板条"],["针状铁素体 AF","约 500℃","晶内针状，常以质点为核心呈放射状——__有益__"],["细晶铁素体 FGF（贝氏铁素体）","<500℃","晶内细小，450℃ 左右可转上贝氏体"]]],["p","珠光体转变：Ar1～550℃，扩散型，领先相 Fe₃C；焊接非平衡条件下量少；含 B、Ti 时可被全部抑制。"],["p","贝氏体：上贝氏体 Bu（550～500℃，羽毛状）__韧性差__；下贝氏体 BL（450℃～Ms，针状）__强韧__；M-A 组元（富碳岛状奥氏体转变为马氏体 + 残余奥氏体）。"],["h","马氏体：__板条马氏体__（位错型，低碳低合金焊缝，强韧）；__片状马氏体__（孪晶型，C≥0.4%，粗大贯穿晶粒，脆）。"],["f","cct","16Mn 焊缝 CCT 示意：冷速决定 F+P、B、M 的比例"]]},{"t":"§3 焊缝中的气孔和夹杂","items":[["t",["气孔","分布与形状","成因"],[["氢气孔","表面为主，断面螺钉状、喇叭口形，内壁光滑","水分、有机物多；冷却时氢溶解度骤降来不及逸出"],["氮气孔","表面，蜂窝状成堆出现","保护不良，空气侵入"],["CO 气孔","内部，条虫状，沿柱状晶分布","CO 不溶于金属，结晶时粘度增大难以逸出"]]],["f","pores","三类气孔的形态与位置"],["p","形成过程：生核 → 长大 → 逸出。浸润角 θ<90° 利于上浮；结晶速度 R 小则有时间逸出，R 大则残留。"],["h","工艺影响：电流↑ 气孔倾向↑；电压↑ 氮气孔↑；焊速↑ 气孔↑；气孔倾向：交流 > 直流正接 > 直流反接。"],["t",["夹杂物","危害"],[["氧化物（SiO₂、MnO、TiO₂、Al₂O₃）","密集块状或片状时引起热裂、层状撕裂"],["氮化物（Fe₄N）","脆硬相，硬度升高、韧性下降"],["硫化物（FeS）","晶界低熔点共晶（985℃）→ 热裂"]]]]},{"t":"§4 焊缝性能的控制（自学）","items":[["p","改善焊缝金属性能的途径：固溶强化、变质处理（微合金化）、调整焊接工艺。"]]},{"t":"§5 焊接缺欠","items":[["x","缺欠就是缺陷","缺欠是不连续、不均匀、不健全的欠缺；__缺陷__是超过规定限值、不符合使用性能要求的缺欠。"],["t",["质量标准","含义"],[["QA","质量管理标准，达到者为优质品"],["QB","合于使用的最低验收标准"],["QA～QB 之间","一般质量，不必修补"],["达不到 QB","必须修补，否则判废"]]],["h","危害排序：__裂纹 > 未熔合、未焊透 > 咬边 > 成串气孔、夹杂 > 单个气孔__；裂纹__绝对不允许__存在。成串气孔比单个危险；承载面积减小 10% 时疲劳强度可降约 50%；带咬边接头 10⁶ 次循环的疲劳强度约为致密接头的 40%。"],["n",["裂纹","孔穴","固体夹杂","未熔合及未焊透","形状和尺寸不良","其他缺欠"]]]}],"tip":[["结晶形态口诀","成分过冷一点点变大：“平—胞—胞树—树—等轴”。"],["气孔三兄弟","氢——表面喇叭口；氮——表面蜂窝堆；CO——内部条虫沿柱状晶。"],["铁素体四兄弟","PF 晶界、FSP 侧板条、AF 针状（有益）、FGF 细晶。"]]},{"id":"c4","no":"四","tag":"第四章","title":"焊接热影响区的组织和性能","lv":3,"line":"一句话：热循环“__温度高、加热快、停留短、冷得快、局部加热__”，使 HAZ 出现组织梯度——__熔合区与过热区__最薄弱。","secs":[{"t":"§1 焊接热循环","items":[["k","热影响区（HAZ）","焊缝两侧发生组织和性能变化的区域，又称近缝区。"],["k","焊接热循环","焊件上某点温度由低而高、达到最高值后又由高而低随时间变化的过程。"],["h","四个主要参数：加热速度 ωH、加热最高温度 Tm、相变温度以上的停留时间 tH、冷却速度 ωc（常用 t8/5、t8/3、t100 表示）。"],["f","thermal","焊接热循环四参数示意"],["t",["特点","具体表现"],[["加热温度高","比热处理加热温度高 100～200℃"],["加热速度快","是热处理的几十倍甚至几百倍"],["高温停留时间短","手工焊约 4～20s，埋弧焊约 30～100s"],["自然冷却","冷速快，低温转变产物增多"],["局部加热","产生复杂应力，组织转变在应力下完成"]]],["p","多层焊：相邻层互有热处理作用。长段多层焊（每道 >1m，前层已冷至 100～200℃ 以下）不适于淬硬倾向大的钢；短段多层焊（每道约 50～400mm）焊下层时前层温度仍较高。"]]},{"t":"§2 热循环条件下的组织转变特点","items":[["h","加热速度增大 → 扩散相变滞后，__Ac1、Ac3 及（Ac3−Ac1）升高__，奥氏体均质化不完全；含 Cr、W、Mo、V 等碳化物形成元素时影响更大。"],["t",["元素类别","代表元素"],[["强碳化物形成元素","Ti、V、Nb（碳化物比 Fe₃C 更稳定）"],["弱碳化物形成元素","Mn"],["非碳化物形成元素","Ni、Co、Cu、Si、Al、N、B"]]],["x","所有钢焊接后淬硬倾向都增大","分钢种：__45 钢__——焊接条件下无碳化物溶解过程且组织粗化，CCT __右移__、淬硬倾向增大；__40Cr__——Cr 等碳化物形成元素未充分溶入奥氏体，CCT __左移__、淬硬倾向降低。"],["p","焊接 CCT 图由热模拟试验建立，可预估 HAZ 组织性能、作为制定工艺和线能量的依据；影响因素：母材成分、冷却速度、峰值温度、晶粒粗化、应力应变。"]]},{"t":"§3 焊接热影响区的组织和性能","items":[["p","不易淬火钢：低碳钢及某些不易淬硬的低合金钢（16Mn、15MoV、15MnTi）；易淬火钢：45 钢、30CrMnSi、18MnMoNb 等。"],["t",["不易淬火钢 HAZ","温度范围","组织与性能"],[["熔合区（半熔化区）","TL～TS","范围很窄，化学与物理不均匀"],["过热区","TS～1100℃","奥氏体晶粒粗大，__韧性很低__"],["相变重结晶区（正火区）","A3～1000℃","重结晶，均匀细小，塑韧性__较好__"],["不完全重结晶区","Ac1～Ac3","部分相变，组织性能不均匀"]]],["f","haz_low","不易淬火钢（低碳钢/16Mn）HAZ 分区"],["t",["易淬火钢 HAZ","温度范围","组织与性能"],[["完全淬火区","Ac3 以上","粗大马氏体，淬硬倾向大，冷裂敏感"],["不完全淬火区","Ac1～Ac3","马氏体 + 铁素体"],["回火区","Ac1 以下","母材焊前为调质态时出现回火软化"]]],["f","haz_quench","易淬火钢（45 钢/30CrMnSi）HAZ 分区"],["k","碳当量","把钢中合金元素（包括碳）对淬硬（冷裂、脆化）的影响折合成碳的相当含量；碳当量越大，最高硬度 Hmax 越高。"],["t",["公式","适用钢种"],[["CE（IIW）","中等强度非调质低合金钢，σb=400～700MPa"],["Ceq（WES）","强度较高的低合金高强钢，σb=500～1000MPa"],["Pcm（伊藤）","C≤0.17%、σb=400～900MPa 的低合金高强钢"],["CEN","C≥0.18% 时近似 CE；C≤0.17% 时近似 Pcm"]]],["h","注意：CE（IIW）与 Ceq（WES）__不适用于含碳量 0.17% 以下__的钢种。"],["n",["粗晶脆化（过热区晶粒粗大或脆性组织）","组织脆化（M-A 组元、上贝氏体、魏氏组织、组织遗传）","析出脆化（碳化物、氮化物在晶界析出）","热应变时效脆化（静应变：室温；动应变：200～400℃）","氢脆化","石墨脆化"]],["p","韧化途径：母材多元合金化/微合金化与韧化相（针状铁素体、下贝氏体、低碳马氏体）；焊后热处理、预热；控制线能量。"],["p","软化：调质钢回火温度越低，焊后软化越严重；热处理强化合金发生过时效软化。"]]},{"t":"§4 焊接热、力模拟试验方法","items":[["p","用热模拟试验机（如 Gleeble 3500）在试样上重现焊接热循环，测定 SH-CCT 图及 HAZ 各部位性能。"]]}],"tip":[["热循环五特点","“高、快、短、冷、局”——温度高、加热快、停留短、自然冷却、局部加热。"],["薄弱环节","熔合区 + 过热区：晶粒最粗、韧性最低。"],["脆化六类","粗晶、组织、析出、热应变时效、氢、石墨——M-A 组元是组织脆化的主角。"]]},{"id":"c5","no":"五","tag":"第五章","title":"焊接裂纹","lv":3,"line":"一句话：先分清__五大类裂纹__（热、冷、再热、层状撕裂、应力腐蚀）——按“温度—部位—走向—断口”四步判断，再谈机理与防治。","secs":[{"t":"§1 概述：分类及一般特征","items":[["t",["类别","产生温度","主要部位","走向与特征"],[["热裂纹（结晶、液化、多边化）","高温（固相线附近）","焊缝为主，少量 HAZ","__沿晶__，断口有氧化彩色"],["再热裂纹","550～650℃ 敏感","HAZ 粗晶区","沿晶，止裂于细晶区"],["冷裂纹","约 100℃～−75℃","多在 HAZ，高强钢/钛合金也在焊缝","沿晶或穿晶，__脆性亮断口__，可延迟"],["层状撕裂","<400℃","厚板 T、十字、角接头的 HAZ 附近或母材","__台阶状__，穿晶"],["应力腐蚀裂纹 SCC","特定介质 + 拉应力，工作时","焊缝与 HAZ","枯树根状、带分支，沿晶或穿晶"]]],["p","按走向分：横向、纵向、星形（弧形）；按部位分：焊缝金属中、热影响区中、贯穿裂纹。"]]},{"t":"§2 焊接热裂纹","items":[["h","结晶裂纹两大原因：__液态薄膜是根本原因，拉伸应力是必要条件__。"],["t",["熔池结晶阶段","状态","能否裂"],[["液固阶段","液相多，晶粒未接触，液体可流动补缩","不裂"],["固液阶段","固相彼此接触，残余低熔点共晶成液膜，流动困难","__脆性温度区 TB，易裂__"],["完全凝固阶段","强度塑性较高","难裂"]]],["k","产生条件","TB 内焊缝承受的拉伸应变 __大于__ 焊缝金属的塑性（塑性储备 Δes<0）时开裂。TB 越大、TB 内塑性越小、应变增长率越大，越易裂。"],["t",["元素","影响"],[["S、P","扩大结晶温度区间、形成低熔点共晶液膜、加剧偏析 → 裂纹倾向显著↑"],["C","C<0.1% 时 C↑ 裂纹↑；C>0.16% 后 P 的有害作用超过 S；C>0.51% 初生相由 δ 转 γ，S、P 在 γ 中溶解度低，裂纹↑"],["Mn","脱 S 并使硫化物由膜状变球状 → 抗裂↑；C↑ 则要求 Mn/S ↑"],["Si","δ 相形成元素，适量有利；__Si>0.4%__ 易形成低熔点硅酸盐夹杂，裂纹↑"],["Ti、Zr、RE","与 S 亲和力大，形成高熔点硫化物（TiS 2000～2100℃）→ 消除裂纹"],["Ni","易与 S 形成低熔点共晶 → 裂纹↑，加 Mn、Ti 可抑制"],["O","一定量的 O 形成 Fe-FeS-FeO 三元共晶，使 FeS 由膜变球 → 降低 S 的危害"]]],["p","组织：晶粒越粗大、柱状晶方向越明显，裂纹倾向越大；__γ+δ 双相组织__抗裂性好（δ 相细化晶粒、打乱方向性、溶解更多 S、P）。"],["h","防治：冶金——限制 S、P（<0.03%～0.04%）、C（焊丝 C<0.12%），加入细化晶粒元素，获得 γ+δ 双相组织；工艺——适当增大线能量、预热，改善接头形式，合理的焊接次序（对称焊）。"],["k","近缝区液化裂纹","近缝区或多层焊层间的__晶界低熔点共晶被重新熔化__，在拉应力下沿晶开裂；尺寸多在 0.5mm 以下。B、Ni、高 Cr 增加倾向；线能量大、熔合线凹陷处易生。防治：控制 S、P、Si、B，小线能量。"],["k","多边化裂纹","刚凝固金属中位错、空位等晶格缺陷迁移聚集形成“多边化边界”，塑性下降而沿其开裂；见于纯金属或单相奥氏体合金，常伴有再结晶晶粒，与晶界液化无关。"]]},{"t":"§3 焊接冷裂纹","items":[["h","三大要素：__钢种的淬硬倾向（M）+ 接头含氢量及其分布（H）+ 拘束应力（R）__，三者相互促进。"],["f","cold_crack","氢致冷裂纹三要素：H + M + R"],["p","延迟裂纹三种形态：焊趾裂纹（起源于焊缝与母材交界、应力集中处，常平行焊道）；焊道下裂纹（淬硬倾向大、[H] 高的 HAZ）；根部裂纹（[H] 高、预热不足，起源于焊根应力集中处）。"],["k","淬硬倾向","形成脆硬马氏体（高碳孪晶 M 对氢脆最敏感）；淬硬产生更多位错、空位，聚集后成为裂纹源。"],["p","氢的动态行为：焊缝含碳量低于母材，先发生相变 → 氢越过熔合线向尚未转变的奥氏体 HAZ 扩散 → 在熔合线附近__富氢__ → HAZ 转 M 后氢过饱和残留 → 脆化开裂。致裂有效氢为冷至 100℃ 的残余扩散氢 HR100。"],["k","拘束度 R","单位长度焊缝在根部间隙产生单位长度弹性位移所需的力；R 达到__临界拘束度 Rcr__ 时开裂，Rcr 越大抗裂性越强。拘束应力 σ = m·R，低合金高强钢焊条电弧焊 m≈(3～5)×10⁻²。"],["h","工艺影响：线能量过大→晶粒粗大，过小→淬硬；预热要适中；焊后__后热__可消氢、降残余应力；多层焊控制__层间温度__，否则氢逐层积累。"],["h","防止冷裂纹：① 冶金——低碳微合金化、降 S、P；选低氢焊材与低氢方法（CO₂ 焊）；烘干焊条焊剂；加 Ti、Nb、Mo、V；必要时用奥氏体焊条。② 工艺——合理线能量、预热、后热（350℃ 保温 1～2h 消氢）。"]]},{"t":"§4 再热裂纹","items":[["k","再热裂纹","焊后再加热（消除应力退火）或高温服役（500～600℃）过程中产生的裂纹；部位在 HAZ __粗晶区__，沿晶开裂，止裂于细晶区。"],["t",["敏感温度","钢种"],[["500～700℃","含沉淀强化元素的低合金钢"],["700～900℃","奥氏体不锈钢和部分高温合金"]]],["h","产生条件：__e > ec__——粗晶区晶界的实际塑性变形量超过晶界最大塑性变形能力。"],["n",["晶界杂质析集弱化说：P、S、Sb、Sn、As 及硼化物沿晶析集","二次沉淀（晶内沉淀强化）说：Cr、Mo、V、Ti、Nb 的碳氮化物在晶内析出，变形集中于晶界","蠕变断裂说：楔形开裂（三晶粒交界应力集中）与空位聚集开裂"]],["p","影响因素：Cr、Mo、V、Ti、Nb、Cu 含量↑ → 倾向↑；晶粒越粗、杂质越多 → 倾向↑；拘束度大、应力集中部位易生。"],["h","防治：预热 200～450℃ 或配合后热；适当增大线能量；采用__低强焊缝__（低匹配）；降低残余应力、避免应力集中。"]]},{"t":"§5 层状撕裂","items":[["h","特征：外观呈__台阶状__——平行于轧向的“平台”+ 垂直平台的“剪切壁”；断口呈木纹状；发生于厚板 T 形、十字、角接头；与钢种强度级别__无关__，与夹杂物及分布形态__有关__。"],["n",["第一类：由焊趾或焊根的冷裂纹诱发","第二类：沿 HAZ 内夹杂开裂（最常见）","第三类：远离 HAZ 的母材中沿夹杂开裂"]],["n",["① 刚性拘束产生 Z 向应力应变，超过母材塑性 → 夹杂与基体分离（脱聚）","② 同一平面相邻夹杂连成一片 → 形成“平台”","③ 相邻平台间的剪应力 → “剪切壁”，连成阶梯状"]],["p","影响因素：条状硫化物、硅酸盐敏感，球状铝酸盐不敏感；夹杂体积比与累积长度↑ → Z 向断面收缩率 ψZ↓；Z 向应力超过临界值；氢聚集在夹杂端部；母材淬硬或热应变脆化。"],["h","判据：Z 向断面收缩率 __ψZ ≥ 15%__（一般 15%～20%，优异 ≥25%）。"],["h","防止：选__超低 S 精炼钢__，加 Ca 或稀土使夹杂物球化；避免单侧焊缝；用对称角焊缝代替全焊透；在受 Z 向应力一侧开坡口；去氢、预热、后热、控制层间温度；预加软焊道。"]]},{"t":"§6 应力腐蚀裂纹","items":[["k","应力腐蚀裂纹（SCC）","金属材料在__特定介质__与__拉应力__（工作应力 + 残余应力）共同作用下产生的延迟破裂现象。"],["p","外观：疏松网状或龟裂；横断面像枯树根，由表面向内发展，__深宽比大、细长带分支__；断口为脆性断口。"],["t",["开裂途径","材料"],[["沿晶","低碳钢、低合金钢、铝合金、α 黄铜、镍基合金"],["穿晶","β 黄铜、氯化物介质中的奥氏体不锈钢"],["沿晶 + 穿晶混合","硫酸、亚硫酸中的奥氏体不锈钢"]]],["h","电化学机理两条：__APC__ 阳极溶解腐蚀（M→M⁺+e）；__HEC__ 阴极氢脆开裂（H⁺+e→H）。奥氏体不锈钢多为 APC 型；低碳钢、低合金钢、超高强钢多为 HEC 型。三要素：__材质、腐蚀介质、拉应力__。"],["p","机械破裂机理：塑性变形产生滑移台阶 → 台阶高于氧化膜厚度时膜破裂 → 金属快速溶解。__HAZ 粗晶区对 SCC 最敏感__（晶粒粗大、位错多、滑移台阶大）。"],["h","防治：组装精确、避免伤痕与打弧；焊材成分组织尽量与母材一致；合理线能量（不锈钢宜小）；焊后消除应力处理（整体/局部热处理、水压试验、机械拉伸等）；表面改质（喷 Al、涂层、堆焊不锈钢）。"]]},{"t":"§7 焊接裂纹综合分析和判断","items":[["n",["宏观分析：材质与焊材成分、施工工艺、运行工况","微观分析：光学显微镜、扫描电镜、电子探针、俄歇能谱、X 射线衍射","断口分析：韧窝（DR）、解理（CF）、准解理（QC）、沿晶（IG）"]],["t",["线索","推断"],[["S、P、C 多","冷裂、热裂，应力集中部位可能有再热裂纹"],["S、P、O 多","层状撕裂"],["有腐蚀介质","应力腐蚀裂纹"],["高温高压","再热裂纹、蠕变疲劳裂纹"],["线能量过大 / 过小","热裂纹 / 冷裂纹"]]]]}],"tip":[["五类裂纹一句话","热裂沿晶带氧化色，冷裂亮脆会延迟；再热粗晶 550 起，层状撕裂台阶立；SCC 枯根带分枝，介质应力缺一不可。"],["冷裂三要素与三对策","H+M+R → 低氢、预热控线能量、后热消氢。"],["结晶裂纹","“液膜是根本，拉应力是条件；治 S、P、C，用 Mn 换 S，γ+δ 双相好。”"]]},{"id":"c6","no":"六","tag":"第六章","title":"钎焊","lv":2,"line":"一句话：母材__不熔化__，靠熔点更低的液态钎料__润湿、铺展、毛细填缝__，再靠溶解扩散形成接头。","secs":[{"t":"§1 概述","items":[["k","钎焊","在低于母材熔点、高于钎料熔点的温度下加热，液态钎料在母材间隙中__润湿、铺展、毛细流动填缝__，凝固结晶后实现原子间结合的连接方法。母材不熔化。"],["n",["钎剂熔化流入间隙，去除母材表面氧化膜","钎料熔化，润湿、铺展，排开钎剂残渣","钎料与母材相互作用：少量母材溶入钎料，钎料组元扩散进入母材"]],["n",["加热温度低，对母材组织性能影响小","接头平整光滑、变形小、尺寸精度高","一次可焊几十到上百条钎缝，生产率高","可连接异种金属、金属与非金属"]],["k","润湿","固—液界面取代固—气界面、体系自由能降低的过程；用润湿角 θ 衡量：__θ<90° 润湿，θ>90° 不润湿，θ≈0° 漫流__。多数钎焊系统 θ 在 10°～45°。"],["p","表面氧化膜抑制润湿；毛细流动的驱动力来自毛细管作用，并受熔化金属密度、粘度和接头几何形状影响。"],["h","影响钎焊过程的三因素：__接头间隙__（小间隙强度高，甚至超过母材；间隙增大则接近钎料自身强度）、__钎料__（熔化区间宽则流动性差、易偏析填充不均）、__残余应力__（两种材料热膨胀系数不同 → 局部应力、变形或裂纹）。"],["f","brazing","钎焊润湿角与毛细填缝示意"]]},{"t":"§2 钎焊方法","items":[["h","按钎料熔点：__软钎焊 <450℃，硬钎焊 >450℃__。"],["t",["分类标准","类别"],[["按钎焊温度","钢：高温 >800℃、中温 550～800℃、低温 <550℃；铝合金：>450℃、300～450℃、<300℃"],["按热源与加热方法","火焰、炉中、感应、电阻、浸渍、气相、烙铁、超声波"],["按去氧化膜方式","钎剂、无钎剂、自钎剂、气体保护、真空钎焊"],["按接头形式","毛细钎焊；非毛细钎焊（接触反应、扩散钎焊）"],["按母材或钎料","铝、不锈钢、钛合金、高温合金、陶瓷、复合材料钎焊；银钎焊、铜钎焊"]]],["p","火焰钎焊：靠燃气火焰加热。特点——设备简单、投资低；在空气中进⾏，通常需钎剂，焊后要清理残渣；方便灵活，可自动化；钎料选择范围广（银基到镍基、铜基）；不受批量限制。"],["p","限制：氧化环境、残渣与热垢；手工质量依赖技能；大件加热慢、厚重件难超 1000℃；高活性母材不适合；含镉钎料超温蒸发有害健康；残渣可能引起腐蚀。"]]},{"t":"§3 钎焊用钎料","items":[["p","纯金属恒温熔化、流动性好；共晶成分合金流动性好，非共晶成分较差。熔化区间宽的钎料慢热时__偏析__，低熔点组元先流入焊缝。"],["h","钎焊温度：至少加热到钎料__液相线__以上，所有钎缝结合面都要达到；取决于母材、钎料、工艺与接头设计（含间隙）。"],["n",["适当的熔点","良好的润湿性，能铺展并填满间隙","能与母材溶解、扩散，形成牢固冶金结合","成分稳定均匀，避免偏析和易挥发元素烧损","满足接头使用要求，经济"]],["t",["按熔点","按熔点与接头强度","按组成元素"],[["软钎料 Tm<450℃；硬钎料 Tm>450℃；高温钎料 Tm>950℃","易熔钎料、难熔钎料","铝基、银基、铜基、锰基、镍基"]]]]},{"t":"§4 钎焊缺陷","items":[["t",["缺陷","含义与特征","防止"],[["钎缝不致密","气孔、夹渣、未填满；降低密封性、强度、导电性，吸潮引起腐蚀","合适间隙、钎剂与温度；可采用不等间隙"],["母材自裂","高强度材料在有刚性固定时，液态钎料渗入表面显微裂纹使强度下降，在拉应力下自裂","减小拉应力（局部加热、刚性固定、锤击、冷弯、划痕）"],["溶蚀","母材向钎料中过度溶解，表面出现溶坑，易发生在钎料放置处","控制温度与保温时间、钎料用量与放置位置"]]]]}],"tip":[["钎焊关键词","“不熔母材、钎料填缝；润湿看角、毛细流动；小间隙高强度；450 分软硬。”"],["三缺陷","不致密（气孔夹渣未填满）、自裂（液态钎料渗入微裂纹）、溶蚀（母材溶入钎料过度）。"]]},{"id":"c7","no":"增","tag":"增材制造技术","title":"增材制造技术","lv":2,"line":"一句话：三维模型__切片__→逐层__叠加__，“自下而上”成形；重点掌握 SLA（光固化）与 SLM（激光选区熔化）的原理、材料要求与工艺流程。","secs":[{"t":"§1 增材制造技术概论","items":[["k","增材制造","依据三维 CAD 数据，采用液体、粉末、丝材等__离散材料逐层累加__制造实体零件；相对减材与模具成形，是一种“__自下而上__”的材料累加过程。"],["t",["三类制造","含义"],[["减材制造","材料去除（切削加工）"],["等材制造","模具控形、材料变形（铸、锻）"],["增材制造","离散材料逐层累加"]]],["h","两个阶段：__数据处理__（三维模型分层“切片”，得到二维轮廓数据）+ __叠层制作__（逐层制作薄片并自上叠加成三维实体）。"],["p","发展史：1986 Hull 发明 SLA；1988 Feygin 发明 LOM；1989 Deckard 发明 SLS；1992 Crump 发明 FDM；1993 Sachs 发明 3DP。"],["p","特点与局限：适合复杂结构、个性化定制、高附加值产品；但技术成熟度低、材料种类有限、精度与尺寸受限、成本高，暂不能替代传统工艺。"],["p","材料与方法：高分子材料用于 FDM、SLA、3DP、SLS；金属材料用于 SLM、EBM、LENS。趋势：快速原型 → 功能零件；常规尺度 → 微纳与大型化；工业应用 → 日常消费。"]]},{"t":"§2 光固化制造技术（SLA）","items":[["k","原理","利用光能的化学与热作用使液态光敏树脂__固化__（紫外光引发聚合反应），控制光斑逐层固化堆积成形；光源波长 325～355nm。"],["p","曝光方式：掩模面曝光、扫描头选择性曝光、投影曝光；扫描方式：X-Y 平面扫描（成本低、速度慢）与振镜扫描（速度快、范围受限），目前常用振镜。"],["h","树脂要求：固化前稳定、黏度低、光敏性好、固化收缩小、溶胀小、固化后强度/耐蚀/热稳定好、毒性小。"],["n",["前处理：建模、近似处理、选择成形方向、切片、加支撑","分层叠加成形","后处理：取出零件、排残树脂、清洗、后固化、去支撑、机加工、打磨"]],["p","层间台阶约 0.05～0.1mm；残留树脂会发生暗反应固化收缩，__必须排出__。"]]},{"t":"§3 激光选区熔化技术（SLM）","items":[["k","原理","高能激光束将金属粉末__完全熔化__后快速冷却凝固，逐层得到高致密度、高精度金属零件；激光消失后快冷形成细晶。"],["t",["粉末要求","影响"],[["堆积特性","铺粉宜用振实密度；二组分粒径级配可提高铺粉致密度"],["颗粒形状","球形度越高、表面越光滑，孔隙率越低；气雾化粉近球形，旋转电极粉更好"],["流动性","影响铺粉均匀性"],["含氧量","一般 __≤1000ppm__；氧化膜降低润湿性 → 分层、裂纹"],["激光吸收率","激光波长越短，吸收率越高"]]],["n",["材料准备","工作腔准备（清理、装基板）","模型准备（CAD→STL→切片）","零件加工（抽真空、通保护气、预热，设定激光功率、扫描速度、层厚、扫描间距与路径）","零件后处理（喷砂/高压气清粉、去支撑、乙醇清洗）"]],["h","优点：材料广、晶粒细小均匀、力学性能优异、致密度高、精度高。缺点：__球化、翘曲、裂纹__等冶金缺陷；零件尺寸受限；工艺参数复杂；设备成本高、可靠性待提高。"]]}],"tip":[["两大工艺一句话","SLA——光固化树脂，切片后紫外扫描逐层固化；SLM——激光把金属粉末完全熔化，快冷细晶。"],["SLM 三大缺陷","球化、翘曲、裂纹——根源在润湿不良与热应力。"]]}];
const NOTES_Q = [{"id":"m1","ch":"绪论","type":"名词解释","src":["真题"],"tag":"期中·名词 1","q":"焊接热输入","think":"定义 + 公式 + 各量含义 + 它影响什么。","ans":"焊接热输入（线能量）是焊接热源传给单位长度焊缝上的热量，表达式 q = ηUI/v。式中 η 为热效率系数，U 为电弧电压，I 为焊接电流，v 为焊接速度。\n热输入越大，熔池越大、高温停留时间越长、冷却越慢（t8/5 增大），HAZ 变宽；热输入过小则冷却快、易淬硬和产生冷裂纹。它是制定焊接工艺、控制 HAZ 组织性能的基本参数。","pts":["单位长度焊缝上获得的热量","公式 q=ηUI/v 及各量含义","对熔池、冷却速度 t8/5、HAZ 宽度与组织的影响"],"essay":false,"fig":null,"basis":"绪论 焊接温度场的影响因素；第一章 §1 工艺参数对冶金反应的影响"},{"id":"m2","ch":"绪论","type":"名词解释","src":["真题"],"tag":"期中·名词 2","q":"熔合比","think":"定义 + 表达式 + 影响因素 + 意义。","ans":"熔合比是指焊缝金属中局部熔化的母材所占的比例，常按截面积表示为 θ = F母/(F母+F填充)。\n熔合比取决于焊接方法、坡口形式与板厚、焊条药皮类型以及电流、电压等。它决定母材成分对焊缝的稀释程度，从而影响焊缝的化学成分与性能：母材中 C、S、P 较高时，熔合比过大会把有害元素带入焊缝。","pts":["定义：焊缝中熔化母材所占比例","影响因素","对焊缝成分、性能（稀释作用）的意义"],"essay":false,"fig":null,"basis":"第一章 §1 熔合比；绪论 焊接接头形成"},{"id":"m3","ch":"第一章","type":"名词解释","src":["真题"],"tag":"期中·名词 3","q":"脱氢处理","think":"是什么 + 工艺参数 + 目的。","ans":"脱氢处理（消氢处理）是焊后立即将焊件加热到一定温度并保温，促使焊缝中的扩散氢逸出金属的热处理。常用规范为 350℃ 保温 1h，或 250℃ 保温 6h。\n其目的是降低接头中的扩散氢含量，防止氢致延迟裂纹（冷裂纹）；主要用于低氢型焊条焊接的低合金高强钢等重要结构。","pts":["焊后立即进行的加热保温处理","规范：350℃×1h 或 250℃×6h","目的：促使扩散氢逸出，防止氢致冷裂纹"],"essay":false,"fig":["hydrogen","氢的来源、存在形式与危害；脱氢处理针对的是扩散氢。"],"basis":"第一章 §2 控制氢的措施"},{"id":"m4","ch":"第一章","type":"名词解释","src":["真题"],"tag":"期中·名词 4","q":"根据离子理论，碱度的定义是什么？","think":"先给定义，再点明与分子理论的区别。","ans":"按熔渣的离子理论，液态熔渣是由阳离子和阴离子组成的电中性溶液。碱度定义为液态熔渣中__自由氧离子（O²⁻）的浓度（活度）__：自由氧离子浓度越高，熔渣碱性越强；自由氧离子越少，酸性越强。\n分子理论则以碱性与酸性氧化物的相对含量表示，B>1 为碱性，B<1 为酸性。碱度决定了熔渣的脱硫、脱磷能力与焊缝的氧化性。","pts":["碱度 = 自由氧离子 O²⁻ 的浓度（活度）","自由氧离子越多，碱性越强","与分子理论（B 值）的区别"],"essay":false,"fig":null,"basis":"第一章 §3 熔渣碱度"},{"id":"m5","ch":"绪论","type":"名词解释","src":["真题"],"tag":"期中·名词 5","q":"热惯性","think":"按传热含义作答：温度变化落后于热量变化，取决于体积热容与导热，并联系板厚。","ans":"热惯性是指焊件吸收或散失热量时，其温度变化落后于热输入变化的性质，取决于金属的体积热容（cρ）和导热能力。\n板越厚、cρ 越大、导热越差，热惯性越大，加热慢、冷却也慢，热循环曲线平缓，HAZ 较宽；薄板热惯性小，升温和冷却都快，易淬硬。","pts":["温度变化滞后于热输入变化","取决于体积热容、导热能力与板厚","对加热速度、冷却速度和 HAZ 的影响"],"essay":false,"fig":null,"basis":"绪论 焊接热过程特征（局部性、瞬时性）与温度场；注：现版绪论课件未单列此词条，本答案按传热学通用含义整理","note":"现版绪论课件未单列“热惯性”词条，此处按传热学通用含义作答，请对照老师课堂讲义核对。"},{"id":"w01","ch":"第一章","type":"简答","src":["真题"],"tag":"期中·简答 1（10 分）","q":"分别叙述硫和磷对焊接的危害性及其控制措施。","think":"两种元素各按“存在形式 → 低熔点共晶与温度 → 危害 → 控制”四步写。","ans":"硫：① 以 FeS 形式存在，液态互溶、固态基本不溶，偏析于晶界；与 Fe 形成 Fe+FeS 低熔点共晶（985℃），与 FeO 形成 Fe+FeO 共晶（940℃），高镍合金还有 NiS+Ni 共晶（644℃）。结晶后期晶界液膜在拉应力下开裂，即热裂纹（热脆）；C↑ 促进偏析。② 控制：限制母材、焊丝、药皮、焊剂含硫；冶金脱硫用 Mn（[FeS]+[Mn]→(MnS)+[Fe]，MnS 熔点 1610℃ 入渣，降温有利），或用 CaO/MgO 碱性氧化物脱硫。\n磷：① 以 Fe3P/Fe2P 存在，固态基本不溶，晶界形成 Fe+Fe3P 共晶（1050℃）或 Fe+Ni3P 共晶（880℃），引起冷脆和热裂，P 偏析严重。② 控制：限制来源；脱磷两步——先使 P 氧化成 P2O5，再与 CaO 生成稳定磷酸钙入渣（2[Fe3P]+5(FeO)+3CaO→(CaO)3·P2O5+11[Fe]）。碱性渣、低氢焊条有利于脱硫脱磷；同时控制 C、Ni 等促进偏析的元素。","pts":["硫以 FeS 形式偏析于晶界，形成 Fe+FeS（985℃）、Fe+FeO（940℃）低熔点共晶，结晶后期晶界液膜在拉应力下开裂，产生热裂纹（热脆）。","控硫：限制母材、焊丝、药皮、焊剂含硫；用 Mn 脱硫生成 MnS 入渣（[FeS]+[Mn]→(MnS)+[Fe]），或用 CaO/MgO 碱性氧化物脱硫。","磷以 Fe3P/Fe2P 偏析于晶界，形成 Fe+Fe3P（1050℃）、Fe+Ni3P（880℃）低熔点共晶，引起冷脆和热裂。","控磷：限制来源；脱磷分两步，先使 P 氧化成 P2O5，再与 CaO 生成稳定磷酸钙入渣。","碱性渣、低氢焊条有利于脱硫脱磷；C、Ni 等促进偏析的元素应控制。"],"essay":true,"fig":["hot_crack","硫、磷在晶界形成低熔点共晶液膜，结晶后期受拉应力→热裂纹；图中标出 Fe+FeS 985℃、Fe+Fe3P 1050℃。"],"basis":"CHAP1 §3 硫、磷的危害；期中试题 简答1"},{"id":"w02","ch":"第二章","type":"简答","src":["真题","课后"],"tag":"期中·简答 2（15 分）· 练习题 2","q":"对比说明酸性焊条对焊缝金属的净化作用。","think":"选代表焊条 → 从脱氧、脱硫、脱磷、去氢四方面与碱性焊条对比 → 结论。","ans":"酸性焊条以 E4303（J422）为代表，渣系 TiO2-CaO-SiO2，B1=0.76，属酸性，气渣联合保护。其熔渣氧化性较强、FeO 活度高，扩散脱氧能力弱；酸性氧化物多，自由氧离子少，脱硫脱磷能力弱，主要靠 Mn 脱硫，脱磷靠 FeO+CaO 但效果有限；CaF2 少，去氢能力弱。因此焊缝中 O、H、S、P 含量较高，塑韧性较低。\n碱性焊条以 E5015（J507）为代表，渣系 CaF2-CaO-SiO2，B1=1.89，属碱性，氧化性小；CaO 等碱性氧化物脱硫脱磷强，CaF2 与 H/水反应生成 HF 去氢；焊缝 O、H、S、P 低，净化作用强，塑韧性好。\n结论：酸性焊条对焊缝金属的净化作用明显弱于碱性焊条；但酸性焊条稳弧、脱渣、成形好，成本低，一般结构常用；重要结构用碱性低氢焊条。","pts":["酸性焊条以 E4303（J422）为代表，渣系 TiO2-CaO-SiO2，B1=0.76，属酸性，气渣联合保护。","熔渣氧化性较强、FeO 活度高，扩散脱氧能力弱；酸性氧化物多，自由氧离子少，脱硫脱磷能力弱。","碱性焊条以 E5015（J507）为代表，B1=1.89，CaO 等碱性氧化物脱硫脱磷强，CaF2 与 H/水生成 HF 去氢。","碱性焊条焊缝 O、H、S、P 低，净化作用强，塑韧性好；酸性焊条焊缝 O、H、S、P 较高，塑韧性较低。","结论：酸性焊条净化作用明显弱于碱性焊条；但酸性焊条稳弧、脱渣、成形好，一般结构常用，重要结构用碱性低氢焊条。"],"essay":true,"fig":["acidbase","酸性 E4303 与碱性 E5015 的渣系、碱度、氧化性、脱硫脱磷、去氢和塑韧性对比。"],"basis":"CHAP2 §1 典型焊条；期中试题 简答2；练习题2"},{"id":"w03","ch":"第三章","type":"简答","src":["真题"],"tag":"期中·简答 3（15 分）","q":"根据 16Mn 钢焊缝化学成分和冷却条件的不同，其固态相变组织可能有哪些？各自特征如何？","think":"先点明四类组织 → 铁素体四型逐个写温度与形态 → 珠光体、贝氏体、马氏体 → 说明冷速影响。","ans":"16Mn 为低合金高强钢（C≈0.16%、Mn≈1.4%），焊缝为低合金钢焊缝，固态相变可能出现铁素体、珠光体、贝氏体、马氏体四类组织，以铁素体为主。\n① 铁素体：先共析铁素体 PF（>750℃，沿原奥氏体晶界细条/块状）；侧板条铁素体 FSP（700~550℃，由晶界向晶内板条状，无碳贝氏体）；针状铁素体 AF（约500℃，晶内针状、以质点为核心放射状）；细晶铁素体 FGF（<500℃，晶内细小，450℃左右可转上贝氏体）。\n② 珠光体：Ar1~550℃ 扩散型转变，F+Fe3C 层状；焊接非平衡冷却时量少，慢冷/预热/后热时增多。\n③ 贝氏体：上贝氏体 Bu（550~500℃，羽毛状，条状 F 间夹渗碳体）；下贝氏体 BL（450℃~Ms，针状，强韧）；M-A 组元为富碳马氏体+残余奥氏体。\n④ 马氏体：含碳高或合金复杂、快冷到 Ms 以下；板条马氏体（低碳低合金，位错亚结构，强韧）；片状马氏体（C≥0.4%，孪晶，脆）。\n16Mn 常规焊态以 PF+FSP+AF+FGF 为主，少量 P；冷速加快→B 增多；更快→M；慢冷/预热→P 增多。","pts":["16Mn 为低合金高强钢（C≈0.16%、Mn≈1.4%），焊缝可能出现铁素体、珠光体、贝氏体、马氏体四类组织，以铁素体为主。","铁素体四类：PF（>750℃晶界）、FSP（700~550℃侧板条/无碳贝氏体）、AF（约500℃晶内针状）、FGF（<500℃细晶/贝氏铁素体）。","珠光体：Ar1~550℃扩散型转变，F+Fe3C 层状；焊接非平衡冷却时量少，慢冷/预热/后热时增多。","贝氏体：上贝 550~500℃羽毛状；下贝 450℃~Ms 针状强韧；M-A 组元为富碳马氏体+残余奥氏体。","马氏体：含碳高或合金复杂、快冷到 Ms 以下；板条马氏体（位错、强韧），片状马氏体（C≥0.4%、孪晶、脆）。"],"essay":true,"fig":["cct","16Mn 低合金钢焊缝 CCT 示意：冷速↑，组织由 F+P→B→M 转变；常规焊态以 PF+FSP+AF+FGF 为主。"],"basis":"CHAP3 §2 焊缝固态相变；期中试题 简答3"},{"id":"w04","ch":"第二章","type":"简答","src":["真题"],"tag":"期中·简答 4(1)（6 分）","q":"解释焊条型号 E5515-N5 P U H10 中数字及字母的含义。","think":"按 E / 55 / 15 / -N5 / P / U / H10 逐段拆开。","ans":"E5515-N5 P U H10：E—焊条；55—熔敷金属抗拉强度最小值 550MPa；15—药皮为碱性，适用于全位置焊接，直流反接；-N5—熔敷金属化学成分分类代号；P—焊后状态代号，P 为热处理态（无标记为焊态，AP 为焊态/焊后热处理态均可）；U—可选附加代号，规定温度下冲击吸收能量≥47J；H10—可选附加代号，熔敷金属扩散氢≤10mL/100g。","pts":["E 表示焊条；55 表示熔敷金属抗拉强度最小值 550MPa。","15 表示药皮为碱性、适用于全位置焊接、直流反接；-N5 表示熔敷金属化学成分分类代号。","P 表示焊后状态（P=热处理态，无标记=焊态，AP=两种状态均可）；U 表示规定温度下冲击吸收能量≥47J；H10 表示扩散氢≤10mL/100g。"],"essay":true,"fig":["e5515","按 GB/T 5117 逐段读焊条型号：E / 55 / 15 / -N5 / P / U / H10。"],"basis":"CHAP2 §1 焊条型号图；期中试题 简答4(1)"},{"id":"w05","ch":"第二章","type":"简答","src":["真题"],"tag":"期中·简答 4(2)（15 分）","q":"分析焊条 J422 的冶金性能。","think":"先定位型号与渣系 → 脱氧、脱硫脱磷、合金过渡、气孔敏感性 → 工艺性与用途。","ans":"E4303（J422）为钛钙型酸性焊条，渣系 TiO2-CaO-SiO2，B1=0.76，气渣联合保护，抗拉强度≥430MPa，全位置焊接。\n冶金性能：① 氧化性较强，熔渣中 FeO 活度高，扩散脱氧弱；靠 Mn 先期+沉淀脱氧、Si 沉淀脱氧、C 脱氧，并有 Si/Mn 还原过渡。② 脱硫主要靠 Mn（[FeS]+[Mn]→[Fe]+(MnS)；[FeS]+(MnO)→[FeO]+(MnS)）；脱磷靠 P 氧化成 P2O5 后与 CaO 生成 3CaO·P2O5/4CaO·P2O5 入渣，能力有限。③ 合金化：锰铁主要脱氧脱硫，Mo、V、W 不易氧化、过渡好。④ 气孔敏感性：熔渣氧化性↑→CO 气孔↑；还原性↑→H2 气孔↑。\n性能：工艺性好，稳弧、飞溅小、脱渣易、成形美观，发尘量少；但焊缝 O、S、P 较高，塑韧性低于碱性焊条。用于一般低碳钢/低合金钢结构；重要结构应选 E5015 等碱性低氢焊条。","pts":["E4303（J422）为钛钙型酸性焊条，渣系 TiO2-CaO-SiO2，B1=0.76，气渣联合保护，抗拉强度≥430MPa，全位置焊接。","氧化性较强、FeO 活度高，扩散脱氧弱；靠 Mn 先期+沉淀脱氧、Si 沉淀脱氧、C 脱氧，并有 Si/Mn 还原过渡。","脱硫主要靠 Mn；脱磷靠 P 氧化成 P2O5 后与 CaO 生成磷酸钙入渣，能力有限。","合金化：锰铁主要脱氧脱硫，Mo、V、W 不易氧化、过渡好；熔渣氧化性↑→CO 气孔↑，还原性↑→H2 气孔↑。","工艺性好：稳弧、飞溅小、脱渣易、成形美观、发尘少；但焊缝 O、S、P 较高，塑韧性低于碱性焊条，用于一般结构。"],"essay":true,"fig":["acidbase","酸性 E4303（J422）与碱性 E5015（J507）的净化能力和工艺性对比。"],"basis":"CHAP2 §1 E4303；期中试题 简答4(2)"},{"id":"w06","ch":"第一章","type":"简答","src":["真题"],"tag":"期中·简答 5（15 分）","q":"请简述 Mn、Si、Nb、V、Mo 五种元素对焊缝性能的影响。","think":"每个元素写“主作用 + 副作用（注意点）”，最后一句总纲。","ans":"① Mn：脱氧、脱硫；使硫以 MnS 代替低熔点 FeS 薄膜，改善硫化物形态；固溶强化，提高强度。Mn/S 比需按含碳量控制，过量 Mn 会增加淬硬倾向。\n② Si：脱氧剂，固溶强化，δ 相形成元素，利于消除结晶裂纹；但 Si>0.4% 易形成低熔点硅酸盐夹杂，热裂倾向增大；Si 还降低氢在钢中的溶解度。\n③ Nb：强碳化物形成元素，形成比 Fe3C 更稳定的 NbC，细化晶粒、沉淀强化、提高强度；但增加再热裂纹敏感性。\n④ V：强碳化物形成元素，V(C,N) 细化晶粒、沉淀强化；V+N→VN 可消除氮的时效脆化；同样增加再热裂纹敏感性。\n⑤ Mo：碳化物形成元素，提高淬透性、热强性和抗回火软化能力；Mo、V、W 不易氧化、过渡系数高；但增加再热裂纹敏感性。\n总纲：微量合金化以细化晶粒+沉淀强化为主；Nb、V、Mo 会增加再热裂纹敏感性、应控制，Si 控≤0.4%，Mn/S 比按 C 匹配。","pts":["Mn：脱氧、脱硫，使硫以 MnS 代替低熔点 FeS 薄膜，改善硫化物形态，提高强度；Mn/S 比按 C 控制，过量增加淬硬倾向。","Si：脱氧、固溶强化、δ 相形成，利于抗热裂；但 Si>0.4% 易形成低熔点硅酸盐夹杂，热裂↑，并降低 H 溶解度。","Nb：强碳化物形成元素，NbC 比 Fe3C 稳定，细化晶粒、沉淀强化、提高强度；但增加再热裂纹敏感性。","V：强碳化物形成元素，V(C,N) 细化晶粒、沉淀强化；V+N→VN 消除氮时效脆化；增加再热裂纹敏感性。","Mo：碳化物形成元素，提高淬透性、热强性、抗回火软化；Mo/V/W 不易氧化、过渡系数高；增加再热裂纹敏感性。"],"essay":true,"fig":["alloy","五种元素的主作用与注意点：Mn/Si 偏净化与固溶，Nb/V/Mo 偏细化晶粒/沉淀强化，但都需防再热裂纹。"],"basis":"CHAP1 §3/§4、CHAP5 再热裂纹；期中试题 简答5"},{"id":"w12","ch":"第二章","type":"简答","src":["课后"],"tag":"练习题 1","q":"按功能划分，举例说明焊条药皮有哪些组成？","think":"按“七剂”逐条写作用 + 典型材料。","ans":"按功能分七类：① 稳弧剂——含低电离位元素，如 K2CO3、大理石、长石、金红石；② 造渣剂——钛铁矿、金红石、大理石、石英砂、长石、云母、萤石；③ 造气剂——木粉、淀粉、大理石、菱苦土；④ 脱氧剂——锰铁、钛铁、硅铁、铝粉；⑤ 合金剂——锰铁、硅铁、钼铁；⑥ 粘结剂——钠水玻璃、钾钠水玻璃；⑦ 增塑剂——白泥、云母、钛白粉、糊精。\n药皮作用：机械保护、冶金处理（脱氧、脱硫磷、去氢、合金化）、改善工艺性能。","pts":["稳弧剂：含低电离位元素，如 K2CO3、大理石、长石、金红石。","造渣剂：钛铁矿、金红石、大理石、石英砂、长石、云母、萤石。","造气剂：木粉、淀粉、大理石、菱苦土。","脱氧剂与合金剂：锰铁、钛铁、硅铁、铝粉；锰铁、硅铁、钼铁。","粘结剂与增塑剂：钠水玻璃、钾钠水玻璃；白泥、云母、钛白粉、糊精。","药皮作用：机械保护、冶金处理（脱氧、脱硫磷、去氢、合金化）、改善工艺性能。"],"essay":true,"fig":["coating","焊条药皮七类组分：稳弧、造渣、造气、脱氧、合金、粘结、增塑。"],"basis":"CHAP2 §1 药皮组成；练习题1"},{"id":"w13","ch":"第一章","type":"论述","src":["课后"],"tag":"练习题 3","q":"论述氧化性气体对金属的氧化作用。","think":"判据 → O₂、CO₂、H₂O 三条路径与反应式 → 后果 → 控制。","ans":"焊接区氧化性气体主要有 O2、CO2、H2O，以及活性熔渣。判断方向：{pO2}>pO2* 氧化，=平衡，<还原。\n① 自由氧：Fe+1/2O2→FeO；C+1/2O2→CO；Si、Mn 氧化生成 SiO2、MnO，可能夹渣。\n② CO2：CO2+[Fe]→CO+[FeO]，温度升高反应向右，氧化性增强；可用 Si、Mn 脱氧；CO 不溶于液态金属，可能形成 CO 气孔。\n③ H2O：H2O+[Fe]→H2+[FeO]，温度升高氧化性增强，同时增氢，兼有氢气孔/冷裂纹风险。\n后果：强度、塑韧性下降；CO 气孔、飞溅；有益合金元素烧损。控制：限制氧源（烘干、清理、保护），冶金脱氧（Mn、Si、Ti、Al），合适 I/U（U↑ 含氧↑，I↑ 含氧↓）。","pts":["氧化性气体主要有 O2、CO2、H2O 及活性熔渣；判据：{pO2}>pO2* 氧化，=平衡，<还原。","自由氧：Fe+1/2O2→FeO；C+1/2O2→CO；Si、Mn 氧化生成 SiO2、MnO，可能夹渣。","CO2：CO2+[Fe]→CO+[FeO]，T↑ 向右、氧化性↑；可用 Si、Mn 脱氧；CO 不溶于液态金属→CO 气孔。","H2O：H2O+[Fe]→H2+[FeO]，T↑ 氧化性↑，同时增氢；后果：强度塑韧性↓、CO 气孔/飞溅、合金烧损；控制：限制氧源、冶金脱氧、合适 I/U。"],"essay":true,"fig":["oxidation","氧化判据与 O2、CO2、H2O 三条氧化路径；H2O 同时增氢，CO2 可能带来 CO 气孔。"],"basis":"CHAP1 §2 氧的作用；练习题3"},{"id":"w14","ch":"第一章","type":"论述","src":["课后"],"tag":"练习题 4","q":"论述氢对焊接质量的影响及控制措施。","think":"来源 → 存在形式 → 四种危害 → 五条控制措施。","ans":"来源：药皮/焊剂/药芯水分、含氢有机物、空气水分、焊丝和工件表面油锈水。\n存在形式：扩散氢（原子/质子，可自由扩散）；残余氢（分子，聚集于晶格缺陷/裂纹/夹杂边缘，不能自由扩散）；总氢=扩散氢+残余氢，放置时间延长扩散氢减少、残余氢增多。\n危害：① 氢脆——室温附近塑性严重下降，加载快时不明显；② 白点/鱼眼——直径 0.5~3mm，中心有气孔/夹渣，外围塑性断裂痕迹，碳钢及 Cr/Ni/Mo 合金化焊缝敏感；③ 气孔——H2 表面喇叭口；④ 冷裂纹/延迟裂纹——三要素 H+M+R。\n控制：限制氢源（烘干：有机物≤200℃、碳酸盐≤450℃；清理油锈）；冶金（CaF2 与 H 生成 HF、控制氧化势、脱氢处理）；工艺参数；焊后脱氢 350℃×1h 或 250℃×6h；重要焊缝选奥氏体焊缝（D 最小）。","pts":["氢源：药皮/焊剂/药芯水分、含氢有机物、空气水分、焊丝和工件表面油锈水。","存在形式：扩散氢（原子/质子，可自由扩散）；残余氢（分子，聚集于缺陷，不能自由扩散）；总氢=扩散+残余。","危害：氢脆（室温塑性↓）；白点/鱼眼（0.5~3mm，中心气孔/夹渣）；H2 气孔；冷裂纹/延迟裂纹（H+M+R）。","控制：限制氢源（烘干：有机物≤200℃、碳酸盐≤450℃；清理油锈）；CaF2 与 H 生成 HF；控制氧化势、脱氢处理。","焊后脱氢 350℃×1h 或 250℃×6h；重要焊缝选奥氏体焊缝（D 最小）。"],"essay":true,"fig":["hydrogen","氢源→扩散氢→氢脆/白点、H2 气孔、冷裂纹（H+M+R）；下方为烘干、CaF2 去氢和焊后脱氢措施。"],"basis":"CHAP1 §2 氢；练习题4"},{"id":"w15","ch":"第一章","type":"简答","src":["课后"],"tag":"练习题 5","q":"焊缝金属合金化的目的是什么？","think":"三条目的 + 四种方式 + 过渡系数。","ans":"① 补偿合金元素在焊接过程中的烧损、蒸发和飞溅损失；② 消除焊接缺陷、改善组织和性能——脱氧、细化晶粒、提高强度塑韧性、抗裂性；③ 获得具有特殊性能的堆焊金属，如耐磨、耐蚀、耐热。\n方式：合金焊丝/带极、药芯焊丝/药芯焊条、合金药皮/焊剂、合金粉末。\n过渡系数 η=熔敷金属中某合金含量/焊接材料中该合金总量；元素越活泼、沸点越低，η 越小；合金含量↑、粒度↑、药皮氧化势↓、Kb↓、I↓、氩弧焊，η 增大。","pts":["补偿合金元素在焊接过程中的烧损、蒸发和飞溅损失。","消除焊接缺陷、改善组织和性能：脱氧、细化晶粒、提高强度塑韧性、抗裂性。","获得特殊性能堆焊金属（耐磨、耐蚀、耐热）；方式有合金焊丝/带极、药芯焊丝/药芯焊条、合金药皮/焊剂、合金粉末。"],"essay":true,"fig":["alloy_route","四条合金化路径：合金焊丝/带极、药芯焊丝/药芯焊条、合金药皮/焊剂、合金粉末。"],"basis":"CHAP1 §4 合金过渡；练习题5"},{"id":"w07","ch":"第二章","type":"简答","src":["课后"],"tag":"练习题 6 · 复习题 1","q":"焊条工艺性能包括哪几个方面？影响因素有哪些？","think":"八项性能逐条写“含义 + 影响因素”。","ans":"焊条工艺性能包括：① 电弧稳定性——不断弧、不飘移、抗磁偏吹；稳弧剂含 K/Na 低电离位元素，CaF2 电离势高会降低稳弧性。② 焊缝成形——表面光滑、波纹细密、几何尺寸和余高合格、无咬边；受熔渣凝固温度、粘度、表面张力影响（1500℃ 粘度 0.1~0.2Pa·s，表面张力 0.3~0.4N/m）。③ 全位置焊接性——立、仰、横焊时熔滴和熔渣不下流；短渣（凝固温度范围窄）有利，氧化铁型长渣不适应。④ 飞溅——粘度↑、电流↑、药皮水分↑、电压↑、交流、大颗粒过渡均增大飞溅。⑤ 脱渣性——熔渣与金属线膨胀系数差越大越好；氧化性太强难脱；渣松脆易脱；钛型最好、低氢最差。⑥ 熔化速度——用熔化系数 αp；考虑飞溅用熔敷系数 αH=αp(1-ψ)。⑦ 药皮发红——后半段药皮温升过高发红开裂脱落，与焊芯电阻、熔化系数、电阻热有关。⑧ 焊接烟尘——锰中毒、氟中毒；低氢焊条烟尘含氟10%以上。","pts":["电弧稳定性：不断弧、不飘移、抗磁偏吹；稳弧剂含 K/Na 低电离位元素，CaF2 电离势高会降低稳弧性。","焊缝成形与全位置焊接性：熔渣凝固温度、粘度、表面张力决定成形；短渣（凝固温度范围窄）适应立/仰/横焊，氧化铁型长渣不适应。","飞溅、脱渣性、熔化速度：粘度↑/电流↑/水分↑/电压↑/交流/大颗粒过渡使飞溅↑；线膨胀系数差大、渣松脆易脱渣；用 αp、αH=αp(1-ψ) 表征熔化/熔敷。","药皮发红与焊接烟尘：后半段药皮温升过高发红开裂；焊芯电阻大、熔化系数小、电阻热多；烟尘有锰中毒、氟中毒，低氢焊条烟尘含氟10%以上。"],"essay":true,"fig":["coating","药皮七类组分与焊条工艺性能的关系；稳弧、造渣、造气、脱氧、合金、粘结、增塑共同决定工艺与冶金性能。"],"basis":"CHAP2 §1 焊条工艺性能；复习题2-1 / 练习题6"},{"id":"w08","ch":"第一章","type":"简答","src":["课后"],"tag":"练习题 7 · 复习题 2","q":"简述焊缝金属的脱氧途径。","think":"按反应区由低到高：先期 → 沉淀 → 扩散，各写位置、脱氧剂与特点。","ans":"① 先期脱氧：药皮固态加热阶段，Al、Ti、Mn 等对氧亲和力大，先与药皮中高价氧化物/碳酸盐分解产物反应，如 Fe2O3+Mn→MnO+2FeO、2CaCO3+Ti→2CaO+TiO2+2CO；Al、Ti 大部分烧损，产物进入熔渣。\n② 沉淀脱氧：熔滴和熔池中，脱氧剂与 [FeO] 直接反应，产物上浮入渣：[Mn]+[FeO]→[Fe]+(MnO)；[Si]+2[FeO]→2[Fe]+(SiO2)；Mn-Si 联合时 (MnO)+(SiO2)→(MnO·SiO2)，密度小、熔点低，易上浮。\n③ 扩散脱氧：[FeO]→(FeO)，温度降低有利，主要在熔池后部；酸性渣中 SiO2、TiO2 与 FeO 生成复合物，降低 FeO 活度，有利于扩散脱氧；碱性渣 FeO 活度高，扩散脱氧较差。\n实际以先期+沉淀为主，扩散为辅。","pts":["先期脱氧：药皮固态加热阶段，Al、Ti、Mn 与高价氧化物/碳酸盐分解产物反应，Al、Ti 大部分烧损。","沉淀脱氧：熔滴和熔池中，[Mn]/[Si] 与 [FeO] 直接反应，生成 MnO、SiO2 或 MnO·SiO2 上浮入渣。","扩散脱氧：[FeO]→(FeO)，降温有利；酸性渣 SiO2/TiO2 降低 FeO 活度，有利于扩散脱氧；碱性渣 FeO 活度高，效果差。"],"essay":true,"fig":["deox","三条脱氧途径按反应区排列：药皮反应区先期→熔滴/熔池沉淀→熔池后部扩散。"],"basis":"CHAP1 §3 脱氧；复习题2-2 / 练习题7"},{"id":"w09","ch":"第三章","type":"简答","src":["课后"],"tag":"练习题 8 · 复习题 3","q":"说明焊接速度对结晶速度和结晶方向的影响。","think":"写出 vc=v·cosθ → 两个特殊位置 → 焊速增减对柱状晶方向与热裂的影响。","ans":"结晶线速度 vc=v cosθ，θ 为 vc 与焊接速度 v 的夹角。熔合线处 θ=90°，vc=0；熔池中心 θ=0°，vc=v 最大。\n焊接速度 v 增大→θ 增大→柱状晶成长方向趋向垂直于焊缝中心线，焊缝中心易产生热裂纹；v 减小→θ 减小→柱状晶偏向焊接方向，熔合线附近为胞状/胞状树枝晶，中心为较细的胞状树枝晶，抗裂性改善。\n实际焊接通过调节焊速控制柱状晶方向和组织。","pts":["结晶线速度 vc=v cosθ，θ 为 vc 与焊接速度 v 的夹角；熔合线 θ=90°，vc=0；熔池中心 θ=0°，vc=v 最大。","焊速 v 增大→θ 增大→柱状晶趋向垂直于焊缝中心线，焊缝中心易产生热裂纹。","v 减小→θ 减小→柱状晶偏向焊接方向，熔合线附近胞状/胞状树枝，中心为较细的胞状树枝晶，抗裂性改善。"],"essay":true,"fig":["vc","熔池俯视：熔合线 θ=90°、vc=0；中心 θ=0°、vc=v。焊速增大使柱状晶趋向垂直中心线。"],"basis":"CHAP3 §1 结晶线速度；复习题2-3 / 练习题8"},{"id":"w10","ch":"第三章","type":"简答","src":["课后"],"tag":"练习题 9 · 复习题 4","q":"焊接气孔的危害及防治措施。","think":"危害 → 三类气孔特征 → 机理 → 冶金与工艺防治。","ans":"危害：气孔减小承载截面积；成串/密集气孔比单个气孔危险；承载面积减小 10% 时疲劳强度可下降约 50%；气孔周围应力集中，降低塑韧性、致密性和耐蚀/密封性。\n类型：H2 气孔多在表面，断面喇叭口/螺钉状、内壁光滑；N2 气孔多在表面，蜂窝状成堆；CO 气孔在内部，条虫/蠕虫状，沿柱状晶分布。\n机理：液态金属过饱和气体→生核→长大→上浮；θ<90° 易浮出，θ>90° 且结晶速度大时残留；R 大、粘度大、气泡半径小都不利上浮。\n冶金防治：清理铁锈/油污/水分，焊条焊剂烘干；控制熔渣氧化性（氧化性大 CO↑，还原性大 H2↑）；CaF2、SiO2 降低氢气孔；脱氧脱氮。\n工艺防治：合适电流/电压/焊速；加强保护防 N2；直流反接优于正接/交流；短弧、摆动、焊前清理。","pts":["危害：减小承载截面积；成串/密集气孔更危险；承载面积减小10%时疲劳强度可下降约50%；降低塑韧性、致密性和耐蚀/密封性。","类型：H2 表面喇叭口/螺钉状、内壁光滑；N2 表面蜂窝状成堆；CO 内部条虫/蠕虫状、沿柱状晶分布。","机理：过饱和气体→生核→长大→上浮；θ<90°易浮出，θ>90°且结晶速度大时残留；R 大、粘度大、气泡半径小都不利上浮。","冶金防治：清理铁锈/油污/水分，焊条焊剂烘干；控制熔渣氧化性（氧化性大 CO↑，还原性大 H2↑）；CaF2、SiO2 降低氢气孔；脱氧脱氮。","工艺防治：合适电流/电压/焊速；加强保护防 N2；直流反接优于正接/交流；短弧、摆动、焊前清理。"],"essay":true,"fig":["pores","三类气孔形态：H2 表面喇叭口、N2 表面蜂窝状、CO 内部条虫状沿柱状晶。"],"basis":"CHAP3 §3 气孔；CHAP3 补充 焊接缺欠；复习题2-4 / 练习题9"},{"id":"w11","ch":"第四章","type":"论述","src":["课后"],"tag":"练习题 10 · 复习题 5","q":"论述易淬火钢热影响区的组织分布及对性能的影响。","think":"三个区逐个写温度范围、组织、性能 → 指出薄弱环节 → 对策。","ans":"易淬火钢如 45钢、30CrMnSi、18MnMoNb，淬硬倾向大；HAZ 分布取决于焊前热处理状态。\n① 完全淬火区（Ac3 以上）：A 晶粒粗大，焊后得粗大马氏体，硬度高、塑韧性低，冷裂敏感性最高（过热区）。\n② 不完全淬火区（Ac1~Ac3）：快速加热时 F 很少溶入 A，快冷时 F 保留并长大，最后得 M+F，组织不均匀。\n③ 回火区（Ac1 以下）：母材焊前调质态，受热发生不同程度回火软化，软化程度取决于焊前回火温度。\n性能：熔合区、过热区最薄弱；硬度升高、塑韧性下降；冷裂纹三要素 H+M+R。对策：预热、控制 t8/5、低氢焊材、后热/缓冷、焊后回火。","pts":["易淬火钢如 45钢、30CrMnSi、18MnMoNb，淬硬倾向大；HAZ 分布取决于焊前热处理状态。","完全淬火区（Ac3 以上）：A 晶粒粗大，焊后得粗大马氏体，硬度高、塑韧性低，冷裂敏感性最高。","不完全淬火区（Ac1~Ac3）：快速加热时 F 很少溶入 A，快冷时 F 保留并长大，最后得 M+F，组织不均匀。","回火区（Ac1 以下）：母材焊前调质态，受热发生不同程度回火软化，软化程度取决于焊前回火温度。","性能：熔合区、过热区最薄弱；硬度↑、塑韧性↓；冷裂纹三要素 H+M+R。对策：预热、控制 t8/5、低氢焊材、后热/缓冷、焊后回火。"],"essay":true,"fig":["haz_quench","易淬火钢 HAZ：完全淬火区（粗大 M）→不完全淬火区（M+F）→回火区（软化）→母材。"],"basis":"CHAP4 §3 易淬火钢 HAZ；复习题2-5 / 练习题10"},{"id":"k31","ch":"第三章","type":"思考题","src":["课件"],"tag":"CHAP3 思考题 1","q":"焊接熔池凝固与一般铸锭凝固有何不同的特点？","think":"对比着写：熔池五个特点，再补形核方式、散热条件与结晶方向。","ans":"① 过热度大：熔池液体温度远高于母材熔点，熔滴温度更高，合金元素烧损多。② 过冷度大：熔池体积小、周围被冷金属包围，散热条件好。③ 结晶速度大：熔池体积小（手工焊 0.6～16g）、存在时间短（几秒至几十秒）。④ 运动态结晶：熔池随热源移动，且有搅拌和对流，结晶区不断移动。⑤ 以非自发形核为主，晶粒沿最大温度梯度方向长成方向性明显的柱状晶，与结晶等温面正交。\n一般铸锭：整体加热、冷却慢、过冷度小、存在时间长，以体积结晶为主，有表层细晶区、柱状晶区和中心等晶区，组织比较粗大且分布规律不同。","pts":["过热度大、合金元素烧损大","过冷度大（散热条件好）","结晶速度大（体积小、存在时间短）","运动态结晶","非自发形核为主、柱状晶方向性强"],"essay":false,"fig":null,"basis":"CHAP3 §1 熔池凝固特点与结晶一般规律"},{"id":"k32","ch":"第三章","type":"思考题","src":["课件"],"tag":"CHAP3 思考题 2","q":"试述熔池的结晶线速度与焊接速度的关系。","think":"公式 → 熔合线与中心两个极端 → 焊速变化的影响。","ans":"熔池结晶线速度 vc = v·cosθ，θ 为结晶方向（等温面法线）与焊接速度方向的夹角。熔合线处 θ=90°，vc=0；熔池中心 θ=0°，vc=v，达到最大值。即柱状晶由熔合线向中心长大时，结晶速度由零逐渐增大到焊接速度。\n焊接速度越大，熔池拉长，柱状晶成长方向趋向垂直于焊缝中心线，中心最后凝固的杂质富集区易产生结晶裂纹；焊速小时柱状晶偏向焊接方向前进，抗裂性较好。","pts":["vc = v·cosθ","熔合线 vc=0，熔池中心 vc=v","焊速增大使柱状晶垂直中心线、热裂倾向增大"],"essay":false,"fig":["vc","熔池俯视：熔合线与熔池中心的结晶方向"],"basis":"CHAP3 §1 结晶线速度"},{"id":"k33","ch":"第三章","type":"思考题","src":["课件"],"tag":"CHAP3 思考题 3","q":"简述熔池的结晶形态，并分析结晶速度、温度梯度和浓度对结晶形态的影响。","think":"先列五种形态 → 说明成分过冷是判据 → 逐一写 R、G、C₀ 的影响。","ans":"结晶形态五种：① 平面结晶（无成分过冷）；② 胞状结晶（过冷度很小，断面呈六角形、蜂窝状）；③ 胞状树枝结晶（主干四周伸出短小二次横枝）；④ 树枝状结晶（主枝长、二次枝发达）；⑤ 等轴结晶（成分过冷区很宽，可自发生核、自由长大）。\n形态取决于成分过冷的大小，而成分过冷由 G/R 相对大小与溶质浓度 C₀ 决定：结晶速度 R 增大 → 成分过冷增大 → 由平面向等轴发展；温度梯度 G 增大 → 成分过冷减小 → 由等轴向平面发展；浓度 C₀ 增大 → 成分过冷增大 → 趋向等轴晶。\n焊接条件下：焊缝边界 G 大、R 小，为平面晶；焊缝中心 G 小、R 大，倾向等轴晶。","pts":["五种结晶形态及特征","R↑ → 等轴；G↑ → 平面；C₀↑ → 等轴","焊缝边界与中心的形态差异"],"essay":false,"fig":["solidification","成分过冷增大 → 结晶形态演变"],"basis":"CHAP3 §1 固溶体合金结晶形态（成分过冷）"},{"id":"k34","ch":"第三章","type":"思考题","src":["课件"],"tag":"CHAP3 思考题 4","q":"分析焊缝和熔合区的化学不均匀性，为什么会形成这种不均匀性？","think":"焊缝三种偏析 + 熔合区两类不均匀，原因落在“溶质再分配与结晶先后”上。","ans":"焊缝的化学不均匀性（偏析）：① 显微偏析——先结晶的固相较纯，后结晶的液相溶质浓度高，一个晶粒内枝晶干与枝晶间成分不同；② 区域偏析——柱状晶生长把低熔点杂质推向熔池中心，中心最后凝固区杂质富集；③ 层状偏析——结晶潜热与熔滴过渡热输入周期性变化，使凝固层成分呈深浅分层。\n熔合区的不均匀性：母材与焊缝成分不同，熔合区是半熔化区，存在未混合区与不完全混合区；合金元素在液相中的溶解度大于在固相中的溶解度，凝固时溶质被排出到液相，使界面附近浓度波动很大；此外还有物理不均匀性（空位过饱和、残余应力）。\n根本原因：溶质再分配（平衡分配系数 k<1）、结晶有先后且有方向性、熔池存在时间短来不及均匀化。","pts":["显微偏析、区域偏析、层状偏析及成因","熔合区化学不均匀：未混合区、界面溶质浓度波动","熔合区物理不均匀：空位、残余应力","原因：溶质再分配与结晶先后、时间短"],"essay":false,"fig":null,"basis":"CHAP3 §1 焊缝化学不均匀性与熔合区"},{"id":"k35","ch":"第三章","type":"思考题","src":["课件"],"tag":"CHAP3 思考题 5","q":"试述低合金钢焊缝固态相变的特点，根据组织特征如何获得有益组织和避免有害组织？","think":"特点（非平衡、四类转变）→ 有益/有害组织各列 → 从合金与工艺两方面给措施。","ans":"特点：焊缝冷却快、为非平衡转变，组织随成分与 t8/5 变化；可能发生铁素体、珠光体、贝氏体、马氏体四类转变，以铁素体为主；晶粒有方向性（柱状晶），并可能存在 M-A 组元等非平衡组织。\n有益组织：针状铁素体 AF（晶内细小交错、以质点为核心放射状）、细晶铁素体、下贝氏体、低碳板条马氏体——细小、位错型、强韧配合好。有害组织：粗大的先共析铁素体与侧板条铁素体、魏氏组织、上贝氏体（条间渗碳体）、M-A 组元、高碳片状马氏体。\n获得有益组织：① 成分——降低 C，适量 Mn，加入微量 Ti、B、Nb、V、Mo、RE 细化晶粒，促进针状铁素体形核；② 工艺——控制线能量与冷却速度（合适的 t8/5），采用多层多道焊利用后层对前层的回火作用，必要时焊后热处理细化晶粒。","pts":["特点：非平衡转变、四类组织、以铁素体为主","有益：AF、FGF、下贝氏体、板条 M","有害：粗大 PF/FSP、魏氏组织、上贝氏体、M-A、片状 M","措施：控 C 与微合金化；控线能量、t8/5；多层焊与焊后热处理"],"essay":false,"fig":null,"basis":"CHAP3 §2 焊缝固态相变；§4 焊缝性能的控制"},{"id":"k36","ch":"第三章","type":"思考题","src":["课件"],"tag":"CHAP3 思考题 6","q":"分析粒状贝氏体 Bg 和 M-A 组元的形成原因及其对焊缝性能的影响。","think":"形成条件（中等冷速）→ 形成过程（块状铁素体 + 富碳奥氏体岛）→ 两种形态 → 脆化原因。","ans":"形成原因：在中等冷却速度下，先析出块状（或条状）铁素体，碳被排入尚未转变的奥氏体中，形成富碳的岛状奥氏体；这些奥氏体岛在继续冷却时转变为高碳马氏体 + 残余奥氏体，即 M-A 组元。M-A 呈粒状分布在块状铁素体基体上称粒状贝氏体 Bg，呈条状分布称条状贝氏体。上贝氏体形成温度区间（中温转变）最易出现。\n对性能的影响：M-A 组元是硬脆相，与周围铁素体硬度差大，受载时在界面产生应力集中，成为裂纹形核位置；同时它是氢的陷阱，易聚集氢；使焊缝韧性特别是低温冲击韧性显著下降，脆性转变温度升高，并增加冷裂敏感性。","pts":["中等冷速下块状铁素体 + 富碳奥氏体岛","奥氏体岛 → 高碳马氏体 + 残余奥氏体（M-A）","粒状分布为 Bg，条状分布为条状贝氏体","影响：硬脆相、应力集中、聚氢 → 韧性下降、冷裂敏感性增大"],"essay":false,"fig":null,"basis":"CHAP3 §2 贝氏体转变与 M-A 组元；第四章 M-A 组元脆化"},{"id":"k37","ch":"第三章","type":"思考题","src":["课件"],"tag":"CHAP3 思考题 7","q":"试述氢气和 CO 气孔的形成原因、特征及如何防止。","think":"两种气孔各写“原因—特征”，再合并写防止措施。","ans":"氢气孔：熔池在高温下吸收大量氢，冷却凝固时氢在固态金属中的溶解度骤降，呈过饱和状态，来不及逸出而形成气孔。特征：多出现在焊缝表面，断面呈螺钉状或喇叭口形，内壁光滑。\nCO 气孔：熔池中的碳与氧或 FeO 反应生成 CO（[C]+[O]→CO），CO 不溶于液态金属；结晶后期熔池粘度增大、CO 难以逸出而残留。特征：多在焊缝内部，呈条虫状，沿柱状晶方向分布。\n防止：① 清理焊丝与坡口的油、锈、水分，烘干焊条、焊剂；② 控制熔渣氧化性——氧化性过强 CO 气孔增多，还原性过强氢气孔增多；③ 药皮和焊剂中加入 CaF₂、SiO₂ 降低氢气孔倾向；④ 加强保护，采用合适的电流、电压与焊速，短弧操作，直流反接。","pts":["氢气孔原因：溶解度骤降、来不及逸出","氢气孔特征：表面、螺钉状/喇叭口、内壁光滑","CO 气孔原因：C-O 反应生成不溶的 CO","CO 气孔特征：内部、条虫状、沿柱状晶","防止：清理烘干、控氧化性、加 CaF₂、工艺与保护"],"essay":false,"fig":["pores","三类气孔的形态与位置"],"basis":"CHAP3 §3 焊缝中的气孔"},{"id":"k38","ch":"第三章","type":"思考题","src":["课件"],"tag":"CHAP3 思考题 8","q":"分析夹杂物对焊缝金属性能的影响。","think":"先分类 → 各自的危害 → 共性影响 → 防止。","ans":"夹杂物分三类：① 氧化物（SiO₂、MnO、TiO₂、Al₂O₃）——密集块状或片状分布时降低塑韧性，引起热裂纹和层状撕裂；② 氮化物（Fe₄N）——脆硬相，使硬度升高、韧性下降，并产生时效脆化，可引起热裂和冷裂；③ 硫化物（FeS 为主）——沿晶界析出，形成 Fe+FeS（985℃）、FeO+FeS（940℃）低熔点共晶，是热裂纹的主要原因。\n共同影响：夹杂物破坏金属的连续性，造成应力集中，降低强度、塑性、韧性和疲劳性能；成为氢的聚集处，增加冷裂纹敏感性；沿层分布的夹杂是层状撕裂的起因。\n防止：控制焊缝含氧量、充分脱氧；调整熔渣性能使其易于上浮；多层焊清渣；焊条适当摆动；加强保护防止氮侵入。","pts":["氧化物：块状/片状 → 热裂、层状撕裂","氮化物 Fe₄N：脆硬、时效脆化","硫化物 FeS：低熔点共晶 → 热裂","共性：应力集中、聚氢、降低韧性","防止：脱氧、渣性能、清渣、保护"],"essay":false,"fig":null,"basis":"CHAP3 §3 焊缝中的夹杂物"},{"id":"w16","ch":"第四章","type":"思考题","src":["课件"],"tag":"CHAP4 思考题 1","q":"焊接热循环对被焊金属近缝区的组织、性能有何影响？","think":"按四个参数分别写对组织的影响，再落到性能与薄弱区。","ans":"热循环四参数：加热速度 ωH、最高温度 Tm、相变温度以上停留时间 tH、冷却速度 ωc（常用 t8/5）。\n① ωH 大→扩散相变滞后，Ac1、Ac3 及 Ac3-Ac1 升高，A 均质化不完全；② Tm 高→近缝区晶粒长大，过热区粗晶；③ tH 长→有利于 A 均质化，但温度过高、时间过长会晶粒严重长大；④ ωc 大→易得 M/B 硬组织，冷裂敏感性↑；ωc 小→晶粒粗大、软化。\n结果：HAZ 形成熔合区、过热区、正火区、不完全重结晶区的组织梯度；熔合区、过热区最薄弱；需控制线能量、预热、后热。","pts":["热循环四参数：加热速度 ωH、最高温度 Tm、相变温度以上停留时间 tH、冷却速度 ωc（常用 t8/5）。","ωH 大→扩散相变滞后，Ac1、Ac3 及 Ac3-Ac1 升高，A 均质化不完全。","Tm 高→近缝区晶粒长大，过热区粗晶；tH 长→有利 A 均质化，但温度过高、时间过长会晶粒严重长大。","ωc 大→易得 M/B 硬组织，冷裂敏感性↑；ωc 小→晶粒粗大、软化。","结果：HAZ 形成熔合区、过热区、正火区、不完全重结晶区的组织梯度；熔合区、过热区最薄弱；需控制线能量、预热、后热。"],"essay":true,"fig":["thermal","焊接热循环四参数 ωH、Tm、tH、ωc；它们共同决定 HAZ 的晶粒尺寸、相变充分程度和冷却后组织。"],"basis":"CHAP4 §1/§3、思考题1"},{"id":"w17","ch":"第四章","type":"思考题","src":["课件"],"tag":"CHAP4 思考题 2","q":"低合金钢焊接时，HAZ 粗晶区奥氏体的均质化程度对冷却时相变有何影响？","think":"均质化好/差两种情况 → 联系 45 钢与 40Cr 的 CCT 移动。","ans":"低合金钢 HAZ 粗晶区加热温度高、奥氏体晶粒粗大；均质化程度取决于加热速度、峰值温度、高温停留时间及碳化物溶解。\n① 均质化程度高：A 中 C 和合金元素分布均匀，A 稳定性高、淬透性大，CCT 右移，冷却时易形成 M/B，硬度高、冷裂敏感性大。\n② 均质化不完全：存在富碳/贫碳区，局部 Ms 不同，相变温度范围宽，组织不均匀，可能出现块状 F、M-A 组元。\n③ 焊接快速加热：Cr、W、Mo、V 等碳化物形成元素未充分溶解，A 稳定性降低（40Cr CCT 左移、淬硬倾向↓）；45钢无碳化物溶解且晶粒粗化，CCT 右移、淬硬倾向↑。\n结果：同一粗晶区因均质化差异可得到不同 M/B/F 比例，性能不均。","pts":["粗晶区加热温度高、A 晶粒粗大；均质化程度取决于加热速度、峰值温度、高温停留时间及碳化物溶解。","均质化程度高→A 中 C/合金元素分布均匀，A 稳定性高、淬透性大，CCT 右移，易形成 M/B。","均质化不完全→富碳/贫碳区，局部 Ms 不同，相变温度范围宽，组织不均匀，可能出现块状 F、M-A 组元；Cr/W/Mo/V 未充分溶解时 A 稳定性降低，40Cr CCT 左移，45钢 CCT 右移。"],"essay":true,"fig":["haz_low","HAZ 由熔合线向外温度递减；粗晶区靠近熔合线，峰值温度最高、晶粒最粗。"],"basis":"CHAP4 §2、思考题2"},{"id":"w18","ch":"第四章","type":"思考题","src":["课件"],"tag":"CHAP4 思考题 3","q":"探讨低合金钢焊接 HAZ 受应力应变时对相变的影响。","think":"分“应力”与“应变”两方面，再落到与裂纹的关系。","ans":"焊接 HAZ 在加热/冷却过程中受周围金属约束，产生热应力、组织应力和拘束应力，并伴随塑性应变。\n① 应力：拉应力促进马氏体相变、使 Ms 升高，压应力抑制相变；三向拉应力促进裂纹形核扩展。\n② 应变：塑性变形增加位错和空位密度，为相变提供形核位置、加速扩散，使相变温度区间变化；大应变还可诱发动态再结晶/软化。\n③ 焊接条件下应力应变与相变耦合：相变伴随体积膨胀可松弛部分热应力；但粗晶区+M+H+R 叠加时冷裂敏感性增大。\n结论：HAZ 组织转变不是单纯温度过程，应力应变会改变相变动力学、组织形态和裂纹倾向。","pts":["HAZ 受周围金属约束，产生热应力、组织应力、拘束应力，并伴随塑性应变。","拉应力促进马氏体相变、使 Ms 升高，压应力抑制相变；三向拉应力促进裂纹形核扩展。","塑性变形增加位错/空位密度，为相变提供形核位置、加速扩散，改变相变温度区间；相变体积膨胀可松弛部分热应力，但粗晶区+M+H+R 叠加时冷裂敏感性增大。"],"essay":true,"fig":["haz_quench","易淬火钢 HAZ 的完全淬火区、不完全淬火区和回火区；应力应变会改变这些区的相变动力学和裂纹倾向。"],"basis":"CHAP4 §2 应力应变、思考题3"},{"id":"w19","ch":"第四章","type":"思考题","src":["课件"],"tag":"CHAP4 思考题 4","q":"焊接条件下组织转变与热处理条件下组织转变有何不同？","think":"从加热速度、温度、停留时间、冷却、应力五个维度对比。","ans":"① 加热速度快（几十~几百倍）：扩散相变滞后，Ac1、Ac3 及 Ac3-Ac1 升高，A 均质化不完全；热处理加热慢，相变接近平衡。\n② 加热温度高（高 100~200℃）：近缝区晶粒粗大；热处理温度较低、晶粒控制好。\n③ 高温停留短（手弧 4~20s、埋弧 30~100s）：扩散、碳化物溶解、A 均质化不充分；热处理保温时间长，组织均匀。\n④ 冷却快、非平衡：易得 M/B 等淬硬组织；热处理可控制冷却得 F+P/贝氏体等平衡/近平衡组织。\n⑤ 局部加热+复杂应力：组织转变在应力应变下进行，HAZ 组织梯度大；热处理整体加热，组织均匀、应力小。\n典型：45钢焊接 CCT 右移、淬硬↑；40Cr 焊接 CCT 左移、淬硬↓。","pts":["加热速度快（几十~几百倍）：扩散相变滞后，Ac1、Ac3 及 Ac3-Ac1 升高，A 均质化不完全；热处理加热慢，接近平衡。","加热温度高（高100~200℃）：近缝区晶粒粗大；热处理温度较低、晶粒控制好。","高温停留短（手弧4~20s、埋弧30~100s）：扩散、碳化物溶解、A 均质化不充分；热处理保温时间长、组织均匀。","冷却快、非平衡：易得 M/B 淬硬组织；局部加热+复杂应力使 HAZ 组织梯度大；45钢 CCT 右移、40Cr CCT 左移。"],"essay":true,"fig":["cct","焊接 CCT 与热处理 CCT 的差异：焊接加热快、停留短、冷却非平衡，CCT 曲线和淬硬倾向随钢种不同而偏移。"],"basis":"CHAP4 §2 组织转变特点、思考题4"},{"id":"k61","ch":"第六章","type":"思考题","src":["课件"],"tag":"CH6 复习题 1","q":"铝合金软钎焊接头的电化学腐蚀及其解决措施。","think":"原因（钎料与母材电位差）→ 后果 → 四条措施。","ans":"原因：铝合金软钎焊多用 Sn-Pb、Sn-Zn 等钎料，钎料的电极电位比铝母材__正__。接头处在腐蚀介质（潮湿、盐雾）中构成腐蚀电池：铝母材为__阳极__被溶解腐蚀，钎料为阴极；钎缝面积小、母材面积大，腐蚀电流集中在界面附近的母材上，接头沿钎缝界面很快破坏。此外残留的腐蚀性钎剂会加速腐蚀。\n解决措施：① 选用电极电位接近母材的钎料（如 Sn-Zn、Zn-Al 系）；② 钎焊后彻底清洗，去除钎剂残渣；③ 接头涂覆耐蚀涂层或密封，隔绝腐蚀介质；④ 在铝表面预镀 Ni、Cu 等金属作隔离层，或采用真空/无钎剂钎焊。","pts":["钎料电位比铝正 → 铝为阳极被腐蚀","界面小阳极大阴极，腐蚀集中在钎缝附近","残存钎剂加速腐蚀","措施：选近电位钎料、清洗、涂层、预镀层/无钎剂钎焊"],"essay":false,"fig":null,"basis":"第六章 §4 钎焊缺陷；课件该页为图示，解析按电化学腐蚀原理整理","note":"课件该页以图示呈现，文字解析按电化学腐蚀原理整理。"},{"id":"k62","ch":"第六章","type":"思考题","src":["课件"],"tag":"CH6 复习题 2","q":"采用不等间隙改善钎焊不致密缺陷的原理。","think":"毛细驱动力与间隙的关系 → 钎料流向 → 气体和残渣的排出。","ans":"钎料靠毛细作用填缝，间隙越小毛细驱动力越大。把接头设计成不等间隙（一端窄、一端宽）后，窄端的毛细作用强，液态钎料从窄端先流入并沿间隙向前推进，把气体和钎剂残渣__赶向宽端__，最后从宽端排出。\n若采用等间隙，钎料会从两端同时向中间流，在中间汇合处把气体和残渣围困，形成气孔、夹渣和未填满等不致密缺陷。因此不等间隙能有效提高钎缝的致密性。","pts":["毛细驱动力随间隙减小而增大","窄端先流入，向宽端单向推进","气体与残渣被赶向宽端排出","等间隙时两端汇合把气体围困"],"essay":false,"fig":null,"basis":"第六章 §1 毛细流动与接头间隙；§4 钎缝不致密"},{"id":"k63","ch":"第六章","type":"思考题","src":["课件"],"tag":"CH6 复习题 3","q":"控制溶蚀的措施。","think":"溶蚀 = 母材过度溶入钎料 → 从温度、时间、钎料量与成分、间隙四方面控制。","ans":"溶蚀是母材向液态钎料中过度溶解，在钎料放置处表面形成溶坑。控制措施：① 降低钎焊温度、缩短保温时间，只要把结合面加热到钎料液相线以上即可；② 控制钎料用量，合理放置钎料，避免在薄壁或关键表面局部堆积；③ 选用与母材互溶作用小的钎料，避免含易向母材扩散组元过多的钎料；④ 控制接头间隙与装配质量，避免局部间隙过大导致钎料聚集；⑤ 对易溶蚀的薄壁件可先镀覆隔离层。","pts":["降低钎焊温度、缩短保温时间","控制钎料用量与放置位置","选与母材互溶小的钎料","控制间隙，必要时镀隔离层"],"essay":false,"fig":null,"basis":"第六章 §4 溶蚀"}];

const FRAMEWORK_HTML = "<div class=\"fwgrid\">\n  <div class=\"fwcard c0\">\n    <div class=\"fw-hd\"><b>绪论 焊接概述</b><span>核心：焊接的实质、能源与热过程</span></div>\n    <div class=\"fw-bd\">\n      <div class=\"fw-sec\"><span class=\"fw-lb\">焊接定义与措施</span><ul>\n        <li>定义：加热或加压（或并用）、用或不用填充材料、原子间结合、永久性连接</li>\n        <li>加压措施：破坏表面氧化膜 + 增加有效接触面积；加热措施：去氧化膜、降变形阻力、增原子振动能、促扩散/再结晶/化学反应/结晶</li>\n        <li>按过程特点分：冷压焊、电阻焊、熔化焊</li>\n      </ul></div>\n      <div class=\"fw-sec\"><span class=\"fw-lb\">能源与热过程</span><ul>\n        <li>能源9种：电弧热、化学热、电阻热、高频感应热、摩擦热、等离子焰、电子束、激光束（+其他）</li>\n        <li>热过程两特征：局部性 + 瞬时性；加热区：活性斑点区 dA + 加热斑点区 dH</li>\n        <li>接头形成：加热→熔化→冶金反应→凝固→固态相变</li>\n      </ul></div>\n      <div class=\"fw-sec\"><span class=\"fw-lb\">温度场</span><ul>\n        <li>定义：焊件上某瞬时温度分布；分稳定 / 非稳定 / 准稳定</li>\n        <li>准稳定：对移动热源，静态坐标系非稳定、移动坐标系稳定</li>\n        <li>影响因素：热源性质、线能量、金属性质（λ、c、a）、板厚形状</li>\n      </ul></div>\n    </div>\n  </div>\n  <div class=\"fwcard c1\">\n    <div class=\"fw-hd\"><b>第一章 焊接化学冶金</b><span>核心：高温下气体·液态金属·熔渣的相互作用</span></div>\n    <div class=\"fw-bd\">\n      <div class=\"fw-sec\"><span class=\"fw-lb\">§1 冶金过程特点</span><ul>\n        <li>热源三来源：电阻热·电弧热·化学反应热（占1%~3%可忽略）</li>\n        <li>熔滴过渡：短路（细丝CO₂焊）/颗粒·喷射/附壁/渣保护；碱性=短路+大颗粒，酸性=细颗粒+附壁</li>\n        <li>保护五种：渣·气·气渣联合·真空·自保护</li>\n        <li>反应区三段：药皮→熔滴（0.01~0.1s）→熔池（SMAW 3~8s）；熔合比θ</li>\n      </ul></div>\n      <div class=\"fw-sec\"><span class=\"fw-lb\">§2 气相对金属的作用</span><ul>\n        <li>氮：源空气；Fe₄N脆化，Ti/V→TiN/VN除时效脆化；15MnVN增强</li>\n        <li>氢：氢脆、白点（鱼眼0.5~3mm）、冷裂纹（H·M·R）；烘干+氟化物防氢</li>\n        <li>氧：CO气孔·飞溅·烧损有益元素；控氧：限制来源+工艺+冶金</li>\n      </ul></div>\n      <div class=\"fw-sec\"><span class=\"fw-lb\">§3 熔渣 · §4 合金过渡</span><ul>\n        <li>碱度B&gt;1(1.3)碱 / B=1中 / B&lt;1酸；CaF₂降粘度降表面张力</li>\n        <li>氧化：扩散氧化·置换氧化；脱氧：先期·沉淀·扩散</li>\n        <li>硫（Fe+FeS 985℃热裂）磷（Fe+Fe₃P 1050℃冷脆）控制</li>\n        <li>过渡系数η：活泼元素↓、Kb↑↓、I↑↓、氩弧焊↑；对氧亲和力Cu→Al递增</li>\n      </ul></div>\n    </div>\n  </div>\n  <div class=\"fwcard c2\">\n    <div class=\"fw-hd\"><b>第二章 焊接材料</b><span>核心：焊条、焊剂、焊丝的选型与冶金性能</span></div>\n    <div class=\"fw-bd\">\n      <div class=\"fw-sec\"><span class=\"fw-lb\">§1 焊条</span><ul>\n        <li>组成：焊芯（导电+填充，多用H08A）+药皮（七剂：稳弧/造渣/造气/脱氧/合金/粘结/增塑）</li>\n        <li>E4303（J422）钛钙型·酸性·气渣联合；E5015（J507）低氢型·碱性·塑韧好</li>\n        <li>J507稳弧差因CaF₂氟电离势高（18.6V）夺电子；短渣才能立仰横焊</li>\n        <li>飞溅↑：粘度↑·I↑·水分↑·U↑·交流&gt;直流；钛型脱渣最好、低氢最差</li>\n      </ul></div>\n      <div class=\"fw-sec\"><span class=\"fw-lb\">§2 焊剂</span><ul>\n        <li>焊剂=焊条药皮、焊丝=焊条焊芯；作用：隔离空气+冶金处理</li>\n        <li>制造：熔炼 / 粘结（陶质，&lt;400℃）/ 烧结（400~1000℃）</li>\n        <li>质量：H₂O≤0.10%、夹杂≤0.30%、S≤0.060%、P≤0.080%；高硅焊剂SiO₂&gt;30%</li>\n      </ul></div>\n      <div class=\"fw-sec\"><span class=\"fw-lb\">§3 焊丝</span><ul>\n        <li>分类：按焊接方法 / 形状结构（实心·药芯·活性）/ 适用金属材料</li>\n      </ul></div>\n    </div>\n  </div>\n  <div class=\"fwcard c3\">\n    <div class=\"fw-hd\"><b>第三章 熔池凝固与焊缝固态相变</b><span>核心：结晶、组织转变、气孔夹杂与焊接缺欠</span></div>\n    <div class=\"fw-bd\">\n      <div class=\"fw-sec\"><span class=\"fw-lb\">§1 熔池凝固</span><ul>\n        <li>特点：过热度大·过冷度大·烧损大·速度快·运动结晶；以非自发形核为主</li>\n        <li>结晶五形态（成分过冷↑）：平面→胞状→胞状树枝→树枝→等轴</li>\n        <li>偏析三种：显微（枝晶间）·区域（推向中心）·层状（潜热周期）；熔合区=薄弱环节</li>\n      </ul></div>\n      <div class=\"fw-sec\"><span class=\"fw-lb\">§2 焊缝固态相变</span><ul>\n        <li>低碳钢：F+少量P；铁素体四类：PF（晶界）/FSP（侧板条）/AF（针状500℃）/FGF</li>\n        <li>上贝氏体羽毛状、下贝氏体针状强韧、M-A组元→粒状/条状贝氏体</li>\n        <li>板条M=位错M（韧性好）；片状M=孪晶M（C≥0.4%）</li>\n      </ul></div>\n      <div class=\"fw-sec\"><span class=\"fw-lb\">§3 气孔夹杂 · §5 焊接缺欠</span><ul>\n        <li>气孔：H₂表面喇叭口·N₂表面蜂窝·CO内部条虫沿柱状晶</li>\n        <li>夹杂：氧化物（层状撕裂）·氮化物Fe₄N·硫化物FeS（热裂）</li>\n        <li>缺欠六类（GB/T 6417.1-2005）：裂纹·孔穴·固体夹杂·未熔合未焊透·形状尺寸不良·其他；裂纹最危险</li>\n      </ul></div>\n    </div>\n  </div>\n  <div class=\"fwcard c4\">\n    <div class=\"fw-hd\"><b>第四章 焊接热影响区</b><span>核心：热循环、组织转变、HAZ分区与性能</span></div>\n    <div class=\"fw-bd\">\n      <div class=\"fw-sec\"><span class=\"fw-lb\">§1 焊接热循环</span><ul>\n        <li>四参数：加热速度·最高温度·相变以上停留时间·冷却速度（t8/5等）</li>\n        <li>特点：温度高100~200℃、速度快几十至几百倍、手工停留4~20s/埋弧30~100s</li>\n      </ul></div>\n      <div class=\"fw-sec\"><span class=\"fw-lb\">§2 组织转变特点</span><ul>\n        <li>45钢CCT右移（淬硬↑：无碳化物溶解+组织粗化）；40Cr左移（淬硬↓：Cr未充分溶入A）</li>\n        <li>合金元素按碳亲和力：强碳化物Ti/V/Nb、弱碳化物Mn、非碳化物Ni/Co/Cu/Si/Al等</li>\n      </ul></div>\n      <div class=\"fw-sec\"><span class=\"fw-lb\">§3 HAZ组织与性能</span><ul>\n        <li>不易淬火钢分区：熔合区·过热区（韧性低）·重结晶区（细）·不完全重结晶区（不均）</li>\n        <li>碳当量：CE(IIW) 400~700MPa / Ceq(WES) 500~1000 / Pcm C≤0.17%</li>\n        <li>脆化六类：粗晶·组织（M-A）·析出·热应变时效（200~400℃）·氢·石墨</li>\n        <li>韧化：母材组织+焊后热处理+控制线能量；调质钢回火温度越低软化越严重</li>\n      </ul></div>\n    </div>\n  </div>\n  <div class=\"fwcard c5\">\n    <div class=\"fw-hd\"><b>第五章 焊接裂纹</b><span>核心：裂纹分类、机理、判据与防治</span></div>\n    <div class=\"fw-bd\">\n      <div class=\"fw-sec\"><span class=\"fw-lb\">热裂纹</span><ul>\n        <li>按本质分：结晶裂纹（液态薄膜+拉应力；脆性温度区；CST↑敏感↓；S、P&lt;0.03~0.04%）、高温液化裂纹（近缝区/层间，&lt;0.5mm）、多边化裂纹（纯金属/单相奥氏体）</li>\n        <li>抗裂：Ti/Zr/RE高熔点硫化物（TiS 2000~2100℃、ZrS 2100℃、CeS 2450℃）、γ+δ双相</li>\n      </ul></div>\n      <div class=\"fw-sec\"><span class=\"fw-lb\">冷裂纹</span><ul>\n        <li>温度约100℃~-75℃、HAZ为主、断口发亮；延迟裂纹最普遍（焊趾/焊道下/根部）</li>\n        <li>三因素：淬硬倾向+含氢量及分布+拘束应力；致裂=冷至100℃残余扩散氢</li>\n        <li>判据：拘束度R/Rcr；试验：TRC/RRC/插销；防治：低氢材料、烘干、预热、后热350℃×1~2h</li>\n      </ul></div>\n      <div class=\"fw-sec\"><span class=\"fw-lb\">再热 · 层状撕裂 · SCC · 断口</span><ul>\n        <li>再热裂纹：HAZ粗晶沿晶；500~700℃敏感；二次沉淀+晶界杂质弱化；预热200~450℃</li>\n        <li>层状撕裂：平台+剪切壁；与夹杂有关；ψZ≥15%；条状硫化物/硅酸盐敏感</li>\n        <li>SCC：介质+拉应力；奥氏体不锈钢多APC、高强钢多HEC；焊后消除应力可降低敏感性</li>\n        <li>断口：韧窝DR / 解理CF（河流） / 准解理QC / 沿晶IG（冰糖状）</li>\n      </ul></div>\n    </div>\n  </div>\n  <div class=\"fwcard c6\">\n    <div class=\"fw-hd\"><b>第六章 钎焊</b><span>核心：润湿铺展、分类体系与缺陷</span></div>\n    <div class=\"fw-bd\">\n      <div class=\"fw-sec\"><span class=\"fw-lb\">定义与过程</span><ul>\n        <li>定义：低于母材熔点、高于钎料熔点加热；液态钎料润湿/铺展/毛细流动填缝、凝固结晶、原子间结合</li>\n        <li>过程：钎剂去氧化膜→钎料熔化排钎剂残渣→钎料与母材溶解扩散反应</li>\n        <li>优点：温度低影响小、变形小精度高、生产率高、异种金属及金属非金属连接</li>\n      </ul></div>\n      <div class=\"fw-sec\"><span class=\"fw-lb\">润湿与毛细</span><ul>\n        <li>润湿：固液界面取代固气界面自由能降低；θ=90°分界（&lt;90润湿、&gt;90不润湿、≈0漫流）；大多10~45°</li>\n        <li>毛细流动受：毛细管驱动力、金属密度、黏度、接头几何形状影响</li>\n        <li>接头间隙小→强度高（可超母材）；间隙增大→接近钎料自身强度</li>\n      </ul></div>\n      <div class=\"fw-sec\"><span class=\"fw-lb\">分类与缺陷</span><ul>\n        <li>按温度：软钎焊&lt;450℃ / 硬钎焊&gt;450℃ / 高温钎料&gt;950℃</li>\n        <li>按热源：火焰/炉中/感应/电阻/浸渍/气相/烙铁/超声波；按去膜：钎剂/无钎剂/自钎剂/气体保护/真空</li>\n        <li>缺陷：不致密性（气孔夹渣未填满）、母材自裂（液态钎料渗入微裂纹）、溶蚀（表面溶坑）</li>\n      </ul></div>\n    </div>\n  </div>\n  <div class=\"fwcard c7\">\n    <div class=\"fw-hd\"><b>增材制造技术</b><span>核心：逐层累加、光固化、SLM</span></div>\n    <div class=\"fw-bd\">\n      <div class=\"fw-sec\"><span class=\"fw-lb\">概念与体系</span><ul>\n        <li>定义：三维CAD→分层切片→离散材料逐层累加；与减材、等材并列</li>\n        <li>两阶段：数据处理（切片）→叠层制作（二维薄层叠成三维实体）</li>\n        <li>特点：复杂结构、个性化定制、高附加值；局限：成熟度/材料/尺寸/成本</li>\n      </ul></div>\n      <div class=\"fw-sec\"><span class=\"fw-lb\">光固化 SLA</span><ul>\n        <li>原理：紫外光→光敏树脂聚合固化；静态光斑固化形貌为旋转抛物面</li>\n        <li>扫描：X-Y平面（成本低、大幅面、慢）/振镜（快、贵、范围小），常用振镜</li>\n        <li>流程：前处理→分层叠加→后处理（排残树脂/清洗/后固化/去支撑/打磨0.05~0.1mm）</li>\n      </ul></div>\n      <div class=\"fw-sec\"><span class=\"fw-lb\">激光选区熔化 SLM</span><ul>\n        <li>原理：高能激光完全熔化金属粉→快冷→高致密高精度零件</li>\n        <li>粉末：振实密度、球形度↑孔隙率↓、二组分体系级配、氧≤1000ppm、短波长吸收率高</li>\n        <li>流程：材料/工作腔/模型准备→加工→后处理；优点细晶高致密，缺点球化/翘曲/裂纹、尺寸受限、参数复杂</li>\n      </ul></div>\n    </div>\n  </div>\n</div>";

<g>
<rect x="20" y="72" width="212" height="228" rx="12" fill="#fdf1e3" stroke="#e8a35c"/>
<text x="36" y="102" class="lbl2 org">① 先期脱氧</text>
<text x="36" y="126" class="tiny">药皮固态加热阶段</text>
<text x="36" y="154" font-size="13" fill="#3f586a">Fe₂O₃ + Mn →</text>
<text x="36" y="174" font-size="13" fill="#3f586a">MnO + 2FeO</text>
<text x="36" y="202" font-size="13" fill="#3f586a">2CaCO₃ + Ti →</text>
<text x="36" y="222" font-size="13" fill="#3f586a">2CaO + TiO₂ + 2CO</text>
<text x="36" y="248" class="tiny">Al、Ti 大量烧损；产物入渣</text>
</g>
<g>
<rect x="252" y="72" width="230" height="228" rx="12" fill="#eaf3f8" stroke="#7fb3d5"/>
<text x="268" y="102" class="lbl2">② 沉淀脱氧</text>
<text x="268" y="126" class="tiny">熔滴 + 熔池</text>
<text x="268" y="154" font-size="13" fill="#3f586a">[Mn] + [FeO] →</text>
<text x="268" y="172" font-size="13" fill="#3f586a">[Fe] + (MnO)</text>
<text x="268" y="196" font-size="13" fill="#3f586a">[Si] + 2[FeO] →</text>
<text x="268" y="214" font-size="13" fill="#3f586a">2[Fe] + (SiO₂)</text>
<text x="268" y="238" font-size="13" fill="#3f586a">(MnO)+(SiO₂)→(MnO·SiO₂)↑</text>
<text x="268" y="262" class="tiny">产物密度小、熔点低，易上浮</text>
</g>
<g>
<rect x="502" y="72" width="198" height="228" rx="12" fill="#eaf5ec" stroke="#7fb069"/>
<text x="518" y="102" class="lbl2 grn">③ 扩散脱氧</text>
<text x="518" y="126" class="tiny">熔池后部，温度降低</text>
<text x="518" y="158" class="sm">[FeO] → (FeO)</text>
<text x="518" y="188" class="tiny">酸性渣：SiO₂/TiO₂ 与 FeO</text>

<text x="518" y="224" class="tiny">→ 有利</text>
<text x="518" y="246" class="tiny">碱性渣：FeO 活度高</text>

<path d="M482,188 H498" stroke="#8fa3b0" stroke-width="3"/><path d="M498,188 l-10,-5 v10 z" fill="#8fa3b0"/>

const ESSAY_AI = [{"id":"w01","ch":"第一章","chname":"第一章 焊接化学冶金","src":"真题","srcnote":"期中试题·简答1","full":10,"q":"分别叙述硫和磷对焊接的危害性及其控制措施。","pts":[{"t":"硫以 FeS 形式偏析于晶界，形成 Fe+FeS（985℃）、Fe+FeO（940℃）低熔点共晶，结晶后期晶界液膜在拉应力下开裂，产生热裂纹（热脆）。","k":["FeS","985","940","热裂纹","晶界"]},{"t":"控硫：限制母材、焊丝、药皮、焊剂含硫；用 Mn 脱硫生成 MnS 入渣（[FeS]+[Mn]→(MnS)+[Fe]），或用 CaO/MgO 碱性氧化物脱硫。","k":["Mn","MnS","CaO","限制"]},{"t":"磷以 Fe3P/Fe2P 偏析于晶界，形成 Fe+Fe3P（1050℃）、Fe+Ni3P（880℃）低熔点共晶，引起冷脆和热裂。","k":["Fe3P","1050","880","冷脆","热裂"]},{"t":"控磷：限制来源；脱磷分两步，先使 P 氧化成 P2O5，再与 CaO 生成稳定磷酸钙入渣。","k":["P2O5","CaO","两步","脱磷"]},{"t":"碱性渣、低氢焊条有利于脱硫脱磷；C、Ni 等促进偏析的元素应控制。","k":["碱性","低氢","C","Ni"]}],"ans":"硫：① 以 FeS 形式存在，液态互溶、固态基本不溶，偏析于晶界；与 Fe 形成 Fe+FeS 低熔点共晶（985℃），与 FeO 形成 Fe+FeO 共晶（940℃），高镍合金还有 NiS+Ni 共晶（644℃）。结晶后期晶界液膜在拉应力下开裂，即热裂纹（热脆）；C↑ 促进偏析。② 控制：限制母材、焊丝、药皮、焊剂含硫；冶金脱硫用 Mn（[FeS]+[Mn]→(MnS)+[Fe]，MnS 熔点 1610℃ 入渣，降温有利），或用 CaO/MgO 碱性氧化物脱硫。\n磷：① 以 Fe3P/Fe2P 存在，固态基本不溶，晶界形成 Fe+Fe3P 共晶（1050℃）或 Fe+Ni3P 共晶（880℃），引起冷脆和热裂，P 偏析严重。② 控制：限制来源；脱磷两步——先使 P 氧化成 P2O5，再与 CaO 生成稳定磷酸钙入渣（2[Fe3P]+5(FeO)+3CaO→(CaO)3·P2O5+11[Fe]）。碱性渣、低氢焊条有利于脱硫脱磷；同时控制 C、Ni 等促进偏析的元素。","figKey":"hot_crack","figcap":"硫、磷在晶界形成低熔点共晶液膜，结晶后期受拉应力→热裂纹；图中标出 Fe+FeS 985℃、Fe+Fe3P 1050℃。","basis":"CHAP1 §3 硫、磷的危害；期中试题 简答1"},{"id":"w02","ch":"第二章","chname":"第二章 焊接材料","src":"真题","srcnote":"期中试题·简答2 / 练习题2","full":15,"q":"对比说明酸性焊条对焊缝金属的净化作用。","pts":[{"t":"酸性焊条以 E4303（J422）为代表，渣系 TiO2-CaO-SiO2，B1=0.76，属酸性，气渣联合保护。","k":["E4303","TiO2","0.76","酸性","气渣联合"]},{"t":"熔渣氧化性较强、FeO 活度高，扩散脱氧能力弱；酸性氧化物多，自由氧离子少，脱硫脱磷能力弱。","k":["氧化性","FeO","脱氧","脱硫","脱磷"]},{"t":"碱性焊条以 E5015（J507）为代表，B1=1.89，CaO 等碱性氧化物脱硫脱磷强，CaF2 与 H/水生成 HF 去氢。","k":["E5015","1.89","CaO","CaF2","HF"]},{"t":"碱性焊条焊缝 O、H、S、P 低，净化作用强，塑韧性好；酸性焊条焊缝 O、H、S、P 较高，塑韧性较低。","k":["O","H","S","P","塑韧性"]},{"t":"结论：酸性焊条净化作用明显弱于碱性焊条；但酸性焊条稳弧、脱渣、成形好，一般结构常用，重要结构用碱性低氢焊条。","k":["净化作用弱","工艺性","稳弧","重要结构"]}],"ans":"酸性焊条以 E4303（J422）为代表，渣系 TiO2-CaO-SiO2，B1=0.76，属酸性，气渣联合保护。其熔渣氧化性较强、FeO 活度高，扩散脱氧能力弱；酸性氧化物多，自由氧离子少，脱硫脱磷能力弱，主要靠 Mn 脱硫，脱磷靠 FeO+CaO 但效果有限；CaF2 少，去氢能力弱。因此焊缝中 O、H、S、P 含量较高，塑韧性较低。\n碱性焊条以 E5015（J507）为代表，渣系 CaF2-CaO-SiO2，B1=1.89，属碱性，氧化性小；CaO 等碱性氧化物脱硫脱磷强，CaF2 与 H/水反应生成 HF 去氢；焊缝 O、H、S、P 低，净化作用强，塑韧性好。\n结论：酸性焊条对焊缝金属的净化作用明显弱于碱性焊条；但酸性焊条稳弧、脱渣、成形好，成本低，一般结构常用；重要结构用碱性低氢焊条。","figKey":"acidbase","figcap":"酸性 E4303 与碱性 E5015 的渣系、碱度、氧化性、脱硫脱磷、去氢和塑韧性对比。","basis":"CHAP2 §1 典型焊条；期中试题 简答2；练习题2"},{"id":"w03","ch":"第三章","chname":"第三章 熔池凝固和焊缝固态相变","src":"真题","srcnote":"期中试题·简答3","full":15,"q":"根据 16Mn 钢焊缝化学成分和冷却条件的不同，其固态相变组织可能有哪些？各自特征如何？","pts":[{"t":"16Mn 为低合金高强钢（C≈0.16%、Mn≈1.4%），焊缝可能出现铁素体、珠光体、贝氏体、马氏体四类组织，以铁素体为主。","k":["16Mn","低合金","铁素体","珠光体","贝氏体","马氏体"]},{"t":"铁素体四类：PF（>750℃晶界）、FSP（700~550℃侧板条/无碳贝氏体）、AF（约500℃晶内针状）、FGF（<500℃细晶/贝氏铁素体）。","k":["PF","FSP","AF","FGF","750","500"]},{"t":"珠光体：Ar1~550℃扩散型转变，F+Fe3C 层状；焊接非平衡冷却时量少，慢冷/预热/后热时增多。","k":["珠光体","Ar1","550","层状","慢冷"]},{"t":"贝氏体：上贝 550~500℃羽毛状；下贝 450℃~Ms 针状强韧；M-A 组元为富碳马氏体+残余奥氏体。","k":["上贝","下贝","羽毛","针状","M-A","Ms"]},{"t":"马氏体：含碳高或合金复杂、快冷到 Ms 以下；板条马氏体（位错、强韧），片状马氏体（C≥0.4%、孪晶、脆）。","k":["马氏体","板条","片状","0.4","位错","孪晶"]}],"ans":"16Mn 为低合金高强钢（C≈0.16%、Mn≈1.4%），焊缝为低合金钢焊缝，固态相变可能出现铁素体、珠光体、贝氏体、马氏体四类组织，以铁素体为主。\n① 铁素体：先共析铁素体 PF（>750℃，沿原奥氏体晶界细条/块状）；侧板条铁素体 FSP（700~550℃，由晶界向晶内板条状，无碳贝氏体）；针状铁素体 AF（约500℃，晶内针状、以质点为核心放射状）；细晶铁素体 FGF（<500℃，晶内细小，450℃左右可转上贝氏体）。\n② 珠光体：Ar1~550℃ 扩散型转变，F+Fe3C 层状；焊接非平衡冷却时量少，慢冷/预热/后热时增多。\n③ 贝氏体：上贝氏体 Bu（550~500℃，羽毛状，条状 F 间夹渗碳体）；下贝氏体 BL（450℃~Ms，针状，强韧）；M-A 组元为富碳马氏体+残余奥氏体。\n④ 马氏体：含碳高或合金复杂、快冷到 Ms 以下；板条马氏体（低碳低合金，位错亚结构，强韧）；片状马氏体（C≥0.4%，孪晶，脆）。\n16Mn 常规焊态以 PF+FSP+AF+FGF 为主，少量 P；冷速加快→B 增多；更快→M；慢冷/预热→P 增多。","figKey":"cct","figcap":"16Mn 低合金钢焊缝 CCT 示意：冷速↑，组织由 F+P→B→M 转变；常规焊态以 PF+FSP+AF+FGF 为主。","basis":"CHAP3 §2 焊缝固态相变；期中试题 简答3"},{"id":"w04","ch":"第二章","chname":"第二章 焊接材料","src":"真题","srcnote":"期中试题·简答4(1)","full":6,"q":"解释焊条型号 E5515-N5 P U H10 的含义。","pts":[{"t":"E 表示焊条；55 表示熔敷金属抗拉强度最小值 550MPa。","k":["E","焊条","55","550"]},{"t":"15 表示药皮为碱性、适用于全位置焊接、直流反接；-N5 表示熔敷金属化学成分分类代号。","k":["15","碱性","全位置","直流反接","N5","化学成分"]},{"t":"P 表示焊后状态（P=热处理态，无标记=焊态，AP=两种状态均可）；U 表示规定温度下冲击吸收能量≥47J；H10 表示扩散氢≤10mL/100g。","k":["P","热处理","U","47","H10","10"]}],"ans":"E5515-N5 P U H10：E—焊条；55—熔敷金属抗拉强度最小值 550MPa；15—药皮为碱性，适用于全位置焊接，直流反接；-N5—熔敷金属化学成分分类代号；P—焊后状态代号，P 为热处理态（无标记为焊态，AP 为焊态/焊后热处理态均可）；U—可选附加代号，规定温度下冲击吸收能量≥47J；H10—可选附加代号，熔敷金属扩散氢≤10mL/100g。","figKey":"e5515","figcap":"按 GB/T 5117 逐段读焊条型号：E / 55 / 15 / -N5 / P / U / H10。","basis":"CHAP2 §1 焊条型号图；期中试题 简答4(1)"},{"id":"w05","ch":"第二章","chname":"第二章 焊接材料","src":"真题","srcnote":"期中试题·简答4(2)","full":15,"q":"分析 E4303（J422）焊条的冶金性能。","pts":[{"t":"E4303（J422）为钛钙型酸性焊条，渣系 TiO2-CaO-SiO2，B1=0.76，气渣联合保护，抗拉强度≥430MPa，全位置焊接。","k":["E4303","钛钙","TiO2","0.76","430","全位置"]},{"t":"氧化性较强、FeO 活度高，扩散脱氧弱；靠 Mn 先期+沉淀脱氧、Si 沉淀脱氧、C 脱氧，并有 Si/Mn 还原过渡。","k":["氧化性","FeO","Mn","Si","C","还原"]},{"t":"脱硫主要靠 Mn；脱磷靠 P 氧化成 P2O5 后与 CaO 生成磷酸钙入渣，能力有限。","k":["Mn","脱硫","P2O5","CaO","脱磷"]},{"t":"合金化：锰铁主要脱氧脱硫，Mo、V、W 不易氧化、过渡好；熔渣氧化性↑→CO 气孔↑，还原性↑→H2 气孔↑。","k":["Mo","V","W","CO","H2"]},{"t":"工艺性好：稳弧、飞溅小、脱渣易、成形美观、发尘少；但焊缝 O、S、P 较高，塑韧性低于碱性焊条，用于一般结构。","k":["工艺性","稳弧","脱渣","塑韧性","一般结构"]}],"ans":"E4303（J422）为钛钙型酸性焊条，渣系 TiO2-CaO-SiO2，B1=0.76，气渣联合保护，抗拉强度≥430MPa，全位置焊接。\n冶金性能：① 氧化性较强，熔渣中 FeO 活度高，扩散脱氧弱；靠 Mn 先期+沉淀脱氧、Si 沉淀脱氧、C 脱氧，并有 Si/Mn 还原过渡。② 脱硫主要靠 Mn（[FeS]+[Mn]→[Fe]+(MnS)；[FeS]+(MnO)→[FeO]+(MnS)）；脱磷靠 P 氧化成 P2O5 后与 CaO 生成 3CaO·P2O5/4CaO·P2O5 入渣，能力有限。③ 合金化：锰铁主要脱氧脱硫，Mo、V、W 不易氧化、过渡好。④ 气孔敏感性：熔渣氧化性↑→CO 气孔↑；还原性↑→H2 气孔↑。\n性能：工艺性好，稳弧、飞溅小、脱渣易、成形美观，发尘量少；但焊缝 O、S、P 较高，塑韧性低于碱性焊条。用于一般低碳钢/低合金钢结构；重要结构应选 E5015 等碱性低氢焊条。","figKey":"acidbase","figcap":"酸性 E4303（J422）与碱性 E5015（J507）的净化能力和工艺性对比。","basis":"CHAP2 §1 E4303；期中试题 简答4(2)"},{"id":"w06","ch":"第一章","chname":"第一章 焊接化学冶金","src":"真题","srcnote":"期中试题·简答5","full":15,"q":"简述 Mn、Si、Nb、V、Mo 五种元素对焊缝性能的影响。","pts":[{"t":"Mn：脱氧、脱硫，使硫以 MnS 代替低熔点 FeS 薄膜，改善硫化物形态，提高强度；Mn/S 比按 C 控制，过量增加淬硬倾向。","k":["Mn","脱氧","脱硫","MnS","Mn/S","淬硬"]},{"t":"Si：脱氧、固溶强化、δ 相形成，利于抗热裂；但 Si>0.4% 易形成低熔点硅酸盐夹杂，热裂↑，并降低 H 溶解度。","k":["Si","脱氧","δ","0.4","硅酸盐","热裂"]},{"t":"Nb：强碳化物形成元素，NbC 比 Fe3C 稳定，细化晶粒、沉淀强化、提高强度；但增加再热裂纹敏感性。","k":["Nb","NbC","细化晶粒","沉淀强化","再热裂纹"]},{"t":"V：强碳化物形成元素，V(C,N) 细化晶粒、沉淀强化；V+N→VN 消除氮时效脆化；增加再热裂纹敏感性。","k":["V","V(C,N)","细化晶粒","VN","再热裂纹"]},{"t":"Mo：碳化物形成元素，提高淬透性、热强性、抗回火软化；Mo/V/W 不易氧化、过渡系数高；增加再热裂纹敏感性。","k":["Mo","淬透性","热强性","回火","再热裂纹"]}],"ans":"① Mn：脱氧、脱硫；使硫以 MnS 代替低熔点 FeS 薄膜，改善硫化物形态；固溶强化，提高强度。Mn/S 比需按含碳量控制，过量 Mn 会增加淬硬倾向。\n② Si：脱氧剂，固溶强化，δ 相形成元素，利于消除结晶裂纹；但 Si>0.4% 易形成低熔点硅酸盐夹杂，热裂倾向增大；Si 还降低氢在钢中的溶解度。\n③ Nb：强碳化物形成元素，形成比 Fe3C 更稳定的 NbC，细化晶粒、沉淀强化、提高强度；但增加再热裂纹敏感性。\n④ V：强碳化物形成元素，V(C,N) 细化晶粒、沉淀强化；V+N→VN 可消除氮的时效脆化；同样增加再热裂纹敏感性。\n⑤ Mo：碳化物形成元素，提高淬透性、热强性和抗回火软化能力；Mo、V、W 不易氧化、过渡系数高；但增加再热裂纹敏感性。\n总纲：微量合金化以细化晶粒+沉淀强化为主；Nb、V、Mo 会增加再热裂纹敏感性、应控制，Si 控≤0.4%，Mn/S 比按 C 匹配。","figKey":"alloy","figcap":"五种元素的主作用与注意点：Mn/Si 偏净化与固溶，Nb/V/Mo 偏细化晶粒/沉淀强化，但都需防再热裂纹。","basis":"CHAP1 §3/§4、CHAP5 再热裂纹；期中试题 简答5"},{"id":"w07","ch":"第二章","chname":"第二章 焊接材料","src":"课后","srcnote":"复习题2-1 / 练习题6","full":10,"q":"焊条工艺性能包括哪几个方面？影响因素有哪些？","pts":[{"t":"电弧稳定性：不断弧、不飘移、抗磁偏吹；稳弧剂含 K/Na 低电离位元素，CaF2 电离势高会降低稳弧性。","k":["电弧稳定性","稳弧剂","K","Na","CaF2"]},{"t":"焊缝成形与全位置焊接性：熔渣凝固温度、粘度、表面张力决定成形；短渣（凝固温度范围窄）适应立/仰/横焊，氧化铁型长渣不适应。","k":["焊缝成形","粘度","表面张力","短渣","全位置"]},{"t":"飞溅、脱渣性、熔化速度：粘度↑/电流↑/水分↑/电压↑/交流/大颗粒过渡使飞溅↑；线膨胀系数差大、渣松脆易脱渣；用 αp、αH=αp(1-ψ) 表征熔化/熔敷。","k":["飞溅","脱渣","αp","αH","线膨胀"]},{"t":"药皮发红与焊接烟尘：后半段药皮温升过高发红开裂；焊芯电阻大、熔化系数小、电阻热多；烟尘有锰中毒、氟中毒，低氢焊条烟尘含氟10%以上。","k":["药皮发红","电阻","烟尘","锰","氟"]}],"ans":"焊条工艺性能包括：① 电弧稳定性——不断弧、不飘移、抗磁偏吹；稳弧剂含 K/Na 低电离位元素，CaF2 电离势高会降低稳弧性。② 焊缝成形——表面光滑、波纹细密、几何尺寸和余高合格、无咬边；受熔渣凝固温度、粘度、表面张力影响（1500℃ 粘度 0.1~0.2Pa·s，表面张力 0.3~0.4N/m）。③ 全位置焊接性——立、仰、横焊时熔滴和熔渣不下流；短渣（凝固温度范围窄）有利，氧化铁型长渣不适应。④ 飞溅——粘度↑、电流↑、药皮水分↑、电压↑、交流、大颗粒过渡均增大飞溅。⑤ 脱渣性——熔渣与金属线膨胀系数差越大越好；氧化性太强难脱；渣松脆易脱；钛型最好、低氢最差。⑥ 熔化速度——用熔化系数 αp；考虑飞溅用熔敷系数 αH=αp(1-ψ)。⑦ 药皮发红——后半段药皮温升过高发红开裂脱落，与焊芯电阻、熔化系数、电阻热有关。⑧ 焊接烟尘——锰中毒、氟中毒；低氢焊条烟尘含氟10%以上。","figKey":"coating","figcap":"药皮七类组分与焊条工艺性能的关系；稳弧、造渣、造气、脱氧、合金、粘结、增塑共同决定工艺与冶金性能。","basis":"CHAP2 §1 焊条工艺性能；复习题2-1 / 练习题6"},{"id":"w08","ch":"第一章","chname":"第一章 焊接化学冶金","src":"课后","srcnote":"复习题2-2 / 练习题7","full":6,"q":"简述焊缝金属的脱氧途径。","pts":[{"t":"先期脱氧：药皮固态加热阶段，Al、Ti、Mn 与高价氧化物/碳酸盐分解产物反应，Al、Ti 大部分烧损。","k":["先期脱氧","药皮","Al","Ti","烧损"]},{"t":"沉淀脱氧：熔滴和熔池中，[Mn]/[Si] 与 [FeO] 直接反应，生成 MnO、SiO2 或 MnO·SiO2 上浮入渣。","k":["沉淀脱氧","Mn","Si","FeO","上浮"]},{"t":"扩散脱氧：[FeO]→(FeO)，降温有利；酸性渣 SiO2/TiO2 降低 FeO 活度，有利于扩散脱氧；碱性渣 FeO 活度高，效果差。","k":["扩散脱氧","酸性渣","FeO活度","碱性渣"]}],"ans":"① 先期脱氧：药皮固态加热阶段，Al、Ti、Mn 等对氧亲和力大，先与药皮中高价氧化物/碳酸盐分解产物反应，如 Fe2O3+Mn→MnO+2FeO、2CaCO3+Ti→2CaO+TiO2+2CO；Al、Ti 大部分烧损，产物进入熔渣。\n② 沉淀脱氧：熔滴和熔池中，脱氧剂与 [FeO] 直接反应，产物上浮入渣：[Mn]+[FeO]→[Fe]+(MnO)；[Si]+2[FeO]→2[Fe]+(SiO2)；Mn-Si 联合时 (MnO)+(SiO2)→(MnO·SiO2)，密度小、熔点低，易上浮。\n③ 扩散脱氧：[FeO]→(FeO)，温度降低有利，主要在熔池后部；酸性渣中 SiO2、TiO2 与 FeO 生成复合物，降低 FeO 活度，有利于扩散脱氧；碱性渣 FeO 活度高，扩散脱氧较差。\n实际以先期+沉淀为主，扩散为辅。","figKey":"deox","figcap":"三条脱氧途径按反应区排列：药皮反应区先期→熔滴/熔池沉淀→熔池后部扩散。","basis":"CHAP1 §3 脱氧；复习题2-2 / 练习题7"},{"id":"w09","ch":"第三章","chname":"第三章 熔池凝固和焊缝固态相变","src":"课后","srcnote":"复习题2-3 / 练习题8","full":6,"q":"说明焊接速度对结晶速度和结晶方向的影响。","pts":[{"t":"结晶线速度 vc=v cosθ，θ 为 vc 与焊接速度 v 的夹角；熔合线 θ=90°，vc=0；熔池中心 θ=0°，vc=v 最大。","k":["vc","cos","熔合线","90","中心"]},{"t":"焊速 v 增大→θ 增大→柱状晶趋向垂直于焊缝中心线，焊缝中心易产生热裂纹。","k":["焊速","θ","柱状晶","垂直","热裂纹"]},{"t":"v 减小→θ 减小→柱状晶偏向焊接方向，熔合线附近胞状/胞状树枝，中心为较细的胞状树枝晶，抗裂性改善。","k":["减小","偏向","胞状","抗裂"]}],"ans":"结晶线速度 vc=v cosθ，θ 为 vc 与焊接速度 v 的夹角。熔合线处 θ=90°，vc=0；熔池中心 θ=0°，vc=v 最大。\n焊接速度 v 增大→θ 增大→柱状晶成长方向趋向垂直于焊缝中心线，焊缝中心易产生热裂纹；v 减小→θ 减小→柱状晶偏向焊接方向，熔合线附近为胞状/胞状树枝晶，中心为较细的胞状树枝晶，抗裂性改善。\n实际焊接通过调节焊速控制柱状晶方向和组织。","figKey":"vc","figcap":"熔池俯视：熔合线 θ=90°、vc=0；中心 θ=0°、vc=v。焊速增大使柱状晶趋向垂直中心线。","basis":"CHAP3 §1 结晶线速度；复习题2-3 / 练习题8"},{"id":"w10","ch":"第三章","chname":"第三章 熔池凝固和焊缝固态相变","src":"课后","srcnote":"复习题2-4 / 练习题9","full":10,"q":"焊接气孔有哪些危害？如何防治？","pts":[{"t":"危害：减小承载截面积；成串/密集气孔更危险；承载面积减小10%时疲劳强度可下降约50%；降低塑韧性、致密性和耐蚀/密封性。","k":["承载","10","50","疲劳","塑韧性"]},{"t":"类型：H2 表面喇叭口/螺钉状、内壁光滑；N2 表面蜂窝状成堆；CO 内部条虫/蠕虫状、沿柱状晶分布。","k":["H2","喇叭口","N2","蜂窝","CO","条虫"]},{"t":"机理：过饱和气体→生核→长大→上浮；θ<90°易浮出，θ>90°且结晶速度大时残留；R 大、粘度大、气泡半径小都不利上浮。","k":["过饱和","生核","θ","结晶速度","上浮"]},{"t":"冶金防治：清理铁锈/油污/水分，焊条焊剂烘干；控制熔渣氧化性（氧化性大 CO↑，还原性大 H2↑）；CaF2、SiO2 降低氢气孔；脱氧脱氮。","k":["清理","烘干","氧化性","CaF2","脱氧"]},{"t":"工艺防治：合适电流/电压/焊速；加强保护防 N2；直流反接优于正接/交流；短弧、摆动、焊前清理。","k":["电流","电压","焊速","保护","短弧"]}],"ans":"危害：气孔减小承载截面积；成串/密集气孔比单个气孔危险；承载面积减小 10% 时疲劳强度可下降约 50%；气孔周围应力集中，降低塑韧性、致密性和耐蚀/密封性。\n类型：H2 气孔多在表面，断面喇叭口/螺钉状、内壁光滑；N2 气孔多在表面，蜂窝状成堆；CO 气孔在内部，条虫/蠕虫状，沿柱状晶分布。\n机理：液态金属过饱和气体→生核→长大→上浮；θ<90° 易浮出，θ>90° 且结晶速度大时残留；R 大、粘度大、气泡半径小都不利上浮。\n冶金防治：清理铁锈/油污/水分，焊条焊剂烘干；控制熔渣氧化性（氧化性大 CO↑，还原性大 H2↑）；CaF2、SiO2 降低氢气孔；脱氧脱氮。\n工艺防治：合适电流/电压/焊速；加强保护防 N2；直流反接优于正接/交流；短弧、摆动、焊前清理。","figKey":"pores","figcap":"三类气孔形态：H2 表面喇叭口、N2 表面蜂窝状、CO 内部条虫状沿柱状晶。","basis":"CHAP3 §3 气孔；CHAP3 补充 焊接缺欠；复习题2-4 / 练习题9"},{"id":"w11","ch":"第四章","chname":"第四章 焊接热影响区的组织和性能","src":"课后","srcnote":"复习题2-5 / 练习题10","full":10,"q":"论述易淬火钢热影响区的组织分布及对性能的影响。","pts":[{"t":"易淬火钢如 45钢、30CrMnSi、18MnMoNb，淬硬倾向大；HAZ 分布取决于焊前热处理状态。","k":["45","30CrMnSi","18MnMoNb","淬硬","焊前热处理"]},{"t":"完全淬火区（Ac3 以上）：A 晶粒粗大，焊后得粗大马氏体，硬度高、塑韧性低，冷裂敏感性最高。","k":["完全淬火区","Ac3","粗大马氏体","硬度","冷裂"]},{"t":"不完全淬火区（Ac1~Ac3）：快速加热时 F 很少溶入 A，快冷时 F 保留并长大，最后得 M+F，组织不均匀。","k":["不完全淬火区","Ac1","铁素体","马氏体","不均匀"]},{"t":"回火区（Ac1 以下）：母材焊前调质态，受热发生不同程度回火软化，软化程度取决于焊前回火温度。","k":["回火区","Ac1","调质","软化","回火温度"]},{"t":"性能：熔合区、过热区最薄弱；硬度↑、塑韧性↓；冷裂纹三要素 H+M+R。对策：预热、控制 t8/5、低氢焊材、后热/缓冷、焊后回火。","k":["熔合区","过热区","H","M","R","预热","t8/5"]}],"ans":"易淬火钢如 45钢、30CrMnSi、18MnMoNb，淬硬倾向大；HAZ 分布取决于焊前热处理状态。\n① 完全淬火区（Ac3 以上）：A 晶粒粗大，焊后得粗大马氏体，硬度高、塑韧性低，冷裂敏感性最高（过热区）。\n② 不完全淬火区（Ac1~Ac3）：快速加热时 F 很少溶入 A，快冷时 F 保留并长大，最后得 M+F，组织不均匀。\n③ 回火区（Ac1 以下）：母材焊前调质态，受热发生不同程度回火软化，软化程度取决于焊前回火温度。\n性能：熔合区、过热区最薄弱；硬度升高、塑韧性下降；冷裂纹三要素 H+M+R。对策：预热、控制 t8/5、低氢焊材、后热/缓冷、焊后回火。","figKey":"haz_quench","figcap":"易淬火钢 HAZ：完全淬火区（粗大 M）→不完全淬火区（M+F）→回火区（软化）→母材。","basis":"CHAP4 §3 易淬火钢 HAZ；复习题2-5 / 练习题10"},{"id":"w12","ch":"第二章","chname":"第二章 焊接材料","src":"课后","srcnote":"练习题1","full":12,"q":"按功能划分，举例说明焊条药皮有哪些组成？","pts":[{"t":"稳弧剂：含低电离位元素，如 K2CO3、大理石、长石、金红石。","k":["稳弧剂","K2CO3","长石","金红石"]},{"t":"造渣剂：钛铁矿、金红石、大理石、石英砂、长石、云母、萤石。","k":["造渣剂","钛铁矿","石英砂","萤石"]},{"t":"造气剂：木粉、淀粉、大理石、菱苦土。","k":["造气剂","木粉","淀粉","大理石"]},{"t":"脱氧剂与合金剂：锰铁、钛铁、硅铁、铝粉；锰铁、硅铁、钼铁。","k":["脱氧剂","锰铁","钛铁","硅铁","合金剂","钼铁"]},{"t":"粘结剂与增塑剂：钠水玻璃、钾钠水玻璃；白泥、云母、钛白粉、糊精。","k":["粘结剂","水玻璃","增塑剂","白泥","糊精"]},{"t":"药皮作用：机械保护、冶金处理（脱氧、脱硫磷、去氢、合金化）、改善工艺性能。","k":["机械保护","冶金处理","脱氧","合金化","工艺性能"]}],"ans":"按功能分七类：① 稳弧剂——含低电离位元素，如 K2CO3、大理石、长石、金红石；② 造渣剂——钛铁矿、金红石、大理石、石英砂、长石、云母、萤石；③ 造气剂——木粉、淀粉、大理石、菱苦土；④ 脱氧剂——锰铁、钛铁、硅铁、铝粉；⑤ 合金剂——锰铁、硅铁、钼铁；⑥ 粘结剂——钠水玻璃、钾钠水玻璃；⑦ 增塑剂——白泥、云母、钛白粉、糊精。\n药皮作用：机械保护、冶金处理（脱氧、脱硫磷、去氢、合金化）、改善工艺性能。","figKey":"coating","figcap":"焊条药皮七类组分：稳弧、造渣、造气、脱氧、合金、粘结、增塑。","basis":"CHAP2 §1 药皮组成；练习题1"},{"id":"w13","ch":"第一章","chname":"第一章 焊接化学冶金","src":"课后","srcnote":"练习题3","full":8,"q":"论述氧化性气体对金属的氧化作用。","pts":[{"t":"氧化性气体主要有 O2、CO2、H2O 及活性熔渣；判据：{pO2}>pO2* 氧化，=平衡，<还原。","k":["O2","CO2","H2O","pO2","氧化"]},{"t":"自由氧：Fe+1/2O2→FeO；C+1/2O2→CO；Si、Mn 氧化生成 SiO2、MnO，可能夹渣。","k":["Fe","O2","CO","Si","Mn"]},{"t":"CO2：CO2+[Fe]→CO+[FeO]，T↑ 向右、氧化性↑；可用 Si、Mn 脱氧；CO 不溶于液态金属→CO 气孔。","k":["CO2","CO","FeO","气孔"]},{"t":"H2O：H2O+[Fe]→H2+[FeO]，T↑ 氧化性↑，同时增氢；后果：强度塑韧性↓、CO 气孔/飞溅、合金烧损；控制：限制氧源、冶金脱氧、合适 I/U。","k":["H2O","H2","增氢","塑韧性","脱氧"]}],"ans":"焊接区氧化性气体主要有 O2、CO2、H2O，以及活性熔渣。判断方向：{pO2}>pO2* 氧化，=平衡，<还原。\n① 自由氧：Fe+1/2O2→FeO；C+1/2O2→CO；Si、Mn 氧化生成 SiO2、MnO，可能夹渣。\n② CO2：CO2+[Fe]→CO+[FeO]，温度升高反应向右，氧化性增强；可用 Si、Mn 脱氧；CO 不溶于液态金属，可能形成 CO 气孔。\n③ H2O：H2O+[Fe]→H2+[FeO]，温度升高氧化性增强，同时增氢，兼有氢气孔/冷裂纹风险。\n后果：强度、塑韧性下降；CO 气孔、飞溅；有益合金元素烧损。控制：限制氧源（烘干、清理、保护），冶金脱氧（Mn、Si、Ti、Al），合适 I/U（U↑ 含氧↑，I↑ 含氧↓）。","figKey":"oxidation","figcap":"氧化判据与 O2、CO2、H2O 三条氧化路径；H2O 同时增氢，CO2 可能带来 CO 气孔。","basis":"CHAP1 §2 氧的作用；练习题3"},{"id":"w14","ch":"第一章","chname":"第一章 焊接化学冶金","src":"课后","srcnote":"练习题4","full":10,"q":"论述氢对焊接质量的影响及控制措施。","pts":[{"t":"氢源：药皮/焊剂/药芯水分、含氢有机物、空气水分、焊丝和工件表面油锈水。","k":["药皮","焊剂","水分","有机物","油锈"]},{"t":"存在形式：扩散氢（原子/质子，可自由扩散）；残余氢（分子，聚集于缺陷，不能自由扩散）；总氢=扩散+残余。","k":["扩散氢","残余氢","总氢","缺陷"]},{"t":"危害：氢脆（室温塑性↓）；白点/鱼眼（0.5~3mm，中心气孔/夹渣）；H2 气孔；冷裂纹/延迟裂纹（H+M+R）。","k":["氢脆","白点","鱼眼","气孔","冷裂纹","H","M","R"]},{"t":"控制：限制氢源（烘干：有机物≤200℃、碳酸盐≤450℃；清理油锈）；CaF2 与 H 生成 HF；控制氧化势、脱氢处理。","k":["烘干","200","450","CaF2","HF","脱氢"]},{"t":"焊后脱氢 350℃×1h 或 250℃×6h；重要焊缝选奥氏体焊缝（D 最小）。","k":["350","1h","250","6h","奥氏体"]}],"ans":"来源：药皮/焊剂/药芯水分、含氢有机物、空气水分、焊丝和工件表面油锈水。\n存在形式：扩散氢（原子/质子，可自由扩散）；残余氢（分子，聚集于晶格缺陷/裂纹/夹杂边缘，不能自由扩散）；总氢=扩散氢+残余氢，放置时间延长扩散氢减少、残余氢增多。\n危害：① 氢脆——室温附近塑性严重下降，加载快时不明显；② 白点/鱼眼——直径 0.5~3mm，中心有气孔/夹渣，外围塑性断裂痕迹，碳钢及 Cr/Ni/Mo 合金化焊缝敏感；③ 气孔——H2 表面喇叭口；④ 冷裂纹/延迟裂纹——三要素 H+M+R。\n控制：限制氢源（烘干：有机物≤200℃、碳酸盐≤450℃；清理油锈）；冶金（CaF2 与 H 生成 HF、控制氧化势、脱氢处理）；工艺参数；焊后脱氢 350℃×1h 或 250℃×6h；重要焊缝选奥氏体焊缝（D 最小）。","figKey":"hydrogen","figcap":"氢源→扩散氢→氢脆/白点、H2 气孔、冷裂纹（H+M+R）；下方为烘干、CaF2 去氢和焊后脱氢措施。","basis":"CHAP1 §2 氢；练习题4"},{"id":"w15","ch":"第一章","chname":"第一章 焊接化学冶金","src":"课后","srcnote":"练习题5","full":6,"q":"焊缝金属合金化的目的是什么？","pts":[{"t":"补偿合金元素在焊接过程中的烧损、蒸发和飞溅损失。","k":["补偿","烧损","蒸发","飞溅"]},{"t":"消除焊接缺陷、改善组织和性能：脱氧、细化晶粒、提高强度塑韧性、抗裂性。","k":["脱氧","细化晶粒","强度","塑韧性","抗裂"]},{"t":"获得特殊性能堆焊金属（耐磨、耐蚀、耐热）；方式有合金焊丝/带极、药芯焊丝/药芯焊条、合金药皮/焊剂、合金粉末。","k":["耐磨","耐蚀","耐热","焊丝","药芯","药皮","粉末"]}],"ans":"① 补偿合金元素在焊接过程中的烧损、蒸发和飞溅损失；② 消除焊接缺陷、改善组织和性能——脱氧、细化晶粒、提高强度塑韧性、抗裂性；③ 获得具有特殊性能的堆焊金属，如耐磨、耐蚀、耐热。\n方式：合金焊丝/带极、药芯焊丝/药芯焊条、合金药皮/焊剂、合金粉末。\n过渡系数 η=熔敷金属中某合金含量/焊接材料中该合金总量；元素越活泼、沸点越低，η 越小；合金含量↑、粒度↑、药皮氧化势↓、Kb↓、I↓、氩弧焊，η 增大。","figKey":"alloy_route","figcap":"四条合金化路径：合金焊丝/带极、药芯焊丝/药芯焊条、合金药皮/焊剂、合金粉末。","basis":"CHAP1 §4 合金过渡；练习题5"},{"id":"w16","ch":"第四章","chname":"第四章 焊接热影响区的组织和性能","src":"课件","srcnote":"CHAP4 思考题1","full":10,"q":"焊接热循环对被焊金属近缝区的组织、性能有何影响？","pts":[{"t":"热循环四参数：加热速度 ωH、最高温度 Tm、相变温度以上停留时间 tH、冷却速度 ωc（常用 t8/5）。","k":["ωH","Tm","tH","ωc","t8/5"]},{"t":"ωH 大→扩散相变滞后，Ac1、Ac3 及 Ac3-Ac1 升高，A 均质化不完全。","k":["加热速度","Ac1","Ac3","均质化"]},{"t":"Tm 高→近缝区晶粒长大，过热区粗晶；tH 长→有利 A 均质化，但温度过高、时间过长会晶粒严重长大。","k":["Tm","晶粒长大","过热区","tH"]},{"t":"ωc 大→易得 M/B 硬组织，冷裂敏感性↑；ωc 小→晶粒粗大、软化。","k":["冷却速度","马氏体","贝氏体","冷裂","软化"]},{"t":"结果：HAZ 形成熔合区、过热区、正火区、不完全重结晶区的组织梯度；熔合区、过热区最薄弱；需控制线能量、预热、后热。","k":["熔合区","过热区","正火区","不完全重结晶区","线能量","预热"]}],"ans":"热循环四参数：加热速度 ωH、最高温度 Tm、相变温度以上停留时间 tH、冷却速度 ωc（常用 t8/5）。\n① ωH 大→扩散相变滞后，Ac1、Ac3 及 Ac3-Ac1 升高，A 均质化不完全；② Tm 高→近缝区晶粒长大，过热区粗晶；③ tH 长→有利于 A 均质化，但温度过高、时间过长会晶粒严重长大；④ ωc 大→易得 M/B 硬组织，冷裂敏感性↑；ωc 小→晶粒粗大、软化。\n结果：HAZ 形成熔合区、过热区、正火区、不完全重结晶区的组织梯度；熔合区、过热区最薄弱；需控制线能量、预热、后热。","figKey":"thermal","figcap":"焊接热循环四参数 ωH、Tm、tH、ωc；它们共同决定 HAZ 的晶粒尺寸、相变充分程度和冷却后组织。","basis":"CHAP4 §1/§3、思考题1"},{"id":"w17","ch":"第四章","chname":"第四章 焊接热影响区的组织和性能","src":"课件","srcnote":"CHAP4 思考题2","full":6,"q":"低合金钢焊接时，HAZ 粗晶区奥氏体的均质化程度对冷却时相变有何影响？","pts":[{"t":"粗晶区加热温度高、A 晶粒粗大；均质化程度取决于加热速度、峰值温度、高温停留时间及碳化物溶解。","k":["粗晶区","晶粒粗大","加热速度","峰值温度","碳化物"]},{"t":"均质化程度高→A 中 C/合金元素分布均匀，A 稳定性高、淬透性大，CCT 右移，易形成 M/B。","k":["均质化","稳定性","淬透性","CCT","马氏体","贝氏体"]},{"t":"均质化不完全→富碳/贫碳区，局部 Ms 不同，相变温度范围宽，组织不均匀，可能出现块状 F、M-A 组元；Cr/W/Mo/V 未充分溶解时 A 稳定性降低，40Cr CCT 左移，45钢 CCT 右移。","k":["不完全","富碳","Ms","M-A","40Cr","45"]}],"ans":"低合金钢 HAZ 粗晶区加热温度高、奥氏体晶粒粗大；均质化程度取决于加热速度、峰值温度、高温停留时间及碳化物溶解。\n① 均质化程度高：A 中 C 和合金元素分布均匀，A 稳定性高、淬透性大，CCT 右移，冷却时易形成 M/B，硬度高、冷裂敏感性大。\n② 均质化不完全：存在富碳/贫碳区，局部 Ms 不同，相变温度范围宽，组织不均匀，可能出现块状 F、M-A 组元。\n③ 焊接快速加热：Cr、W、Mo、V 等碳化物形成元素未充分溶解，A 稳定性降低（40Cr CCT 左移、淬硬倾向↓）；45钢无碳化物溶解且晶粒粗化，CCT 右移、淬硬倾向↑。\n结果：同一粗晶区因均质化差异可得到不同 M/B/F 比例，性能不均。","figKey":"haz_low","figcap":"HAZ 由熔合线向外温度递减；粗晶区靠近熔合线，峰值温度最高、晶粒最粗。","basis":"CHAP4 §2、思考题2"},{"id":"w18","ch":"第四章","chname":"第四章 焊接热影响区的组织和性能","src":"课件","srcnote":"CHAP4 思考题3","full":6,"q":"探讨低合金钢焊接 HAZ 受应力应变时对相变的影响。","pts":[{"t":"HAZ 受周围金属约束，产生热应力、组织应力、拘束应力，并伴随塑性应变。","k":["热应力","组织应力","拘束应力","塑性应变"]},{"t":"拉应力促进马氏体相变、使 Ms 升高，压应力抑制相变；三向拉应力促进裂纹形核扩展。","k":["拉应力","马氏体","Ms","压应力","裂纹"]},{"t":"塑性变形增加位错/空位密度，为相变提供形核位置、加速扩散，改变相变温度区间；相变体积膨胀可松弛部分热应力，但粗晶区+M+H+R 叠加时冷裂敏感性增大。","k":["位错","空位","形核","扩散","体积膨胀","冷裂"]}],"ans":"焊接 HAZ 在加热/冷却过程中受周围金属约束，产生热应力、组织应力和拘束应力，并伴随塑性应变。\n① 应力：拉应力促进马氏体相变、使 Ms 升高，压应力抑制相变；三向拉应力促进裂纹形核扩展。\n② 应变：塑性变形增加位错和空位密度，为相变提供形核位置、加速扩散，使相变温度区间变化；大应变还可诱发动态再结晶/软化。\n③ 焊接条件下应力应变与相变耦合：相变伴随体积膨胀可松弛部分热应力；但粗晶区+M+H+R 叠加时冷裂敏感性增大。\n结论：HAZ 组织转变不是单纯温度过程，应力应变会改变相变动力学、组织形态和裂纹倾向。","figKey":"haz_quench","figcap":"易淬火钢 HAZ 的完全淬火区、不完全淬火区和回火区；应力应变会改变这些区的相变动力学和裂纹倾向。","basis":"CHAP4 §2 应力应变、思考题3"},{"id":"w19","ch":"第四章","chname":"第四章 焊接热影响区的组织和性能","src":"课件","srcnote":"CHAP4 思考题4","full":8,"q":"焊接条件下组织转变与热处理条件下组织转变有何不同？","pts":[{"t":"加热速度快（几十~几百倍）：扩散相变滞后，Ac1、Ac3 及 Ac3-Ac1 升高，A 均质化不完全；热处理加热慢，接近平衡。","k":["加热速度快","Ac1","Ac3","均质化","平衡"]},{"t":"加热温度高（高100~200℃）：近缝区晶粒粗大；热处理温度较低、晶粒控制好。","k":["温度高","100","200","晶粒粗大"]},{"t":"高温停留短（手弧4~20s、埋弧30~100s）：扩散、碳化物溶解、A 均质化不充分；热处理保温时间长、组织均匀。","k":["停留时间","4","20","30","100","保温"]},{"t":"冷却快、非平衡：易得 M/B 淬硬组织；局部加热+复杂应力使 HAZ 组织梯度大；45钢 CCT 右移、40Cr CCT 左移。","k":["冷却快","马氏体","贝氏体","应力","45","40Cr"]}],"ans":"① 加热速度快（几十~几百倍）：扩散相变滞后，Ac1、Ac3 及 Ac3-Ac1 升高，A 均质化不完全；热处理加热慢，相变接近平衡。\n② 加热温度高（高 100~200℃）：近缝区晶粒粗大；热处理温度较低、晶粒控制好。\n③ 高温停留短（手弧 4~20s、埋弧 30~100s）：扩散、碳化物溶解、A 均质化不充分；热处理保温时间长，组织均匀。\n④ 冷却快、非平衡：易得 M/B 等淬硬组织；热处理可控制冷却得 F+P/贝氏体等平衡/近平衡组织。\n⑤ 局部加热+复杂应力：组织转变在应力应变下进行，HAZ 组织梯度大；热处理整体加热，组织均匀、应力小。\n典型：45钢焊接 CCT 右移、淬硬↑；40Cr 焊接 CCT 左移、淬硬↓。","figKey":"cct","figcap":"焊接 CCT 与热处理 CCT 的差异：焊接加热快、停留短、冷却非平衡，CCT 曲线和淬硬倾向随钢种不同而偏移。","basis":"CHAP4 §2 组织转变特点、思考题4"},{"id":"ez01","ch":"增材制造","chname":"增材制造技术","q":"增材制造的定义是什么？它与减材制造、等材制造有何区别？工作过程分为哪两个阶段？","ans":"增材制造是依据三维CAD设计数据，采用液体、粉末、丝等离散材料逐层累加制造实体零件的制造技术，是一种“自下而上”的材料累加过程。与减材制造利用刀具或电化学方法去除毛坯材料、等材制造利用模具使液体或固体材料成形不同，增材制造以材料逐层累加为本质特征。其工作过程分为两个阶段：数据处理阶段对三维CAD模型进行分层“切片”，把三维数据分解为若干二维轮廓数据；叠层制作阶段按二维数据逐层制作与分层厚度相同的薄片实体，并将薄片自下而上叠加成三维实体。","anstext":"增材制造是依据三维CAD设计数据，采用液体、粉末、丝等离散材料逐层累加制造实体零件的制造技术，是一种“自下而上”的材料累加过程。与减材制造利用刀具或电化学方法去除毛坯材料、等材制造利用模具使液体或固体材料成形不同，增材制造以材料逐层累加为本质特征。其工作过程分为两个阶段：数据处理阶段对三维CAD模型进行分层“切片”，把三维数据分解为若干二维轮廓数据；叠层制作阶段按二维数据逐层制作与分层厚度相同的薄片实体，并将薄片自下而上叠加成三维实体。","src":"课件","srcnote":"第四章 增材制造技术 4.1.1/4.1.2","full":8,"pts":[{"t":"增材制造依据三维CAD设计数据，采用液体、粉末、丝等离散材料逐层累加制造实体零件，是“自下而上”的材料累加过程。","k":["三维CAD","离散材料","逐层累加","自下而上"]},{"t":"减材制造是材料去除，等材制造是通过模具使材料成形（材料变形）；增材制造是材料逐层累加，三者材料量变化方式不同。","k":["减材制造","材料去除","等材制造","模具","增材制造"]},{"t":"工作过程分两个阶段：数据处理——对三维CAD模型分层切片，分解为二维轮廓数据；叠层制作——按二维数据逐层制作薄片并叠加成三维实体。","k":["数据处理","切片","二维轮廓","叠层制作","三维实体"]}],"basis":"第四章 4.1 增材制造概念与工作过程"},{"id":"ez02","ch":"增材制造","chname":"增材制造技术","q":"光固化成形的工作原理是什么？成形全过程包括哪些步骤？后处理为什么必须排出残留树脂？","ans":"光固化法利用光能的化学和热作用使液态光敏树脂固化，控制光能的形状逐层固化树脂，堆积成形出所需的三维实体零件；国际上通称stereolithography（SL），也常称为SLA法。成形全过程分为前处理、分层叠加成形和后处理：前处理包括三维模型构造、模型近似处理、选择成形方向、切片处理和生成支撑结构；分层叠加成形由模型断面逐层制作并叠加；后处理包括取出制件、排出未固化树脂、表面清洗、后固化、去除支撑、机械加工和打磨。必须排出残留树脂，是因为残留树脂会在后固化或储存过程中发生暗反应，固化收缩并引起制件变形；内部封闭时应设计排液孔或成形后钻孔排液。SLA制件表面还会留下约0.05～0.1mm的层间台阶，需要打磨。","anstext":"光固化法利用光能的化学和热作用使液态光敏树脂固化，控制光能的形状逐层固化树脂，堆积成形出所需的三维实体零件；国际上通称stereolithography（SL），也常称为SLA法。成形全过程分为前处理、分层叠加成形和后处理：前处理包括三维模型构造、模型近似处理、选择成形方向、切片处理和生成支撑结构；分层叠加成形由模型断面逐层制作并叠加；后处理包括取出制件、排出未固化树脂、表面清洗、后固化、去除支撑、机械加工和打磨。必须排出残留树脂，是因为残留树脂会在后固化或储存过程中发生暗反应，固化收缩并引起制件变形；内部封闭时应设计排液孔或成形后钻孔排液。SLA制件表面还会留下约0.05～0.1mm的层间台阶，需要打磨。","src":"课件","srcnote":"第四章 增材制造技术 4.2.1/4.2.3","full":10,"pts":[{"t":"利用光能的化学和热作用使液态光敏树脂固化，控制光能形状逐层固化树脂，堆积成形三维实体；国际上通称stereolithography（SL/SLA）。","k":["光能","光敏树脂","固化","逐层","SLA"]},{"t":"全过程分前处理、分层叠加成形、后处理：前处理包括建模、近似处理、选择成形方向、切片、生成支撑；分层叠加由模型断面逐层制作并叠加。","k":["前处理","分层叠加","后处理","切片","支撑"]},{"t":"后处理包括取出制件、排出未固化树脂、表面清洗、后固化、去除支撑、机械加工和打磨；层间台阶约0.05~0.1mm。","k":["排出","清洗","后固化","去支撑","打磨","0.05"]},{"t":"必须排出残留树脂，因为残留树脂在后固化或储存中发生暗反应，固化收缩引起制件变形；内部封闭时需在设计时开排液孔或成形后钻孔。","k":["暗反应","收缩","变形","排液孔"]}],"basis":"第四章 4.2 光固化制造技术"},{"id":"ez03","ch":"增材制造","chname":"增材制造技术","q":"SLM对金属粉末有哪些主要要求？粉末的球形度、粒径分布、流动性和含氧量如何影响成形质量？","ans":"SLM对金属粉末的堆积特性、粒径分布、颗粒形状、流动性、含氧量和激光吸收率均有较严格的要求。铺粉时宜采用振实密度；颗粒球形度增加、表面更光滑时，粉末床孔隙率降低。气雾化粉末接近球形，旋转电极法制备的粉末球形度更高、表面更光洁、孔隙率更低。采用二组分体系级配可提高铺粉致密度；旋转电极粉末颗粒间以滚动摩擦为主，流动性好，与气雾化粉混合可利用滚珠效应改善流动性。粉末含氧量一般要求≤1000ppm；表面氧化膜会降低液态金属与基板或已凝固部分的润湿性，导致制件分层和裂纹、降低致密度。激光波长越短，金属对激光的吸收率越高。","anstext":"SLM对金属粉末的堆积特性、粒径分布、颗粒形状、流动性、含氧量和激光吸收率均有较严格的要求。铺粉时宜采用振实密度；颗粒球形度增加、表面更光滑时，粉末床孔隙率降低。气雾化粉末接近球形，旋转电极法制备的粉末球形度更高、表面更光洁、孔隙率更低。采用二组分体系级配可提高铺粉致密度；旋转电极粉末颗粒间以滚动摩擦为主，流动性好，与气雾化粉混合可利用滚珠效应改善流动性。粉末含氧量一般要求≤1000ppm；表面氧化膜会降低液态金属与基板或已凝固部分的润湿性，导致制件分层和裂纹、降低致密度。激光波长越短，金属对激光的吸收率越高。","src":"课件","srcnote":"第四章 增材制造技术 4.3.1/4.3.2","full":10,"pts":[{"t":"SLM对粉末的堆积特性、粒径分布、颗粒形状、流动性、含氧量和激光吸收率均有较严格要求。","k":["堆积特性","粒径分布","颗粒形状","流动性","含氧量","吸收率"]},{"t":"铺粉宜用振实密度；球形度增加、表面更光滑时孔隙率降低；气雾化粉接近球形，旋转电极粉球形度更高、表面更光洁、孔隙率更低。","k":["振实密度","球形度","孔隙率","气雾化","旋转电极"]},{"t":"采用二组分粒径级配可提高铺粉致密度；旋转电极粉滚动摩擦小、流动性好，混合后可利用滚珠效应改善流动性。","k":["二组分","级配","流动性","滚珠效应"]},{"t":"粉末含氧量一般要求≤1000ppm；氧化膜降低液态金属与基板/已凝固部分的润湿性，导致分层和裂纹、降低致密度；激光波长越短，金属吸收率越高。","k":["1000ppm","氧化膜","润湿性","分层","裂纹","波长"]}],"basis":"第四章 4.3 激光选区熔化技术"},{"id":"ez04","ch":"增材制造","chname":"增材制造技术","q":"增材制造技术有哪些主要特点和局限？其发展趋势是什么？","ans":"增材制造的主要特点：适合复杂结构的快速制造，把三维实体加工变为若干二维平面加工，可制造传统方法难加工甚至无法加工的结构；适合个性化定制和小批量生产；适合高附加值产品的制造。主要局限：技术成熟度低于传统机加工、铸锻焊和模具工艺；材料种类有限、制件精度较低；加工速率较低、零件尺寸受限（最大约2m）、成本高、稳定性差；目前难以替代传统制造工艺，而是传统技术的发展和补充。发展趋势：由快速原型向功能零件制造发展；由常规尺度制造向微纳和大型化等多尺度制造拓展；由工业应用型向日常消费型发展。","anstext":"增材制造的主要特点：适合复杂结构的快速制造，把三维实体加工变为若干二维平面加工，可制造传统方法难加工甚至无法加工的结构；适合个性化定制和小批量生产；适合高附加值产品的制造。主要局限：技术成熟度低于传统机加工、铸锻焊和模具工艺；材料种类有限、制件精度较低；加工速率较低、零件尺寸受限（最大约2m）、成本高、稳定性差；目前难以替代传统制造工艺，而是传统技术的发展和补充。发展趋势：由快速原型向功能零件制造发展；由常规尺度制造向微纳和大型化等多尺度制造拓展；由工业应用型向日常消费型发展。","src":"课件","srcnote":"第四章 增材制造技术 4.1.3/4.1.6","full":10,"pts":[{"t":"特点：适合复杂结构快速制造，将三维加工变为二维平面加工，可制造传统方法难加工或无法加工的结构；适合个性化定制和小批量；适合高附加值产品。","k":["复杂结构","二维平面","个性化","小批量","高附加值"]},{"t":"局限：技术成熟度低于传统机加工、铸锻焊和模具工艺；材料种类有限、制件精度较低；加工速率低、尺寸受限、成本高、稳定性差。","k":["成熟度","材料种类","精度","尺寸","成本","稳定性"]},{"t":"增材制造目前难以替代传统制造工艺，而是传统技术的发展和补充。","k":["难以替代","补充"]},{"t":"趋势：由快速原型向功能零件制造发展；由常规尺度向微纳和大型化等多尺度拓展；由工业应用型向日常消费型发展。","k":["快速原型","功能零件","微纳","大型化","日常消费"]}],"basis":"第四章 4.1 增材制造特点与发展趋势"}];
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => String(s||'').replace(/[\s\u3000]/g,'').replace(/[⁰¹²³⁴⁵⁶⁷⁸⁹]/g, m=>'0123456789'['⁰¹²³⁴⁵⁶⁷⁸⁹'.indexOf(m)]).replace(/[×xX*]/g,'x').replace(/\^/g,'').replace(/[～~]/g,'~').replace(/[-－—]/g,'~').replace(/[（）()]/g,'').toLowerCase();
const core = s => { const m = String(s||'').split(/[（(]/)[0]; return m.trim(); };
let db = load();
function load(){
  let d; try{ const raw = localStorage.getItem(DB_KEY); if(raw) d = JSON.parse(raw); }catch(e){}
  if(!d) d = {answers:{}, stars:{}, mastery:{}, wrongs:{}};
  if(!d.wrongs) d.wrongs = {};
  const migrate = obj => { let touched=false; Object.keys(obj).forEach(k=>{ if(/^\d+$/.test(k)){ const nk='q'+k; if(obj[nk]===undefined){ obj[nk]=obj[k]; delete obj[k]; touched=true; } } }); return touched; };
  const changed = migrate(d.answers) | migrate(d.stars) | migrate(d.wrongs);
  if(changed) try{ localStorage.setItem(DB_KEY, JSON.stringify(d)); }catch(e){}
  return d;
}
function save(){ try{ localStorage.setItem(DB_KEY, JSON.stringify(db)); }catch(e){} }
function isCorrect(i){ const q = QUIZ_DATA[i]; const u = db.answers[q.id]; if(u===undefined||u==='') return null;
  if(q.type==='mcq') return u===q.ans;
  if(q.type==='term'||q.type==='essay') return u==='ok';
  const un=norm(u), an=norm(q.ans), cn=norm(core(q.ans));
  return un===an || un===cn || (un.length>=2 && an.includes(un)); }
function wrongIds(){ const r=[]; QUIZ_DATA.forEach((q,i)=>{ if(isCorrect(i)===false) r.push(i); }); return r; }
function answeredCount(){ return Object.keys(db.answers).filter(i=>db.answers[i]!=='').length; }
function accRate(){ const a=answeredCount(); if(!a) return 0; let c=0; QUIZ_DATA.forEach((_,i)=>{ if(isCorrect(i)) c++; }); return Math.round(c/a*100); }
function updateGauge(){
  const a=answeredCount(); $('g-done').textContent=a;
  $('g-total').textContent='/'+QUIZ_DATA.length;
  $('g-acc').textContent=accRate()+'%';
  const pct=a/QUIZ_DATA.length, R=16, C=2*Math.PI*R;
  $('g-ring').style.strokeDashoffset=C*(1-pct);
}
let session = null; // {list:[...], idx, title, wrongMode}
let filters = {ch:'全部', type:'全部', order:'顺序'};
let wfilter = {ch:'全部', type:'全部'};
let speedIdx = 0;
const IS_MOBILE = /Android|iPhone|iPad|iPod|Mobile|MicroMessenger|Opera Mini/i.test(navigator.userAgent) || innerWidth<=900;
if(IS_MOBILE && !location.hash){ filters.order='随机'; } // 移动端默认随机刷题
let route = location.hash.replace('#/','') || (IS_MOBILE ? 'quiz' : 'home');

function render(){
  const el = $('view');
  const wrongRunning = route==='quiz' && session && session.wrongMode;
  document.querySelectorAll('[data-route]').forEach(b=>b.classList.toggle('on', b.dataset.route===route || (b.dataset.route==='wrong' && wrongRunning)));
  document.querySelectorAll('.chfilter button').forEach(b=>b.classList.toggle('on', b.dataset.ch===filters.ch));
  document.querySelectorAll('.quicknav button').forEach(b=>b.classList.toggle('on', b.dataset.qroute===route));
  if(route==='home') el.innerHTML=viewHome();
  else if(route==='quiz') { if(!session) buildSession(false); el.innerHTML=viewQuiz(); bindQuiz(); }
  else if(route==='wrong') { el.innerHTML=viewWrong(); bindWrong(); }
  else if(route==='speed') { if(speedIdx>=SPEED_DATA.length)speedIdx=0; el.innerHTML=viewSpeed(); bindSpeed(); }
  else if(route==='stats') el.innerHTML=viewStats();
  else if(route==='notes'){ el.innerHTML=viewNotes(); bindNotes(); }
  else if(route==='framework') el.innerHTML=viewFramework();
  else if(route==='stars') el.innerHTML=viewStars();
  else if(route==='essay'){ el.innerHTML=viewEssay(); bindEssay(); }
  updateGauge();
  updateTabs();
  document.querySelectorAll('[data-goto]').forEach(el=>el.addEventListener('click', ()=>{ route=el.dataset.goto; location.hash='#/'+route; render(); }));
  document.querySelectorAll('[data-goto-wrong]').forEach(el=>el.addEventListener('click', ()=>{ const wi=Number(el.dataset.gotoWrong); const wq=QUIZ_DATA[wi]; startWrongSession([wi], '单题 · '+(wq?wq.ch:'')); }));
  document.querySelectorAll('[data-goto-star]').forEach(el=>el.addEventListener('click', ()=>{ buildSession(false); session.list=[Number(el.dataset.gotoStar)]; session.idx=0; route='quiz'; location.hash='#/quiz'; render(); }));
}
function updateTabs(){
  document.querySelectorAll('.bottomnav button').forEach(b=>{
    let on=false;
    const wrongMode = route==='quiz' && session && session.wrongMode;
    if(b.dataset.tab==='random') on = (route==='quiz' && filters.order==='随机' && !wrongMode);
    else if(b.dataset.tab==='chapter') on = (route==='quiz' && filters.order!=='随机' && !wrongMode);
    else if(b.dataset.tab==='stars') on = (route==='stars');
    else if(b.dataset.route) on = (b.dataset.route===route || (b.dataset.route==='wrong' && wrongMode));
    b.classList.toggle('on', on);
  });
}
function openChPanel(){
  const grid=$('chgrid');
  grid.innerHTML = CHS.map(c=>{
