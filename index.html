function buildSession(fromWrong){
  const wrongMode = !!fromWrong;
  let base;
  if(wrongMode){ base = wrongIds(); }
  else {
    base = [];
    QUIZ_DATA.forEach((q,i)=>{ if(filters.ch==='全部'||q.ch===filters.ch) if(filters.type==='全部'||q.type===filters.type) base.push(i); });
    if(filters.order==='随机') base = shuffle(base);
  }
  session = {list:base, idx:0, wrongMode, title: wrongMode?'错题重刷':('刷题 · '+(filters.ch==='全部'?'全部章节':filters.ch)+(filters.type==='全部'?'':TYPES[filters.type])), scopeLabel: wrongMode?'全部错题':'', retryDone:{}};
}
function wrongScopeList(){
  return wrongIds().filter(i=>{
    const q=QUIZ_DATA[i];
    return (wfilter.ch==='全部'||q.ch===wfilter.ch) && (wfilter.type==='全部'||q.type===wfilter.type);
  }).sort((a,b)=>(db.wrongs[QUIZ_DATA[b].id]||0)-(db.wrongs[QUIZ_DATA[a].id]||0)||a-b);
}
function wrongScopeLabel(){
  const ch=wfilter.ch==='全部'?'全部章节':wfilter.ch;
  const ty=wfilter.type==='全部'?'':TYPES[wfilter.type];
  return ty?ch+' · '+ty:ch;
}
function startWrongSession(list,label){
  if(!list||!list.length) return false;
  session={list:list.slice(),idx:0,wrongMode:true,title:'错题重刷',scopeLabel:label||'全部错题',retryDone:{}};
  route='quiz'; location.hash='#/quiz'; render(); return true;
}
function shuffle(a){ const r=a.slice(); for(let i=r.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [r[i],r[j]]=[r[j],r[i]]; } return r; }
function viewQuiz(){
  if(!session) return '';
  if(!session.list.length){
    const why = session.wrongMode ? '太棒了，当前没有错题。' : '当前筛选条件下没有题目。';
    return `<section class="page"><div class="empty"><div class="big">✓</div>${why}${session.wrongMode?'<br><button class="wstartbtn" data-goto="wrong">返回错题本</button>':'<br>请调整章节或题型筛选。'}</div></section>`;
  }
  if(session.idx>=session.list.length) session.idx=0;
  const i = session.list[session.idx], q = QUIZ_DATA[i];
  const state = isCorrect(i);
  const hasAnswer = db.answers[q.id]!==undefined && db.answers[q.id]!=='';
  const done = session.wrongMode ? (hasAnswer && !!(session.retryDone&&session.retryDone[q.id])) : hasAnswer;
  const isReview = q.type==='term'||q.type==='essay';
  const opts = (!isReview && q.type==='mcq') ? q.options.map((o,k)=>{

function bindQuiz(){
  if(!session||!session.list.length) return;
  const i = session.list[session.idx], q = QUIZ_DATA[i];
  const answeredNow = db.answers[q.id]!==undefined && db.answers[q.id]!=='';
  const doneNow = session.wrongMode ? (answeredNow && !!(session.retryDone&&session.retryDone[q.id])) : answeredNow;
  const markDone = ()=>{ if(session.wrongMode){ session.retryDone=session.retryDone||{}; session.retryDone[q.id]=true; } };
  const openCh=$('open-ch'); if(openCh) openCh.addEventListener('click', openChPanel);
  const ftype=$('f-type'); if(ftype) ftype.addEventListener('change', e=>{ filters.type=e.target.value; buildSession(false); render(); });
  const forder=$('f-order'); if(forder) forder.addEventListener('click', ()=>{ filters.order = filters.order==='随机'?'顺序':'随机'; buildSession(false); render(); });
  const backwrong=$('backwrong'); if(backwrong) backwrong.addEventListener('click', ()=>{ session=null; route='wrong'; location.hash='#/wrong'; render(); });
  $('qprev').addEventListener('click', ()=>{ if(session.idx>0){ session.idx--; render(); } });
  $('qnext').addEventListener('click', ()=>{ if(session.idx<session.list.length-1){ session.idx++; render(); } else { const wasWrong=session.wrongMode; session=null; route=wasWrong?'wrong':'stats'; location.hash='#/'+route; render(); } });
  $('qsheet').addEventListener('click', openSheet);
  const star=document.querySelector('.star'); if(star) star.addEventListener('click', ()=>{ db.stars[q.id]=!db.stars[q.id]; save(); render(); });
  const reveal=$('reveal'); if(reveal) reveal.addEventListener('click', ()=>{ $('anscard').classList.toggle('show'); reveal.classList.toggle('on'); reveal.textContent=$('anscard').classList.contains('show')?'收起参考答案':'查看参考答案'; });
  document.querySelectorAll('[data-selfev]').forEach(b=>b.addEventListener('click', ()=>{ const ev=b.dataset.selfev; if(ev==='no'&&db.answers[q.id]!=='no') db.wrongs[q.id]=(db.wrongs[q.id]||0)+1; db.answers[q.id]=ev; markDone(); save(); render(); }));
  document.querySelectorAll('.opt').forEach(o=>o.addEventListener('click', ()=>{ if(doneNow)return; const chosen=o.dataset.opt; db.answers[q.id]=chosen; if(!isCorrect(i)) db.wrongs[q.id]=(db.wrongs[q.id]||0)+1; markDone(); save(); render(); }));
  const fillin=$('fillin'), fillgo=$('fillgo');
  if(fillin&&fillgo){
    fillgo.addEventListener('click', ()=>{ const v=fillin.value; if(!v.trim())return; db.answers[q.id]=v.trim(); if(!isCorrect(i)) db.wrongs[q.id]=(db.wrongs[q.id]||0)+1; markDone(); save(); render(); });
    fillin.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); fillgo.click(); } });
  }
  const key = e => {
    if(route!=='quiz') return;
    if(q.type==='mcq' && !doneNow){
      const n=parseInt(e.key,10); if(n>=1&&n<=q.options.length){ const chosen='ABCD'[n-1]; db.answers[q.id]=chosen; if(!isCorrect(i)) db.wrongs[q.id]=(db.wrongs[q.id]||0)+1; markDone(); save(); render(); }
    }
    if((q.type==='term'||q.type==='essay') && (e.key===' '||e.code==='Space')){ e.preventDefault(); const r=$('reveal'); if(r) r.click(); }
  };
  window.__quizKey = key;
}

function viewStats(){
  const a=answeredCount(), acc=accRate(), wrong=wrongIds().length;
  const chRows = CHS.slice(1).map(ch=>{
    const qs=[]; QUIZ_DATA.forEach((q,i)=>{ if(q.ch===ch) qs.push(i); });
    let done=0, okc=0; qs.forEach(i=>{ const st=isCorrect(i); if(st!==null){done++; if(st)okc++;} });
    const pct = done?Math.round(okc/done*100):0;
    const fillPct = done?Math.round(done/qs.length*100):0;
    return `<div class="cbar"><span class="lbl">${ch}</span><span class="track"><span class="fill" style="width:${fillPct}%"></span></span><span class="val">${okc}/${done} 对 · <b>${pct}%</b></span></div>`;
  }).join('');
  const typeRows = [['mcq','单项选择题'],['fill','填空题'],['term','名词解释'],['essay','简答题']].map(([t,label])=>{
    const total = QUIZ_DATA.filter(x=>x.type===t).length;
    let done=0, okc=0; QUIZ_DATA.forEach((q,i)=>{ if(q.type!==t)return; const st=isCorrect(i); if(st!==null){done++; if(st)okc++;} });
    const pct = done?Math.round(okc/done*100):0;
    return `<div class="cbar"><span class="lbl">${label}</span><span class="track"><span class="fill" style="width:${total?Math.round(done/total*100):0}%"></span></span><span class="val">${okc}/${done} 对 · <b>${pct}%</b></span></div>`;
  }).join('');
  return `<section class="page">
    <div class="hdr"><h2>学习统计</h2><span class="sub">正确率按已答题目计算</span><div class="sp"><button class="danger" id="resetall">重置全部进度</button></div></div>

  const cpb = e.target.closest('[data-chpanel]');
  if(cpb){ filters.ch=cpb.dataset.chpanel; filters.order='顺序'; route='quiz'; session=null; closeChPanel(); location.hash='#/quiz'; render(); return; }
  if(e.target.closest('#chmask') || e.target.closest('[data-close="ch"]')) closeChPanel();
});
document.querySelectorAll('.chfilter button').forEach(b=>b.addEventListener('click', ()=>{ filters.ch=b.dataset.ch; if(route==='quiz'){ buildSession(false); } else { route='quiz'; location.hash='#/quiz'; } render(); }));
window.addEventListener('hashchange', ()=>{ route=location.hash.replace('#/','')||'home'; render(); });
document.addEventListener('keydown', e=>{
  if(route==='quiz' && session && session.list.length){
    const qi=session.list[session.idx], qq=QUIZ_DATA[qi];
    const answered=qq&&db.answers[qq.id]!==undefined&&db.answers[qq.id]!=='';
    const done=qq?(session.wrongMode?(answered&&!!(session.retryDone&&session.retryDone[qq.id])):answered):false;
    if(window.__quizKey) window.__quizKey(e);
    if(e.key==='Enter'&&$('qnext')&&done){ e.preventDefault(); $('qnext').click(); }
    if(e.key==='ArrowLeft'&&$('qprev')){ $('qprev').click(); }
    if(e.key==='ArrowRight'&&$('qnext')&&done){ e.preventDefault(); $('qnext').click(); }
  }
  if(e.key==='Escape') closeSheet();
});
render();
</script>
</body>
</html>
