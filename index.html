      const n=parseInt(e.key,10); if(n>=1&&n<=q.options.length){ const chosen='ABCD'[n-1]; db.answers[q.id]=chosen; if(!isCorrect(i)) db.wrongs[q.id]=(db.wrongs[q.id]||0)+1; markDone(); save(); render(); }
    }
    if((q.type==='term'||q.type==='essay') && (e.key===' '||e.code==='Space')){ e.preventDefault(); const r=$('reveal'); if(r) r.click(); }
  };
  window.__quizKey = key;
}
/* ================= 收藏 ================= */
function viewStars(){
  const ids=[]; QUIZ_DATA.forEach((q,i)=>{ if(db.stars[q.id]) ids.push(i); });
  if(!ids.length) return `<div class="page"><div class="empty"><div class="big"><svg viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="color:#e8a33c"><path d="m12 3 2.9 5.9 6.5 1-4.7 4.6 1.1 6.5L12 18.3l-5.8 2.7 1.1-6.5-4.7-4.6 6.5-1z"/></svg></div>还没有收藏题目。<br>刷题时点击题目右上角的星标即可收藏，方便集中复习。</div></div>`;
  const rows = ids.slice().reverse().map(i=>{
    const q=QUIZ_DATA[i];
    const st=isCorrect(i);
    const state = st===null?'未答':(st?'已答对':'已答错');
    return `<div class="wrow starlist" data-goto-star="${i}"><span class="tag">${q.ch}</span><span class="tag t4">错 ${db.wrongs[q.id]||0} 次</span><span class="qt">${esc(q.q)}</span><span class="ans">${state}</span></div>`;
  }).join('');
  return `<section class="page">
    <div class="hdr"><h2>收藏题目</h2><span class="sub">共 ${ids.length} 道 · 点击题目即可进入复习</span></div>
    <div class="wronglist">${rows}</div>
  </section>`;
}
/* ================= 错题本 ================= */
function viewWrong(){
  const ids=wrongIds();
  if(!ids.length){
    return `<section class="page">
      <div class="hdr"><h2>错题本</h2><span class="sub">当前没有待重刷错题</span></div>
      <div class="empty"><div class="big">✓</div><b>错题已经清空</b><br>继续刷题，答错的题目会自动进入这里。<button class="wstartbtn" data-goto="quiz">去刷题</button></div>
    </section>`;
  }
  const chKeys=CHS.filter(c=>c==='全部'||ids.some(i=>QUIZ_DATA[i].ch===c));
  const typeKeys=['全部','mcq','fill','term','essay'].filter(t=>t==='全部'||ids.some(i=>QUIZ_DATA[i].type===t));
  if(!chKeys.includes(wfilter.ch)) wfilter.ch='全部';
  if(!typeKeys.includes(wfilter.type)) wfilter.type='全部';
  const list=wrongScopeList();
  const chCount=new Set(ids.map(i=>QUIZ_DATA[i].ch)).size;
  const typeCount=new Set(ids.map(i=>QUIZ_DATA[i].type)).size;
  const chOptions=chKeys.map(c=>`<option value="${esc(c)}" ${wfilter.ch===c?'selected':''}>${esc(c==='全部'?'全部章节':c)}（${c==='全部'?ids.length:ids.filter(i=>QUIZ_DATA[i].ch===c).length}）</option>`).join('');
  const typeOptions=typeKeys.map(t=>`<option value="${t}" ${wfilter.type===t?'selected':''}>${esc(t==='全部'?'全部题型':TYPES[t])}（${t==='全部'?ids.length:ids.filter(i=>QUIZ_DATA[i].type===t).length}）</option>`).join('');
  const rows=list.map(i=>{
    const q=QUIZ_DATA[i];
    const isRev=q.type==='term'||q.type==='essay';
    const cnt=db.wrongs[q.id]||0;
    const ans=q.type==='mcq'?(q.ansText||q.ans):(q.type==='fill'?q.ans:'进入后查看参考答案');
    return `<button type="button" class="wcard" data-goto-wrong="${i}">
      <div class="wctop"><span class="tag">${esc(q.ch)}</span><span class="tag t3">${esc(TYPES[q.type])}</span><span class="tag ${cnt?'t4':'t3'}">${cnt?'错 '+cnt+' 次':'待重刷'}</span><span class="wgo">单题重刷 <span aria-hidden="true">›</span></span></div>
      <div class="wcq">${esc(q.q).replace(/____/g,'＿＿')}</div>
      <div class="wans"><span>答案</span><b>${esc(ans)}</b></div>
    </button>`;
  }).join('');
  const empty=list.length?'':`<div class="wempty"><div class="big">∅</div><b>这个范围里没有错题</b><span>换一个章节或题型，或查看全部错题。</span></div>`;
  const target=list.length?`开始重刷这 ${list.length} 题`:'当前范围没有可重刷题目';
  return `<section class="page">
    <div class="hdr"><h2>错题本</h2><span class="sub">先定范围，再集中重刷；答对后会自动移出错题本</span></div>
    <div class="wsum"><div><b>${ids.length}</b><span>道待重刷</span></div><div><b>${chCount}</b><span>个章节</span></div><div><b>${typeCount}</b><span>种题型</span></div></div>
    <div class="wscope">
      <div class="wscopehead"><b>① 选定重刷范围</b><span>当前 ${list.length} 题</span></div>
      <div class="wselects">
        <label class="wfield"><span>章节</span><select id="w-ch" aria-label="错题章节范围">${chOptions}</select></label>
        <label class="wfield"><span>题型</span><select id="w-type" aria-label="错题题型范围">${typeOptions}</select></label>
      </div>
      <div class="wscopehint">题目按错误次数从多到少排列；范围越窄，越适合集中突破。</div>
      <button class="wstartbtn" id="wrongstart" ${list.length?'':'disabled'}>② ${target} <span aria-hidden="true">→</span></button>
    </div>
    <div class="wlisthead"><b>${wfilter.ch==='全部'&&wfilter.type==='全部'?'全部错题':'本范围错题'}</b><span>${list.length} 题 · 点单题可只重刷这一道</span></div>
    ${rows?`<div class="wrongcards">${rows}</div>`:empty}
    <div class="wfoot"><span>清空只移除错题作答，已答对题和收藏不受影响。</span><button class="wclear" id="clearwrong">清空全部错题</button></div>
  </section>`;
}
function bindWrong(){
  const ch=$('w-ch');
  if(ch) ch.addEventListener('change',()=>{ wfilter.ch=ch.value; render(); });
  const ty=$('w-type');
  if(ty) ty.addEventListener('change',()=>{ wfilter.type=ty.value; render(); });
  const start=$('wrongstart');
  if(start) start.addEventListener('click',()=>{ const list=wrongScopeList(); if(list.length) startWrongSession(list,wrongScopeLabel()); });
  const clear=$('clearwrong');
  if(clear) clear.addEventListener('click',()=>{
    if(!confirm('清空全部错题记录？只移除错题作答，已答对题目和收藏不受影响。')) return;
    wrongIds().forEach(i=>{ const id=QUIZ_DATA[i].id; delete db.answers[id]; delete db.wrongs[id]; });
    db.wrongs={}; wfilter={ch:'全部',type:'全部'}; session=null; save(); render();
  });
}

/* ================= 速记 ================= */
function viewSpeed(){
  const s = SPEED_DATA[speedIdx];
  const mastered = !!db.mastery[speedIdx];
  return `<section class="page">
    <div class="hdr"><h2>高频考点速记</h2><span class="sub">考前快速回顾 · 共 ${SPEED_DATA.length} 条</span><div class="sp"><button class="danger ${mastered?'':'x'}" id="master" style="${mastered?'background:#e4f2ea;color:var(--ok);border-color:#bfe3cd':''}">${mastered?'✓ 已掌握':'标记掌握'}</button></div></div>
    <div class="speedcard">
      <div class="st"><i>${speedIdx+1}</i>高频考点一句话速记</div>
      <div class="txt">${esc(s)}</div>
    </div>
    <div class="speednav">
      <button id="sprev">上一张</button>
      <div class="mid">${speedIdx+1} / ${SPEED_DATA.length} · 已掌握 ${Object.keys(db.mastery).length} 条</div>
      <button id="srand">随机</button>
      <button id="snext">下一张</button>
    </div>
  </section>`;
}
function bindSpeed(){
  $('sprev').addEventListener('click', ()=>{ speedIdx=(speedIdx-1+SPEED_DATA.length)%SPEED_DATA.length; render(); });
  $('snext').addEventListener('click', ()=>{ speedIdx=(speedIdx+1)%SPEED_DATA.length; render(); });
  $('srand').addEventListener('click', ()=>{ speedIdx=Math.floor(Math.random()*SPEED_DATA.length); render(); });
  $('master').addEventListener('click', ()=>{ db.mastery[speedIdx]=!db.mastery[speedIdx]; save(); render(); });
}
/* ================= 统计 ================= */
function viewStats(){
  const a=answeredCount(), acc=accRate(), wrong=wrongIds().length;
  const chRows = CHS.slice(1).map(ch=>{
    const qs=[]; QUIZ_DATA.forEach((q,i)=>{ if(q.ch===ch) qs.push(i); });
    let done=0, okc=0; qs.forEach(i=>{ const st=isCorrect(i); if(st!==null){done++; if(st)okc++;} });
    const pct = done?Math.round(okc/done*100):0;
    const fillPct = done?Math.round(done/qs.length*100):0;
    return `<div class="cbar"><span class="lbl">${ch}</span><span class="track"><span class="fill" style="width:${fillPct}%"></span></span><span class="val">${okc}/${done} 对 · <b>${pct}%</b></span></div>`;
  }).join('');
  const typeRows = [['mcq','单项选择题'],['fill','填空题'],['term','名词解释'],['essay','简答题']].map(([t,label])=>{
    const total = QUIZ_DATA.filter(x=>x.type===t).length;
    let done=0, okc=0; QUIZ_DATA.forEach((q,i)=>{ if(q.type!==t)return; const st=isCorrect(i); if(st!==null){done++; if(st)okc++;} });
    const pct = done?Math.round(okc/done*100):0;
    return `<div class="cbar"><span class="lbl">${label}</span><span class="track"><span class="fill" style="width:${total?Math.round(done/total*100):0}%"></span></span><span class="val">${okc}/${done} 对 · <b>${pct}%</b></span></div>`;
  }).join('');
  return `<section class="page">
    <div class="hdr"><h2>学习统计</h2><span class="sub">正确率按已答题目计算</span><div class="sp"><button class="danger" id="resetall">重置全部进度</button></div></div>
    <div class="statsrow">
      <div class="sc"><div class="n">${a}</div><div class="l">已答 / ${QUIZ_DATA.length}</div></div>
      <div class="sc"><div class="n">${acc}%</div><div class="l">总体正确率</div></div>
      <div class="sc"><div class="n">${wrong}</div><div class="l">错题数</div></div>
      <div class="sc"><div class="n">${Object.keys(db.mastery).length}</div><div class="l">已掌握速记</div></div>
    </div>
    <div class="chname"><i></i>各章进度与正确率</div>
    ${chRows}
    <div class="chname"><i></i>题型正确率</div>
    ${typeRows}
  </section>`;
}
/* ================= 答题卡 ================= */
function openSheet(){
  const ids = session?session.list:QUIZ_DATA.map((_,i)=>i);
  const cur = session?session.list[session.idx]:-1;
  const cells = ids.map(i=>{
    const q=QUIZ_DATA[i];
    const st=isCorrect(i); let cls='', mark=String(i+1);
    if(st===true) cls='ok'; else if(st===false) cls='bad'; else if(db.answers[q.id]!==undefined&&db.answers[q.id]!=='') cls='done';
    if(i===cur) cls+=' cur';
    return `<button class="cell ${cls}" data-cell="${i}">${mark}</button>`;
  }).join('');
  $('sheet-sum').textContent = `（${ids.length} 题）`;
  $('sheetgrid').innerHTML = cells;
  $('sheetpanel').classList.add('show');
}
function closeSheet(){ $('sheetpanel').classList.remove('show'); }
/* ================= 全局事件 ================= */
document.addEventListener('click', e=>{
  const cell = e.target.closest('[data-cell]');
  if(cell){ const id=Number(cell.dataset.cell); const pos=session?session.list.indexOf(id):-1; if(pos>=0){ session.idx=pos; closeSheet(); render(); } }
  if(e.target.closest('[data-close="sheet"]')) closeSheet();
  const resetall=$('resetall'); if(resetall&&e.target===resetall){ db.answers={}; db.stars={}; db.mastery={}; db.wrongs={}; save(); render(); }
  const btn=$('btn-reset'); if(btn&&e.target===btn){ if(confirm('确定重置全部学习进度？此操作不可撤销。')){ db.answers={}; db.stars={}; db.mastery={}; save(); render(); } }
});
document.querySelectorAll('[data-route]').forEach(b=>b.addEventListener('click', ()=>{ route=b.dataset.route; if(route==='quiz') session=null; location.hash='#/'+route; render(); }));
document.querySelectorAll('.quicknav button').forEach(b=>b.addEventListener('click', ()=>{ route=b.dataset.qroute; location.hash='#/'+route; render(); }));
document.querySelectorAll('[data-tab="random"]').forEach(b=>b.addEventListener('click', ()=>{ filters.ch='全部'; filters.order='随机'; route='quiz'; session=null; location.hash='#/quiz'; render(); }));
document.querySelectorAll('[data-tab="chapter"]').forEach(b=>b.addEventListener('click', ()=>{ openChPanel(); }));
document.querySelectorAll('[data-tab="stars"]').forEach(b=>b.addEventListener('click', ()=>{ route='stars'; location.hash='#/stars'; render(); }));
document.addEventListener('click', e=>{
  const cpb = e.target.closest('[data-chpanel]');
  if(cpb){ filters.ch=cpb.dataset.chpanel; filters.order='顺序'; route='quiz'; session=null; closeChPanel(); location.hash='#/quiz'; render(); return; }
  if(e.target.closest('#chmask') || e.target.closest('[data-close="ch"]')) closeChPanel();
});
document.querySelectorAll('.chfilter button').forEach(b=>b.addEventListener('click', ()=>{ filters.ch=b.dataset.ch; if(route==='quiz'){ buildSession(false); } else { route='quiz'; location.hash='#/quiz'; } render(); }));
window.addEventListener('hashchange', ()=>{ route=location.hash.replace('#/','')||'home'; render(); });
document.addEventListener('keydown', e=>{
  if(route==='quiz' && session && session.list.length){
    const qi=session.list[session.idx], qq=QUIZ_DATA[qi];
    const answered=qq&&db.answers[qq.id]!==undefined&&db.answers[qq.id]!=='';
    const done=qq?(session.wrongMode?(answered&&!!(session.retryDone&&session.retryDone[qq.id])):answered):false;
    if(window.__quizKey) window.__quizKey(e);
    if(e.key==='Enter'&&$('qnext')&&done){ e.preventDefault(); $('qnext').click(); }
    if(e.key==='ArrowLeft'&&$('qprev')){ $('qprev').click(); }
    if(e.key==='ArrowRight'&&$('qnext')&&done){ e.preventDefault(); $('qnext').click(); }
  }
  if(e.key==='Escape') closeSheet();
});
render();
</script>
</body>
</html>
