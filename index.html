"q200", "orig": -1}, {"ch": "第五章", "chname": "焊接裂纹", "type": "mcq", "q": "焊接裂纹宏观分析中，母材和焊材的S、P、O含量较多时，易产生的裂纹是（　）A. 层状撕裂　B. 冷裂纹　C. 再热裂纹　D. 多边化裂纹", "options": ["层状撕裂", "冷裂纹", "再热裂纹", "多边化裂纹"], "ans": "A", "anstext": "层状撕裂", "id": "q201", "orig": -1}, {"ch": "第五章", "chname": "焊接裂纹", "type": "fill", "q": "断口分析中，沿晶粒界面断裂、断口呈冰糖状、多与氢脆、回火脆性、蠕变相关的断裂形式是____断裂。", "ans": "沿晶", "id": "q202", "orig": -1}, {"ch": "第五章", "chname": "焊接裂纹", "type": "mcq", "q": "结晶裂纹产生的两个基本条件是（　）A.结晶区间存在液态薄膜+焊接拉应力　B.含氢量高+拘束度大　C.粗大晶粒+晶界析出　D.腐蚀介质+拉应力", "options": ["结晶区间存在液态薄膜+焊接拉应力", "含氢量高+拘束度大", "粗大晶粒+晶界析出", "腐蚀介质+拉应力"], "ans": "A", "anstext": "结晶区间存在液态薄膜+焊接拉应力", "id": "q263", "orig": -1}, {"ch": "第五章", "chname": "焊接裂纹", "type": "fill", "q": "层状撕裂宏观断口呈阶梯状，由平行于轧制面的____（平台）和剪切壁组成。", "ans": "平台状断口", "id": "q264", "orig": -1}, {"ch": "第五章", "chname": "焊接裂纹", "type": "term", "q": "冷裂纹（延迟裂纹）", "ans": "焊接接头冷却到较低温度（Ms点以下）时产生的裂纹，主要发生在热影响区，具有延迟性。与淬硬组织、扩散氢、拘束应力三要素有关。", "id": "q303", "orig": -1}, {"ch": "第五章", "chname": "焊接裂纹", "type": "term", "q": "热裂纹（结晶裂纹）", "ans": "焊接过程中在液相线附近（凝固结晶期间）沿晶界产生的裂纹，多发生在焊缝中心。产生条件是结晶区间存在液态薄膜和焊接拉应力。", "id": "q304", "orig": -1}, {"ch": "第五章", "chname": "焊接裂纹", "type": "term", "q": "再热裂纹", "ans": "焊后对焊接接头再次加热（消除应力热处理或多层焊后层间再次受热）时，在热影响区粗晶区产生的沿晶裂纹，与沉淀强化元素（Cr、Mo、V等）和拘束应力有关。", "id": "q305", "orig": -1}, {"ch": "第五章", "chname": "焊接裂纹", "type": "term", "q": "层状撕裂", "ans": "厚板角接焊缝在焊接收缩应力（z向拉应力）作用下，沿轧制方向平行于板面的夹杂物（MnS等）界面产生的阶梯状撕裂，宏观断口呈台阶状。", "id": "q306", "orig": -1}, {"ch": "第五章", "chname": "焊接裂纹", "type": "term", "q": "液化裂纹", "ans": "焊接热循环作用下，母材或焊道中沿晶界分布的低熔点共晶（或晶界偏析物）重新熔化形成液态薄膜，在收缩应力作用下沿晶界开裂产生的裂纹，属热裂纹。", "id": "q307", "orig": -1}, {"ch": "第五章", "chname": "焊接裂纹", "type": "term", "q": "应力腐蚀裂纹", "ans": "焊接接头在腐蚀介质与拉应力共同作用下产生的延迟开裂。多发生在敏感材料与特定介质组合（如奥氏体不锈钢的Cl⁻环境）。", "id": "q308", "orig": -1}, {"ch": "第五章", "chname": "焊接裂纹", "type": "term", "q": "氢脆（白点）", "ans": "钢中氢含量过高时，在拉伸应力或内应力作用下，氢聚集于缺陷处导致塑性急剧下降的现象；在焊缝断口上表现为圆形银白色斑点（白点）。", "id": "q309", "orig": -1}, {"ch": "第五章", "chname": "焊接裂纹", "type": "essay", "q": "焊接冷裂纹（延迟裂纹）的产生条件有哪些？如何防治？", "ans": "①三要素：淬硬组织（马氏体等）、扩散氢的聚集、拘束应力（拉应力）三者共同作用，缺一不可；冷裂纹具有延迟性（焊后数小时~数天出现）。②防治措施：选用低氢焊条焊剂、烘干焊材、清理坡口油锈，降低氢源；合理预热、控制冷却速度防止淬硬组织（减小淬硬倾向）；控制拘束度、合理坡口设计、减小残余应力；焊后立即后热（消氢处理250℃×6h或350℃×1h）；焊后及时进行消除应力热处理；必要时选用奥氏体焊材（氢扩散系数小）。", "id": "q346", "orig": -1}, {"ch": "第五章", "chname": "焊接裂纹", "type": "essay", "q": "焊接热裂纹（结晶裂纹）的形成机理及防治措施是什么？", "ans": "①机理：焊缝凝固结晶后期，晶界残留低熔点液态薄膜（富S、P共晶等），在焊接拉应力作用下沿晶界开裂；产生条件为结晶区间存在液态薄膜+焊接拉应力。②防治：控制焊缝中S、P含量（限制母材焊材、碱性渣脱硫脱磷）；加入细化晶粒元素（Ti、V、Mo、Nb）减少柱状晶、细化晶粒；改善焊缝成形（增大成形系数φ=B/H，避免窄深焊缝）；控制焊接参数（减小电流、降低焊速、调整热输入）改善结晶方向；选用适当的焊接材料降低结晶温度区间；对易裂结构采用预热、减小拘束应力。", "id": "q347", "orig": -1}, {"ch": "第五章", "chname": "焊接裂纹", "type": "essay", "q": "再热裂纹的产生机理是什么？如何防治？", "ans": "①机理：焊后再次加热（消除应力热处理或多层焊后层受热）时，HAZ粗晶区晶界处沉淀强化元素（Cr、Mo、V、Nb、Ti等）的碳化物在晶界析出、晶内强化减弱，晶界弱化，在残余应力和外加应力作用下沿晶界开裂；多发生于低合金高强钢、珠光体耐热钢厚板接头HAZ粗晶区，加热到600℃左右敏感。②防治：选用再热裂纹敏感性低的母材和焊材（控制Cr、Mo、V含量）；合理设计坡口降低拘束度；选用低预热+合理线能量控制粗晶区晶粒度；避免在不敏感温度区间长时间停留，合理选择消除应力处理温度（避开敏感区）；焊后尽快进行热处理并控制加热速度。", "id": "q348", "orig": -1}, {"ch": "第五章", "chname": "焊接裂纹", "type": "essay", "q": "层状撕裂的特征是什么？说明其机理和防治措施。", "ans": "①特征：厚板（T形接头、角接）焊接时，在焊接收缩产生的z向（板厚方向）拉应力作用下，沿平行于轧制面的夹杂物界面开裂，宏观断口呈阶梯状（平台+剪切壁），故称层状撕裂。②机理：钢中轧制时沿轧向分布的MnS等片状夹杂物使板厚方向（z向）塑韧性极低，焊接z向收缩应力超过夹杂物界面结合强度时，以夹杂物为核心萌生裂纹并沿夹杂物平面扩展，形成平台，相邻平面间以剪切壁连接，呈阶梯状。③防治：选用z向性能好（硫含量低、夹杂物控制）的钢板；改变接头形式减小z向拘束与应力（如开坡口方向、采用过渡层）；采用低氢焊材、预热降低应力；控制焊接顺序减小收缩应力；对母材进行细化夹杂物处理。", "id": "q349", "orig": -1}, {"ch": "第六章", "chname": "钎焊", "type": "fill", "q": "钎焊通过液态钎料在母材表面或间隙中润湿、铺展、____填缝，凝固结晶后实现原子间结合。", "ans": "毛细流动", "id": "q203", "orig": -1}, {"ch": "第六章", "chname": "钎焊", "type": "mcq", "q": "下列不属于钎焊基本过程的是（　）A. 钎剂熔化及填缝　B. 钎料熔化及填满钎缝　C. 钎料同母材的相互作用　D. 母材自身的固态相变", "options": ["钎剂熔化及填缝", "钎料熔化及填满钎缝", "钎料同母材的相互作用", "母材自身的固态相变"], "ans": "D", "anstext": "母材自身的固态相变", "id": "q204", "orig": -1}, {"ch": "第六章", "chname": "钎焊", "type": "mcq", "q": "下列不属于钎焊优点的是（　）A. 加热温度较低、对母材组织和性能影响小　B. 工件变形小、易保证尺寸精度　C. 生产率高、可一次焊成多条钎缝　D. 接头强度总是高于母材", "options": ["加热温度较低、对母材组织和性能影响小", "工件变形小、易保证尺寸精度", "生产率高、可一次焊成多条钎缝", "接头强度总是高于母材"], "ans": "D", "anstext": "接头强度总是高于母材", "id": "q205", "orig": -1}, {"ch": "第六章", "chname": "钎焊", "type": "mcq", "q": "润湿与不润湿的分界线是润湿角θ（　）A. =0°　B. =90°　C. =45°　D. =180°", "options": ["=0°", "=90°", "=45°", "=180°"], "ans": "B", "anstext": "=90°", "id": "q206", "orig": -1}, {"ch": "第六章", "chname": "钎焊", "type": "mcq", "q": "大多数钎焊系统的润湿角θ取值范围为（　），θ小适于薄的接头。A. 45~90°　B. 10~45°　C. 90~135°　D. 0~5°", "options": ["45~90°", "10~45°", "90~135°", "0~5°"], "ans": "B", "anstext": "10~45°", "id": "q207", "orig": -1}, {"ch": "第六章", "chname": "钎焊", "type": "mcq", "q": "下列不属于影响钎料毛细流动因素的是（　）A. 毛细管驱动力　B. 熔化金属的密度和黏度　C. 接头几何形状　D. 母材抗拉强度等级", "options": ["毛细管驱动力", "熔化金属的密度和黏度", "接头几何形状", "母材抗拉强度等级"], "ans": "D", "anstext": "母材抗拉强度等级", "id": "q208", "orig": -1}, {"ch": "第六章", "chname": "钎焊", "type": "mcq", "q": "接头间隙对钎焊接头强度的影响：间隙较小时（　）A. 强度低　B. 强度高，钎缝强度甚至超过母材强度　C. 与母材强度无关　D. 一定产生裂纹", "options": ["强度低", "强度高，钎缝强度甚至超过母材强度", "与母材强度无关", "一定产生裂纹"], "ans": "B", "anstext": "强度高，钎缝强度甚至超过母材强度", "id": "q209", "orig": -1}, {"ch": "第六章", "chname": "钎焊", "type": "mcq", "q": "按钎料熔点分类，软钎焊温度低于（　），硬钎焊高于该温度。A. 450℃　B. 550℃　C. 800℃　D. 950℃", "options": ["450℃", "550℃", "800℃", "950℃"], "ans": "A", "anstext": "450℃", "id": "q210", "orig": -1}, {"ch": "第六章", "chname": "钎焊", "type": "mcq", "q": "下列不属于按热源种类和加热方法分类的钎焊方法是（　）A. 火焰钎焊　B. 炉中钎焊　C. 感应钎焊　D. 钎剂钎焊", "options": ["火焰钎焊", "炉中钎焊", "感应钎焊", "钎剂钎焊"], "ans": "D", "anstext": "钎剂钎焊", "id": "q211", "orig": -1}, {"ch": "第六章", "chname": "钎焊", "type": "mcq", "q": "按接头形式特点分类，依靠毛细作用使液态钎料填缝的钎焊是（　）A. 毛细钎焊　B. 非毛细钎焊　C. 扩散钎焊　D. 接触反应钎焊", "options": ["毛细钎焊", "非毛细钎焊", "扩散钎焊", "接触反应钎焊"], "ans": "A", "anstext": "毛细钎焊", "id": "q212", "orig": -1}, {"ch": "第六章", "chname": "钎焊", "type": "mcq", "q": "下列不属于火焰钎焊特点的是（　）A. 在空气中完成、通常需要使用钎剂　B. 设备初期投资低、操作技术容易掌握　C. 可加工任何数量的接头　D. 适用于高活性母材", "options": ["在空气中完成、通常需要使用钎剂", "设备初期投资低、操作技术容易掌握", "可加工任何数量的接头", "适用于高活性母材"], "ans": "D", "anstext": "适用于高活性母材", "id": "q213", "orig": -1}, {"ch": "第六章", "chname": "钎焊", "type": "fill", "q": "按熔化温度和接头强度分类，熔点Tm>950℃的钎料称为____钎料。", "ans": "高温", "id": "q214", "orig": -1}, {"ch": "第六章", "chname": "钎焊", "type": "mcq", "q": "下列不属于对钎料基本要求的是（　）A. 适当的熔点　B. 良好的润湿性、能铺展并充分填满间隙　C. 能与母材发生溶解扩散、形成牢固的冶金结合　D. 熔点越高越好", "options": ["适当的熔点", "良好的润湿性、能铺展并充分填满间隙", "能与母材发生溶解扩散、形成牢固的冶金结合", "熔点越高越好"], "ans": "D", "anstext": "熔点越高越好", "id": "q215", "orig": -1}, {"ch": "第六章", "chname": "钎焊", "type": "mcq", "q": "下列不属于钎焊接头缺陷类型的是（　）A. 钎缝不致密性　B. 母材自裂　C. 溶蚀　D. 冷裂纹", "options": ["钎缝不致密性", "母材自裂", "溶蚀", "冷裂纹"], "ans": "D", "anstext": "冷裂纹", "id": "q216", "orig": -1}, {"ch": "第六章", "chname": "钎焊", "type": "mcq", "q": "母材向钎料中溶解过度、在表面出现溶坑的钎焊缺陷是（　）A. 母材自裂　B. 溶蚀　C. 未填满　D. 气孔", "options": ["母材自裂", "溶蚀", "未填满", "气孔"], "ans": "B", "anstext": "溶蚀", "id": "q217", "orig": -1}, {"ch": "第六章", "chname": "钎焊", "type": "fill", "q": "钎缝不致密性缺陷（气孔、夹渣、未填满）会降低密封性、降低接头强度和导电性，并____潮气造成接头腐蚀。", "ans": "吸收（吸附）", "id": "q218", "orig": -1}, {"ch": "第六章", "chname": "钎焊", "type": "term", "q": "钎焊", "ans": "利用熔点比母材低的钎料，加热熔化后润湿并填充母材间隙，靠液态钎料与固态母材之间的相互扩散形成钎焊接头的焊接方法。母材不熔化。", "id": "q310", "orig": -1}, {"ch": "第六章", "chname": "钎焊", "type": "term", "q": "润湿角（润湿性）", "ans": "液态钎料在母材表面铺展时，钎料液滴与母材表面之间的接触角θ。θ越小，润湿铺展性越好（θ<90°为润湿）。", "id": "q311", "orig": -1}, {"ch": "第六章", "chname": "钎焊", "type": "term", "q": "毛细作用（毛细现象）", "ans": "液态钎料在母材间隙中依靠表面张力上升、填充间隙的现象。间隙越小毛细作用越强，但过小会阻碍钎料流动。", "id": "q312", "orig": -1}, {"ch": "第六章", "chname": "钎焊", "type": "term", "q": "钎剂", "ans": "钎焊时使用的能清除母材表面氧化物、保护母材和钎料不被氧化、并改善钎料润湿性的辅助材料（如硼砂、硼酸等）。", "id": "q313", "orig": -1}, {"ch": "第六章", "chname": "钎焊", "type": "term", "q": "钎料", "ans": "钎焊时用于填充接头间隙、形成钎缝的金属或合金（熔点低于母材），如银基、铜基、铝基钎料。选择时需与母材匹配并考虑润湿性和强度。", "id": "q314", "orig": -1}, {"ch": "第六章", "chname": "钎焊", "type": "essay", "q": "简述钎焊原理及钎焊接头的形成过程。", "ans": "①原理：钎焊时母材不熔化，熔点低于母材的钎料受热熔化，在毛细作用下润湿、铺展并填充母材间隙，液态钎料与固态母材之间通过扩散（钎料组元向母材扩散、母材组元向钎料溶解）形成冶金结合。②过程：表面清理（去氧化膜）→装配并加钎料钎剂→加热至钎焊温度（钎料熔化、润湿铺展、填充间隙）→保温（溶解扩散）→冷却凝固形成钎缝。③钎缝组织由钎料固溶体、共晶及扩散层等构成；钎焊接头强度取决于钎缝组织和界面结合质量。", "id": "q350", "orig": -1}, {"ch": "第六章", "chname": "钎焊", "type": "essay", "q": "影响钎料润湿性的因素有哪些？", "ans": "①钎料与母材的匹配：能相互溶解、形成合金的体系润湿性好；②母材表面状态：氧化膜、油污阻碍润湿，必须清理；③温度：温度升高粘度下降、润湿改善，但过高会过烧、流失；④钎剂作用：清除氧化膜、降低界面张力，改善润湿；⑤间隙大小：毛细作用随间隙减小增强，但过小阻碍流动；⑥母材与钎料成分（表面张力）：表面张力小、界面张力小则润湿角小。生产中通过清洁表面、选用合适钎剂和钎焊温度控制润湿铺展。", "id": "q351", "orig": -1}, {"ch": "第六章", "chname": "钎焊", "type": "essay", "q": "钎剂的作用是什么？钎料选择应遵循哪些原则？", "ans": "①钎剂作用：清除母材和钎料表面氧化膜；在加热和钎焊过程中保护母材与钎料不再氧化；改善液态钎料对母材的润湿铺展（降低表面张力）；促进钎料与母材的扩散结合。②钎料选择原则：钎料熔点应低于母材（一般低数十~数百℃）；与母材有良好的润湿性和相互扩散溶解能力；钎焊接头强度、耐蚀性、导电性等满足使用要求；与母材成分匹配避免形成脆性相；经济性与工艺性（如铜基、银基、铝基钎料按母材选用）。", "id": "q352", "orig": -1}, {"ch": "第六章", "chname": "钎焊", "type": "essay", "q": "钎焊与熔焊相比有何特点？适用于哪些场合？", "ans": "①特点：母材不熔化，加热温度低（低于母材熔点），热影响区小、变形小，接头尺寸精度高；可焊接异种金属和薄件、精密件；可一次完成多接头（批量高效）；设备简单、易实现自动化。②局限：接头强度一般低于母材，对搭接接头和间隙要求严格。③适用场合：电子元器件与集成电路封装、硬质合金刀具、散热器与换热器、精密仪器、薄壁异种金属结构等，如铝合金散热器、微波器件、航空航天精密组件。", "id": "q353", "orig": -1}];
const SPEED_DATA = ["焊冶是“再熔炼”，普冶是“提炼”；原材料和目的均不同。", "焊条加热三大热源：电阻热、电弧热、化学反应热（仅占1%～3%，可忽略）。", "碱性焊条以短路过渡+大颗粒过渡为主，酸性焊条以细颗粒过渡+附壁过渡为主。", "保护方式五种：渣保护、气保护、气渣联合保护、真空保护、自保护。", "反应区三段：药皮（先蒸发水分）→熔滴（1800～2400℃、10³～10⁴cm²/kg、0.01～0.1s）→熔池（1600～1900℃、3～130cm²/kg、3～8s）。", "氮源空气、氢源水分；控氮靠保护+Ti/Al/Zr，控氢靠烘干+氟化物，控氧靠工艺+冶金。", "氢脆是暂态现象（可时效消除）；氢白点（鱼眼）直径0.5～3mm；氢致冷裂纹三要素：H、M、R。", "熔渣碱度B＞1碱性、B＜1酸性；CaF2降粘度、降表面张力；表面张力金属键最大。", "脱氧三步：先期（药皮固态加热，Al、Ti大量烧损）→沉淀（熔滴与熔池）→扩散（降温、酸性渣有利）。", "硫害热裂（Fe+FeS共晶985℃），磷害冷脆热裂（Fe+Fe3P共晶1050℃）；脱硫常用Mn。", "合金过渡系数η：元素越活泼越低、沸点低越低；Kb↑η↓；I↑η↓；氩弧焊η较大。", "E4303（J422）钛钙型酸性、气渣联合保护；E5015（J507）低氢型碱性、塑韧性好、用于重要结构。", "药皮“七剂”：稳弧、造渣、造气、脱氧、合金、粘结、增塑。", "立、仰、横焊要“短渣”——凝固温度范围窄、快速凝固；氧化铁型长渣不行。", "飞溅影响因素：粘度↑、电流↑、水分↑、电压↑、交流＞直流、大颗粒过渡。", "焊剂=焊条药皮、焊丝=焊条药芯；焊剂三种制造方法：熔炼、粘结（陶质，400℃以下）、烧结（400～1000℃）。", "焊剂质量：含水量≤0.10%、机械夹杂物≤0.30%、S≤0.060%、P≤0.080%。", "熔池凝固五特点：过热度大、过冷度大、烧损大、结晶速度快、运动态结晶。", "结晶五形态随成分过冷增大：平面→胞状→胞状树枝→树枝→等轴。", "偏析三种：显微（枝晶间）、区域（杂质推向中心）、层状（结晶潜热周期性变化）。", "气孔三兄弟：氢-表面喇叭口、氮-表面蜂窝成堆、CO-内部条虫沿柱状晶。", "铁素体四类：PF晶界、FSP侧板条（无碳贝氏体）、AF针状（500℃）、FGF细晶（贝氏铁素体）。", "上贝羽毛状、下贝针状强韧；板条马氏体位错、片状马氏体孪晶（C≥0.4%）。", "焊接缺欠六类：裂纹、孔穴、固体夹杂、未熔合及未焊透、形状和尺寸不良、其他；裂纹最危险、绝对不允许存在。", "热循环四参数：加热速度、最高温度、相变以上停留时间、冷却速度（t8/5等）。", "手工焊高温停留4～20s、埋弧自动焊30～100s；加热快几十到几百倍、温度高100～200℃。", "45钢CCT右移（淬硬↑，无碳化物溶解+组织粗化）；40Cr CCT左移（淬硬↓，Cr未充分溶入奥氏体）。", "不易淬火钢HAZ分区：熔合区（窄）、过热区（韧性低）、相变重结晶区（细）、不完全重结晶区（不均）。", "碳当量公式适用性：CE(IIW)适用σb=400～700MPa，Ceq(WES)适用σb=500～1000MPa，Pcm适用C≤0.17%。", "HAZ脆化六类：粗晶、组织、析出、热应变时效、氢、石墨；M-A组元是组织脆化主因之一。", "动应变时效脆化在200～400℃；调质钢回火温度越低、焊后软化越严重。"];
const NOTES_HTML = "<h1 class=\"n1\">材料连接与增材制造原理</h1><p>第一至四章 知识点梳理与快速复习题库（依据课程PPT整理）</p><p>使用说明：本资料依据《材料连接与增材制造原理》课程第1至4章PPT整理，包含三部分——各章知识点梳理、快速复习题（单项选择题与填空题）以及各章参考答案，书末附高频考点一句话速记。建议先通读知识点，再闭卷完成练习并对照答案，最后用速记表快速回顾。</p><h1 class=\"n1\">第一部分　各章知识点梳理</h1><h2 class=\"n2\">第一章　焊接化学冶金</h2><h3 class=\"n3\">§1　焊接化学冶金过程的特点</h3><p>焊接化学冶金过程：熔化焊时，焊接区内各种物质（气体、液态金属、熔渣）之间在高温下相互作用的过程；焊缝相当于“高炉”，是金属在焊接条件下的再熔炼过程。</p><p>与普通化学冶金比较：相同点——均属金属冶炼加工；不同点——原材料不同（普冶用矿石、焦炭、废钢铁，焊冶用焊条、焊丝、焊剂），目的不同（普冶提炼金属，焊冶再熔炼以满足构件性能）。</p><p>焊条加热的三类热源：电阻热（电流通过焊芯产生）、电弧热（电弧传给焊条端部）、化学反应热（药皮化学物质反应产生，仅占1%～3%，可忽略）。</p><p>熔滴过渡形式：短路过渡（短路→电弧熄灭→熔滴过渡→电弧重燃）；颗粒状过渡（电弧足够长、不短路）；附壁过渡（熔滴沿药皮套筒壁向熔池过渡）；渣保护过渡（埋弧焊渣壁过渡）。</p><p>按熔滴尺寸分：颗粒过渡（熔滴尺寸大于焊丝直径）、喷射过渡（熔滴尺寸等于或小于焊丝直径）。碱性焊条以短路过渡和大颗粒过渡为主；酸性焊条以细颗粒过渡和附壁过渡为主。</p><p>短路过渡特点：燃弧、短路交替进行；电弧稳定、飞溅较小、过渡频率高（每秒几十次至一百多次）、焊缝成形良好；用于φ1.6mm以下细丝CO2气体保护焊或低电压小电流的碱性焊条焊条电弧焊，广泛用于薄板结构及全位置焊接。</p><p>熔滴特征：温度高（实测碳钢焊条2100～2700K，电流增大温度升高、焊丝直径增大温度降低）；比表面积大；存在时间短（0.01～0.1s）；与熔渣强烈混合。</p><p>熔池特征：质量轻、体积小（手工焊0.6～16g）；温度不均匀；液态金属不断运动；存在时间短（几秒至几十秒）；周围散热条件好。</p><div class=\"tbl\"><table><thead><tr><th>保护方式</th><th>典型焊接方法</th></tr></thead><tbody><tr><td>渣保护</td><td>埋弧焊、电渣焊</td></tr><tr><td>气保护</td><td>气焊、TIG焊</td></tr><tr><td>气渣联合保护</td><td>具有造气成分的焊条和药芯焊丝</td></tr><tr><td>真空保护</td><td>真空电子束焊接</td></tr><tr><td>自保护</td><td>含脱氧、脱氮剂的自保护焊丝</td></tr></tbody></table></div><div class=\"tbl\"><table><thead><tr><th>冶金反应区</th><th>温度</th><th>比表面积</th><th>反应时间</th></tr></thead><tbody><tr><td>药皮反应区</td><td>T&gt;100℃水分蒸发；有机物分解生成CO、CO2、H2；碳酸盐和高价氧化物分解生成CO2、O2；铁合金氧化</td><td>—</td><td>—</td></tr><tr><td>熔滴反应区</td><td>1800～2400℃</td><td>10³～10⁴ cm²/kg</td><td>0.01～0.1s</td></tr><tr><td>熔池反应区</td><td>1600～1900℃</td><td>3～130 cm²/kg</td><td>SMAW 3～8s；SAW 6～25s</td></tr></tbody></table></div><p>熔合比θ：焊缝金属中局部熔化的母材所占比例。焊接电流增大，熔滴停留时间缩短、熔滴变细，冶金反应不充分；焊接电压增大，熔滴停留时间增长、熔滴变粗，冶金反应充分。</p><h3 class=\"n3\">§2　气相对金属的作用</h3><p>焊接区气体来源：焊接材料；气体介质；焊丝和母材表面的油锈等杂质；金属和熔渣蒸发产生的气体。</p><p>有机物分解：淀粉、纤维素、糊精受热热氧化分解；纤维素烘干温度不超过200℃，一般150℃左右。碳酸盐分解：CaCO3、MgCO3、BaCO3、白云石CaMg(CO3)2，碳酸盐烘干温度≤450℃、白云石≤300℃，粒度小易分解。</p><p>简单气体分解：N2、H2、O2；复杂气体分解：CO2、H2O。</p><p>氮的作用：来源主要是空气。Cu、Ni不与氮作用，可用N作保护气；Fe、Ti与氮作用（能溶解氮并形成氮化物），须防止焊缝氮化。</p><p>氮的危害：气孔（温度降低溶解度下降）；脆化和时效脆化（N与Fe生成Fe4N脆化，Ti、V与N生成TiN、VN可消除时效脆化）；有利一面——可作为合金元素提高钢的强度（如15MnVN）。</p><p>控制焊缝含氮量：加强保护（药皮重量系数Kb增大保护效果增强）；电流增大、过渡频率增大则含氮量降低，电压增大含氮量增大；直流正接含氮量增大；增加含碳量（降低N溶解度、生成CO/CO2加强保护、熔池沸腾利于N逸出）；Ti、Al、Zr和稀土形成稳定氮化物并减少NO分压。</p><p>氢的作用：来源为焊接材料（药皮、焊剂、药芯）中水分、含氢物质及电弧周围空气水分。Zr、Ti、V、Ta、Nb形成稳定氢化物（放热反应）；Al、Fe、Ni、Cu、Cr、Mo不形成稳定氢化物（吸热反应）。</p><p>影响氢在钢中溶解度：温度升高溶解度增大；Ti、Zr、Nb等使溶解度增大，C、Si、Al、O等使溶解度降低；面心立方晶格中的溶解度大于体心立方晶格；位错等缺陷和应力也有影响。</p><p>氢的存在形式：扩散氢（原子或质子形式，可在晶格中自由扩散）；残余氢（聚集到晶格缺陷、显微裂纹和非金属夹杂边缘空隙，结合成分子不能自由扩散）。总含氢量=扩散氢+剩余氢；放置时间延长，扩散氢减少、残余氢增多。</p><p>扩散氢测定：甘油法；水银法较准确。扩散氢系数D：铁素体＞马氏体＞奥氏体，故选用奥氏体焊缝可防止氢致裂纹。</p><p>氢的危害：氢脆（室温附近氢溶于晶格使钢塑性严重下降，δ、ψ降低，加载快不造成氢脆）；氢白点（鱼眼，肉眼可见直径0.5～3mm，中心有气孔或小夹渣、外围有塑性断裂痕迹，铁素体中扩散快不出现、奥氏体中不出现，碳钢及Cr、Ni、Mo合金化焊缝敏感）；气孔；氢致裂纹（冷裂纹，三要素为H含氢多、M马氏体结构、R拘束度）。</p><p>控制氢的措施：限制氢来源（药皮、焊剂、工件、焊丝中的水分，焊前烘干）；冶金措施（药皮和焊剂中加入氟化物、控制材料氧化势、脱氢处理）；清除焊丝和焊件表面杂质；控制焊接工艺参数；焊后脱氢处理（350℃×1h或250℃×6h）。</p><p>氧的作用：Mg、Al不溶解氧但焊接时剧烈氧化；Fe、Ni、Cu、Ti有限溶解氧且焊接时也氧化。液态铁中氧以原子氧和FeO形式存在；温度升高含氧量增大，合金元素使含氧量降低；α-Fe中氧几乎不溶解。</p><p>氧化还原方向判据：分解压pO2与实际分压比较。CO2对金属的氧化：温度升高氧化性增强，可用Si、Mn脱氧；H2O温度升高氧化性越强。</p><p>氧的危害：力学性能下降（强度、塑性、韧性降低）；工艺性能变差（CO气孔、飞溅）；合金氧化（烧损有益合金元素）。控制氧：限制氧来源；工艺条件（电压增大含氧量增大、电流增大含氧量降低）；冶金处理。</p><h3 class=\"n3\">§3　熔渣及其对金属的作用</h3><p>熔渣作用：机械保护作用（防止氧化和氮化）；改善焊接工艺性能（加低电离势物质易引弧）；冶金处理作用（脱O、S、P，去H，合金化）。</p><p>熔渣分类：盐型（氟酸盐、氯酸盐和不含氧的化合物，如NaCl、KCl）；盐—氧化物型（氟化物和强金属氧化物，如CaO、Al2O3）；氧化物型（金属氧化物，氧化性强）。</p><p>熔渣结构理论：分子理论（液态熔渣由化合物分子组成，氧化物及其复合物处于平衡状态，只有自由氧化物才能参加反应，(FeO)2·SiO2中的FeO不能参加反应）；离子理论（液态熔渣由阴阳离子组成电中性溶液，离子分布聚集取决于综合矩，综合矩越大静电场越强，熔渣与金属作用是原子和离子交换电荷的过程）。</p><p>熔渣碱度：分子理论B＞1（1.3）为碱性、B=1中性、B＜1酸性；离子理论以自由氧离子浓度定义碱度，B2＞0为碱性。</p><p>熔渣粘度：温度升高粘度降低；长渣凝固温度范围大、短渣凝固温度范围小；含SiO2的酸性渣粘度下降较慢；酸性渣SiO2增多粘度增大、CaO增多粘度降低，碱性渣反之；无论酸碱性，CaF2均使粘度降低。</p><p>熔渣表面张力：金属键最大、离子键较大、共价键最小；碱性渣加入CaO、MgO（综合矩大）表面张力增大；酸性渣SiO2使表面张力降低；CaF2使表面张力降低；温度升高表面张力降低。</p><p>熔渣熔点：造渣温度为药皮开始熔化的温度；熔渣熔点比焊缝金属熔点低200～450℃，一般为1150～1350℃。</p><p>活性熔渣氧化两种形式：扩散氧化（分配常数随温度升高而降低，发生在高温液态区——熔滴阶段和熔池前部；碱性焊条对铁锈氧化皮敏感因FeO活度大，但碱性焊条焊缝含氧量低于酸性焊条，因其氧化势小）；置换氧化（熔滴阶段最剧烈、在熔池前部高温区；焊缝增氧的同时也增Si、Mn，起合金化作用）。</p><p>焊剂活度AF：大于0.6为高活性，0.6～0.3为活性，0.3～0.1为低活性，不大于0.1为惰性；活度越大焊缝含氧量越高。</p><p>脱氧目的：减少焊缝含氧量。脱氧剂选取原则：对氧的亲和力比被焊金属大（Al、Ti、Si、Mn等可作铁基合金脱氧剂）；脱氧产物不溶于液态金属且密度小于液态金属，利于上浮；考虑对焊缝成分、性能和焊接工艺的影响。</p><p>脱氧过程三种方式：先期脱氧（药皮固态加热阶段进行，Al、Ti对氧亲和力大、绝大部分烧损）；沉淀脱氧（在熔滴阶段和熔池内进行，脱氧剂与液态金属中FeO直接反应、产物浮出）；扩散脱氧（温度降低易进行，酸性渣中SiO2、TiO2与FeO生成复合物减小FeO活度利于脱氧，碱性渣中FeO活度大、脱氧能力较差；脱氧反应放热，在熔池后部进行）。</p><p>硫的危害：FeS液态互溶、固态基本不溶，易偏析并在晶界析出片状低熔点共晶；Fe+FeS共晶熔点985℃、Fe+FeO共晶940℃，引起热裂、热脆；高镍合金钢中NiS+Ni共晶熔点644℃更低；含碳量增大促进硫的偏析。控制：控制原料含硫；冶金脱硫选择对S亲和力比Fe大的元素（常用Mn）；渣中碱性氧化物脱硫；温度降低利于脱硫。</p><p>磷的危害：Fe2P、Fe3P液态互溶、固态基本不溶，易偏析并在晶界析出低熔点共晶；Fe+Fe3P共晶熔点1050℃、Fe+Ni3P共晶熔点880℃，引起冷脆、热裂。控制：控制来源；冶金脱磷分两步进行（先使P氧化成P2O5，再使P2O5生成稳定复合物进入熔渣）。</p><h3 class=\"n3\">§4　合金过渡</h3><p>合金过渡目的：补偿合金元素损失；消除焊接缺陷、改善组织和性能；获得具有特殊性能的堆焊金属。</p><p>合金化方式：合金焊丝或带极；药芯焊丝或药芯焊条；合金药皮或焊剂；合金粉末。</p><p>合金过渡系数η=熔敷金属中某合金含量/焊接材料中该合金总量（焊芯+药皮）。影响因素：元素活泼、沸点低则过渡系数低；合金元素含量增大过渡系数增大并趋于定值；合金剂粒度大过渡系数增大；药皮或焊剂氧化势增大过渡系数降低；合金元素与其氧化物与渣的酸碱性相同时过渡系数增大；药皮重量系数Kb增大过渡系数降低；焊接电流增大过渡系数降低；氩弧焊过渡系数较大。</p><p>1600℃下各种合金元素对氧的亲和力由左到右增强：Cu、Ni、Co、Fe、W、Mo、Cr、Mn、V、Si、Ti、Zr、Al。</p><p>本章小结：以手工电弧焊焊接低碳钢和低合金钢的冶金问题为重点，从热力学角度阐明焊接化学冶金的一般规律，并讨论熔渣对金属的作用及合金过渡的几种形式与影响因素。</p><h2 class=\"n2\">第二章　焊接材料</h2><h3 class=\"n3\">§1　焊条</h3><p>焊条分类：按用途分（结构钢、钼和铬钼耐热钢、不锈钢、堆焊、低温钢、铸铁、镍及镍合金、铜及铜合金、铝及铝合金、特殊用途焊条）；按焊接熔渣的酸碱度分（酸性焊条E4303、碱性焊条E5015）；按药皮类型分（氧化钛型、钛钙型、钛铁矿型、氧化铁型、纤维素型、低氢型，另有石墨型、盐基型）。</p><p>焊条组成：焊芯+药皮。焊芯作用：导电、填充金属；焊芯材料用量最多的是H08、H08A，还有H08E。</p><p>药皮作用：机械保护作用（产生熔渣和气体，保护熔滴、熔池和焊接区，隔离空气）；冶金处理作用（去除有害杂质，保护或添加有益合金元素，提高焊缝抗气孔性和抗裂性）；工艺性能良好（电弧易引燃、稳定燃烧，飞溅小，成形美观，易脱渣，适于各种位置施焊）。</p><div class=\"tbl\"><table><thead><tr><th>药皮类型</th><th>主要组成特点</th><th>典型用途</th></tr></thead><tbody><tr><td>氧化钛型（钛型）</td><td>35%以上TiO2、硅酸盐、锰铁，少量有机物</td><td>工艺性好</td></tr><tr><td>氧化钛钙型（钛钙型）</td><td>30%以上TiO2、20%以下碳酸盐，硅酸盐、锰铁</td><td>应用最广</td></tr><tr><td>钛铁矿型</td><td>30%以上钛铁矿、硅酸盐、锰铁，少量有机物</td><td>—</td></tr><tr><td>氧化铁型</td><td>大量铁矿石、硅酸盐、锰铁和少量有机物</td><td>长渣，不宜立仰横焊</td></tr><tr><td>纤维素型</td><td>15%以上有机物、一定量造渣物质和锰铁</td><td>适于全位置、向下焊</td></tr><tr><td>低氢型</td><td>大量碳酸盐、萤石、铁合金及TiO2</td><td>重要结构、低合金钢</td></tr><tr><td>石墨型</td><td>大量石墨，配低碳钢芯或铸铁焊芯</td><td>铸铁焊条</td></tr><tr><td>盐基型</td><td>氟盐和氯盐组成</td><td>铝及铝合金焊条</td></tr></tbody></table></div><p>药皮原材料四类：矿物类（钛铁矿、赤铁矿、金红石、大理石、白云石、萤石、长石、白泥、云母等）；金属及铁合金类（Cr、Ni、锰铁、硅铁、钛铁、钼铁、钒铁等）；化工产品类（钛白粉、纯碱、碳酸钾、碳酸钡、粘结剂水玻璃）；有机物类（淀粉、木粉、纤维素、酚醛树脂等）。</p><div class=\"tbl\"><table><thead><tr><th>药皮组分</th><th>作用与常用材料</th></tr></thead><tbody><tr><td>稳弧剂</td><td>含低电离位元素，改善引弧与稳弧：碳酸钾、大理石、长石、金红石等</td></tr><tr><td>造渣剂</td><td>形成熔渣保护：钛铁矿、金红石、大理石、石英砂、长石、云母、萤石等</td></tr><tr><td>造气剂</td><td>形成保护气体：木粉、淀粉、大理石、菱苦土等</td></tr><tr><td>脱氧剂</td><td>对O亲和力比Fe大：锰铁、钛铁、硅铁、铝粉等</td></tr><tr><td>合金剂</td><td>过渡合金元素：锰铁、硅铁、钼铁等</td></tr><tr><td>粘结剂</td><td>钠水玻璃、钾钠水玻璃等</td></tr><tr><td>增塑剂</td><td>改善压涂塑性：白泥、云母、钛白粉、糊精等</td></tr></tbody></table></div><p>电弧稳定性：电离电位低可提高电弧稳定性；药皮熔点过高或药皮太厚易形成长套筒、电弧易熄灭。碱性焊条J507稳弧性差，因药皮含较多萤石（CaF2），氟电离势高（18.6V）且与电子亲和力大，夺取电弧中电子形成负离子，恶化电弧稳定性；J506加入低电离势的K、Na可用交直流，但K、Na与F亲和力大，KF、NaF有毒。酸性焊条含SiO2、TiO2、CaO及K2O、Na2O等，稳弧性好。</p><p>焊缝成形：熔渣凝固温度过高产生“压铁水”现象成形差，过低熔渣不能均匀覆盖；高温熔渣粘度在1500℃时为0.1～0.2Pa·s；表面张力一般为0.3～0.4N/m，可保证熔渣均匀覆盖焊缝表面。</p><p>全位置焊接：立、仰、横焊的难点是重力作用下熔滴不易过渡、熔池金属和熔渣下流。解决办法：适当增加电弧吹力、调整药皮熔点和厚度使焊条端部产生适当长度的套筒、药皮中加一定数量造气剂；熔渣的物理性能要适应——凝固温度范围窄（短渣）能快速凝固的焊条才能立、仰、横焊。氧化铁型为长渣，不适应横、立、仰焊。</p><div class=\"tbl\"><table><thead><tr><th>焊条类型</th><th>熔渣凝固温度/℃</th><th>凝固温度范围/℃</th></tr></thead><tbody><tr><td>纤维素型</td><td>1200～1290</td><td>90</td></tr><tr><td>钛型</td><td>1320～1420</td><td>100</td></tr><tr><td>氧化铁型</td><td>1180～1350</td><td>170</td></tr></tbody></table></div><p>飞溅：产生原因——熔池内部气体逸出、熔滴爆炸、电弧作用力、短路过渡电弧再燃。影响因素——粘度增大飞溅增大、电流增大飞溅增大、药皮水分增大飞溅增大、电压增大飞溅增大、交流飞溅大于直流、大颗粒过渡飞溅增大。</p><p>CO2气体保护焊飞溅原因：熔池中飞溅（温度升高CO2分解为CO+O，CO体积膨胀，外逸受阻时局部爆破产生细颗粒飞溅）；电弧斑点压力飞溅（直流正极性时焊丝为阴极、斑点压力大，产生粗大熔滴并被顶偏形成非轴向过渡）；熔滴过渡（自由过渡在斑点压力下熔滴上翘形成大滴状飞溅；短路过渡发生在短路小桥破断瞬间，飞溅多少取决于电爆炸能量，与短路电流和小桥直径有关）。</p><p>脱渣性：焊后熔渣壳从焊缝表面清除的难易程度。影响因素——熔渣线膨胀系数（金属与熔渣膨胀系数相差越大，收缩内应力越大，脱渣性越好）；熔渣氧化性（太强则焊缝表面氧化生成氧化膜，脱渣困难）；熔渣松脆性（越松脆越易清除）。钛型焊条脱渣性最好，低氢型焊条脱渣性最差。</p><p>焊条熔化速度：熔化系数αp反映熔化速度；考虑飞溅损失后，真正反映焊接生产率的指标是熔敷系数αH（单位时间内熔敷在焊件上的金属重量）；损失系数ψ为飞溅、氧化、蒸发损失与熔化焊芯质量之比。</p><p>药皮发红：焊条使用到后半段，药皮温升过高而发红、开裂或脱落。原因是焊芯电阻大、熔化系数小，熔化时间长、电阻热多。解决办法：调整药皮配方、改善熔滴过渡形态、提高熔化系数、减少电阻热以降低焊条表面温升。</p><p>焊接烟尘：焊条端部液态金属和熔渣、熔池和熔滴表面蒸发，高温蒸汽被氧化冷凝成细小固态粒子。气体毒性分两种——锰中毒（细微蒸发锰的毒性）；氟中毒（药皮含大量萤石时析出HF，有人认为NaF、KF更易中毒）。低氢型焊条烟尘含氟10%以上。</p><div class=\"tbl\"><table><thead><tr><th>对比项</th><th>钛钙型焊条 E4303（J422）</th><th>低氢型焊条 E5015（J507）</th></tr></thead><tbody><tr><td>渣系</td><td>TiO2-CaO-SiO2</td><td>CaF2-CaO-SiO2</td></tr><tr><td>碱度</td><td>B1=0.76，酸性</td><td>B1=1.89，碱性</td></tr><tr><td>保护方式/氧化性</td><td>气渣联合保护</td><td>氧化性小，对铁锈、油污、水分敏感</td></tr><tr><td>焊缝含氢量</td><td>—</td><td>极低，塑韧性好，适合重要结构和大多数低合金钢</td></tr><tr><td>脱硫脱磷</td><td>用Mn脱硫；脱磷两步</td><td>脱硫靠碱性氧化物；脱磷利用CaO，含大理石多、脱磷效果优于钛钙型</td></tr><tr><td>合金过渡</td><td>Mo、V、W不易氧化过渡好</td><td>MnO为碱性氧化物，碱度增大Mn过渡系数增大，焊缝Mn%要求低于1.6%、Si%低于0.75%</td></tr><tr><td>工艺性</td><td>工艺性好、成形美观、发尘量少</td><td>稳弧性、脱渣性差，烟尘大、含KF、NaF危害较大</td></tr></tbody></table></div><p>焊条设计：原则——技术上满足设计任务、达到各项技术指标，制造工艺切实可行，经济效益好，卫生指标先进；依据——被焊母材化学成分与力学性能、焊件工作条件、施工现场焊接设备情况、焊条制造生产工艺条件；方法——传统配方基础上的改进与创新、计算化学成分配比、计算机优化设计；步骤——选定焊芯（多用H08A）、选定药皮类型渣系及配方、通过试验调整。</p><p>焊条制造流程：焊芯制备→焊条药皮材料制备→水玻璃制备→配料、混拌及压涂→焊条烘焙→检验合格后包装、入库、出厂。</p><h3 class=\"n3\">§2　焊剂</h3><p>焊剂和焊丝是埋弧焊、电渣焊使用的焊接材料；焊剂相当于焊条药皮，焊丝相当于焊条药芯。焊剂作用：隔离空气、保护焊接区金属不受空气侵害，并进行冶金处理。</p><p>焊剂分类：按用途（被焊材料：钢用、有色金属用；工艺方法：埋弧焊、电渣焊）；按制造方法（熔炼焊剂、粘结焊剂、烧结焊剂）；按化学成分（酸性、中性、碱性；按SiO2含量分高硅、中硅、低硅；按MnO含量分高锰、中锰、低锰、无锰；按CaF2含量分高氟、中氟、低氟）；按化学性质（氧化性、弱氧化性、惰性焊剂）；按颗粒结构（玻璃状、结晶状、浮石状）。</p><div class=\"tbl\"><table><thead><tr><th>制造方法</th><th>工艺要点</th><th>备注</th></tr></thead><tbody><tr><td>熔炼焊剂</td><td>配料在炉内熔炼，经水冷粒化、烘干、筛选</td><td>传统焊剂</td></tr><tr><td>粘结焊剂（陶质焊剂）</td><td>粉状配料加粘结剂混合搅拌、粒化，低温（400℃以下）烘干</td><td>—</td></tr><tr><td>烧结焊剂</td><td>粉状配料加粘结剂混合搅拌后，经高温（400～1000℃）烧结成块、粉碎、筛选</td><td>—</td></tr></tbody></table></div><p>焊剂型号（GB/T 5293-1999《埋弧焊用碳钢焊丝和焊剂》，课件按此版讲解，该标准已被GB/T 5293-2018代替）：焊丝-焊剂组合型号中，“F”表示焊剂；第1位数字表示熔敷金属抗拉强度最小值；第2位字母表示试件热处理状态（A为焊态、P为焊后热处理态）；第3位数字表示熔敷金属冲击吸收功不小于27J时的最低试验温度；“-”后为焊丝牌号。</p><p>焊剂质量要求：冶金性能好；工艺性能好；颗粒度符合要求；含水量不大于0.10%；机械夹杂物含量不大于0.30%；含硫量不大于0.060%、含磷量不大于0.080%。</p><p>熔炼焊剂：高硅焊剂以硅酸盐为主（SiO2＞30%），有通过焊剂向焊缝过渡硅的作用，按MnO含量分为高硅高锰、高硅中锰、高硅低锰、高硅无锰焊剂；中硅焊剂SiO2较少、CaO和MgO含量较高、碱度高，属弱氧化性焊剂，焊缝含氢量较高、抗冷裂纹能力弱，加FeO提高氧化性可减少含氢量，焊缝韧性高，用于焊接高强钢；低硅焊剂由CaO、Al2O3、MgO、CaF2等组成，对基本金属无氧化作用，配合相应焊丝焊接高合金钢（不锈钢、热强钢等）。</p><p>烧结焊剂优缺点：可连续生产、劳动条件好、成本低；碱度可在较大范围内调节；可获得较好的强度、塑性和韧性配合；加脱氧剂脱氧充分；加合金剂合金化强；松装密度较小、焊接时消耗量较小；颗粒圆滑、回收阻力小；抗气孔能力比熔炼焊剂强，但对焊接参数变动敏感、会引起焊缝化学成分不均匀；吸湿性大、易增加焊缝含氢量。</p><h3 class=\"n3\">§3　焊丝</h3><p>焊丝分类：按适用的焊接方法（埋弧焊焊丝、CO2焊焊丝、钨极氩弧焊焊丝、自保护焊焊丝、电渣焊焊丝）；按形状结构（实心焊丝、药芯焊丝、活性焊丝）；按适用的金属材料（低碳钢、低合金钢焊丝，硬质合金堆焊焊丝，以及铝、铜与铸铁焊丝等）。</p><p>实心焊丝：埋弧焊用实心焊丝、CO2焊实心焊丝、其他用途实心焊丝；药芯焊丝：按分类、截面形状和特性选用。</p><h2 class=\"n2\">第三章　熔池凝固和焊缝固态相变</h2><h3 class=\"n3\">§1　熔池凝固</h3><p>熔池凝固特点：熔池过热度大；过冷度大；合金元素烧损大；结晶速度大；运动态结晶（运动、搅拌）。</p><p>结晶一般规律：液→固结晶包括形核和长大两阶段。熔池中主要为非自发形核；两种现成表面——合金元素或杂质的悬浮质点，熔合区附近半熔化状态基本金属的晶粒表面。</p><p>晶粒生长有方向性：沿最大温度梯度方向最有利于晶粒长大，可形成粗大柱状晶；晶粒成长方向与结晶等温面正交。</p><p>结晶线速度vc与焊接速度v的关系：熔合线处θ=90°、vc=0；熔池中心θ=0°、vc=v（最大）；焊接速度增大、θ增大，柱状晶趋向垂直于中心线，易产生热裂纹。</p><p>纯金属结晶形态：柱状晶（正温度梯度G＞0成长缓慢为平面晶；负温度梯度G＜0过冷度大、成长快为树枝晶）、等轴晶。</p><p>固溶体合金结晶形态（成分过冷）：平面结晶（过冷度等于0、无成分过冷）；胞状结晶（过冷度很小，断面六角形、细胞或蜂窝状）；胞状树枝结晶（过冷度稍大，主干四周伸出短小二次横枝）；树枝状结晶（过冷度较大，主枝长、二次横枝发达）；等轴结晶（过冷度大、成分过冷区很宽，可自发生核、自由长大的等轴树枝晶）。</p><div class=\"tbl\"><table><thead><tr><th>条件</th><th>成分过冷</th><th>结晶形态变化</th></tr></thead><tbody><tr><td>R、G一定，C0增大</td><td>增大</td><td>平面晶→等轴晶过渡</td></tr><tr><td>C0一定，R增大</td><td>增大</td><td>平面晶→等轴晶过渡</td></tr><tr><td>C0、R一定，G增大</td><td>减小</td><td>等轴晶→平面晶过渡</td></tr></tbody></table></div><p>焊接条件下的凝固形态：焊缝边界G大、R小，平面晶得到发展；焊缝中心G小、R大，倾向于获得等轴晶。溶质浓度影响：99.99%纯Al焊缝熔合线附近为平面晶、中心为胞状晶，99.6%纯Al中心为等轴晶；焊接速度增大，熔池中心出现等轴晶；电流小为胞状晶、电流较大为胞状树枝晶、电流大出现粗大胞状树枝晶。</p><p>焊缝金属化学不均匀性（偏析）：显微偏析（先结晶固相较纯、后结晶溶质浓度较高，发生在晶粒边界、亚晶界或树枝晶晶枝之间）；区域偏析（柱状晶把杂质推向熔池中心，最后凝固部位偏析较严重）；层状偏析（结晶潜热和熔滴过渡热能输入周期性变化引起化学成分不均匀，形成颜色深浅不同的分层）。</p><p>熔合区：不是一条线而是一个区（热传播不均匀、晶粒传热方向不同）；宽度取决于材料液固温度范围、热物理性质和组织状态，一般0.0n～0.nmm，奥氏体钢电弧焊时约0.06～0.12mm；合金元素在液相中的溶解度大于固相，界面附近溶质浓度波动大。</p><p>熔合区不均匀性：化学不均匀性+物理不均匀性（空位——不平衡冷却时空位过饱和，熔合线附近空位密度最大，空位聚合可能是熔合区延迟断裂原因之一；残余应力——导热系数、膨胀系数、屈服强度、弹性模量不均匀引起）。熔合区是焊接接头的薄弱环节。</p><h3 class=\"n3\">§2　焊缝固态相变</h3><p>低碳钢焊缝组织：铁素体+少量珠光体；铁素体先沿原奥氏体边界析出、晶粒粗大，部分呈魏氏组织形态（铁素体在晶界网状析出，或从晶粒内部沿一定方向呈针状、片条状析出）；多层焊或热处理可获得细小铁素体和少量珠光体，柱状晶被破坏；冷却速度越大珠光体越多、组织细化、硬度升高。</p><p>低合金钢焊缝组织：以铁素体为主，珠光体、贝氏体、马氏体占次要地位；可能出现铁素体转变、珠光体转变、贝氏体转变、马氏体转变四种组织转变。</p><div class=\"tbl\"><table><thead><tr><th>铁素体类型</th><th>形成温度</th><th>特征</th></tr></thead><tbody><tr><td>先共析铁素体PF（粒界铁素体GBF）</td><td>T＞750℃</td><td>晶界析出，细条状或块状</td></tr><tr><td>侧板条铁素体FSP（无碳贝氏体）</td><td>700～550℃</td><td>从奥氏体晶界PF侧面以板条状向晶内成长</td></tr><tr><td>针状铁素体AF</td><td>500℃左右</td><td>晶粒内针状分布，常以质点为核心放射性成长</td></tr><tr><td>细晶铁素体FGF（贝氏铁素体）</td><td>500℃以下</td><td>晶粒内形成，450℃左右可转变为上贝氏体</td></tr></tbody></table></div><p>珠光体转变：发生在Ar1～550℃，是扩散型相变；珠光体是铁素体和渗碳体的层状混合物，领先相为Fe3C；焊接状态为非平衡转变、珠光体量少；含B、Ti合金元素时珠光体转变可被全部抑制；分类有层状珠光体、细珠光体（索氏体）、粒状珠光体（屈氏体）。</p><p>贝氏体转变：上贝氏体Bu（形成于550～500℃，光学显微镜下呈羽毛状，沿奥氏体晶界析出，平行条状铁素体间分布渗碳体）；下贝氏体BL（形成于450℃～Ms，针状、强韧组织）；M-A组元（块状铁素体形成后，富碳岛状奥氏体转变为富碳马氏体和残余奥氏体；粒状分布称粒状贝氏体BG，条状分布称条状贝氏体Be）。</p><p>马氏体转变：焊缝含碳量偏高或合金元素较复杂、快冷至Ms以下时发生。板条马氏体（位错马氏体）——低碳低合金焊缝、转变温度较高，板条内部存在大量位错，韧性好、强度高；片状马氏体（孪晶马氏体、高碳马氏体）——含碳较高（≥0.4%）、转变温度偏低，初形成马氏体粗大、往往贯穿晶粒，亚结构为孪晶。</p><h3 class=\"n3\">§3　焊缝中的气孔和夹杂</h3><p>气孔两类：一类是高温时溶解、凝固和相变时溶解度骤降、来不及逸出而残留在焊缝内部的气体（H2、N2）；另一类是冶金反应产生的不溶于金属的气体（CO、H2O）。</p><div class=\"tbl\"><table><thead><tr><th>气孔类型</th><th>分布与形状特征</th><th>形成原因</th></tr></thead><tbody><tr><td>氢气孔</td><td>表面气孔为主，少数内部；断面螺钉状、喇叭口形，四周内壁光滑</td><td>H2O多、有机物多；高温熔池吸氢，冷却结晶时氢溶解度急剧下降来不及逸出</td></tr><tr><td>氮气孔</td><td>表面气孔，多数呈蜂窝状成堆出现</td><td>保护不好、空气侵入熔池</td></tr><tr><td>CO气孔</td><td>内部气孔，条虫状或蠕虫状，沿柱状晶方向分布</td><td>CO不溶于液态金属，高温冶金反应生成，熔池结晶时粘度增大不易逸出</td></tr></tbody></table></div><p>气孔形成机理：生核→长大→逸出。条件：液态金属中有过饱和气体；要消耗一定能量（有现成表面可大大降低能量消耗）。熔池中大量现成表面：分布不均的溶质质点、熔渣与液态金属的接触表面、熔池底部成长的树枝状晶粒；树枝晶间凹陷处和母材未熔化晶粒界面Aa/A比值最大、最易形核。</p><p>气泡上浮：浸润角θ＜90°利于气泡上浮逸出；θ＞90°时需形成细颈、结晶速度大时形成气孔。结晶速度R小，气泡有充分时间逸出无气孔；R大，气泡可能残留在焊缝内部。气泡半径增大、液体金属密度增大、粘度降低、结晶速度降低，均利于气泡浮出。</p><p>影响气孔的因素：熔渣氧化性大则CO气孔倾向增大、还原性大则H2气孔倾向增大；药皮和焊剂中CaF2、SiO2降低氢气孔倾向；铁锈含较多Fe2O3和H2O引起CO、H2气孔，氧化皮（主要Fe3O4）引起CO气孔。工艺因素：电流增大气孔倾向增大（熔滴变细、比表面积增大、吸收气体多）；电压增大空气侵入、氮气孔增多；焊速增大结晶速度增大、气体残留形成气孔；气孔倾向交流大于直流正接、直流正接大于直流反接；焊前清理、焊条焊剂烘干、短弧摆动可防气孔。</p><p>焊缝中的夹杂物：氧化物（SiO2、MnO、TiO2、Al2O3，密集块状或片状分布时引起热裂、层状撕裂）；氮化物（Fe4N，脆硬相，硬度增大、韧性降低，引起热裂、冷裂）；硫化物（MnS、FeS，主要是FeS，沿晶界析出并形成低熔点Fe+FeS（985℃）或FeO+FeS（940℃）共晶，引起热裂）。</p><p>防止夹杂物的措施：选用合理规范以利于熔渣浮出；多层焊时清渣；焊条摆动；保护熔池、防止空气侵入。</p><h3 class=\"n3\">§4　焊缝性能的控制（自学）</h3><p>控制焊缝性能是控制焊接质量的主要目标。常规焊接构件焊后多不再进行热处理，应尽可能保证焊缝凝固并经相变后即具有良好的性能。改善焊缝金属性能的途径主要是焊缝的固溶强化、变质处理（微合金化）和调整焊接工艺。</p><h3 class=\"n3\">§5　焊接缺欠</h3><p>焊接缺欠：泛指焊接接头中的不连续性、不均匀性以及其他不健全性的欠缺（GB/T 6417.1-2005定义为因焊接产生的金属不连续、不致密或连接不良的现象）。焊接缺陷：不符合具体焊接产品使用性能要求的焊接缺欠，即超过规定限值的缺欠，标志判废或必须返修。</p><p>质量标准：QA为用于质量管理的质量标准，达到QA的产品为优质品；QB为基于合于使用的质量标准，是最低合用的验收标准；QA与QB之间的缺欠属一般质量、不必修补；达不到QB标准的产品必须修补，否则判废。判别缺欠是否为缺陷按相关标准规定的容限执行。</p><p>缺欠对承载强度的影响：成串或密集气孔使承载截面积减小、明显降低承载强度，成串气孔比单个气孔危险；气孔使承载截面积减小10%时疲劳强度下降可达50%；咬边对疲劳强度的影响比气孔和夹杂大得多（带咬边接头在10⁶次循环下疲劳强度约为致密接头的40%）；未熔合和未焊透比气孔和夹渣更有害，在一定条件下成为脆性断裂的引发点；裂纹被认为最危险、易造成断裂，焊接产品及结构中绝对不允许存在。</p><p>应力集中：裂纹、未熔合和未焊透比气孔和夹渣危害大；裂纹尖端存在缺口效应、易诱发三向应力状态，导致裂纹失稳扩展，是焊接结构中最危险的缺陷。单个球状气孔和单一夹杂周围应力集中并不严重，但密集气孔或夹杂连通时应力区扩大、应力值急剧上升。</p><p>对脆性断裂的影响：裂纹尖端尖锐度最大，对脆性断裂影响最大；气孔、夹渣等体积类缺欠小于5%且工作温度不低于材料韧脆转变温度时，对结构安全影响较小。应力腐蚀开裂通常从表面开始，焊接接头应力腐蚀裂纹扩展和腐蚀疲劳破坏大都是从焊趾处开始。</p><p>缺欠分类方法：按存在位置分表面缺欠和内部缺欠；按分布区域分焊缝、熔合区、热影响区及母材缺欠；按成形及性能分成形、连接及性能缺欠；按产生原因分构造、工艺及冶金缺欠；按影响断裂机制分平面缺欠（裂纹、未熔合、线状夹渣等）和非平面缺欠（气孔、圆形夹渣等）。</p><p>按GB/T 6417.1-2005，熔焊接头缺欠按性质、特征分为6类：裂纹、孔穴、固体夹杂、未熔合及未焊透、形状和尺寸不良、其他缺欠。</p><p>裂纹类：纵向裂纹（基本与焊缝轴线平行）、横向裂纹（基本垂直）、放射状裂纹（具有公共点，小裂纹称星形裂纹）、弧坑裂纹、间断裂纹群、枝状裂纹。</p><p>孔穴类：气孔（球形、均布、局部密集、链状、条状、虫形、表面气孔）；缩孔（结晶缩孔、弧坑缩孔、末端弧坑缩孔）；微型缩孔（微型结晶缩孔、微型穿晶缩孔）。</p><p>固体夹杂类：夹渣、焊剂夹渣、氧化物夹杂（铝合金焊接时因熔池保护不善和湍流产生的氧化膜称“皱褶”）、金属夹杂（钨、铜等外来金属颗粒）。未熔合及未焊透：未熔合是焊缝金属与母材或各焊层之间未结合（分侧壁、焊道间、根部未熔合）；未焊透是实际熔深与公称熔深之间的差异。</p><p>形状和尺寸不良类：咬边（母材或前一道熔敷金属在焊趾处因焊接产生的不规则缺口）、凸度过大、下塌、焊缝形面不良、焊瘤、错边、下垂、烧穿、未焊满、表面不规则、焊缝接头不良、焊缝尺寸不正确等。其他缺欠：电弧擦伤、飞溅（包括钨飞溅）、表面撕裂、磨痕、凿痕、打磨过量、定位焊缺欠、回火色、表面鳞片、焊剂残留物等。</p><h2 class=\"n2\">第四章　焊接热影响区的组织和性能</h2><h3 class=\"n3\">§1　焊接热循环</h3><p>热影响区（HAZ）：焊缝两侧发生组织和性能变化的区域，又称近缝区。焊接热循环：焊件上某点温度由低而高、达到最高值后又由高而低随时间变化的过程；距焊缝不同距离的各点所经历的热循环不同，焊接方法不同热循环曲线形状也不同。</p><p>焊接热循环主要参数：加热速度ωH（比热处理条件下快得多）；加热的最高温度Tm（很高，高于热处理温度时晶粒易长大）；相变温度以上的停留时间tH（停留时间延长有利于奥氏体均质化，但温度太高会导致晶粒严重长大）；冷却速度ωc和冷却时间（t8/5、t8/3、t100等）。</p><p>焊接热循环特点：加热温度高（比热处理加热温度高100～200℃）；加热速度快（是热处理加热速度的几十倍甚至几百倍）；高温停留时间短（手工焊约4～20s、埋弧自动焊约30～100s）；自然冷却（冷却速度快、低温转变增多）；局部加热（局部集中加热产生复杂应力，组织转变在复杂应力下完成）。</p><p>多层焊热循环：相邻层间彼此具有热处理作用，多层焊比单层焊优越。长段多层焊——每道焊缝长度1m以上，焊下一层时前一层已冷至100～200℃以下，不适于淬硬倾向大的钢种；短段多层焊——每道焊缝长度约50～400mm，焊下层时前层温度较高。</p><h3 class=\"n3\">§2　焊接热循环条件下的金属组织转变特点</h3><p>加热过程：加热速度增大，扩散相变滞后，Ac1、Ac3及（Ac3-Ac1）升高；含碳化物合金元素（Cr、W、Mo、V等）时加热速度影响更大；快速加热时奥氏体均质化过程不完全；Tm很大、近缝区晶粒易长大。</p><p>合金元素分类（按与碳亲和力大小）：碳化物形成元素Zr、Nb、Ti、V、W、Mo、Cr、Mn、Fe；强碳化物形成元素Ti、V、Nb（与C形成的碳化物比Fe3C稳定）；弱碳化物形成元素Mn；非碳化物形成元素Ni、Co、Cu、Si、Al、N、B。</p><p>45钢：相同冷却速度下，焊接条件比热处理条件下淬硬倾向增大、CCT曲线右移，原因是焊接条件下不存在碳化物溶解过程且HAZ组织粗化；40Cr：淬硬倾向降低、CCT曲线左移，原因是Cr等碳化物形成元素在焊接条件下高温停留时间短、未充分向奥氏体内溶解，奥氏体稳定性降低。</p><p>CCT图：用焊接热模拟试验装置建立某种钢的焊接CCT图；意义——在大量钢种试验前可预先估计热影响区的组织性能，或作为制定工艺、确定焊接线能量的依据；应用——通过CCT图可得到不同冷却速度下的组织。影响CCT图的因素：母材化学成分、冷却速度、峰值温度、晶粒粗化、应力应变。</p><h3 class=\"n3\">§3　焊接热影响区的组织和性能</h3><p>焊接结构钢按热处理特性分两类：不易淬火钢（低碳钢及某些不易淬硬的低合金钢，如16Mn、15MoV、15MnTi）；易淬火钢（低碳调质高强钢18MnMoNb、中碳钢45钢、中碳调质高强钢30CrMnSi等）。HAZ组织分布与母材焊前热处理状态有关。</p><div class=\"tbl\"><table><thead><tr><th>HAZ分区</th><th>温度范围</th><th>组织与性能特点</th></tr></thead><tbody><tr><td>熔合区</td><td>TL～TS（半熔化区）</td><td>范围很窄</td></tr><tr><td>过热区</td><td>TS～1100℃</td><td>奥氏体晶粒粗大，冷却后得到粗大组织，韧性很低</td></tr><tr><td>相变重结晶区</td><td>A3～1000℃</td><td>发生重结晶，焊后得到均匀细小组织，塑性和韧性较好</td></tr><tr><td>不完全重结晶区</td><td>Ac1～Ac3</td><td>一部分发生相变重结晶、另一部分保留并粗化，组织性能不均匀</td></tr></tbody></table></div><p>易淬火钢HAZ分区：完全淬火区（Ac3以上，淬硬倾向大，焊后得到粗大马氏体）；不完全淬火区（Ac1～Ac3，快速加热时铁素体很少溶入奥氏体，快冷时原铁素体保持不变并有不同程度长大，最后形成马氏体-铁素体组织）；回火区（母材焊前为调质态时可能存在不同程度的回火处理）。</p><p>注意问题：熔合区、过热区晶粒严重长大，是焊接接头的薄弱地带；低碳钢的不完全重结晶区在急冷急热条件下会表现出高碳钢的行为；成分偏析严重、C、P、S高时易产生淬硬组织和裂纹。</p><p>HAZ硬化：常用硬度变化判定热影响区性能变化；测热影响区（一般在熔合区）的最高硬度Hmax可间接估计热影响区的强度、塑性和裂纹倾向。碳当量：把钢中合金元素（包括碳）对其淬硬（包括冷裂、脆化）的影响程度折合成碳的相当含量。</p><div class=\"tbl\"><table><thead><tr><th>碳当量公式</th><th>适用钢种</th></tr></thead><tbody><tr><td>CE（IIW，国际焊接学会）</td><td>中等强度的非调质低合金钢（σb=400～700MPa）</td></tr><tr><td>Ceq（WES，日本焊接协会）</td><td>强度级别较高的低合金高强钢（σb=500～1000MPa）</td></tr><tr><td>Pcm（伊藤公式）</td><td>含碳量≤0.17%、σb=400～900MPa的低合金高强钢</td></tr><tr><td>CEN（Suzuki、Yurioka）</td><td>C≥0.18%时近似CE（IIW）；C≤0.17%时CE近似Pcm</td></tr></tbody></table></div><p>注意：CE（IIW）和Ceq（WES）不适用于含碳量0.17%以下的钢种。结论：随钢种碳当量（Pcm、CE（IIW））增加，最高硬度Hmax随之增加、淬硬倾向增加。最高硬度计算：国产钢公式中τM100为HAZ组织全部为马氏体时的t8/5，此时硬度达饱和值、与冷却时间无关、只与含碳量有关；另有铃木（Suzuki）公式适用于日本低合金高强钢。</p><p>HAZ脆化类型：粗晶脆化、析出脆化、组织脆化、热应变时效脆化、氢脆化、石墨脆化。</p><p>粗晶脆化：产生于HAZ靠近熔合线附近和过热区；不易淬火钢主要因晶粒长大（Ti、Nb、V、W、Mo等合金元素的碳、氮化物阻碍晶界迁移、防止晶粒长大）；易淬火钢由脆性组织（孪晶马氏体、非平衡态粒状贝氏体等）产生；线能量、峰值温度升高、t8/5增大均使晶粒粗化加剧。粗晶脆化在化学成分、组织状态不均匀的非平衡条件下形成，常与组织脆化叠加，脆化更严重。</p><p>组织脆化：低碳低合金高强钢HAZ组织脆化主要由于出现M-A组元（常伴粒状贝氏体）、上贝氏体、粗大魏氏组织以及“组织遗传”等造成。M-A组元脆化出现在焊缝和HAZ中等冷速条件下：冷却速度大全部转变成高碳马氏体；冷却速度小奥氏体转变成铁素体和渗碳体；中等淬硬倾向钢种合金化高、奥氏体稳定不分解；在上贝氏体形成温度范围内经中温转变形成。</p><p>析出脆化：固溶态的强碳化物或氮化物形成元素，因焊接热循环影响（时效或回火）析出碳化物Cm和氮化物Nm，使强度硬度升高、冲击韧性AkV降低而脆化；沉淀相细小弥散分布于晶内时不易析出、有利于韧性，存在于相界或晶界、聚集或沿晶界薄膜状分布时会导致脆化。</p><p>遗传脆化（组织遗传）：厚板多层焊时粗晶区组织未得到改善、仍保留粗晶组织和结晶学的位相关系；条件为原始组织（非平衡）及晶界上出现等轴细晶（“晶粒边界效应”）；致脆原因是粗大晶粒脆化和组织变化。</p><p>热应变时效脆化（HSE）：静应变时效脆化（室温或低温下，含C、N自由间隙原子时产生）；动应变时效脆化（较高温度，特别是200～400℃温度范围）。</p><p>HAZ韧化途径：母材原始组织（多元合金化、微合金化、韧化相——针状铁素体、下贝氏体、低碳马氏体等）；韧化处理（焊后热处理、预热等）；控制焊接工艺（线能量的控制）。</p><p>HAZ软化：调质钢焊前经调质处理，回火温度越低、焊后软化越严重；热处理强化合金发生过时效软化。</p><p>HAZ力学性能研究主要从两方面进行：HAZ不同部位的力学性能、熔合区附近的性能；对淬硬倾向不大的钢种（如16Mn钢）采用焊接热模拟技术研究HAZ不同部位的常规力学性能。</p><h3 class=\"n3\">§4　焊接热、力模拟试验方法的特点</h3><p>包括焊接热模拟技术发展的背景、焊接模拟技术发展的过程及其现状、焊接模拟试验的基本方法及意义；典型设备如Gleeble 3500热模拟试验机，用于焊接热影响区连续冷却曲线（SHCCT图）的测定。</p><h1 class=\"n1\">第二部分　快速复习题</h1><p>以下题目覆盖各章高频考点，全部为可直接快速作答的单项选择题与填空题，答案见各章末。</p><h2 class=\"n2\">第一章　焊接化学冶金　快速练习</h2><p>（一）单项选择题</p><p>焊接化学冶金过程是熔化焊时，焊接区内各种物质之间在高温下相互作用的过程，其作用对象不包括（　）A. 气体　B. 液态金属　C. 熔渣　D. 固态母材</p><p>焊条加热的三类热源中，可以忽略不计的是（　）A. 电阻热　B. 电弧热　C. 化学反应热　D. 等离子弧热</p><p>熔滴尺寸大于焊丝直径时的熔滴过渡称为（　）A. 喷射过渡　B. 颗粒过渡　C. 短路过渡　D. 附壁过渡</p><p>主要用于φ1.6mm以下细丝CO2气体保护焊的熔滴过渡形式是（　）A. 短路过渡　B. 颗粒过渡　C. 喷射过渡　D. 渣壁过渡</p><p>碱性焊条的熔滴过渡以（　）为主。A. 细颗粒过渡和附壁过渡　B. 短路过渡和大颗粒过渡　C. 喷射过渡　D. 渣壁过渡</p><p>实测手工电弧焊碳钢焊条熔滴的温度约为（　）A. 1600～1900K　B. 1800～2400K　C. 2100～2700K　D. 3000K以上</p><p>手工电弧焊熔池的质量约为（　）A. 0.6～16g　B. 30～130g　C. 0.5～1kg　D. 2～5kg</p><p>真空电子束焊对焊接区的保护方式属于（　）A. 渣保护　B. 气保护　C. 真空保护　D. 自保护</p><p>埋弧焊时熔滴通过熔渣之下的电弧完成过渡，属于（　）A. 短路过渡　B. 渣保护过渡　C. 喷射过渡　D. 附壁过渡</p><p>药皮反应区中，温度高于100℃时首先发生的反应是（　）A. 有机物分解　B. 吸附水蒸发　C. 碳酸盐分解　D. 铁合金氧化</p><p>熔滴反应区的反应时间约为（　）A. 0.01～0.1s　B. 3～8s　C. 6～25s　D. 1～2min</p><p>焊接电流增大时熔滴变细、停留时间缩短，冶金反应（　）A. 更充分　B. 不充分　C. 不受影响　D. 停止进行</p><p>（二）填空题</p><p>焊接化学冶金过程的对象包括气体、液态金属和＿＿。</p><p>焊条加热的热源有电阻热、电弧热和＿＿。</p><p>熔滴尺寸等于或小于焊丝直径时的过渡称为＿＿过渡。</p><p>短路过渡电弧稳定、飞溅小、过渡频率高，广泛用于＿＿结构及全位置焊接。</p><p>手工电弧焊的冶金反应区分为药皮反应区、＿＿和熔池反应区。</p><p>手工电弧焊（SMAW）熔池反应区的反应时间为＿＿s。</p><p>焊缝金属中局部熔化的母材所占比例称为＿＿。</p><p>纤维素药皮的烘干温度一般不超过＿＿℃。</p><p>焊接区气体来源包括焊接材料、气体介质、焊丝和母材表面的＿＿以及金属和熔渣蒸发产生的气体。</p><p>氢以原子或质子形式存在于金属晶格中并可自由扩散的形式称为＿＿氢。</p><p>焊后脱氢处理可采用350℃保温1h或250℃保温＿＿h。</p><p>熔渣的结构理论包括分子理论和＿＿理论。</p><p class=\"ans\">参考答案</p><p>选择题：1.D　2.C　3.B　4.A　5.B　6.C　7.A　8.C　9.B　10.B　11.A　12.B</p><p>填空题：1.熔渣　2.化学反应热　3.喷射　4.薄板　5.熔滴反应区　6.3～8　7.熔合比　8.150　9.油锈等杂质　10.扩散　11.6　12.离子</p><h2 class=\"n2\">第二章　焊接材料　快速练习</h2><p>（一）单项选择题</p><p>按焊接熔渣的酸碱度分类，E4303属于（　）A. 酸性焊条　B. 碱性焊条　C. 中性焊条　D. 盐基型焊条</p><p>适合焊接重要结构、焊缝塑韧性高的低氢型焊条型号是（　）A. E4303　B. E5015　C. H08A　D. J422</p><p>焊芯的主要作用是（　）A. 稳弧　B. 导电和填充金属　C. 造气　D. 脱氧</p><p>焊条药芯用量最多的牌号是（　）A. H08A　B. H08E　C. H10MnSi　D. H08Mn2Si</p><p>药皮中起稳定电弧作用、含低电离电位元素的组分是（　）A. 造渣剂　B. 稳弧剂　C. 造气剂　D. 增塑剂</p><p>含大量碳酸盐、萤石、铁合金及TiO2的药皮类型是（　）A. 钛钙型　B. 纤维素型　C. 低氢型　D. 石墨型</p><p>碱性焊条J507电弧稳定性较差，主要原因是药皮中含有较多的（　）A. 大理石　B. 萤石　C. 金红石　D. 锰铁</p><p>高温熔渣在1500℃时合适的粘度约为（　）A. 0.1～0.2Pa·s　B. 0.3～0.4Pa·s　C. 1～2Pa·s　D. 10Pa·s以上</p><p>因凝固温度范围大（长渣）而不能适应横、立、仰焊的焊条类型是（　）A. 纤维素型　B. 钛型　C. 氧化铁型　D. 低氢型</p><p>焊后熔渣壳从焊缝表面清除的难易程度称为（　）A. 脱渣性　B. 全位置焊接性　C. 药皮发红　D. 焊缝成形</p><p>考虑飞溅损失后，真正反映焊接生产率的指标是（　）A. 焊条熔化系数αp　B. 焊条熔敷系数αH　C. 损失系数ψ　D. 焊接电流</p><p>低氢型焊条焊接烟尘的含氟量（　）A. 10%以上　B. 5%以下　C. 不含氟　D. 30%以上</p><p>（二）填空题</p><p>焊条按熔渣酸碱度分为酸性焊条和＿＿焊条。</p><p>焊条由焊芯和＿＿组成。</p><p>药皮的作用包括机械保护、＿＿和改善焊接工艺性能。</p><p>低氢型焊条药皮含大量碳酸盐、萤石、铁合金及TiO2，又称＿＿焊条。</p><p>药皮中的粘结剂常用＿＿水玻璃。</p><p>焊条使用到后半段因药皮温升过高而发红、开裂或脱落的现象称为＿＿。</p><p>焊接烟尘的毒性主要有锰中毒和＿＿两种。</p><p>焊剂相当于＿＿，焊丝相当于焊条药芯。</p><p>粘结焊剂又称陶质焊剂，其烘干温度在＿＿℃以下。</p><p>烧结焊剂的高温烧结温度范围为＿＿℃。</p><p>焊剂的质量要求中，含水量不得大于＿＿%。</p><p>焊剂中机械夹杂物的含量不得大于＿＿%。</p><p class=\"ans\">参考答案</p><p>选择题：1.A　2.B　3.B　4.A　5.B　6.C　7.B　8.A　9.C　10.A　11.B　12.A</p><p>填空题：1.碱性（低氢型）　2.药皮　3.冶金处理　4.低氢　5.钠（钾钠）　6.药皮发红　7.氟中毒　8.焊条药皮　9.400　10.400～1000　11.0.10　12.0.30</p><h2 class=\"n2\">第三章　熔池凝固和焊缝固态相变　快速练习</h2><p>（一）单项选择题</p><p>下列不属于熔池凝固特点的是（　）A. 过热度大　B. 过冷度大　C. 结晶速度小　D. 运动态结晶</p><p>熔池中晶核的形成以（　）为主。A. 自发形核　B. 非自发形核　C. 均匀形核　D. 均质形核</p><p>熔合线处θ=90°，此时结晶线速度vc与焊接速度v的关系是（　）A. vc=v　B. vc=0　C. vc=2v　D. vc=v/2</p><p>熔池中心处θ=0°，结晶线速度vc（　）A. 等于0　B. 等于焊接速度v（最大值）　C. 等于v/2　D. 大于v</p><p>过冷度等于零、无成分过冷时得到的结晶形态是（　）A. 平面结晶　B. 胞状结晶　C. 树枝状结晶　D. 等轴结晶</p><p>过冷度很大、成分过冷区很宽，结晶前沿可自发生核形成自由长大树枝晶的形态是（　）A. 胞状结晶　B. 胞状树枝结晶　C. 树枝状结晶　D. 等轴结晶</p><p>C0、R一定时，温度梯度G增大，成分过冷（　），结晶形态由等轴晶向平面晶过渡。A. 增大　B. 减小　C. 不变　D. 先增后减</p><p>焊接条件下，焊缝中心G小、R大，倾向于获得（　）A. 平面晶　B. 胞状晶　C. 等轴晶　D. 魏氏组织</p><p>先结晶的固相较纯、后结晶的溶质浓度较高的偏析属于（　）A. 区域偏析　B. 层状偏析　C. 显微偏析　D. 宏观偏析</p><p>由结晶潜热和熔滴过渡热能输入周期性变化引起的偏析是（　）A. 显微偏析　B. 区域偏析　C. 层状偏析　D. 晶界偏析</p><p>氢气孔的特征是（　）A. 内部条虫状　B. 表面喇叭口形、四周内壁光滑　C. 表面蜂窝状　D. 沿柱状晶分布</p><p>焊缝中的CO气孔呈（　）A. 球形　B. 螺钉状　C. 条虫状或蠕虫状、沿柱状晶分布　D. 蜂窝状</p><p>（二）填空题</p><p>熔池结晶过程包括形核和＿＿两个阶段。</p><p>熔池中非自发形核的现成表面包括合金元素或杂质的悬浮质点和熔合区附近＿＿状态基本金属的晶粒表面。</p><p>晶粒成长沿最大＿＿梯度方向最有利，可形成粗大的柱状晶。</p><p>焊接速度v增大、θ增大时，柱状晶趋向垂直于中心线，容易产生＿＿裂纹。</p><p>固溶体合金结晶除温度过冷外，还存在＿＿过冷。</p><p>焊接条件下，焊缝边界G大、R小，＿＿晶得到发展。</p><p>熔合区是焊接接头的＿＿环节。</p><p>低碳钢焊缝室温组织为铁素体加少量＿＿。</p><p>针状铁素体在＿＿℃左右于晶粒内形成，常以质点为核心放射性成长。</p><p>上贝氏体在光学显微镜下呈＿＿状，形成于550～500℃。</p><p>含碳量较高（≥0.4%）的焊缝快冷形成的片状马氏体又称＿＿马氏体（高碳马氏体）。</p><p>咬边是在＿＿处因焊接产生的不规则缺口。</p><p class=\"ans\">参考答案</p><p>选择题：1.C　2.B　3.B　4.B　5.A　6.D　7.B　8.C　9.C　10.C　11.B　12.C</p><p>填空题：1.长大　2.半熔化　3.温度　4.热　5.成分　6.平面　7.薄弱　8.珠光体　9.500　10.羽毛　11.孪晶　12.焊趾</p><h2 class=\"n2\">第四章　焊接热影响区的组织和性能　快速练习</h2><p>（一）单项选择题</p><p>热影响区（HAZ）又称（　）A. 熔合区　B. 近缝区　C. 过热区　D. 焊缝区</p><p>手工电弧焊时相变温度以上的高温停留时间约为（　）A. 4～20s　B. 30～100s　C. 1～5min　D. 0.01～0.1s</p><p>埋弧自动焊时高温停留时间约为（　）A. 4～20s　B. 30～100s　C. 1～2h　D. 数秒</p><p>焊接加热速度比热处理加热速度（　）A. 略快　B. 快几十倍甚至几百倍　C. 基本相同　D. 更慢</p><p>加热速度增大时，扩散相变滞后，Ac1、Ac3及（Ac3-Ac1）（　）A. 降低　B. 升高　C. 不变　D. 无规律</p><p>相同冷却速度下，45钢焊接条件下的淬硬倾向比热处理（　），CCT曲线右移。A. 增大　B. 减小　C. 不变　D. 先增后减</p><p>40Cr焊接条件下CCT曲线左移、淬硬倾向降低，原因是（　）A. 晶粒粗化　B. Cr等高温停留时间短、未充分溶入奥氏体，奥氏体稳定性降低　C. 含碳量高　D. 冷却速度过快</p><p>下列属于不易淬火钢的是（　）A. 18MnMoNb　B. 45钢　C. 16Mn　D. 30CrMnSi</p><p>不易淬火钢HAZ中晶粒粗大、韧性很低的区域是（　）A. 熔合区　B. 过热区　C. 相变重结晶区　D. 不完全重结晶区</p><p>易淬火钢完全淬火区（Ac3以上）焊后得到的组织是（　）A. 细小铁素体　B. 粗大马氏体　C. 珠光体　D. 上贝氏体</p><p>焊接接头中晶粒严重长大、属于薄弱地带的是（　）A. 焊缝中心　B. 熔合区和过热区　C. 相变重结晶区　D. 母材</p><p>动应变时效脆化主要发生的温度范围是（　）A. 室温附近　B. 200～400℃　C. 500～600℃　D. 800℃以上</p><p>（二）填空题</p><p>焊缝两侧发生组织和性能变化的区域称为＿＿，又称近缝区。</p><p>焊接热循环是指焊件上某点温度由低到高、达到最高值后又由高到低随＿＿变化的过程。</p><p>焊接热循环的主要参数包括加热速度、最高温度、相变温度以上停留时间和＿＿。</p><p>焊接加热的最高温度比热处理温度高＿＿℃。</p><p>长段多层焊每道焊缝的长度在＿＿以上。</p><p>短段多层焊每道焊缝的长度约为＿＿。</p><p>强碳化物形成元素如Ti、V、Nb与C形成的碳化物比＿＿稳定。</p><p>相同冷却速度下，45钢焊接条件下CCT曲线向＿＿移动。</p><p>不易淬火钢相变重结晶区的温度范围为A3～＿＿℃。</p><p>不完全重结晶区的温度范围为Ac1～＿＿。</p><p>把钢中合金元素（包括碳）对其淬硬影响折合成碳的相当含量称为＿＿。</p><p>伊藤Pcm公式适用于含碳量＿＿%以下的低合金高强钢。</p><p class=\"ans\">参考答案</p><p>选择题：1.B　2.A　3.B　4.B　5.B　6.A　7.B　8.C　9.B　10.B　11.B　12.B</p><p>填空题：1.热影响区　2.时间　3.冷却速度（冷却时间）　4.100～200　5.1m　6.50～400mm　7.Fe3C　8.右　9.1000　10.Ac3　11.碳当量　12.0.17</p><h1 class=\"n1\">附录　高频考点一句话速记</h1><p>焊冶是“再熔炼”，普冶是“提炼”；原材料和目的均不同。</p><p>焊条加热三大热源：电阻热、电弧热、化学反应热（仅占1%～3%，可忽略）。</p><p>碱性焊条以短路过渡+大颗粒过渡为主，酸性焊条以细颗粒过渡+附壁过渡为主。</p><p>保护方式五种：渣保护、气保护、气渣联合保护、真空保护、自保护。</p><p>反应区三段：药皮（先蒸发水分）→熔滴（1800～2400℃、10³～10⁴cm²/kg、0.01～0.1s）→熔池（1600～1900℃、3～130cm²/kg、3～8s）。</p><p>氮源空气、氢源水分；控氮靠保护+Ti/Al/Zr，控氢靠烘干+氟化物，控氧靠工艺+冶金。</p><p>氢脆是暂态现象（可时效消除）；氢白点（鱼眼）直径0.5～3mm；氢致冷裂纹三要素：H、M、R。</p><p>熔渣碱度B＞1碱性、B＜1酸性；CaF2降粘度、降表面张力；表面张力金属键最大。</p><p>脱氧三步：先期（药皮固态加热，Al、Ti大量烧损）→沉淀（熔滴与熔池）→扩散（降温、酸性渣有利）。</p><p>硫害热裂（Fe+FeS共晶985℃），磷害冷脆热裂（Fe+Fe3P共晶1050℃）；脱硫常用Mn。</p><p>合金过渡系数η：元素越活泼越低、沸点低越低；Kb↑η↓；I↑η↓；氩弧焊η较大。</p><p>E4303（J422）钛钙型酸性、气渣联合保护；E5015（J507）低氢型碱性、塑韧性好、用于重要结构。</p><p>药皮“七剂”：稳弧、造渣、造气、脱氧、合金、粘结、增塑。</p><p>立、仰、横焊要“短渣”——凝固温度范围窄、快速凝固；氧化铁型长渣不行。</p><p>飞溅影响因素：粘度↑、电流↑、水分↑、电压↑、交流＞直流、大颗粒过渡。</p><p>焊剂=焊条药皮、焊丝=焊条药芯；焊剂三种制造方法：熔炼、粘结（陶质，400℃以下）、烧结（400～1000℃）。</p><p>焊剂质量：含水量≤0.10%、机械夹杂物≤0.30%、S≤0.060%、P≤0.080%。</p><p>熔池凝固五特点：过热度大、过冷度大、烧损大、结晶速度快、运动态结晶。</p><p>结晶五形态随成分过冷增大：平面→胞状→胞状树枝→树枝→等轴。</p><p>偏析三种：显微（枝晶间）、区域（杂质推向中心）、层状（结晶潜热周期性变化）。</p><p>气孔三兄弟：氢-表面喇叭口、氮-表面蜂窝成堆、CO-内部条虫沿柱状晶。</p><p>铁素体四类：PF晶界、FSP侧板条（无碳贝氏体）、AF针状（500℃）、FGF细晶（贝氏铁素体）。</p><p>上贝羽毛状、下贝针状强韧；板条马氏体位错、片状马氏体孪晶（C≥0.4%）。</p><p>焊接缺欠六类：裂纹、孔穴、固体夹杂、未熔合及未焊透、形状和尺寸不良、其他；裂纹最危险、绝对不允许存在。</p><p>热循环四参数：加热速度、最高温度、相变以上停留时间、冷却速度（t8/5等）。</p><p>手工焊高温停留4～20s、埋弧自动焊30～100s；加热快几十到几百倍、温度高100～200℃。</p><p>45钢CCT右移（淬硬↑，无碳化物溶解+组织粗化）；40Cr CCT左移（淬硬↓，Cr未充分溶入奥氏体）。</p><p>不易淬火钢HAZ分区：熔合区（窄）、过热区（韧性低）、相变重结晶区（细）、不完全重结晶区（不均）。</p><p>碳当量公式适用性：CE(IIW)适用σb=400～700MPa，Ceq(WES)适用σb=500～1000MPa，Pcm适用C≤0.17%。</p><p>HAZ脆化六类：粗晶、组织、析出、热应变时效、氢、石墨；M-A组元是组织脆化主因之一。</p><p>动应变时效脆化在200～400℃；调质钢回火温度越低、焊后软化越严重。</p>";
const FRAMEWORK_HTML = "<div class=\"fwgrid\">\n  <div class=\"fwcard c0\">\n    <div class=\"fw-hd\"><b>绪论 焊接概述</b><span>核心：焊接的实质、能源与热过程</span></div>\n    <div class=\"fw-bd\">\n      <div class=\"fw-sec\"><span class=\"fw-lb\">焊接定义与措施</span><ul>\n        <li>定义：加热或加压（或并用）、用或不用填充材料、原子间结合、永久性连接</li>\n        <li>加压措施：破坏表面氧化膜 + 增加有效接触面积；加热措施：去氧化膜、降变形阻力、增原子振动能、促扩散/再结晶/化学反应/结晶</li>\n        <li>按过程特点分：冷压焊、电阻焊、熔化焊</li>\n      </ul></div>\n      <div class=\"fw-sec\"><span class=\"fw-lb\">能源与热过程</span><ul>\n        <li>能源9种：电弧热、化学热、电阻热、高频感应热、摩擦热、等离子焰、电子束、激光束（+其他）</li>\n        <li>热过程两特征：局部性 + 瞬时性；加热区：活性斑点区 dA + 加热斑点区 dH</li>\n        <li>接头形成：加热→熔化→冶金反应→凝固→固态相变</li>\n      </ul></div>\n      <div class=\"fw-sec\"><span class=\"fw-lb\">温度场</span><ul>\n        <li>定义：焊件上某瞬时温度分布；分稳定 / 非稳定 / 准稳定</li>\n        <li>准稳定：对移动热源，静态坐标系非稳定、移动坐标系稳定</li>\n        <li>影响因素：热源性质、线能量、金属性质（λ、c、a）、板厚形状</li>\n      </ul></div>\n    </div>\n  </div>\n  <div class=\"fwcard c1\">\n    <div class=\"fw-hd\"><b>第一章 焊接化学冶金</b><span>核心：高温下气体·液态金属·熔渣的相互作用</span></div>\n    <div class=\"fw-bd\">\n      <div class=\"fw-sec\"><span class=\"fw-lb\">§1 冶金过程特点</span><ul>\n        <li>热源三来源：电阻热·电弧热·化学反应热（占1%~3%可忽略）</li>\n        <li>熔滴过渡：短路（细丝CO₂焊）/颗粒·喷射/附壁/渣壁；碱性=短路+大颗粒，酸性=细颗粒+附壁</li>\n        <li>保护五种：渣·气·气渣联合·真空·自保护</li>\n        <li>反应区三段：药皮→熔滴（0.01~0.1s）→熔池（SMAW 3~8s）；熔合比θ</li>\n      </ul></div>\n      <div class=\"fw-sec\"><span class=\"fw-lb\">§2 气相对金属的作用</span><ul>\n        <li>氮：源空气；Fe₄N脆化，Ti/V→TiN/VN除时效脆化；15MnVN增强</li>\n        <li>氢：氢脆、白点（鱼眼0.5~3mm）、冷裂纹（H·M·R）；烘干+氟化物防氢</li>\n        <li>氧：CO气孔·飞溅·烧损有益元素；控氧：限制来源+工艺+冶金</li>\n      </ul></div>\n      <div class=\"fw-sec\"><span class=\"fw-lb\">§3 熔渣 · §4 合金过渡</span><ul>\n        <li>碱度B&gt;1(1.3)碱 / B=1中 / B&lt;1酸；CaF₂降粘度降表面张力</li>\n        <li>氧化：扩散氧化·置换氧化；脱氧：先期·沉淀·扩散</li>\n        <li>硫（Fe+FeS 985℃热裂）磷（Fe+Fe₃P 1050℃冷脆）控制</li>\n        <li>过渡系数η：活泼元素↓、Kb↑↓、I↑↓、氩弧焊↑；对氧亲和力Cu→Al递增</li>\n      </ul></div>\n    </div>\n  </div>\n  <div class=\"fwcard c2\">\n    <div class=\"fw-hd\"><b>第二章 焊接材料</b><span>核心：焊条、焊剂、焊丝的选型与冶金性能</span></div>\n    <div class=\"fw-bd\">\n      <div class=\"fw-sec\"><span class=\"fw-lb\">§1 焊条</span><ul>\n        <li>组成：焊芯（导电+填充，多用H08A）+药皮（七剂：稳弧/造渣/造气/脱氧/合金/粘结/增塑）</li>\n        <li>E4303（J422）钛钙型·酸性·气渣联合；E5015（J507）低氢型·碱性·塑韧好</li>\n        <li>J507稳弧差因CaF₂氟电离势高（18.6V）夺电子；短渣才能立仰横焊</li>\n        <li>飞溅↑：粘度↑·I↑·水分↑·U↑·交流&gt;直流；钛型脱渣最好、低氢最差</li>\n      </ul></div>\n      <div class=\"fw-sec\"><span class=\"fw-lb\">§2 焊剂</span><ul>\n        <li>焊剂=焊条药皮、焊丝=焊条药芯；作用：隔离空气+冶金处理</li>\n        <li>制造：熔炼 / 粘结（陶质，&lt;400℃）/ 烧结（400~1000℃）</li>\n        <li>质量：H₂O≤0.10%、夹杂≤0.30%、S≤0.060%、P≤0.080%；高硅焊剂SiO₂&gt;30%</li>\n      </ul></div>\n      <div class=\"fw-sec\"><span class=\"fw-lb\">§3 焊丝</span><ul>\n        <li>分类：按焊接方法 / 形状结构（实心·药芯·活性）/ 适用金属材料</li>\n      </ul></div>\n    </div>\n  </div>\n  <div class=\"fwcard c3\">\n    <div class=\"fw-hd\"><b>第三章 熔池凝固与焊缝固态相变</b><span>核心：结晶、组织转变、气孔夹杂与焊接缺欠</span></div>\n    <div class=\"fw-bd\">\n      <div class=\"fw-sec\"><span class=\"fw-lb\">§1 熔池凝固</span><ul>\n        <li>特点：过热度大·过冷度大·烧损大·速度快·运动结晶；以非自发形核为主</li>\n        <li>结晶五形态（成分过冷↑）：平面→胞状→胞状树枝→树枝→等轴</li>\n        <li>偏析三种：显微（枝晶间）·区域（推向中心）·层状（潜热周期）；熔合区=薄弱环节</li>\n      </ul></div>\n      <div class=\"fw-sec\"><span class=\"fw-lb\">§2 焊缝固态相变</span><ul>\n        <li>低碳钢：F+少量P；铁素体四类：PF（晶界）/FSP（侧板条）/AF（针状500℃）/FGF</li>\n        <li>上贝氏体羽毛状、下贝氏体针状强韧、M-A组元→粒状/条状贝氏体</li>\n        <li>板条M=位错M（韧性好）；片状M=孪晶M（C≥0.4%）</li>\n      </ul></div>\n      <div class=\"fw-sec\"><span class=\"fw-lb\">§3 气孔夹杂 · §5 焊接缺欠</span><ul>\n        <li>气孔：H₂表面喇叭口·N₂表面蜂窝·CO内部条虫沿柱状晶</li>\n        <li>夹杂：氧化物（层状撕裂）·氮化物Fe₄N·硫化物FeS（热裂）</li>\n        <li>缺欠六类（GB/T 6417.1-2005）：裂纹·孔穴·固体夹杂·未熔合未焊透·形状尺寸不良·其他；裂纹最危险</li>\n      </ul></div>\n    </div>\n  </div>\n  <div class=\"fwcard c4\">\n    <div class=\"fw-hd\"><b>第四章 焊接热影响区</b><span>核心：热循环、组织转变、HAZ分区与性能</span></div>\n    <div class=\"fw-bd\">\n      <div class=\"fw-sec\"><span class=\"fw-lb\">§1 焊接热循环</span><ul>\n        <li>四参数：加热速度·最高温度·相变以上停留时间·冷却速度（t8/5等）</li>\n        <li>特点：温度高100~200℃、速度快几十至几百倍、手工停留4~20s/埋弧30~100s</li>\n      </ul></div>\n      <div class=\"fw-sec\"><span class=\"fw-lb\">§2 组织转变特点</span><ul>\n        <li>45钢CCT右移（淬硬↑：无碳化物溶解+组织粗化）；40Cr左移（淬硬↓：Cr未充分溶入A）</li>\n        <li>合金元素按碳亲和力：强碳化物Ti/V/Nb、弱碳化物Mn、非碳化物Ni/Co/Cu/Si/Al等</li>\n      </ul></div>\n      <div class=\"fw-sec\"><span class=\"fw-lb\">§3 HAZ组织与性能</span><ul>\n        <li>不易淬火钢分区：熔合区·过热区（韧性低）·重结晶区（细）·不完全重结晶区（不均）</li>\n        <li>碳当量：CE(IIW) 400~700MPa / Ceq(WES) 500~1000 / Pcm C≤0.17%</li>\n        <li>脆化六类：粗晶·组织（M-A）·析出·热应变时效（200~400℃）·氢·石墨</li>\n        <li>韧化：母材组织+焊后热处理+控制线能量；调质钢回火温度越低软化越严重</li>\n      </ul></div>\n    </div>\n  </div>\n  <div class=\"fwcard c5\">\n    <div class=\"fw-hd\"><b>第五章 焊接裂纹</b><span>核心：裂纹分类、机理、判据与防治</span></div>\n    <div class=\"fw-bd\">\n      <div class=\"fw-sec\"><span class=\"fw-lb\">热裂纹</span><ul>\n        <li>按本质分：结晶裂纹（液态薄膜+拉应力；脆性温度区；CST↑敏感↓；S、P&lt;0.03~0.04%）、高温液化裂纹（近缝区/层间，&lt;0.5mm）、多边化裂纹（纯金属/单相奥氏体）</li>\n        <li>抗裂：Ti/Zr/RE高熔点硫化物（TiS 2000~2100℃、ZrS 2100℃、CeS 2450℃）、γ+δ双相</li>\n      </ul></div>\n      <div class=\"fw-sec\"><span class=\"fw-lb\">冷裂纹</span><ul>\n        <li>温度约100℃~-75℃、HAZ为主、断口发亮；延迟裂纹最普遍（焊趾/焊道下/根部）</li>\n        <li>三因素：淬硬倾向+含氢量及分布+拘束应力；致裂=冷至100℃残余扩散氢</li>\n        <li>判据：拘束度R/Rcr；试验：TRC/RRC/插销；防治：低氢材料、烘干、预热、后热350℃×1~2h</li>\n      </ul></div>\n      <div class=\"fw-sec\"><span class=\"fw-lb\">再热 · 层状撕裂 · SCC · 断口</span><ul>\n        <li>再热裂纹：HAZ粗晶沿晶；500~700℃敏感；二次沉淀+晶界杂质弱化；预热200~450℃</li>\n        <li>层状撕裂：平台+剪切壁；与夹杂有关；ψZ≥15%；条状硫化物/硅酸盐敏感</li>\n        <li>SCC：介质+拉应力；奥氏体不锈钢多APC、高强钢多HEC；消除应力P参数P=20</li>\n        <li>断口：韧窝DR / 解理CF（河流） / 准解理QC / 沿晶IG（冰糖状）</li>\n      </ul></div>\n    </div>\n  </div>\n  <div class=\"fwcard c6\">\n    <div class=\"fw-hd\"><b>第六章 钎焊</b><span>核心：润湿铺展、分类体系与缺陷</span></div>\n    <div class=\"fw-bd\">\n      <div class=\"fw-sec\"><span class=\"fw-lb\">定义与过程</span><ul>\n        <li>定义：低于母材熔点、高于钎料熔点加热；液态钎料润湿/铺展/毛细流动填缝、凝固结晶、原子间结合</li>\n        <li>过程：钎剂去氧化膜→钎料熔化排钎剂残渣→钎料与母材溶解扩散反应</li>\n        <li>优点：温度低影响小、变形小精度高、生产率高、异种金属及金属非金属连接</li>\n      </ul></div>\n      <div class=\"fw-sec\"><span class=\"fw-lb\">润湿与毛细</span><ul>\n        <li>润湿：固液界面取代固气界面自由能降低；θ=90°分界（&lt;90润湿、&gt;90不润湿、≈0漫流）；大多10~45°</li>\n        <li>毛细流动受：毛细管驱动力、金属密度、黏度、接头几何形状影响</li>\n        <li>接头间隙小→强度高（可超母材）；间隙增大→接近钎料自身强度</li>\n      </ul></div>\n      <div class=\"fw-sec\"><span class=\"fw-lb\">分类与缺陷</span><ul>\n        <li>按温度：软钎焊&lt;450℃ / 硬钎焊&gt;450℃ / 高温钎料&gt;950℃；钢分高&gt;800、中550~800、低&lt;550℃</li>\n        <li>按热源：火焰/炉中/感应/电阻/浸渍/气相/烙铁/超声波；按去膜：钎剂/无钎剂/自钎剂/气体保护/真空</li>\n        <li>缺陷：不致密性（气孔夹渣未填满）、母材自裂（液态钎料渗入微裂纹）、溶蚀（表面溶坑）</li>\n      </ul></div>\n    </div>\n  </div>\n</div>\n";
const DB_KEY = 'weld-quiz-db-v1';
const CHS = ['全部','绪论','第一章','第二章','第三章','第四章','第五章','第六章'];
const CHSHORT = {'绪论':'绪','第一章':'一','第二章':'二','第三章':'三','第四章':'四','第五章':'五','第六章':'六'};
const TYPES = {'全部':'全部题型','mcq':'单选','fill':'填空','term':'名词','essay':'简答'};
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => String(s||'').replace(/[\s\u3000]/g,'').replace(/[⁰¹²³⁴⁵⁶⁷⁸⁹]/g, m=>'0123456789'['⁰¹²³⁴⁵⁶⁷⁸⁹'.indexOf(m)]).replace(/[×xX*]/g,'x').replace(/\^/g,'').replace(/[～~]/g,'~').replace(/[-－—]/g,'~').replace(/[（）()]/g,'').toLowerCase();
const core = s => { const m = String(s||'').split(/[（(]/)[0]; return m.trim(); };
let db = load();
function load(){
  let d; try{ const raw = localStorage.getItem(DB_KEY); if(raw) d = JSON.parse(raw); }catch(e){}
  if(!d) d = {answers:{}, stars:{}, mastery:{}};
  const migrate = obj => { let touched=false; Object.keys(obj).forEach(k=>{ if(/^\d+$/.test(k)){ const nk='q'+k; if(obj[nk]===undefined){ obj[nk]=obj[k]; delete obj[k]; touched=true; } } }); return touched; };
  const changed = migrate(d.answers) | migrate(d.stars);
  if(changed) try{ localStorage.setItem(DB_KEY, JSON.stringify(d)); }catch(e){}
  return d;
}
function save(){ try{ localStorage.setItem(DB_KEY, JSON.stringify(db)); }catch(e){} }
function isCorrect(i){ const q = QUIZ_DATA[i]; const u = db.answers[q.id]; if(u===undefined||u==='') return null;
  if(q.type==='mcq') return u===q.ans;
  if(q.type==='term'||q.type==='essay') return u==='ok';
  const un=norm(u), an=norm(q.ans), cn=norm(core(q.ans));
  return un===an || un===cn || (un.length>=2 && an.includes(un)); }
function wrongIds(){ const r=[]; QUIZ_DATA.forEach((q,i)=>{ if(isCorrect(i)===false) r.push(i); }); return r; }
function answeredCount(){ return Object.keys(db.answers).filter(i=>db.answers[i]!=='').length; }
function accRate(){ const a=answeredCount(); if(!a) return 0; let c=0; QUIZ_DATA.forEach((_,i)=>{ if(isCorrect(i)) c++; }); return Math.round(c/a*100); }
function updateGauge(){
  const a=answeredCount(); $('g-done').textContent=a;
  $('g-total').textContent='/'+QUIZ_DATA.length;
  $('g-acc').textContent=accRate()+'%';
  const pct=a/QUIZ_DATA.length, R=16, C=2*Math.PI*R;
  $('g-ring').style.strokeDashoffset=C*(1-pct);
}
let session = null; // {list:[...], idx, title, wrongMode}
let filters = {ch:'全部', type:'全部', order:'顺序'};
let speedIdx = 0;
const IS_MOBILE = /Android|iPhone|iPad|iPod|Mobile|MicroMessenger|Opera Mini/i.test(navigator.userAgent) || innerWidth<=900;
if(IS_MOBILE && !location.hash){ filters.order='随机'; } // 移动端默认随机刷题
let route = location.hash.replace('#/','') || (IS_MOBILE ? 'quiz' : 'home');

function render(){
  const el = $('view');
  document.querySelectorAll('[data-route]').forEach(b=>b.classList.toggle('on', b.dataset.route===route));
  document.querySelectorAll('.chfilter button').forEach(b=>b.classList.toggle('on', b.dataset.ch===filters.ch));
  document.querySelectorAll('.quicknav button').forEach(b=>b.classList.toggle('on', b.dataset.qroute===route));
  if(route==='home') el.innerHTML=viewHome();
  else if(route==='quiz') { if(!session) buildSession(false); el.innerHTML=viewQuiz(); bindQuiz(); }
  else if(route==='wrong') el.innerHTML=viewWrong();
  else if(route==='speed') { if(speedIdx>=SPEED_DATA.length)speedIdx=0; el.innerHTML=viewSpeed(); bindSpeed(); }
  else if(route==='stats') el.innerHTML=viewStats();
  else if(route==='notes') el.innerHTML=viewNotes();
  else if(route==='framework') el.innerHTML=viewFramework();
  else if(route==='stars') el.innerHTML=viewStars();
  updateGauge();
  updateTabs();

function updateTabs(){

/* ================= 刷题 ================= */
function buildSession(fromWrong){
  const wrongMode = !!fromWrong;
  let base;
  if(wrongMode){ base = wrongIds(); }
  else {
    base = [];
    QUIZ_DATA.forEach((q,i)=>{ if(filters.ch==='全部'||q.ch===filters.ch) if(filters.type==='全部'||q.type===filters.type) base.push(i); });
    if(filters.order==='随机') base = shuffle(base);
  }
  session = {list:base, idx:0, wrongMode, title: wrongMode?'错题重刷':('刷题 · '+(filters.ch==='全部'?'全部章节':filters.ch)+(filters.type==='全部'?'':TYPES[filters.type]))};
}
function shuffle(a){ const r=a.slice(); for(let i=r.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [r[i],r[j]]=[r[j],r[i]]; } return r; }
function viewQuiz(){
  if(!session) return '';

    const why = session.wrongMode ? '太棒了，当前没有错题。' : '当前筛选条件下没有题目。';
    return `<div class="empty"><div class="big">✓</div>${why}${session.wrongMode?'':'<br>请调整章节或题型筛选。'}</div>`;
  }
  if(session.idx>=session.list.length) session.idx=0;
  const i = session.list[session.idx], q = QUIZ_DATA[i];

    const letter = 'ABCD'[k]; let cls='';
    if(done){ if(letter===q.ans) cls='correct'; else if(letter===db.answers[q.id]) cls='wrong'; else cls='dim'; }
    return `<button class="opt ${cls}" data-opt="${letter}" ${done?'disabled':''}><span class="k">${letter}</span><span>${esc(o)}</span></button>`;
  }).join('') : '';
  const fillZone = (!isReview && q.type==='fill') ? `<div class="fillzone"><div class="fillrow"><input id="fillin" placeholder="输入答案后提交" ${done?'disabled':''} value="${done?esc(db.answers[q.id]):''}" autocomplete="off"><button class="go" id="fillgo" ${done?'disabled':''}>提交答案</button></div></div>` : '';
  const revZone = isReview ? `<div class="revzone">

    : `<div class="feedback ${state?'ok':'no'} show"><b>${state?'回答正确':'回答错误'}</b><span>${state?'':'正确答案：'}${state?'':esc(q.ansText||q.ans)}</span></div>`) : '';
  return `<section class="page">
    <div class="toolbar">
      <div class="seg" id="seg-ch">${CHS.map(c=>`<button data-ch="${c}" class="${filters.ch===c?'on':''}">${c==='全部'?'全部':CHSHORT[c]+'章'}</button>`).join('')}</div>

        <span class="tag ${q.type==='mcq'?'':'t3'}">${q.type==='mcq'?'单项选择题':(q.type==='fill'?'填空题':(q.type==='term'?'名词解释':'简答题'))}</span>
        <span class="no">题库第 ${i+1} 题</span>
        <button class="star ${db.stars[q.id]?'on':''}" data-star="${q.id}" aria-label="收藏"><svg viewBox="0 0 24 24" width="19" height="19" fill="${db.stars[q.id]?'currentColor':'none'}" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3 2.9 5.9 6.5 1-4.7 4.6 1.1 6.5L12 18.3l-5.8 2.7 1.1-6.5-4.7-4.6 6.5-1z"/></svg></button>

        <button class="next ${done?'primary':''}" id="qnext">${done?'下一题':'跳过'}</button>
        <span class="hintkey">${isReview?'空格 展开答案 · Enter 下一题':'快捷键 1-4 作答 · Enter 下一题'}</span>
      </div>
    </div>
  </section>`;
}
function bindQuiz(){
  const i = session.list[session.idx], q = QUIZ_DATA[i];
  $('seg-ch').addEventListener('click', e=>{ const b=e.target.closest('button'); if(!b||!b.dataset.ch)return; filters.ch=b.dataset.ch; buildSession(false); render(); });
  $('seg-type').addEventListener('click', e=>{ const b=e.target.closest('button'); if(!b||!b.dataset.type)return; filters.type=b.dataset.type; buildSession(false); render(); });
  $('seg-order').addEventListener('click', e=>{ const b=e.target.closest('button'); if(!b||!b.dataset.order)return; filters.order=b.dataset.order; buildSession(false); render(); });
  $('qprev').addEventListener('click', ()=>{ if(session.idx>0){ session.idx--; render(); } });
  $('qnext').addEventListener('click', ()=>{ if(session.idx<session.list.length-1){ session.idx++; render(); } else { session=null; route='stats'; render(); } });
  $('qsheet').addEventListener('click', openSheet);
  const star=document.querySelector('.star'); if(star) star.addEventListener('click', ()=>{ db.stars[q.id]=!db.stars[q.id]; save(); render(); });
  const reveal=$('reveal'); if(reveal) reveal.addEventListener('click', ()=>{ $('anscard').classList.toggle('show'); reveal.classList.toggle('on'); reveal.textContent=$('anscard').classList.contains('show')?'收起参考答案':'查看参考答案'; });
  document.querySelectorAll('[data-selfev]').forEach(b=>b.addEventListener('click', ()=>{ db.answers[q.id]=b.dataset.selfev; save(); render(); }));
  document.querySelectorAll('.opt').forEach(o=>o.addEventListener('click', ()=>{ if(db.answers[q.id]!==undefined&&db.answers[q.id]!=='')return; db.answers[q.id]=o.dataset.opt; save(); render(); }));
  const fillin=$('fillin'), fillgo=$('fillgo');
  if(fillin&&fillgo){
    fillgo.addEventListener('click', ()=>{ const v=fillin.value; if(!v.trim())return; db.answers[q.id]=v.trim(); save(); render(); });
    fillin.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); fillgo.click(); } });
  }
  const key = e => {
    if(route!=='quiz') return;
    if(q.type==='mcq' && db.answers[q.id]===undefined){
      const n=parseInt(e.key,10); if(n>=1&&n<=q.options.length){ db.answers[q.id]='ABCD'[n-1]; save(); render(); }
    }
    if((q.type==='term'||q.type==='essay') && (e.key===' '||e.code==='Space')){ e.preventDefault(); const r=$('reveal'); if(r) r.click(); }
  };
  window.__quizKey = key;
}

/* ================= 统计 ================= */
function viewStats(){
  const a=answeredCount(), acc=accRate(), wrong=wrongIds().length;
  const chRows = CHS.slice(1).map(ch=>{
    const qs=[]; QUIZ_DATA.forEach((q,i)=>{ if(q.ch===ch) qs.push(i); });
    let done=0, okc=0; qs.forEach(i=>{ const st=isCorrect(i); if(st!==null){done++; if(st)okc++;} });
    const pct = done?Math.round(okc/done*100):0;
    const fillPct = done?Math.round(done/qs.length*100):0;
    return `<div class="cbar"><span class="lbl">${ch}</span><span class="track"><span class="fill" style="width:${fillPct}%"></span></span><span class="val">${okc}/${done} 对 · <b>${pct}%</b></span></div>`;
  }).join('');
  const typeRows = [['mcq','单项选择题'],['fill','填空题'],['term','名词解释'],['essay','简答题']].map(([t,label])=>{
    const total = QUIZ_DATA.filter(x=>x.type===t).length;
    let done=0, okc=0; QUIZ_DATA.forEach((q,i)=>{ if(q.type!==t)return; const st=isCorrect(i); if(st!==null){done++; if(st)okc++;} });
    const pct = done?Math.round(okc/done*100):0;
    return `<div class="cbar"><span class="lbl">${label}</span><span class="track"><span class="fill" style="width:${total?Math.round(done/total*100):0}%"></span></span><span class="val">${okc}/${done} 对 · <b>${pct}%</b></span></div>`;
  }).join('');
  return `<section class="page">
    <div class="hdr"><h2>学习统计</h2><span class="sub">正确率按已答题目计算</span><div class="sp"><button class="danger" id="resetall">重置全部进度</button></div></div>
    <div class="statsrow">
      <div class="sc"><div class="n">${a}</div><div class="l">已答 / ${QUIZ_DATA.length}</div></div>
      <div class="sc"><div class="n">${acc}%</div><div class="l">总体正确率</div></div>
      <div class="sc"><div class="n">${wrong}</div><div class="l">错题数</div></div>
      <div class="sc"><div class="n">${Object.keys(db.mastery).length}</div><div class="l">已掌握速记</div></div>
    </div>
    <div class="chname"><i></i>各章进度与正确率</div>
    ${chRows}
    <div class="chname"><i></i>题型正确率</div>
    ${typeRows}
  </section>`;
}
/* ================= 答题卡 ================= */
function openSheet(){
  const ids = session?session.list:QUIZ_DATA.map((_,i)=>i);
  const cur = session?session.list[session.idx]:-1;
  const cells = ids.map(i=>{
    const q=QUIZ_DATA[i];
    const st=isCorrect(i); let cls='', mark=String(i+1);
    if(st===true) cls='ok'; else if(st===false) cls='bad'; else if(db.answers[q.id]!==undefined&&db.answers[q.id]!=='') cls='done';
    if(i===cur) cls+=' cur';
    return `<button class="cell ${cls}" data-cell="${i}">${mark}</button>`;
  }).join('');
  $('sheet-sum').textContent = `（${ids.length} 题）`;
  $('sheetgrid').innerHTML = cells;
  $('sheetpanel').classList.add('show');
}
function closeSheet(){ $('sheetpanel').classList.remove('show'); }
/* ================= 全局事件 ================= */
document.addEventListener('click', e=>{
  const cell = e.target.closest('[data-cell]');
  if(cell){ const id=Number(cell.dataset.cell); const pos=session?session.list.indexOf(id):-1; if(pos>=0){ session.idx=pos; closeSheet(); render(); } }
  if(e.target.closest('[data-close="sheet"]')) closeSheet();
  const clearwrong=$('clearwrong'); if(clearwrong&&e.target===clearwrong){ db.answers={}; save(); render(); }
  const resetall=$('resetall'); if(resetall&&e.target===resetall){ db.answers={}; db.stars={}; db.mastery={}; save(); render(); }
  const redo=$('redo'); if(redo&&e.target===redo){ buildSession(true); if(session.list.length){ route='quiz'; location.hash='#/quiz'; } else { render(); } return; }
  const btn=$('btn-reset'); if(btn&&e.target===btn){ if(confirm('确定重置全部学习进度？此操作不可撤销。')){ db.answers={}; db.stars={}; db.mastery={}; save(); render(); } }
});
document.querySelectorAll('[data-route]').forEach(b=>b.addEventListener('click', ()=>{ route=b.dataset.route; if(route==='quiz') session=null; location.hash='#/'+route; render(); }));
document.querySelectorAll('.quicknav button').forEach(b=>b.addEventListener('click', ()=>{ route=b.dataset.qroute; location.hash='#/'+route; render(); }));
document.querySelectorAll('[data-tab="random"]').forEach(b=>b.addEventListener('click', ()=>{ filters.ch='全部'; filters.order='随机'; route='quiz'; session=null; location.hash='#/quiz'; render(); }));
document.querySelectorAll('[data-tab="chapter"]').forEach(b=>b.addEventListener('click', ()=>{ openChPanel(); }));
document.querySelectorAll('[data-tab="stars"]').forEach(b=>b.addEventListener('click', ()=>{ route='stars'; location.hash='#/stars'; render(); }));
document.addEventListener('click', e=>{
  const cpb = e.target.closest('[data-chpanel]');
  if(cpb){ filters.ch=cpb.dataset.chpanel; filters.order='顺序'; route='quiz'; session=null; closeChPanel(); location.hash='#/quiz'; render(); return; }
  if(e.target.closest('#chmask') || e.target.closest('[data-close="ch"]')) closeChPanel();
});
document.querySelectorAll('.chfilter button').forEach(b=>b.addEventListener('click', ()=>{ filters.ch=b.dataset.ch; if(route==='quiz'){ buildSession(false); } else { route='quiz'; location.hash='#/quiz'; } render(); }));
window.addEventListener('hashchange', ()=>{ route=location.hash.replace('#/','')||'home'; render(); });
document.addEventListener('keydown', e=>{
  if(route==='quiz'){ if(window.__quizKey){ window.__quizKey(e); if(e.key==='Enter'&&$('qnext')){ const qi=session.list[session.idx], qq=QUIZ_DATA[qi]; const done=db.answers[qq.id]!==undefined; if(done){ e.preventDefault(); $('qnext').click(); } } }
    if(e.key==='ArrowLeft'&&$('qprev')){ $('qprev').click(); }
    if(e.key==='ArrowRight'&&$('qnext')){ const qi=session.list[session.idx], qq=QUIZ_DATA[qi]; if(db.answers[qq.id]!==undefined){ e.preventDefault(); $('qnext').click(); } }
  }
  if(e.key==='Escape') closeSheet();
});
render();
</script>
</body>
</html>
