<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>材料连接与增材制造原理 · 刷题记忆台</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231c5a86'/%3E%3Cpath d='M14 40h24v6H14z' fill='%23e8f1f8'/%3E%3Ccircle cx='40' cy='43' r='4' fill='%23d9701f'/%3E%3Cpath d='M44 43h4M48 39l3-3M48 47l3 3' stroke='%23f4b95c' stroke-width='2.5' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
:root{
  --ink:#14222e; --muted:#5b6b7a; --bg:#f1f4f7; --panel:#ffffff;
  --line:#dde4ea; --brand:#1c5a86; --brand2:#2f7fb5; --accent:#d9701f;
  --ok:#1e7a50; --bad:#c03a2e; --tint:#e8f1f8; --tint2:#fdf0e3;
  --radius:12px; --shadow:0 1px 2px rgba(20,34,46,.06),0 4px 14px rgba(20,34,46,.05);
  --mono:"Cascadia Mono","SFMono-Regular",Consolas,"Microsoft YaHei",monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;line-height:1.55}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input{font-family:inherit}
:focus-visible{outline:2px solid var(--brand2);outline-offset:2px}
.appbar{position:sticky;top:0;z-index:20;background:var(--panel);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand svg{flex:none}
.brand h1{font-size:16px;font-weight:700;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{display:block;font-size:11.5px;color:var(--muted);font-weight:400;letter-spacing:.06em}
.gauge{display:flex;align-items:center;gap:12px;margin-left:auto}
.gauge .gv{font-size:12px;color:var(--muted)}
.gauge .gv b{color:var(--ink);font-size:14px}
.ring{width:34px;height:34px;flex:none}
.ring .track{fill:none;stroke:#e2e9f0;stroke-width:4}
.ring .bar{fill:none;stroke:var(--accent);stroke-width:4;stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%;transition:stroke-dashoffset .4s}
.iconbtn{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--muted);border:1px solid var(--line);background:#fff}
.iconbtn:hover{color:var(--brand);border-color:#b9c8d6}
.iconbtn:disabled{opacity:.4;cursor:default}
.layout{display:block;padding:16px;max-width:1200px;margin:0 auto}
.sidebar{display:none}
.view{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;min-height:420px}
.bottomnav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--panel);border-top:1px solid var(--line);display:flex}
.bottomnav button{flex:1;padding:10px 4px 12px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--muted)}
.bottomnav button.on{color:var(--brand);font-weight:600}
.bottomnav svg{width:21px;height:21px}
.page{animation:in .18s ease}
@keyframes in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@media(min-width:900px){
  .layout{display:grid;grid-template-columns:196px minmax(0,1fr);gap:16px;padding:20px 24px 60px}
  .sidebar{display:flex;flex-direction:column;gap:4px}
  .sidebar .sect{font-size:11px;color:var(--muted);letter-spacing:.1em;padding:10px 10px 4px;font-weight:600}
  .navitem{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;color:#2a3c4c;font-size:14px;font-weight:500}
  .navitem svg{width:18px;height:18px;color:var(--muted)}
  .navitem:hover{background:#e7edf3}
  .navitem.on{background:var(--tint);color:var(--brand);font-weight:600}
  .navitem.on svg{color:var(--brand)}
  .chfilter{margin-top:12px;padding:12px;background:#e9eef3;border-radius:10px}
  .chfilter .lbl{font-size:12px;color:var(--muted);margin-bottom:6px;font-weight:600}
  .chfilter button{display:block;width:100%;text-align:left;padding:7px 10px;border-radius:8px;font-size:13px;color:#33475b}
  .chfilter button:hover{background:#fff}
  .chfilter button.on{background:var(--brand);color:#fff;font-weight:600}
  .bottomnav{display:none}
  .view{padding:24px}
}
/* ---- notes 复习讲义 ---- */
.notes{line-height:1.7;font-size:14.5px;color:#22313e}
.notes .n1{font-size:20px;margin:6px 0 10px;color:var(--brand);letter-spacing:.02em}
.notes .n2{font-size:17px;margin:20px 0 8px;padding-left:10px;border-left:4px solid var(--accent);color:#12334d}
.notes .n3{font-size:15px;margin:14px 0 6px;color:#1c5a86;font-weight:700}
.notes p{margin:7px 0}
.notes p.qhead{font-weight:700;color:#12334d;margin-top:12px}
.notes p.ans{font-weight:700;color:#8a4a12;background:var(--tint2);display:inline-block;padding:2px 10px;border-radius:6px;margin-top:12px}
.notes .tbl{margin:8px 0;overflow-x:auto}
.notes table{border-collapse:collapse;width:100%;min-width:420px;font-size:13px}
.notes th{background:var(--tint);color:#12334d;font-weight:700;border:1px solid var(--line);padding:6px 9px;text-align:left}
.notes td{border:1px solid var(--line);padding:5px 9px;vertical-align:top}
.notes strong{color:#b25a12}
/* ---- framework 知识框架 ---- */
.fwgrid{display:flex;flex-wrap:wrap;gap:14px}
.fwcard{flex:1 1 280px;min-width:280px;max-width:100%;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow)}
.fw-hd{padding:10px 14px;color:#fff}
.fw-hd b{display:block;font-size:16px}
.fw-hd span{display:block;font-size:12.5px;opacity:.92;margin-top:2px}
.fw-bd{padding:10px 12px 12px}
.fw-sec{margin-bottom:10px}
.fw-sec:last-child{margin-bottom:0}
.fw-lb{display:inline-block;font-size:13.5px;font-weight:700;color:#0f2a43;border-bottom:2px solid;padding-bottom:1px;margin-bottom:5px}
.fw-sec ul{margin:0;padding:0;list-style:none}
.fw-sec li{font-size:13px;line-height:1.55;color:#33475b;padding-left:12px;position:relative;margin:2px 0}
.fw-sec li::before{content:"";position:absolute;left:0;top:8px;width:5px;height:5px;border-radius:50%;background:#8aa0b5}
.fwcard.c0 .fw-hd{background:#14455f} .fwcard.c0 .fw-lb{border-color:#14455f} .fwcard.c0 li::before{background:#14455f}
.fwcard.c1 .fw-hd{background:#1f6f8b} .fwcard.c1 .fw-lb{border-color:#1f6f8b} .fwcard.c1 li::before{background:#1f6f8b}
.fwcard.c2 .fw-hd{background:#2e7d5b} .fwcard.c2 .fw-lb{border-color:#2e7d5b} .fwcard.c2 li::before{background:#2e7d5b}
.fwcard.c3 .fw-hd{background:#b26a2b} .fwcard.c3 .fw-lb{border-color:#b26a2b} .fwcard.c3 li::before{background:#b26a2b}
.fwcard.c4 .fw-hd{background:#7a4d9e} .fwcard.c4 .fw-lb{border-color:#7a4d9e} .fwcard.c4 li::before{background:#7a4d9e}
.fwcard.c5 .fw-hd{background:#a63d40} .fwcard.c5 .fw-lb{border-color:#a63d40} .fwcard.c5 li::before{background:#a63d40}
.fwcard.c6 .fw-hd{background:#5b6b7a} .fwcard.c6 .fw-lb{border-color:#5b6b7a} .fwcard.c6 li::before{background:#5b6b7a}
.fwfoot{margin-top:14px;font-size:13px;color:var(--muted);text-align:center}
/* ---- home ---- */
.hero{position:relative;overflow:hidden;border-radius:var(--radius);background:linear-gradient(135deg,#0d2f45 0%,#14455f 45%,#1c5a86 100%);color:#fff;padding:26px 22px;margin-bottom:16px}
.hero::after{content:"";position:absolute;inset:0;background:radial-gradient(560px 210px at 88% 0%,rgba(228,132,44,.18),transparent 62%);pointer-events:none}
.hero .kicker{font-size:12px;letter-spacing:.24em;color:#9fc3dd;font-weight:600}
.hero h2{font-size:22px;margin:8px 0 8px;font-weight:800;line-height:1.3;letter-spacing:.01em}
.hero p{font-size:14px;color:#cfe2f1;max-width:660px}
.hero svg{position:absolute;right:-14px;bottom:-26px;opacity:.85;width:230px;height:210px}
@media(max-width:600px){.hero svg{right:-70px;bottom:-46px;width:180px;opacity:.55}}
@media(max-width:600px){.hero .kicker{letter-spacing:.15em;font-size:11px;white-space:nowrap}}
.resgrid{display:grid;grid-template-columns:1fr;gap:10px;margin-bottom:16px}
@media(min-width:640px){.resgrid{grid-template-columns:repeat(2,1fr)}}
.rescard{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:13px 14px;text-decoration:none;color:inherit;box-shadow:var(--shadow);transition:transform .12s,box-shadow .12s,border-color .12s}
.rescard:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:#b9c8d6}
.rescard svg{width:42px;height:42px;flex:none;border-radius:10px;background:var(--tint);padding:9px;color:var(--brand);stroke-width:1.8}
.rescard .b{font-size:14.5px;font-weight:700;color:var(--ink)}
.rescard span{display:block;font-size:12px;color:var(--muted);margin-top:1px}
.rescard em{font-style:normal;margin-left:auto;font-size:12px;font-weight:700;color:var(--accent);background:var(--tint2);padding:5px 12px;border-radius:999px;white-space:nowrap}
@media(max-width:600px){
  .appbar{gap:8px;padding:8px 12px}
  .brand{gap:8px}
  .brand svg{width:28px;height:28px}
  .brand h1{font-size:13px}
  .brand small{font-size:10px}
  .gvx{display:none}
  .seg{flex-wrap:wrap;overflow:visible}
}
.statgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:16px}
@media(min-width:640px){.statgrid{grid-template-columns:repeat(4,1fr)}}
.statcard{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:14px;cursor:pointer;transition:transform .12s,box-shadow .12s}
.statcard:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.statcard .n{font-size:24px;font-weight:700;color:var(--brand);font-variant-numeric:tabular-nums;line-height:1.1}
.statcard .n small{font-size:13px;color:var(--muted);font-weight:600}
.statcard .l{font-size:12.5px;color:var(--muted);margin-top:2px}
.statcard .bar{height:5px;background:#e8eef3;border-radius:3px;margin-top:8px;overflow:hidden}
.statcard .bar i{display:block;height:100%;background:var(--accent);border-radius:3px}
.path{background:var(--tint2);border:1px solid #f3ddc4;border-radius:var(--radius);padding:12px 14px}
.path .t{font-size:13px;font-weight:700;color:#8a4a12;margin-bottom:6px}
.path ol{list-style:none;display:flex;flex-wrap:wrap;gap:6px 0}
.path li{font-size:13px;color:#5b432b;padding:0 10px;position:relative}
.path li:not(:first-child)::before{content:"→";color:#d9701f;margin-right:10px}
/* ---- quiz ---- */
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.seg{display:inline-flex;background:#e9eef3;border-radius:9px;padding:3px;gap:2px;max-width:100%;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{padding:5px 12px;border-radius:7px;font-size:13px;color:#33475b;font-weight:500;white-space:nowrap}
.seg button.on{background:var(--brand);color:#fff;font-weight:600}
.progressline{display:flex;align-items:center;gap:10px;margin-left:auto;font-size:13px;color:var(--muted)}
.progressline b{color:var(--ink);font-variant-numeric:tabular-nums}
.qcard{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:18px}
.qmeta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:12px}
.tag{font-size:11.5px;font-weight:600;padding:2px 9px;border-radius:20px;background:var(--tint);color:var(--brand)}
.tag.t2{background:var(--tint2);color:#a2540f}
.tag.t3{background:#e9f3ec;color:var(--ok)}
.qmeta .no{font-size:12px;color:var(--muted);font-weight:600;margin-right:auto}
.star{margin-left:auto;color:#c6d2dc;display:flex}
.star.on{color:#e8a33c}
.qtext{font-size:16px;font-weight:600;line-height:1.65;margin-bottom:14px}
.qtext .blank{color:var(--accent);font-weight:700;border-bottom:2px solid var(--accent)}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;align-items:flex-start;gap:10px;text-align:left;padding:11px 14px;border:1.5px solid var(--line);border-radius:10px;font-size:14.5px;line-height:1.5;background:#fff;transition:border-color .12s,background .12s}
.opt:hover{border-color:#9fc0da}
.opt .k{flex:none;width:24px;height:24px;border-radius:6px;background:#eef3f7;color:#33475b;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center}
.opt.correct{border-color:var(--ok);background:#edf7f1}
.opt.correct .k{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:#fdf0ef}
.opt.wrong .k{background:var(--bad);color:#fff}
.opt.dim{opacity:.55}
.opt:disabled{cursor:default}
.fillzone{margin-top:4px}
.fillrow{display:flex;gap:8px;flex-wrap:wrap}
.fillrow input{flex:1;min-width:200px;padding:11px 14px;font-size:15px;border:1.5px solid var(--line);border-radius:10px;background:#fff}
.fillrow input:focus{border-color:var(--brand2)}
.fillrow .go{padding:11px 20px;border-radius:10px;background:var(--brand);color:#fff;font-size:14px;font-weight:600}
.fillrow .go:hover{background:#16415f}
.fillrow .go:disabled{opacity:.5;cursor:default}
.feedback{margin-top:12px;padding:11px 14px;border-radius:10px;font-size:14px;display:none;align-items:flex-start;gap:9px}
.feedback.show{display:flex;animation:in .18s ease}
.feedback.ok{background:#edf7f1;color:#15593a;border:1px solid #bfe3cd}
.feedback.no{background:#fdf0ef;color:#8c2d24;border:1px solid #f2c9c4}
.feedback b{font-weight:700}
.qnav{display:flex;align-items:center;gap:8px;margin-top:14px}
.qnav .prev,.qnav .next{padding:9px 16px;border-radius:9px;border:1px solid var(--line);font-size:13.5px;font-weight:600;background:#fff;color:#33475b}
.qnav .prev:hover,.qnav .next:hover{border-color:#9fc0da;color:var(--brand)}
.qnav .next.primary{background:var(--brand);color:#fff;border-color:var(--brand)}
.qnav .next.primary:hover{background:#16415f;color:#fff}
.qnav .sheetbtn{margin-left:auto;display:flex;align-items:center;gap:6px;padding:9px 14px;border-radius:9px;border:1px solid var(--line);font-size:13px;color:#33475b;background:#fff}
.hintkey{font-size:11.5px;color:#9aa9b6;margin-left:auto}
/* ---- sheet ---- */
.sheetpanel{position:fixed;inset:0;z-index:30;display:none}
.sheetpanel.show{display:block}
.sheetmask{position:absolute;inset:0;background:rgba(20,34,46,.35)}
.sheet{position:absolute;right:0;top:0;bottom:0;width:min(340px,92vw);background:#fff;box-shadow:-8px 0 30px rgba(20,34,46,.18);padding:16px;display:flex;flex-direction:column}
.sheet h3{font-size:15px;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.sheet h3 .x{margin-left:auto;width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:18px}
.sheet h3 .x:hover{background:#eef3f7}
.sheet .grid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;overflow:auto;padding-bottom:8px}
.cell{aspect-ratio:1;border-radius:6px;background:#eef3f7;border:1px solid transparent;font-size:12px;font-weight:600;color:#33475b;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}
.cell:hover{border-color:#9fc0da}
.cell.done{background:var(--tint);color:var(--brand)}
.cell.ok{background:#e4f2ea;color:var(--ok)}
.cell.bad{background:#fbe6e3;color:var(--bad)}
.cell.cur{outline:2px solid var(--accent)}
/* ---- wrong / speed / stats ---- */
.wronglist{display:flex;flex-direction:column;gap:8px}
.wrow{display:flex;align-items:center;gap:10px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:#fff;cursor:pointer}
.wrow:hover{border-color:#9fc0da}
.wrow .tag{flex:none}
.wrow .qt{font-size:14px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#33475b}
.wrow .ans{font-size:12px;color:var(--muted);flex:none}
.wrow .ans b{color:var(--ok)}
.empty{padding:40px 16px;text-align:center;color:var(--muted)}
.empty .big{font-size:34px;margin-bottom:6px}
.speedcard{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:22px 18px;min-height:180px;display:flex;flex-direction:column}
.speedcard .st{font-size:12px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:8px;margin-bottom:14px}
.speedcard .st i{font-style:normal;width:28px;height:28px;border-radius:8px;background:var(--tint);color:var(--brand);display:flex;align-items:center;justify-content:center;font-weight:700}
.speedcard .txt{font-size:17px;line-height:1.75;font-weight:600;flex:1}
.speednav{display:flex;align-items:center;gap:8px;margin-top:14px}
.speednav button{padding:9px 14px;border-radius:9px;border:1px solid var(--line);background:#fff;font-size:13px;font-weight:600;color:#33475b}
.speednav button:hover{border-color:#9fc0da;color:var(--brand)}
.speednav .mid{flex:1;text-align:center;font-size:13px;color:var(--muted)}
.statsrow{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:16px}
@media(min-width:640px){.statsrow{grid-template-columns:repeat(4,1fr)}}
.statsrow .sc{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:14px;text-align:center}
.statsrow .n{font-size:22px;font-weight:700;color:var(--brand);font-variant-numeric:tabular-nums}
.statsrow .l{font-size:12px;color:var(--muted);margin-top:2px}
.chname{font-size:15px;font-weight:700;margin:16px 0 8px;display:flex;align-items:center;gap:8px}
.chname i{font-style:normal;width:6px;height:18px;border-radius:3px;background:var(--accent)}
.cbar{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.cbar .lbl{width:74px;font-size:13px;color:#33475b;font-weight:600;flex:none}
.cbar .track{flex:1;height:14px;background:#e8eef3;border-radius:7px;overflow:hidden}
.cbar .fill{height:100%;border-radius:7px;background:linear-gradient(90deg,#2f7fb5,#1c5a86);transition:width .5s}
.cbar .val{width:110px;flex:none;text-align:right;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.cbar .val b{color:var(--ink);font-size:13px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.hdr{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.hdr h2{font-size:18px;font-weight:700}
.hdr .sub{font-size:12.5px;color:var(--muted)}
.hdr .sp{margin-left:auto;display:flex;gap:8px}
.danger{padding:9px 14px;border-radius:9px;border:1px solid #ecc9c5;color:#8c2d24;background:#fff;font-size:13px;font-weight:600}
.danger:hover{background:#fdf0ef}
.foot{padding:24px 16px 90px;text-align:center;font-size:12px;color:#8a99a7}
@media(min-width:900px){.foot{padding-bottom:24px}}
[hidden]{display:none!important}
/* ===== 移动端规范（≤899px：打开即刷题 + TabBar + 章节弹层） ===== */
@media(max-width:899px){
  .view{padding:14px 14px 108px}
  .hero h2{font-size:18px}
  .hero p{font-size:13.5px}
  .gauge .gvx{display:none}
  .seg{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
  .seg::-webkit-scrollbar{display:none}
  .seg button{min-height:38px;padding:7px 13px;font-size:13.5px}
  .opt{padding:13px 14px}
  .qnav .prev,.qnav .next{padding:12px 18px;font-size:14px;min-height:44px}
  .fillrow input{font-size:16px;min-height:44px}
  .fillrow .go{min-height:44px;font-size:15px}
  .qcard{padding:16px}
  .qtext{font-size:16px}
  .wrow{min-height:52px}
  .wrow .qt{font-size:14px}
  .speednav button{min-height:44px}
  .notes{font-size:14px}
  .notes table{table-layout:fixed;width:100%;min-width:0}
  .hdr h2{font-size:17px}
  .statsrow .sc{padding:12px}
}
@media(min-width:900px){.quicknav{display:none}}
@media(max-width:899px){

  .quicknav button.on{background:var(--tint);color:var(--brand);border-color:#b9c8d6}

  .bottomnav{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--panel);border-top:1px solid var(--line);display:flex;box-shadow:0 -2px 10px rgba(20,34,46,.08);padding-bottom:env(safe-area-inset-bottom,0)}

  .bottomnav button.on{color:var(--brand);font-weight:700}
  .bottomnav button.on::after{content:"";width:14px;height:2.5px;border-radius:2px;background:var(--accent)}
  .bottomnav svg{width:20px;height:20px}
}
/* 章节选择面板（底部弹层） */
.chmask{position:fixed;inset:0;z-index:55;background:rgba(20,34,46,.38);opacity:0;pointer-events:none;transition:opacity .2s}
.chmask.show{opacity:1;pointer-events:auto}
.chpanel{position:fixed;left:0;right:0;bottom:0;z-index:60;transform:translateY(105%);transition:transform .22s ease;max-height:72vh;overflow-y:auto;background:#fff;border-radius:16px 16px 0 0;padding:14px 14px 20px;padding-bottom:env(safe-area-inset-bottom,20px);box-shadow:0 -6px 24px rgba(20,34,46,.18)}
.chpanel.show{transform:translateY(0)}
.chpanel h3{font-size:15px;margin-bottom:10px;display:flex;align-items:center;gap:8px;color:var(--ink)}
.chpanel h3 .x{margin-left:auto;width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:18px}
.chpanel h3 .x:hover{background:#eef3f7}
.chgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media(max-width:420px){.chgrid{grid-template-columns:1fr}}
.chgrid button{display:flex;align-items:center;gap:9px;min-height:48px;border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:13.5px;color:#33475b;background:#fff}
.chgrid button:active{background:var(--tint);border-color:var(--brand);color:var(--brand)}
.chgrid button.on{background:var(--tint);border-color:var(--brand);color:var(--brand);font-weight:700}
.chgrid .cnt{margin-left:auto;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;font-weight:600}
.chgrid svg{width:18px;height:18px;flex:none;color:var(--brand2)}
/* 收藏 */
.starlist .wrow .ans{color:var(--muted)}
/* 名词解释 / 简答题（对照记忆 + 自评掌握） */
.revzone{margin-top:14px}
.reveal{display:flex;align-items:center;gap:7px;min-height:44px;padding:10px 16px;border-radius:10px;border:1px solid var(--brand);background:var(--tint);color:var(--brand);font-size:14px;font-weight:600}
.reveal.on{background:#fff;border-color:#b9c8d6;color:var(--muted)}
.anscard{display:none;margin-top:12px;padding:14px 16px;background:#f6fafd;border:1px solid #c9d8e4;border-radius:12px}
.anscard.show{display:block}
.anscard .lbl{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;color:var(--brand);letter-spacing:.4px;margin-bottom:8px}
.anscard .txt{font-size:14.5px;line-height:1.8;color:#2c4053;white-space:pre-wrap}
.selfev{display:flex;gap:8px;margin-top:12px}
.selfev button{flex:1;min-height:44px;border-radius:10px;font-size:14px;font-weight:600}
.selfev .ok{background:var(--ok);border:none;color:#fff}
.selfev .ok.chosen{box-shadow:inset 0 0 0 2px rgba(255,255,255,.55)}
.selfev .no{background:#fff;border:1px solid #e0b9b9;color:var(--bad)}
.selfev .no.chosen{background:#fdf1f0}
.revtip{margin:10px 2px 0;font-size:12.5px;color:var(--muted)}
@media(max-width:899px){ .anscard .txt{font-size:14px} }
</style>
</head>

<script>
const QUIZ_DATA = [{"ch": "绪论", "chname": "焊接概述", "type": "fill", "q": "焊接是通过加热或加压（或二者并用），并且用或不用填充材料，使工件材质达到____结合而形成的永久性连接工艺过程。", "ans": "原子间", "id": "q163", "orig": -1}, {"ch": "绪论", "chname": "焊接概述", "type": "mcq", "q": "按焊接过程特点，焊接可分为冷压焊、电阻焊和____三大类（　）A. 摩擦焊　B. 熔化焊　C. 钎焊　D. 扩散焊", "options": ["摩擦焊", "熔化焊", "钎焊", "扩散焊"], "ans": "B", "anstext": "熔化焊", "id": "q164", "orig": -1}, {"ch": "绪论", "chname": "焊接概述", "type": "mcq", "q": "实现焊接过程的加压措施，其主要作用是（　）A. 破坏表面氧化膜、增加有效接触面积　B. 降低金属熔点　C. 提高焊接速度　D. 减少热影响区", "options": ["破坏表面氧化膜、增加有效接触面积", "降低金属熔点", "提高焊接速度", "减少热影响区"], "ans": "A", "anstext": "破坏表面氧化膜、增加有效接触面积", "id": "q165", "orig": -1}, {"ch": "绪论", "chname": "焊接概述", "type": "mcq", "q": "下列不属于常用焊接能源的是（　）A. 电弧热　B. 化学热　C. 电阻热　D. 太阳辐射热", "options": ["电弧热", "化学热", "电阻热", "太阳辐射热"], "ans": "D", "anstext": "太阳辐射热", "id": "q166", "orig": -1}, {"ch": "绪论", "chname": "焊接概述", "type": "mcq", "q": "焊接热过程的两大基本特征是（　）A. 均匀性与持久性　B. 局部性与瞬时性　C. 整体性与连续性　D. 分散性与周期性", "options": ["均匀性与持久性", "局部性与瞬时性", "整体性与连续性", "分散性与周期性"], "ans": "B", "anstext": "局部性与瞬时性", "id": "q167", "orig": -1}, {"ch": "绪论", "chname": "焊接概述", "type": "fill", "q": "焊件加热区中，带电质点集中轰击的部位称为____斑点区（dA）；加热斑点区（dH）由辐射、对流形成。", "ans": "活性", "id": "q168", "orig": -1}, {"ch": "绪论", "chname": "焊接概述", "type": "fill", "q": "焊接接头的形成过程为：加热→熔化→冶金反应→凝固→____→焊接接头。", "ans": "固态相变", "id": "q169", "orig": -1}, {"ch": "绪论", "chname": "焊接概述", "type": "mcq", "q": "焊件上（包括内部）某瞬时的温度分布称为（　）A. 温度场　B. 热循环　C. 热应力　D. 温度梯度", "options": ["温度场", "热循环", "热应力", "温度梯度"], "ans": "A", "anstext": "温度场", "id": "q170", "orig": -1}, {"ch": "绪论", "chname": "焊接概述", "type": "mcq", "q": "相对于移动的焊接热源而言，静态坐标系下处于非稳定状态、移动坐标系下处于稳定状态的传热状态称为（　）A. 稳定温度场　B. 非稳定温度场　C. 准稳定温度场　D. 瞬时温度场", "options": ["稳定温度场", "非稳定温度场", "准稳定温度场", "瞬时温度场"], "ans": "C", "anstext": "准稳定温度场", "id": "q171", "orig": -1}, {"ch": "绪论", "chname": "焊接概述", "type": "fill", "q": "焊接温度场的影响因素包括热源、焊接线能量、被焊金属的性质（热导率λ、比热容c、热扩散率a）以及____。", "ans": "焊件的板厚及形状", "id": "q172", "orig": -1}, {"ch": "绪论", "chname": "焊接概述", "type": "mcq", "q": "焊接热输入（线能量）是反映焊接热过程的重要参数，其表达式 q=ηUI/v 中 v 表示（　）A.焊接速度　B.焊条熔化速度　C.冷却速度　D.结晶速度", "options": ["焊接速度", "焊条熔化速度", "冷却速度", "结晶速度"], "ans": "A", "anstext": "焊接速度", "id": "q219", "orig": -1}, {"ch": "绪论", "chname": "焊接概述", "type": "mcq", "q": "焊接热输入 q=ηUI/v 中，在其他条件不变时增大焊接电流 I，单位长度焊缝获得的热量将（　）A.增大　B.减小　C.不变　D.先增后减", "options": ["增大", "减小", "不变", "先增后减"], "ans": "A", "anstext": "增大", "id": "q220", "orig": -1}, {"ch": "绪论", "chname": "焊接概述", "type": "mcq", "q": "真空电子束焊接时对熔池金属采用的保护方式是（　）A.渣保护　B.真空保护　C.气保护　D.自保护", "options": ["渣保护", "真空保护", "气保护", "自保护"], "ans": "B", "anstext": "真空保护", "id": "q221", "orig": -1}, {"ch": "绪论", "chname": "焊接概述", "type": "term", "q": "焊接", "ans": "通过加热或加压（或二者并用），并且用或不用填充材料，使焊件达到原子间结合的一种加工方法。", "id": "q265", "orig": -1}, {"ch": "绪论", "chname": "焊接概述", "type": "term", "q": "焊接热输入（线能量）", "ans": "焊接热源传给单位长度焊缝上的热量，表达式 q=ηUI/v（η为热效率、U为电弧电压、I为焊接电流、v为焊接速度），是反映焊接热过程的重要参数。", "id": "q266", "orig": -1}, {"ch": "绪论", "chname": "焊接概述", "type": "term", "q": "焊接热循环", "ans": "在焊接热源作用下，焊件上某一点温度随时间的变化过程。用加热速度、最高加热温度、高温停留时间和冷却速度四个参数描述。", "id": "q267", "orig": -1}, {"ch": "绪论", "chname": "焊接概述", "type": "term", "q": "熔合比", "ans": "焊缝中母材金属所占的比例（母材金属在焊缝金属中所占的质量分数），常用γ表示，它决定焊缝金属的化学成分和性能。", "id": "q268", "orig": -1}, {"ch": "绪论", "chname": "焊接概述", "type": "term", "q": "焊缝成形系数", "ans": "焊缝横截面上焊缝宽度与计算厚度之比（φ=B/H）。成形系数过小（焊缝窄而深）时，焊缝中心易产生结晶裂纹。", "id": "q269", "orig": -1}, {"ch": "绪论", "chname": "焊接概述", "type": "term", "q": "热惯性", "ans": "焊件对加热（或冷却）的敏感程度，与焊件的热导率、比热容、密度等热物理性质有关。热惯性大的材料散热快、温度梯度大，加热和冷却速度也快。", "id": "q270", "orig": -1}, {"ch": "绪论", "chname": "焊接概述", "type": "essay", "q": "焊接方法按加热特点可分为哪几类？各类的基本特点是什么？", "ans": "①熔焊：加热使母材局部熔化形成熔池，冷却结晶形成接头，需熔化金属，应用最广（电弧焊、气焊等）；②压焊：加压（可兼加热）使接触面塑性变形或再结晶形成接头，母材不熔化或少量熔化（电阻点焊、摩擦焊等）；③钎焊：用熔点低于母材的钎料熔化填充间隙，母材不熔化（软钎焊、硬钎焊）。", "id": "q315", "orig": -1}, {"ch": "绪论", "chname": "焊接概述", "type": "essay", "q": "焊接热输入 q=ηUI/v 中各符号的含义是什么？增大焊接电流或降低焊接速度对焊接热过程有何影响？", "ans": "①q为热输入（线能量），η为焊接热源热效率，U为电弧电压，I为焊接电流，v为焊接速度；②增大电流I或降低速度v均使热输入增大，焊件加热速度减慢、高温 焊缝扩散氢的常用方法有甘油法和____（后者较准确）。A.水银法　B.排水法　C.色谱法　D.真空法", "options": ["水银法", "排水法", "色谱法", "真空法"], "ans": "A", "anstext": "水银法", "id": "q232", "orig": -1}, {"ch": "第一章", "chname": "焊接化学冶金", "type": "fill", "q": "焊后脱氢处理（消氢处理）的常用规范为 350℃保温 1h，或____℃保温 6h。", "ans": "250", "id": "q233", "orig": -1}, {"ch": "第一章", "chname": "焊接化学冶金", "type": "mcq", "q": "按熔渣分子理论，液态熔渣中能够参加冶金反应的是（　）A.自由氧化物　B.全部氧化物　C.全部复合物　D.氟化物", "options": ["自由氧化物", "全部氧化物", "全部复合物", "氟化物"], "ans": "A", "anstext": "自由氧化物", "id": "q234", "orig": -1}, {"ch": "第一章", "chname": "焊接化学冶金", "type": "mcq", "q": "按熔渣离子理论，熔渣的碱度定义为液态熔渣中____的浓度（活度）。A.自由氧离子　B.自由钙离子　C.SiO2　D.FeO", "options": ["自由氧离子", "自由钙离子", "SiO2", "FeO"], "ans": "A", "anstext": "自由氧离子", "id": "q235", "orig": -1}, {"ch": "第一章", "chname": "焊接化学冶金", "type": "mcq", "q": "熔渣表面张力由大到小的键型顺序为（　）A.金属键>离子键>共价键　B.共价键>离子键>金属键　C.离子键>金属键>共价键　D.金属键>共价键>离子键", "options": ["金属键>离子键>共价键", "共价键>离子键>金属键", "离子键>金属键>共价键", "金属键>共价键>离子键"], "ans": "A", "anstext": "金属键>离子键>共价键", "id": "q236", "orig": -1}, {"ch": "第一章", "chname": "焊接化学冶金", "type": "fill", "q": "熔渣熔点一般比焊缝金属熔点低 200~450℃，通常处于____℃范围。", "ans": "1150~1350", "id": "q237", "orig": -1}, {"ch": "第一章", "chname": "焊接化学冶金", "type": "mcq", "q": "按焊剂活度 AF 分级，AF>0.6 的焊剂属于（　）A.高活性　B.活性　C.低活性　D.惰性", "options": ["高活性", "活性", "低活性", "惰性"], "ans": "A", "anstext": "高活性", "id": "q238", "orig": -1}, {"ch": "第一章", "chname": "焊接化学冶金", "type": "fill", "q": "高镍合金焊缝中硫与镍形成低熔点共晶 NiS+Ni，其共晶温度约为____℃。", "ans": "644", "id": "q239", "orig": -1}, {"ch": "第一章", "chname": "焊接化学冶金", "type": "mcq", "q": "焊缝金属合金化的方式包括合金焊丝（带极）、药芯焊丝、合金药皮或焊剂以及（　）A.合金粉末　B.气体合金化　C.扩散合金化　D.电解合金化", "options": ["合金粉末", "气体合金化", "扩散合金化", "电解合金化"], "ans": "A", "anstext": "合金粉末", "id": "q240", "orig": -1}, {"ch": "第一章", "chname": "焊接化学冶金", "type": "mcq", "q": "氢在金属中溶解形成稳定氢化物（放热反应）的合金元素有（　）A.Zr、Ti、V、Ta、Nb　B.Al、Fe、Ni、Cu　C.Cr、Mo、W　D.Mn、Si、C", "options": ["Zr、Ti、V、Ta、Nb", "Al、Fe、Ni、Cu", "Cr、Mo、W", "Mn、Si、C"], "ans": "A", "anstext": "Zr、Ti、V、Ta、Nb", "id": "q241", "orig": -1}, {"ch": "第一章", "chname": "焊接化学冶金", "type": "fill", "q": "脱磷冶金措施分两步进行：先用 FeO 将磷氧化为 P2O5，再与____结合生成磷酸钙（3CaO·P2O5 或 4CaO·P2O5）入渣。", "ans": "CaO（石灰）", "id": "q242", "orig": -1}, {"ch": "第一章", "chname": "焊接化学冶金", "type": "mcq", "q": "沉淀脱氧产物 MnO·SiO2 等复合物易于从液态金属中上浮，主要因其（　）A.密度小、熔点低　B.密度大、熔点高　C.表面张力大　D.与金属互溶", "options": ["密度小、熔点低", "密度大、熔点高", "表面张力大", "与金属互溶"], "ans": "A", "anstext": "密度小、熔点低", "id": "q243", "orig": -1}, {"ch": "第一章", "chname": "焊接化学冶金", "type": "term", "q": "焊接化学冶金", "ans": "研究焊接区内（熔渣、气相与液态金属之间）发生的化学冶金反应及其对焊缝金属成分、组织和性能影响的学科。", "id": "q271", "orig": -1}, {"ch": "第一章", "chname": "焊接化学冶金", "type": "term", "q": "熔化系数（αP）", "ans": "单位焊接电流、单位时间内焊芯（焊丝）的熔化质量，单位为 g/(A·h)，反映焊条金属的平均熔化速度。", "id": "q272", "orig": -1}, {"ch": "第一章", "chname": "焊接化学冶金", "type": "term", "q": "熔敷系数（αH）", "ans": "单位焊接电流、单位时间内熔敷到焊缝上的金属质量，单位为 g/(A·h)。熔敷系数越大，焊接生产率越高。", "id": "q273", "orig": -1}, {"ch": "第一章", "chname": "焊接化学冶金", "type": "term", "q": "损失系数", "ans": "由于飞溅、氧化、蒸发等损失的金属质量与熔化焊芯质量之比。损失系数越大，焊条金属利用率越低。", "id": "q274", "orig": -1}, {"ch": "第一章", "chname": "焊接化学冶金", "type": "term", "q": "合金过渡系数", "ans": "焊缝金属中某合金元素的含量与该元素在焊条（焊丝）中的原始含量之比，反映合金元素由焊材向焊缝过渡的效率。", "id": "q275", "orig": -1}, {"ch": "第一章", "chname": "焊接化学冶金", "type": "term", "q": "熔渣碱度（离子理论定义）", "ans": "按熔渣离子理论，碱度定义为液态熔渣中自由氧离子（O²⁻）的浓度（活度）。自由氧离子多者为碱性渣，少者为酸性渣。", "id": "q276", "orig": -1}, {"ch": "第一章", "chname": "焊接化学冶金", "type": "term", "q": "沉淀脱氧", "ans": "向熔池中加入与氧亲和力比铁大的脱氧剂（如Mn、Si、Al、Ti），使溶解于液态金属中的氧生成不溶于金属的氧化物并浮出熔池的脱氧方式。", "id": "q277", "orig": -1}, {"ch": "第一章", "chname": "焊接化学冶金", "type": "term", "q": "扩散脱氧", "ans": "利用熔渣中FeO含量低时，液态金属中的FeO向熔渣中扩散、并按下式 FeO(液)＋FeO(渣) 由金属向熔渣转移而实现的脱氧方式。碱性渣有利于扩散脱氧。", "id": "q278", "orig": -1}, {"ch": "第一章", "chname": "焊接化学冶金", "type": "term", "q": "脱氢处理（消氢处理）", "ans": "焊后立即将焊件加热到一定温度（如250℃保温6h，或350℃保温1h），促使焊缝中扩散氢逸出的热处理，用于防止氢致裂纹。", "id": "q279", "orig": -1}, {"ch": "第一章", "chname": "焊接化学冶金", "type": "term", "q": "扩散氢", "ans": "在焊缝金属中能自由扩散运动、溶解于晶格间隙中的氢原子。扩散氢对冷裂纹的形成影响最大；奥氏体焊缝中扩散氢系数最小。", "id": "q280", "orig": -1}, {"ch": "第一章", "chname": "焊接化学冶金", "type": "essay", "q": "焊接化学冶金过程有哪些特点？", "ans": "①反应温度高（电弧区可达4000K以上）且温度变化大，冶金反应速度快、程度不完全；②反应时间极短，熔滴、熔池存在时间仅数秒，反应难以达到平衡；③反应接触面积大（熔滴比表面积大），气-液-渣多相反应同时进行；④熔池不断运动，反应在非平衡条件下进行；⑤参与反应物质多（气相、熔渣、母材、焊芯等），反应复杂，焊缝成分受冶金反应显著影响。", "id": "q318", "orig": -1}, {"ch": "第一章", "chname": "焊接化学冶金", "type": "essay", "q": "焊条工艺性能包括哪几个方面？影响因素有哪些？", "ans": "①方面：电弧稳定性、再引弧性、飞溅大小、脱渣性、焊缝成形（波纹、宽度）、全位置操作性（立、仰焊适应性）、熔化速度与焊条发尘量等；②影响因素：药皮成分（稳弧剂、造渣剂等）、焊接电流种类与极性（交直流、正反接）、焊接电流大小、焊条烘干状况、焊接工艺参数（电弧电压、焊速）等。工艺性能好的焊条应电弧稳定、飞溅小、脱渣易、成形美观。", "id": "q319", "orig": -1}, {"ch": "第一章", "chname": "焊接化学冶金", "type": "essay", "q": "简述焊缝金属的脱氧途径。", "ans": "①沉淀脱氧：向熔池加入脱氧剂（Mn、Si、Ti、Al等），与熔池中溶解氧直接反应生成不溶于金属的氧化物（MnO、SiO2、TiO2等）上浮入渣；②扩散脱氧：利用FeO向熔渣中扩散转移的方式降低熔池含氧量，碱性渣中FeO活度低，扩散脱氧效果好；③实际焊接中常用沉淀脱氧与扩散脱氧配合，如药皮中Mn-Si联合脱氧，产物MnO·SiO2密度小、熔点低、易上浮。", "id": "q320", "orig": -1}, {"ch": "第一章", "chname": "焊接化学冶金", "type": "essay", "q": "分别叙述硫和磷对焊接的危害性及其控制措施。", "ans": "①硫的危害：硫与铁、镍等形成低熔点共晶（FeS+Fe、NiS+Ni），偏聚于晶界，产生结晶裂纹（热裂纹），并降低焊缝塑韧性；控制措施：限制母材和焊材含硫量，用碱性渣脱硫（CaO+FeS→CaS+FeO），添加Mn形成高熔点MnS。②磷的危害：磷与铁形成低熔点共晶（Fe3P），增加冷脆性（降低低温冲击韧度），也促进偏析和裂纹；控制措施：限制含磷量，用碱性渣脱磷（先氧化为P2O5，再与CaO结合生成3CaO·P2O5入渣）。③碱性焊条、含CaO的渣系有利于脱硫脱磷。", "id": "q321", "orig": -1}, {"ch": "第一章", "chname": "焊接化学冶金", "type": "essay", "q": "对比说明酸性焊条对焊缝金属的净化作用。", "ans": "①酸性焊条（如E4303，钛钙型渣系TiO2-CaO-SiO2）：渣中酸性氧化物多、碱度B1<1，自由氧离子少，脱硫脱磷能力弱；焊缝含氧量较高、含硫磷略高，抗裂性和低温韧性较差。②碱性焊条（低氢型，CaO-CaF2-SiO2渣系）：渣碱度B1>1，自由氧离子多，有利于扩散脱氧和脱硫脱磷（CaO+FeS→CaS+FeO、CaO+P2O5→磷酸钙），且CaF2能去氢，焊缝含氧、氢、硫磷量均低，金属较纯净，净化作用强。③因此碱性焊条焊缝抗裂性和韧性好，多用于重要结构；但工艺性能（稳弧、脱渣）略差，需烘干后使用。", "id": "q322", "orig": -1}, {"ch": "第一章", "chname": "焊接化学冶金", "type": "essay", "q": "氢的来源有哪些？氢对焊缝金属有什么危害？如何控制？", "ans": "①来源：焊条药皮和焊剂中的水分、有机物分解（H2O、碳氢化合物），母材和焊丝表面油污、锈蚀，以及焊接区空气中的水汽等；②危害：形成白点降低塑性，产生氢致延迟裂纹（冷裂纹），造成气孔，引起氢脆和再热裂纹；③控制：烘干焊材（药皮去水）、清理坡口油锈、选用低氢型焊条和低氢焊剂、控制气氛中水分、焊后脱氢处理（250℃×6h或350℃×1h）、选用氢扩散系数小的奥氏体焊缝（D：F>M>A，奥氏体最小）。", "id": "q323", "orig": -1}, {"ch": "第一章", "chname": "焊接化学冶金", "type": "essay", "q": "焊缝金属合金化的方式有哪些？合金元素过渡系数受哪些因素影响？", "ans": "①方式：合金焊丝（带极）、药芯焊丝（焊条药皮或焊剂中加入合金）、合金粉末、以及母材稀释（熔合比）等；②过渡系数影响因素：合金元素的氧化性（与氧亲和力）、在渣中的分配、熔渣碱度（碱性渣有利于合金过渡）、焊接工艺参数（电流、极性、焊速）、合金粒度与加入方式等。过渡系数越大，合金利用率越高。", "id": "q324", "orig": -1}, {"ch": "第一章", "chname": "焊接化学冶金", "type": "essay", "q": "简述焊接气孔的危害及防治措施。", "ans": "①危害：气孔削弱焊缝有效截面积、降低致密性和力学性能（尤其冲击韧度与疲劳强度），还会引起应力集中，是焊接生产中常见的缺陷。②防治措施：清理坡口与焊丝表面油锈水分；烘干焊条焊剂（有机物药皮≤200℃、含碳酸盐≤450℃）；选用合适的焊条（低氢型）和焊接参数（减小电流、适当提高焊速以缩短熔池存在时间）；控制保护气体纯度与流量、防止空气侵入；采用预热、后热控制冷却速度，利于气体逸出。③按气体来源可分为CO气孔、H2气孔、N2气孔，需针对性防治。", "id": "q325", "orig": -1}, {"ch": "第一章", "chname": "焊接化学冶金", "type": "essay", "q": "熔渣在焊接过程中起什么作用？", "ans": "①机械保护作用：覆盖熔滴和熔池，隔绝空气，防止N2、O2侵入；②冶金处理作用：作为反应介质参与脱氧、脱硫、脱磷、去氢等冶金反应，影响焊缝成分；③改善成形作用：稳定电弧、约束熔滴，使焊缝成形良好；④调节冷却作用：渣壳隔热，减缓熔池冷却速度，有利于气体逸出和改善结晶条件。因此渣系设计（碱度、粘度、熔点）是焊接材料设计的核心。", "id": "q326", "orig": -1}, {"ch": "第一章", "chname": "焊接化学冶金", "type": "essay", "q": "熔渣碱度对焊接冶金反应有什么影响？", "ans": "①碱度B1>1（碱性渣）自由氧离子多：有利于扩散脱氧（FeO活度低），有利于脱硫（CaO+FeS）、脱磷（CaO+3CaO·P2O5），对氢的排出有一定作用（配合CaF2），焊缝含氧、硫磷、氢低，净化效果好、韧性高；②碱度B1<1（酸性渣）自由氧离子少：脱硫脱磷能力弱、含氧量高，但工艺性能好、稳弧和脱渣容易、成形美观；③碱度过高渣粘度增大、易产生夹渣，焊条工艺性能变差。因此应按结构重要性选配渣系。", "id": "q327", "orig": -1}, {"ch": "第二章", "chname": "焊接材料", "type": "mcq", "q": "按焊接熔渣的酸碱度分类，E4303属于", "options": ["酸性焊条", "碱性焊条", "中性焊条", "盐基型焊条"], "ans": "A", "anstext": "酸性焊条", "id": "q24", "orig": 24}, {"ch": "第二章", "chname": "焊接材料", "type": "mcq", "q": "适合焊接重要结构、焊缝塑韧性高的低氢型焊条型号是", "options": ["E4303", "E5015", "H08A", "J422"], "ans": "B", "anstext": "E5015", "id": "q25", "orig": 25}, {"ch": "第二章", "chname": "焊接材料", "type": "mcq", "q": "焊芯的主要作用是", "options": ["稳弧", "导电和填充金属", "造气", "脱氧"], "ans": "B", "anstext": "导电和填充金属", "id": "q26", "orig": 26}, {"ch": "第二章", "chname": "焊接材料", "type": "mcq", "q": "焊条药芯用量最多的牌号是", "options": ["H08A", "H08E", "H10MnSi", "H08Mn2Si"], "ans": "A", "anstext": "H08A", "id": "q27", "orig": 27}, {"ch": "第二章", "chname": "焊接材料", "type": "mcq", "q": "药皮中起稳定电弧作用、含低电离电位元素的组分是", "options": ["造渣剂", "稳弧剂", "造气剂", "增塑剂"], "ans": "B", "anstext": "稳弧剂", "id": "q28", "orig": 28}, {"ch": "第二章", "chname": "焊接材料", 、脱氧、合金化等作用。", "id": "q282", "orig": -1}, {"ch": "第二章", "chname": "焊接材料", "type": "term", "q": "酸性焊条", "ans": "药皮以酸性氧化物（TiO2、SiO2等）为主、熔渣碱度B1<1的焊条，如E4303（J422）。焊缝含氧量较高，抗裂性较差，但工艺性能好。", "id": "q283", "orig": -1}, {"ch": "第二章", "chname": "焊接材料", "type": "term", "q": "碱性焊条（低氢型焊条）", "ans": "药皮以碱性氧化物（CaO、CaF2等）为主、熔渣碱度B1>1的焊条，如E5015（J507）。焊缝含氧量低、抗裂性好，但需烘干后使用，工艺性能略差。", "id": "q284", "orig": -1}, {"ch": "第二章", "chname": "焊接材料", "type": "term", "q": "焊剂碱度", "ans": "衡量焊剂碱性强弱的指标（如B1），分为高碱性、碱性、中性、酸性焊剂。碱度影响脱硫脱磷能力、焊缝韧性和抗裂性。", "id": "q285", "orig": -1}, {"ch": "第二章", "chname": "焊接材料", "type": "term", "q": "焊芯", "ans": "焊条中被药皮包裹的金属芯棒，既是导电电极又是填充金属来源。焊芯的化学成分直接影响焊缝成分，如H08A、H08Mn2Si等。", "id": "q286", "orig": -1}, {"ch": "第二章", "chname": "焊接材料", "type": "term", "q": "焊条再烘干", "ans": "焊条使用前按规范重新加热干燥以去除药皮吸附水分的处理。含有机物药皮不超过100~200℃，含CaCO3（碳酸钙）等矿物的药皮不超过450℃。", "id": "q287", "orig": -1}, {"ch": "第二章", "chname": "焊接材料", "type": "term", "q": "焊条型号", "ans": "按国家标准（GB）以字母和数字表示焊条主要特性的代号，如E4303：E表示焊条，43表示抗拉强度≥430MPa，0表示全位置焊接，3表示钛钙型药皮。", "id": "q288", "orig": -1}, {"ch": "第二章", "chname": "焊接材料", "type": "essay", "q": "解释焊条型号E5515-N5 P U H10中数字及字母的含义，并分析焊条J422（E4303）的冶金性能。", "ans": "①E5515-N5 P U H10：E为焊条；55表示熔敷金属抗拉强度≥550MPa；1表示全位置焊接；5表示低氢钠型药皮；-N5表示含镍（低温钢焊条）；P表示具有扩散氢代号；U表示熔敷金属冲击吸收功为U型缺口试样测定；H10表示熔敷金属扩散氢含量≤10mL/100g（低氢型）。②J422即E4303：钛钙型药皮（TiO2-CaO-SiO2渣系），碱度B1≈0.76（酸性焊条），熔敷金属抗拉强度≥430MPa，全位置焊接；冶金性能：电弧稳定、工艺性能好，但渣呈酸性、自由氧离子少，脱硫脱磷和扩散脱氧能力弱，焊缝含氧量较高，抗裂性和低温韧性不如碱性焊条，适用于一般低碳钢结构。", "id": "q328", "orig": -1}, {"ch": "第二章", "chname": "焊接材料", "type": "essay", "q": "酸性焊条与碱性焊条在冶金性能和工艺性能上有哪些主要区别？", "ans": "①冶金性能：酸性焊条（钛钙型、氧化铁型等）渣碱度<1，脱硫脱磷能力弱、焊缝含氧量高、抗裂性差；碱性焊条（低氢型）渣碱度>1，自由氧离子多，扩散脱氧、脱硫脱磷效果好，含氟化物去氢，焊缝含氧、氢、硫磷低、净化好、抗裂性强。②工艺性能：酸性焊条稳弧性好、飞溅小、脱渣容易、成形美观、可交直流两用；碱性焊条稳弧性稍差、飞溅略大、脱渣稍难，一般用直流反接，需按规范烘干（350℃×1h左右）。③用途：酸性焊条用于一般结构，碱性焊条用于重要结构和低合金高强度钢。", "id": "q329", "orig": -1}, {"ch": "第二章", "chname": "焊接材料", "type": "essay", "q": "焊条药皮由哪些组成物构成？各自起什么作用？", "ans": "①稳弧剂（碳酸钾、碳酸钠、长石等）：提高电弧稳定性；②造渣剂（TiO2、SiO2、CaCO3、CaF2等）：形成熔渣覆盖熔池，保护与冶金处理；③造气剂（淀粉、纤维素、碳酸盐）：产生CO2、CO等保护气体；④脱氧剂（Mn、Si、Al、Ti铁合金）：沉淀脱氧、细化晶粒；⑤合金剂：过渡合金元素改善焊缝成分；⑥粘结剂（水玻璃Na2O·nSiO2）：将药皮粘牢于焊芯，兼有造渣作用。各组分协调决定焊条的工艺与冶金性能。", "id": "q330", "orig": -1}, {"ch": "第二章", "chname": "焊接材料", "type": "essay", "q": "焊条为什么要烘干？不同焊条的烘干温度规范有何区别？", "ans": "①目的：去除药皮吸附的水分和结晶水，防止焊接时水分分解产生氢（H2O→H2+O），从而避免氢气孔和氢致冷裂纹。②规范：含有机物（淀粉、纤维素）的酸性焊条烘干温度一般不超过200℃（防止有机物分解失效）；含碳酸盐（CaCO3）的焊条不超过450℃（防止碳酸盐提前分解）；碱性低氢焊条烘干温度一般为350℃左右保温1~2h，并随用随取；焊剂烘干温度亦按含有机物/矿物类型区分（≤200℃/≤450℃）。", "id": "q331", "orig": -1}, {"ch": "第二章", "chname": "焊接材料", "type": "essay", "q": "焊剂的作用是什么？按制造方法和碱度可如何分类？", "ans": "①作用：埋弧焊与电渣焊中熔化形成熔渣，起保护熔池、隔绝空气、参与冶金反应（脱氧、脱硫、脱磷、合金化）以及改善成形的作用。②按制造方法：熔炼焊剂（高温熔炼、玻璃态，成分均匀）、烧结焊剂（混料造粒烧结，可加合金、碱度调节范围大）、粘结焊剂（陶质焊剂）；③按碱度B1分类：高碱性（B1>1.5）、碱性（B1 1.0~1.5）、中性（B1 0.8~1.0）、酸性（B1<0.8）焊剂。碱性焊剂焊缝韧性和抗裂性好，酸性焊剂工艺性好。", "id": "q332", "orig": -1}, {"ch": "第二章", "chname": "焊接材料", "type": "essay", "q": "焊条选用应遵循哪些基本原则？", "ans": "①等强原则：焊缝金属强度与母材相匹配（如Q345用E5015），不盲目追求高强度；②考虑母材化学成分和焊接性：易淬火钢、低温钢、耐热钢选低氢型焊条或专用焊条；③考虑接头形式和受力条件：承受冲击载荷、低温或动载结构选韧性好的碱性焊条；④考虑工作条件：耐蚀、耐磨等特殊要求选相应专用焊条；⑤考虑工艺性与经济性：一般结构优先选用工艺性能好的酸性焊条；⑥考虑焊接位置和设备：全位置选药皮类型合适的焊条、直流设备选极性匹配焊条。", "id": "q333", "orig": -1}, {"ch": "第三章", "chname": "熔池凝固和焊缝固态相变", "type": "mcq", "q": "下列不属于熔池凝固特点的是", "options": ["过热度大", "过冷度大", "结晶速度小", "运动态结晶"], "ans": "C", "anstext": "结晶速度小", "id": "q48", "orig": 48}, {"ch": "第三章", "chname": "熔池凝固和焊缝固态相变", "type": "mcq", "q": "熔池中晶核的形成以", "options": ["为主。A. 自发形核", "非自发形核", "均匀形核", "均质形核"], "ans": "B", "anstext": "非自发形核", "id": "q49", "orig": 49}, {"ch": "第三章", "chname": "熔池凝固和焊缝固态相变", "type": "mcq", "q": "熔合线处θ=90°，此时结晶线速度vc与焊接速度v的关系是", "options": ["vc=v", "vc=0", "vc=2v", "vc=v/2"], "ans": "B", "anstext": "vc=0", "id": "q50", "orig": 50}, {"ch": "第三章", "chname": "熔池凝固和焊缝固态相变", "type": "mcq", "q": "熔池中心处θ=0°，结晶线速度vc", "options": ["等于0", "等于焊接速度v（最大值）", "等于v/2", "大于v"], "ans": "B", "anstext": "等于焊接速度v（最大值）", "id": "q51", "orig": 51}, {"ch": "第三章", "chname": "熔池凝固和焊缝固态相变", "type": "mcq", "q": "过冷度等于零、无成分过冷时得到的结晶形态是", "options": ["平面结晶", "胞状结晶", "树枝状结晶", term", "q": "熔池", "ans": "焊接时在热源作用下，焊件上形成的具有一定形状和尺寸的液态金属区域。其凝固过程直接决定焊缝的结晶组织。", "id": "q289", "orig": -1}, {"ch": "第三章", "chname": "熔池凝固和焊缝固态相变", "type": "term", "q": "熔滴过渡", "ans": "焊条（焊丝）端部熔化的金属以滴状脱离焊丝端部、穿过电弧空间向熔池转移的过程。分为短路过渡、颗粒状过渡、喷射过渡等。", "id": "q290", "orig": -1}, {"ch": "第三章", "chname": "熔池凝固和焊缝固态相变", "type": "term", "q": "短路过渡", "ans": "熔滴与熔池接触发生短路，靠短路电流的热量使熔滴颈缩断开而过渡的熔滴过渡形式。电弧稳定、飞溅小，适于薄板和全位置焊接。", "id": "q291", "orig": -1}, {"ch": "第三章", "chname": "熔池凝固和焊缝固态相变", "type": "term", "q": "喷射过渡", "ans": "在一定电流（临界电流）以上，熔滴以细小液滴高速、稳定地沿轴向过渡的形式。电弧稳定、飞溅小、熔深大。", "id": "q292", "orig": -1}, {"ch": "第三章", "chname": "熔池凝固和焊缝固态相变", "type": "term", "q": "柱状晶", "ans": "熔池结晶时，晶粒沿最大散热方向（垂直于熔合线方向）择优长大的柱状晶体。柱状晶越发达，焊缝性能越差，易产生中心偏析和热裂纹。", "id": "q293", "orig": -1}, {"ch": "第三章", "chname": "熔池凝固和焊缝固态相变", "type": "term", "q": "显微偏析", "ans": "晶粒内部或晶界处化学成分不均匀的现象，产生于凝固过程中溶质再分配。严重时会导致晶界低熔点共晶和热裂纹。", "id": "q294", "orig": -1}, {"ch": "第三章", "chname": "熔池凝固和焊缝固态相变", "type": "term", "q": "成分过冷", "ans": "合金凝固时，由于溶质富集使固液界面前沿液相的实际温度低于平衡液相线温度而产生的过冷现象。成分过冷越大，结晶形态越趋向等轴晶。", "id": "q295", "orig": -1}, {"ch": "第三章", "chname": "熔池凝固和焊缝固态相变", "type": "term", "q": "非自发形核", "ans": "熔池结晶时以现成表面（半熔化母材晶粒表面、悬浮质点等）为核心进行形核的方式。熔池结晶以非自发形核为主。", "id": "q296", "orig": -1}, {"ch": "第三章", "chname": "熔池凝固和焊缝固态相变", "type": "essay", "q": "熔池结晶有哪些特点？为什么以非自发形核为主？", "ans": "①特点：熔池体积小、冷却速度快，结晶速度很快；结晶过程在运动着的熔池中连续进行；结晶从熔合线开始向焊缝中心推进，晶粒沿最大散热方向（垂直熔合线）择优长大成柱状晶。②非自发形核为主的原因：熔池中存在大量现成表面——熔合区半熔化状态的母材晶粒表面、合金元素和杂质的悬浮质点等，这些现成界面大大降低形核功，使结晶优先在这些界面上形核，即联生结晶（依附生长）。", "id": "q334", "orig": -1}, {"ch": "第三章", "chname": "熔池凝固和焊缝固态相变", "type": "essay", "q": "说明焊接速度对结晶速度和方向的影响。", "ans": "①结晶线速度vc与焊接速度v的关系：vc=v·cosθ（θ为结晶方向与焊接方向的夹角）。熔合线处θ=90°，vc=0；熔池中心θ=0°，vc最大等于v。②焊接速度增大时：熔池拉长，柱状晶成长方向趋向垂直于焊缝中心线（即更垂直于熔合线而平行于横截面），导致焊缝中心易产生热裂纹；③焊接速度降低时：熔池变宽变短，柱状晶方向偏向焊接方向，有利于焊缝中心和易裂部位的结晶条件改善。故生产中通过调节焊速控制晶粒生长方向以改善抗裂性。", "id": "q335", "orig": -1}, {"ch": "第三章", "chname": "熔池凝固和焊缝固态相变", "type": "essay", "q": "成分过冷对熔池结晶形态有什么影响？", "ans": "①结晶形态随成分过冷增大依次为：平面晶→胞状晶→树枝晶（胞状树枝晶）→等轴晶；②温度梯度G大、结晶速度R小、溶质浓度C0低时，成分过冷小，倾向平面晶和胞状晶；③G减小、R增大或C0增大时，成分过冷增大，树枝晶发达，焊缝中心（G小、R大、溶质富集）易形成等轴晶；④等轴晶组织致密、性能各向同性较好，细化等轴晶有利于提高焊缝性能；树枝晶发达会加重偏析和热裂倾向。", "id": "q336", "orig": -1}, {"ch": "第三章", "chname": "熔池凝固和焊缝固态相变", "type": "essay", "q": "焊缝金属的偏析有哪些类型？各有什么危害？", "ans": "①类型：显微偏析（晶内与晶界成分不均，存在于晶粒尺度）、区域偏析（宏观尺度的成分不均，如焊缝中心偏析、层状分布）、以及层状（带条状）偏析等。②危害：偏析使晶界富集低熔点共晶和有害杂质（S、P），降低焊缝塑韧性和抗裂性，促进结晶裂纹（热裂纹）；中心偏析严重时焊缝中心形成脆弱面，导致中心裂纹；显微偏析降低晶界强度，使腐蚀优先沿晶界发生。③控制：细化晶粒（变质处理、振动）、限制S/P含量、控制熔合比和冷却条件。", "id": "q337", "orig": -1}, {"ch": "第三章", "chname": "熔池凝固和焊缝固态相变", "type": "essay", "q": "根据16Mn钢焊缝化学成分和冷却条件的不同，其固态相变组织可能有哪些？各自特征如何？", "ans": "①16Mn为不易淬火钢（碳当量较低），常规冷却（正火型冷却）时焊缝为铁素体+珠光体组织：先共析铁素体沿晶界呈网状或针状（魏氏组织倾向），珠光体为片层状，性能良好；②冷却速度较快（大热输入、厚板、低温焊）时，过冷奥氏体在较低温度转变，得到针状铁素体+贝氏体，强度升高但韧性下降；③冷却速度极快（淬火条件）时，出现马氏体组织（低碳马氏体），硬度高、塑韧性差、淬硬倾向增大，易产生冷裂纹；④化学成分变化（提高合金元素Mn、Nb等）同样改变CCT曲线位置，使组织向贝氏体、马氏体方向转变。实际焊接应通过控制热输入和预热使冷却速度落在铁素体+珠光体区。", "id": "q338", "orig": -1}, {"ch": "第三章", "chname": "熔池凝固和焊缝固态相变", "type": "essay", "q": "改善焊缝金属组织的措施有哪些？", "ans": "①变质处理：向熔池加入微量合金元素（Ti、V、Nb、Mo、B等）形成高熔点质点，细化晶粒（如16Mn焊缝加Ti、V）；②振动结晶：机械振动、超声波振动或电磁搅拌，破碎柱状晶、促进等轴晶，减小偏析；③多层多道焊：后层对前层产生再加热作用，相当于正火处理，细化组织；④调整焊接参数：控制热输入和冷却速度，避免晶粒粗大或淬硬组织；⑤采用奥氏体化或细化晶粒焊材（合金焊丝），从成分上控制组织。", "id": "q339", "orig": -1}, {"ch": "第四章", "chname": "焊接热影响区的组织和性能", "type": "mcq", "q": "热影响区（HAZ）又称", "options": ["熔合区", "近缝区", "过热区", "焊缝区"], "ans": "B", "anstext": "近缝区", "id": "q72", "orig": 72}, {"ch": "第四章", "chname": "焊接热影响区的组织和性能", "type": "mcq", "q": "手工电弧焊时相变温度以上的高温停留时间约为", "options": ["4～20s", "30～100s", "1～5min", "0.01～0.1s"], "ans": "A", "anstext": "4～20s", "id": "q73", "orig": 73}, {"ch": "第四章", "chname": "焊接热影响区的组织和性能", "type": "mcq", "q": "埋弧自动焊时高温停留时间约为", "options": ["4～20s", "30～100s", "1～2h", "数秒"], "ans": "B", "anstext": "30～100s", "id": "q74", "orig": 74}, {"ch": "第四章", "chname": "焊接热影响区的组织和性能", "type": "mcq", "q": "焊接加热速度比热处理加热速度", "options": ["略快", "快几十倍甚至几百倍", "基本相同", "更慢"], "ans": "B", "anstext": "快几十倍甚至几百倍", "id": "q75", "orig": 75}, {"ch": "第四章", "chname": "焊接热影响区的组织和性 全淬火区为马氏体+部分铁素体；回火区为回火组织。②对性能的影响：过热淬火区硬度高、塑韧性差，是易产生冷裂纹和脆断的薄弱区；马氏体（尤其粗大马氏体）组织淬硬倾向大、氢脆敏感，在拘束应力与扩散氢作用下易形成延迟裂纹。③对策：预热、控制冷却速度（减小淬硬程度）、后热消氢、选用低氢焊材、焊后热处理（回火）改善组织。", "id": "q340", "orig": -1}, {"ch": "第四章", "chname": "焊接热影响区的组织和性能", "type": "essay", "q": "不易淬火钢（低碳钢、16Mn）热影响区的组织分布有何特点？", "ans": "①从熔合线向外依次为：熔合区（半熔化区，很窄）、过热区（固相线~1100℃，晶粒粗大、韧性下降）、相变重结晶区（正火区，A3~1000℃，组织细化、性能好）、不完全重结晶区（Ac1~Ac3，组织不均匀）。②不易淬火钢空冷一般不产生马氏体，组织为铁素体+珠光体（或贝氏体），淬硬倾向小、冷裂敏感性低；③最薄弱环节是熔合区和过热区（粗晶脆化），需控制热输入避免过热区晶粒过分长大。", "id": "q341", "orig": -1}, {"ch": "第四章", "chname": "焊接热影响区的组织和性能", "type": "essay", "q": "焊接热影响区硬化的机理是什么？受哪些因素影响？", "ans": "①机理：焊接加热使HAZ奥氏体化，快速冷却时奥氏体过冷到Ms以下转变为马氏体（或贝氏体），形成淬硬组织，硬度升高、塑韧性下降；含碳量高、合金元素多的钢淬硬倾向大。②影响因素：钢的化学成分（碳当量Ceq越大越易淬硬）、焊接热输入与冷却速度（冷却越快淬硬越严重）、预热温度（预热降低冷却速度、减轻淬硬）、板厚与散热条件（厚板、低温散热快）。③对策：预热、合理热输入、后热或焊后热处理，控制冷却速度在临界冷却速度之上。", "id": "q342", "orig": -1}, {"ch": "第四章", "chname": "焊接热影响区的组织和性能", "type": "essay", "q": "焊接中预热和后热各起什么作用？", "ans": "①预热：降低焊接区温度梯度、减缓冷却速度，防止淬硬组织形成，减少淬硬倾向；降低氢的危害（促进氢逸出）；减小拘束应力、减少冷裂纹倾向；对厚板还能改善焊缝成形。预热温度按钢种和板厚选定。②后热（焊后立即加热保温）：在奥氏体分解温度以下保温，促使扩散氢逸出焊缝（消氢处理，如250℃×6h、350℃×1h），防止氢致延迟裂纹；兼有减小残余应力的作用。③对于易淬火钢，预热+后热联合使用是防止冷裂纹的主要工艺措施。", "id": "q343", "orig": -1}, {"ch": "第四章", "chname": "焊接热影响区的组织和性能", "type": "essay", "q": "焊接热影响区的韧化途径有哪些？", "ans": "①控制热输入：避免过大热输入导致过热区晶粒粗大，也避免过快冷却形成淬硬组织，使冷却速度落在最佳区间；②预热与多层多道焊：多层焊后层对前层再加热，相当于正火/回火处理，细化晶粒、改善韧性；③控制母材成分和有害元素：降低C、S、P含量，加入Ti、V、Nb、Mo等细化晶粒元素；④焊后热处理：回火或正火消除淬硬组织、细化晶粒；⑤提高HAZ韧性的冶金措施：如添加微量合金形成弥散质点钉扎晶界、优化焊接线能量匹配。", "id": "q344", "orig": -1}, {"ch": "第四章", "chname": "焊接热影响区的组织和性能", "type": "essay", "q": "调质钢（淬火回火钢）焊接热影响区的主要问题及对策是什么？", "ans": "①主要问题：焊接热循环使调质钢HAZ奥氏体化并快速冷却，过热区形成粗大马氏体等淬硬组织（脆化、硬度高），且破坏母材原有的调质（回火）组织，韧性下降；在拘束应力和氢作用下易产生冷裂纹；多次热循环还会造成局部回火脆化。②对策：控制热输入在较小范围、采用预热（降低冷却速度、减轻淬硬）、严格限制氢（烘干焊材、清理坡口）、焊后立即后热/回火处理恢复韧性与硬度、必要时采用小线能量多层焊使HAZ组织细化。", "id": "q345", "orig": -1}, {"ch": "第五章", "chname": "焊接裂纹", "type": "mcq", "q": "按产生本质分类，焊接裂纹包括热裂纹、再热裂纹、冷裂纹、层状撕裂和____（　）A. 应力腐蚀裂纹　B. 延迟裂纹　C. 结晶裂纹　D. 焊道下裂纹", "options": ["应力腐蚀裂纹", "延迟裂纹", "结晶裂纹", "焊道下裂纹"], "ans": "A", "anstext": "应力腐蚀裂纹", "id": "q173", "orig": -1}, {"ch": "第五章", "chname": "焊接裂纹", "type": "mcq", "q": "在焊缝结晶过程中产生、焊缝断面上有氧化彩色的热裂纹是（　）A. 高温液化裂纹　B. 结晶裂纹　C. 多边化裂纹　D. 再热裂纹", "options": ["高温液化裂纹", "结晶裂纹", "多边化裂纹", "再热裂纹"], "ans": "B", "anstext": "结晶裂纹", "id": "q174", "orig": -1}, {"ch": "第五章", "chname": "焊接裂纹", "type": "mcq", "q": "产生结晶裂纹的根本原因是液态薄膜，其必要条件是（　）A. 晶格缺陷　B. 拉伸应力　C. 氢聚集　D. 淬硬马氏体", "options": ["晶格缺陷", "拉伸应力", "氢聚集", "淬硬马氏体"], "ans": "B", "anstext": "拉伸应力", "id": "q175", "orig": -1}, {"ch": "第五章", "chname": "焊接裂纹", "type": "fill", "q": "熔池结晶的固液阶段，液相主要是低熔点共晶且流动困难，该温度区间称为____，是结晶裂纹易产生的区间。", "ans": "脆性温度区", "id": "q176", "orig": -1}, {"ch": "第五章", "chname": "焊接裂纹", "type": "mcq", "q": "临界应变率CST越大，表示材料的热裂纹敏感性（　）A. 越大　B. 越小　C. 不变　D. 与CST无关", "options": ["越大", "越小", "不变", "与CST无关"], "ans": "B", "anstext": "越小", "id": "q177", "orig": -1}, {"ch": "第五章", "chname": "焊接裂纹", "type": "mcq", "q": "含碳量C<0.16%时，为防止S引起的结晶裂纹，应（　）A. 提高Mn/S比　B. 降低Mn/S比　C. 增加P含量　D. 增加Si含量", "options": ["提高Mn/S比", "降低Mn/S比", "增加P含量", "增加Si含量"], "ans": "A", "anstext": "提高Mn/S比", "id": "q178", "orig": -1}, {"ch": "第五章", "chname": "焊接裂纹", "type": "mcq", "q": "与S亲和力大、可形成高熔点硫化物（如TiS、ZrS、CeS）从而消除结晶裂纹的元素是（　）A. Cu、Ni　B. C、Si　C. Ti、Zr、稀土　D. Mn、Cr", "options": ["Cu、Ni", "C、Si", "Ti、Zr、稀土", "Mn、Cr"], "ans": "C", "anstext": "Ti、Zr、稀土", "id": "q179", "orig": -1}, {"ch": "第五章", "chname": "焊接裂纹", "type": "mcq", "q": "高温液化裂纹主要发生在含Cr、Ni的高强钢、奥氏体钢及某些镍基合金的（　）A. 焊缝中心　B. 近缝区或多层焊层间　C. 母材　D. 熔合区", "options": ["焊缝中心", "近缝区或多层焊层间", "母材", "熔合区"], "ans": "B", "anstext": "近缝区或多层焊层间", "id": "q180", "orig": -1}, {"ch": "第五章", "chname": "焊接裂纹", "type": "mcq", "q": "多边化裂纹产生于比固相线稍低的高温区间，其形成原因是（　）A. 低熔点共晶熔化　B. 氢脆　C. 晶格缺陷迁移聚集形成多边化边界　D. 淬硬组织", "options": ["低熔点共晶熔化", "氢脆", "晶格缺陷迁移聚集形成多边化边界", "淬硬组织"], "ans": "C", "anstext": "晶格缺陷迁移聚集形成多边化边界", "id": "q181", "orig": -1}, {"ch": "第五章", "chname": "焊接裂纹", "type": "mcq", "q": "沉淀强化低合金钢再热裂纹的敏感温度区间约为（　）A. 100~300℃　B. 500~700℃　C. 800~900℃　D. 200~400℃", "options": ["100~300℃", "500~700℃", "800~900℃", "2
