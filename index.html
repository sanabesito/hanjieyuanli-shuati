<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>材料连接与增材制造原理 · 刷题记忆台</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231c5a86'/%3E%3Cpath d='M14 40h24v6H14z' fill='%23e8f1f8'/%3E%3Ccircle cx='40' cy='43' r='4' fill='%23d9701f'/%3E%3Cpath d='M44 43h4M48 39l3-3M48 47l3 3' stroke='%23f4b95c' stroke-width='2.5' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
:root{
  --ink:#14222e; --muted:#5b6b7a; --bg:#f1f4f7; --panel:#ffffff;
  --line:#dde4ea; --brand:#1c5a86; --brand2:#2f7fb5; --accent:#d9701f;
  --ok:#1e7a50; --bad:#c03a2e; --tint:#e8f1f8; --tint2:#fdf0e3;
  --radius:12px; --shadow:0 1px 2px rgba(20,34,46,.06),0 4px 14px rgba(20,34,46,.05);
  --mono:"Cascadia Mono","SFMono-Regular",Consolas,"Microsoft YaHei",monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;line-height:1.55}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input{font-family:inherit}
:focus-visible{outline:2px solid var(--brand2);outline-offset:2px}
.appbar{position:sticky;top:0;z-index:20;background:var(--panel);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand svg{flex:none}
.brand h1{font-size:16px;font-weight:700;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{display:block;font-size:11.5px;color:var(--muted);font-weight:400;letter-spacing:.06em}
.gauge{display:flex;align-items:center;gap:12px;margin-left:auto}
.gauge .gv{font-size:12px;color:var(--muted)}
.gauge .gv b{color:var(--ink);font-size:14px}
.ring{width:34px;height:34px;flex:none}
.ring .track{fill:none;stroke:#e2e9f0;stroke-width:4}
.ring .bar{fill:none;stroke:var(--accent);stroke-width:4;stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%;transition:stroke-dashoffset .4s}
.iconbtn{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--muted);border:1px solid var(--line);background:#fff}
.iconbtn:hover{color:var(--brand);border-color:#b9c8d6}
.iconbtn:disabled{opacity:.4;cursor:default}
.layout{display:block;padding:16px;max-width:1200px;margin:0 auto}
.sidebar{display:none}
.view{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;min-height:420px}
.bottomnav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--panel);border-top:1px solid var(--line);display:flex}
.bottomnav button{flex:1;padding:10px 4px 12px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--muted)}
.bottomnav button.on{color:var(--brand);font-weight:600}
.bottomnav svg{width:21px;height:21px}
.page{animation:in .18s ease}
@keyframes in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@media(min-width:900px){
  .layout{display:grid;grid-template-columns:196px minmax(0,1fr);gap:16px;padding:20px 24px 60px;align-items:start}
  .sidebar{display:flex;flex-direction:column;gap:4px}
  .sidebar .sect{font-size:11px;color:var(--muted);letter-spacing:.1em;padding:10px 10px 4px;font-weight:600}
  .navitem{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;color:#2a3c4c;font-size:14px;font-weight:500}
  .navitem svg{width:18px;height:18px;color:var(--muted)}
  .navitem:hover{background:#e7edf3}
  .navitem.on{background:var(--tint);color:var(--brand);font-weight:600}
  .navitem.on svg{color:var(--brand)}
  .chfilter{margin-top:12px;padding:12px;background:#e9eef3;border-radius:10px}
  .chfilter .lbl{font-size:12px;color:var(--muted);margin-bottom:6px;font-weight:600}
  .chfilter button{display:block;width:100%;text-align:left;padding:7px 10px;border-radius:8px;font-size:13px;color:#33475b}
  .chfilter button:hover{background:#fff}
  .chfilter button.on{background:var(--brand);color:#fff;font-weight:600}
  .bottomnav{display:none}
  .view{padding:24px}
}
/* ---- notes 复习讲义（图解提纲） ---- */
.nt{--nt-top:60px;max-width:920px;margin:0 auto}
.nt .hl{font-style:normal;font-weight:700;color:#b25a12}
.nt-hero{position:relative;overflow:hidden;border-radius:14px;background:linear-gradient(135deg,#0d2f45 0%,#14455f 48%,#1c5a86 100%);color:#fff;padding:22px 18px;margin:-18px -18px 14px}
.nt-hero::after{content:"";position:absolute;right:-30px;bottom:-70px;width:230px;height:230px;border-radius:50%;border:26px solid rgba(255,255,255,.06);pointer-events:none}
.nt-hero .k{font-size:11.5px;letter-spacing:.22em;color:#9fc3dd;font-weight:700;position:relative}
.nt-hero h2{font-size:23px;margin:6px 0 6px;font-weight:800;position:relative}
.nt-hero>p{font-size:14px;color:#cfe2f1;line-height:1.7;max-width:600px;position:relative}
.nt-stats{position:relative;display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.nt-stats span{display:inline-flex;align-items:baseline;gap:4px;padding:5px 12px;border-radius:999px;background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.24);font-size:12.5px;color:#e3eef7}
.nt-stats b{font-size:16px;color:#fff}
.nt-tabs{position:sticky;top:var(--nt-top);z-index:6;display:flex;gap:8px;overflow-x:auto;margin:0 -18px;padding:10px 18px;background:var(--panel);box-shadow:0 8px 10px -8px rgba(20,34,46,.12);scrollbar-width:none;-webkit-overflow-scrolling:touch}
.nt-tabs::-webkit-scrollbar{display:none}
.nt-tab{flex:none;min-height:44px;padding:0 15px;border-radius:999px;background:#e7edf3;color:#2a3c4c;font-size:13.5px;font-weight:700;border:1px solid transparent;display:inline-flex;align-items:center;white-space:nowrap}
.nt-tab.on{background:var(--brand);color:#fff;box-shadow:0 4px 12px rgba(28,90,134,.28)}
.nt-tab.q{background:var(--tint2);color:#a4560f}
.nt-tab.q.on{background:var(--accent);color:#fff;box-shadow:0 4px 12px rgba(217,112,31,.3)}
.nt-chhd{display:flex;gap:14px;align-items:center;padding:16px 0 12px;flex-wrap:wrap}
.nt-no{flex:none;width:58px;height:58px;border-radius:16px;background:linear-gradient(135deg,#14455f,#1c5a86);color:#fff;font-size:23px;font-weight:800;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 14px rgba(20,69,95,.25)}
.nt-eyebrow{font-size:12px;color:var(--brand2);font-weight:800;letter-spacing:.08em}
.nt-eyebrow em{font-style:normal;color:#d9701f;letter-spacing:.05em}
.nt-chhd h3{font-size:21px;color:#12334d;margin:2px 0 4px;line-height:1.3}
.nt-chhd .ln{font-size:14px;color:#3f586a;line-height:1.75;flex:1 1 260px;min-width:0}
.nt-map{display:flex;flex-wrap:wrap;gap:8px;padding:10px 0 2px}
.nt-maplb{width:100%;font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.08em}
.nt-jump{min-height:44px;padding:8px 12px;border-radius:10px;background:var(--tint);color:#12334d;font-size:13px;font-weight:600;text-align:left}
.nt-jump:hover{background:#d7e6f1}
.nt-sec{margin-top:16px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 14px 8px;box-shadow:var(--shadow);scroll-margin-top:calc(var(--nt-top) + 68px)}
.nt-sec>h4{display:flex;align-items:center;gap:10px;font-size:16.5px;color:#0f2a43;padding-bottom:10px;border-bottom:2px solid var(--tint);margin-bottom:6px;line-height:1.4}
.nt-sec>h4 i{flex:none;width:28px;height:28px;border-radius:9px;background:var(--brand);color:#fff;font-size:14px;font-style:normal;font-weight:800;display:flex;align-items:center;justify-content:center}
.pt{display:grid;grid-template-columns:16px minmax(0,1fr);gap:6px;padding:7px 0;font-size:14px;line-height:1.75;color:#2b3d4d}
.pt::before{content:"";width:7px;height:7px;margin-top:9px;border-radius:2px;background:#8aa0b5;transform:rotate(45deg)}
.pt p{min-width:0;overflow-wrap:anywhere}
.pt b{color:#0f4c75}
.pt.k{display:block;padding:10px 12px;margin:6px 0;border-radius:10px;background:#f6f9fb;border:1px solid #e6eef5}
.pt.k::before{content:none}
.pt.k .tm{display:inline-block;font-size:14.5px;color:#0f4c75;font-weight:800;margin-bottom:2px}
.pt.hot{display:block;margin:6px 0;padding:9px 12px 9px 14px;border-radius:10px;background:var(--tint2);border-left:4px solid var(--accent)}
.pt.hot::before{content:none}
.pt.hot b{color:#8a4a12}
.hb{display:inline-block;margin-right:8px;padding:0 7px;border-radius:6px;background:var(--accent);color:#fff;font-size:11.5px;font-weight:800;vertical-align:2px;letter-spacing:.04em}
.pt.bad{display:block;margin:6px 0;padding:8px 12px;border-radius:10px;background:#fff5f3;border:1px solid #f3d3cc;font-size:13.5px}
.pt.bad::before{content:none}
.xr,.xg{display:grid;grid-template-columns:18px minmax(0,1fr);gap:6px;line-height:1.7;padding:2px 0;overflow-wrap:anywhere}
.xr{color:#a33a2c}.xg{color:#1e7a50}
.xr svg,.xg svg{width:17px;height:17px;margin-top:3px}
.steps{list-style:none;margin:8px 0;padding:0;display:flex;flex-wrap:wrap;gap:8px}
.steps li{display:flex;align-items:center;gap:8px;background:var(--tint);border-radius:999px;padding:5px 13px 5px 5px;font-size:13.5px;color:#12334d;font-weight:600;line-height:1.5;max-width:100%}
.steps i{flex:none;width:24px;height:24px;border-radius:50%;background:#fff;color:var(--brand);font-style:normal;font-weight:800;font-size:12.5px;display:flex;align-items:center;justify-content:center}
.steps.v{flex-direction:column;gap:6px}
.steps.v li{border-radius:12px;padding:6px 12px 6px 6px}
.nt-tbl{overflow-x:auto;margin:8px 0 10px;border:1px solid var(--line);border-radius:10px;-webkit-overflow-scrolling:touch;background:#fff}
.nt-tbl table{border-collapse:collapse;width:100%;font-size:13px;line-height:1.6}
.nt-tbl.wide table{min-width:460px}
.nt-tbl:not(.wide) thead th{white-space:normal}
.nt-tbl th,.nt-tbl td{padding:8px 10px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
.nt-tbl thead th{background:#14455f;color:#fff;font-weight:700}
.nt-tbl tbody th{background:#f3f7fa;color:#0f2a43;font-weight:700;min-width:88px}
.nt-tbl tbody tr:last-child th,.nt-tbl tbody tr:last-child td{border-bottom:none}
.nt-tbl tbody tr:nth-child(even) td{background:#fbfcfd}
.nt-tip{margin-top:18px;border-radius:14px;padding:14px 16px;background:linear-gradient(135deg,#fff7ee,#fdf0e3);border:1px solid #f3d9bd}
.nt-tip h4{display:flex;align-items:center;gap:8px;font-size:15px;color:#a4560f;margin-bottom:2px}
.nt-tip h4 svg{width:20px;height:20px}
.nt-tip p{font-size:14px;line-height:1.75;color:#5a3a1e;margin-top:7px;overflow-wrap:anywhere}
.nt-tip p b{display:inline-block;color:#a4560f;margin-right:8px}
.nt-pg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0 2px}
.nt-pg button{min-height:48px;padding:0 10px;border-radius:12px;border:1px solid var(--line);background:#fff;font-size:14px;font-weight:700;color:#12334d;display:flex;align-items:center;justify-content:center;gap:6px}
.nt-pg button svg{width:18px;height:18px;flex:none}
.nt-pg button.pri{background:var(--brand);color:#fff;border-color:var(--brand)}
.nt-pg button:only-child{grid-column:1/-1}
.nt-pg button:disabled{display:none}
.nt .nt-fig{margin:10px 0 4px!important}
.nt-qintro{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 4px;align-items:center}
.nt-src{min-height:44px;padding:0 15px;border-radius:999px;background:#e7edf3;color:#2a3c4c;font-size:13.5px;font-weight:700;border:1px solid transparent}
.nt-src.on{background:var(--brand);color:#fff}
.nt-all{min-height:44px;margin-left:auto;padding:0 13px;border-radius:999px;border:1px dashed #b9c8d6;color:#1c5a86;font-size:13px;font-weight:700;background:#fff}
.nt-paper{margin-top:10px;padding:12px 14px;border-radius:12px;background:#f6f9fb;border:1px dashed #c5d5e2;font-size:13.5px;line-height:1.8;color:#2b3d4d}
.nt-paper b{color:#0f4c75}
.nt-qgrp{margin:18px 0 8px;font-size:15.5px;font-weight:800;color:#12334d;display:flex;justify-content:space-between;align-items:baseline;gap:10px;border-left:4px solid var(--brand);padding-left:10px}
.nt-qgrp span{font-size:12.5px;color:var(--muted);font-weight:600}
details.nt-q{margin:8px 0;border:1px solid var(--line);border-radius:12px;background:#fff;overflow:hidden}
details.nt-q[open]{border-color:#b9cfe0;box-shadow:var(--shadow)}
.nt-q summary{list-style:none;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:2px 10px;align-items:center;padding:10px 12px;min-height:44px;cursor:pointer}
.nt-q summary::-webkit-details-marker{display:none}
.qt{grid-row:1/3;align-self:center;padding:5px 9px;border-radius:8px;font-size:12.5px;font-weight:800;color:#fff;background:#1c5a86;white-space:nowrap}
.nt-q.s-z .qt{background:#c0392b}.nt-q.s-k .qt{background:#1c5a86}.nt-q.s-c .qt{background:#1e7a50}
.qm{font-size:12px;color:var(--muted);font-weight:600}
.qq{font-size:14.5px;font-weight:700;color:#14222e;line-height:1.6;overflow-wrap:anywhere}
.chv{grid-row:1/3;color:var(--muted);transition:transform .2s;display:flex}
.nt-q[open] .chv{transform:rotate(180deg)}
.nt-qbody{padding:2px 14px 14px;border-top:1px solid var(--line)}
.nt-qrow{margin-top:10px}
.nt-qrow>b{display:inline-block;font-size:12.5px;color:#0f4c75;background:var(--tint);padding:2px 8px;border-radius:6px;margin-bottom:5px;font-weight:800}
.nt-qrow p{font-size:14px;line-height:1.85;color:#2b3d4d;overflow-wrap:anywhere;margin-top:3px}
.nt-qrow.think p{color:#3f586a;font-size:13.5px}
.nt-pts{margin:6px 0 0;padding:0;list-style:none;counter-reset:pt}
.nt-pts li{counter-increment:pt;position:relative;padding:5px 0 5px 34px;font-size:13.5px;line-height:1.7;color:#2b3d4d;overflow-wrap:anywhere}
.nt-pts li::before{content:counter(pt);position:absolute;left:0;top:6px;width:22px;height:22px;border-radius:50%;background:var(--tint2);color:#a4560f;font-weight:800;font-size:12px;display:flex;align-items:center;justify-content:center}
.nt-note{margin-top:10px;padding:8px 12px;border-radius:10px;background:#fff8e6;border:1px solid #f0dfa8;font-size:13px;color:#6b5416;line-height:1.7}
.nt-basis{margin-top:10px;font-size:12.5px;color:var(--muted);border-top:1px dashed var(--line);padding-top:8px;line-height:1.7}
.nt-ego{min-height:44px;margin-top:10px;padding:0 14px;border-radius:10px;border:1px solid #f0cfae;background:#fff;color:#a4560f;font-size:13.5px;font-weight:700}
@media(max-width:759px){.nt-tbl.wide::before{content:"↔ 左右滑动看全表";display:block;position:sticky;left:0;font-size:11.5px;font-weight:700;color:var(--brand2);padding:4px 10px 0;background:#fff}}
@media(min-width:700px){
  .nt-hero{padding:28px 28px}
  .nt-hero h2{font-size:28px}
  .nt-sec{padding:18px 20px 10px}
  .pt{font-size:14.5px}
  .nt-tabs{margin:0 -20px;padding:10px 20px}
}
@media(max-width:360px){.nt-no{width:48px;height:48px;font-size:19px}.nt-chhd h3{font-size:19px}}
@media print{.appbar,.sidebar,.bottomnav,.nt-tabs,.nt-pg,.nt-all,.nt-ego{display:none!important}.nt-hero{background:#14455f!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}}
/* ---- framework 知识框架 ---- */
.fwgrid{display:flex;flex-wrap:wrap;gap:14px}
.fwcard{flex:1 1 280px;min-width:280px;max-width:100%;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow)}
.fw-hd{padding:10px 14px;color:#fff}
.fw-hd b{display:block;font-size:16px}
.fw-hd span{display:block;font-size:12.5px;opacity:.92;margin-top:2px}
.fw-bd{padding:10px 12px 12px}
.fw-sec{margin-bottom:10px}
.fw-sec:last-child{margin-bottom:0}
.fw-lb{display:inline-block;font-size:13.5px;font-weight:700;color:#0f2a43;border-bottom:2px solid;padding-bottom:1px;margin-bottom:5px}
.fw-sec ul{margin:0;padding:0;list-style:none}
.fw-sec li{font-size:13px;line-height:1.55;color:#33475b;padding-left:12px;position:relative;margin:2px 0}
.fw-sec li::before{content:"";position:absolute;left:0;top:8px;width:5px;height:5px;border-radius:50%;background:#8aa0b5}
.fwcard.c0 .fw-hd{background:#14455f} .fwcard.c0 .fw-lb{border-color:#14455f} .fwcard.c0 li::before{background:#14455f}
.fwcard.c1 .fw-hd{background:#1f6f8b} .fwcard.c1 .fw-lb{border-color:#1f6f8b} .fwcard.c1 li::before{background:#1f6f8b}
.fwcard.c2 .fw-hd{background:#2e7d5b} .fwcard.c2 .fw-lb{border-color:#2e7d5b} .fwcard.c2 li::before{background:#2e7d5b}
.fwcard.c3 .fw-hd{background:#b26a2b} .fwcard.c3 .fw-lb{border-color:#b26a2b} .fwcard.c3 li::before{background:#b26a2b}
.fwcard.c4 .fw-hd{background:#7a4d9e} .fwcard.c4 .fw-lb{border-color:#7a4d9e} .fwcard.c4 li::before{background:#7a4d9e}
.fwcard.c5 .fw-hd{background:#a63d40} .fwcard.c5 .fw-lb{border-color:#a63d40} .fwcard.c5 li::before{background:#a63d40}
.fwcard.c6 .fw-hd{background:#5b6b7a} .fwcard.c6 .fw-lb{border-color:#5b6b7a} .fwcard.c6 li::before{background:#5b6b7a} .fwcard.c7 .fw-hd{background:#7a5a2e} .fwcard.c7 .fw-lb{border-color:#7a5a2e} .fwcard.c7 li::before{background:#7a5a2e}
.fwfoot{margin-top:14px;font-size:13px;color:var(--muted);text-align:center}
/* ---- home ---- */
.hero{position:relative;overflow:hidden;border-radius:var(--radius);background:linear-gradient(135deg,#0d2f45 0%,#14455f 45%,#1c5a86 100%);color:#fff;padding:26px 22px;margin-bottom:16px}
.hero::after{content:"";position:absolute;inset:0;background:radial-gradient(560px 210px at 88% 0%,rgba(228,132,44,.18),transparent 62%);pointer-events:none}
.hero .kicker{font-size:12px;letter-spacing:.24em;color:#9fc3dd;font-weight:600}
.hero h2{font-size:22px;margin:8px 0 8px;font-weight:800;line-height:1.3;letter-spacing:.01em}
.hero p{font-size:14px;color:#cfe2f1;max-width:660px}
.hero svg{position:absolute;right:-14px;bottom:-26px;opacity:.85;width:230px;height:210px}
@media(max-width:600px){.hero svg{display:none}}
.hero-actions{position:relative;z-index:1;display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.hero-btn{min-height:44px;padding:0 16px;border-radius:11px;font-size:14px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer}
.hero-btn.primary{background:linear-gradient(135deg,#e07b1f,#d9701f);color:#fff;border:1px solid rgba(255,255,255,.22);box-shadow:0 6px 16px rgba(224,123,31,.35)}
.hero-btn.ghost{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.36)}
.hero-btn.ghost:hover{background:rgba(255,255,255,.2)}
@media(max-width:600px){.hero-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.hero-btn{width:100%;padding:0 8px;font-size:13px}}
@media(max-width:600px){.hero .kicker{letter-spacing:.15em;font-size:11px;white-space:nowrap}}
.resgrid{display:grid;grid-template-columns:1fr;gap:10px;margin-bottom:16px}
@media(min-width:640px){.resgrid{grid-template-columns:repeat(2,1fr)}}

.chgrid button.on{background:var(--tint);border-color:var(--brand);color:var(--brand);font-weight:700}
.chgrid .cnt{margin-left:auto;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;font-weight:600}
.chgrid svg{width:18px;height:18px;flex:none;color:var(--brand2)}

.starlist .wrow .ans{color:var(--muted)}
/* 名词解释 / 简答题（对照记忆 + 自评掌握） */
.revzone{margin-top:14px}
.reveal{display:flex;align-items:center;gap:7px;min-height:44px;padding:10px 16px;border-radius:10px;border:1px solid var(--brand);background:var(--tint);color:var(--brand);font-size:14px;font-weight:600}
.reveal.on{background:#fff;border-color:#b9c8d6;color:var(--muted)}
.anscard{display:none;margin-top:12px;padding:14px 16px;background:#f6fafd;border:1px solid #c9d8e4;border-radius:12px}
.anscard.show{display:block}
.anscard .lbl{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;color:var(--brand);letter-spacing:.4px;margin-bottom:8px}
.anscard .txt{overflow-wrap:anywhere;word-break:break-word;font-size:14.5px;line-height:1.8;color:#2c4053;white-space:pre-wrap}
.selfev{display:flex;gap:8px;margin-top:12px}
.selfev button{flex:1;min-height:44px;border-radius:10px;font-size:14px;font-weight:600}
.selfev .ok{background:var(--ok);border:none;color:#fff}
.selfev .ok.chosen{box-shadow:inset 0 0 0 2px rgba(255,255,255,.55)}
.selfev .no{background:#fff;border:1px solid #e0b9b9;color:var(--bad)}
.selfev .no.chosen{background:#fdf1f0}
.revtip{margin:10px 2px 0;font-size:12.5px;color:var(--muted)}
@media(max-width:899px){ .anscard .txt{font-size:14px} }

body{

.view{border-radius:18px;box-shadow:0 12px 34px rgba(18,42,63,.08),0 2px 6px rgba(18,42,63,.04)}

.rescard:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(18,42,63,.10);border-color:rgba(28,90,134,.28)}
.statcard:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(18,42,63,.10)}

/* ===== 简答默写 · AI 踩分 ===== */
.ep-page{display:flex;flex-direction:column;gap:14px}
.ep-hero{position:relative;overflow:hidden;border-radius:18px;padding:22px 20px;color:#fff;background:linear-gradient(135deg,#0e2f46 0%,#174a68 55%,#1c5a86 100%);box-shadow:0 16px 36px rgba(13,43,63,.18)}
.ep-hero::before{content:"";position:absolute;right:-60px;top:-80px;width:250px;height:250px;border-radius:50%;background:radial-gradient(circle,rgba(244,185,92,.38),transparent 65%)}
.ep-hero::after{content:"";position:absolute;left:-70px;bottom:-110px;width:230px;height:230px;border-radius:50%;background:radial-gradient(circle,rgba(47,127,181,.34),transparent 68%)}
.ep-kicker{position:relative;z-index:1;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#f4c47a;font-weight:700}
.ep-hero h2{position:relative;z-index:1;margin:8px 0 6px;font-size:24px;line-height:1.35;letter-spacing:-.02em}
.ep-hero p{position:relative;z-index:1;margin:0;font-size:13.5px;line-height:1.7;color:rgba(255,255,255,.78);max-width:700px}
.ep-stats{position:relative;z-index:1;display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:16px}
@media(min-width:720px){.ep-stats{grid-template-columns:repeat(4,1fr)}}
.ep-stat{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);border-radius:12px;padding:9px 11px;backdrop-filter:blur(4px)}
.ep-stat b{display:block;font-size:20px;line-height:1.2;color:#ffd89b}
.ep-stat span{font-size:11px;color:rgba(255,255,255,.68)}
.ep-panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:0 10px 26px rgba(18,42,63,.07)}
.ep-chips{max-width:100%;min-width:0;display:flex;flex-wrap:wrap;gap:7px;padding:2px 0 6px}
.ep-chips::-webkit-scrollbar{display:none}
.ep-chip{flex:0 0 auto;min-height:44px;padding:0 13px;border-radius:999px;border:1px solid var(--line);background:#f7f9fb;color:var(--ink);font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.ep-chip em{font-style:normal;color:var(--muted);font-weight:500;margin-left:4px}
.ep-chip.on{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;border-color:transparent;box-shadow:0 4px 12px rgba(28,90,134,.22)}
.ep-chip.on em{color:rgba(255,255,255,.8)}
.ep-toolrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:4px 0 14px}
.ep-toggle{min-height:44px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--muted);font-size:12.5px;font-weight:600;cursor:pointer}
.ep-toggle.on{border-color:rgba(28,90,134,.35);background:var(--tint);color:var(--brand)}
.ep-muted{font-size:12px;color:var(--muted);margin-left:auto}
.ep-card{border:1px solid var(--line);border-radius:16px;background:linear-gradient(180deg,#fff,#fbfcfd);padding:16px}
.ep-cardhead{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.ep-badge{font-size:11.5px;line-height:1;padding:7px 9px;border-radius:999px;background:var(--tint);color:var(--brand);font-weight:700}
.ep-badge.soft{background:#f3f6f9;color:var(--muted);font-weight:600}
.ep-badge.last{background:#fff4e5;color:#a75b10}
.ep-q{overflow-wrap:anywhere;font-size:18px;line-height:1.7;font-weight:700;color:var(--ink);margin:2px 0 8px}
.ep-hint{font-size:12.5px;line-height:1.65;color:var(--muted);margin-bottom:10px}
.ep-textarea{width:100%;min-height:190px;resize:vertical;border:1px solid var(--line);border-radius:12px;padding:12px 13px;font-size:16px;line-height:1.75;color:var(--ink);background:#fbfdfe;outline:none;transition:border-color .15s,box-shadow .15s}
.ep-textarea:focus{border-color:var(--brand2);box-shadow:0 0 0 3px rgba(47,127,181,.14)}
.ep-countrow{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin:7px 2px 12px}
.ep-actions{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
@media(min-width:680px){.ep-actions{grid-template-columns:2fr 1fr 1fr 1fr}}
.ep-btn{min-height:46px;border-radius:12px;border:1px solid var(--line);font-size:14px;font-weight:700;cursor:pointer;transition:transform .12s,box-shadow .12s,background .12s}
.ep-btn.primary{border:0;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;box-shadow:0 8px 18px rgba(28,90,134,.22)}
.ep-btn.primary:active{transform:translateY(1px)}
.ep-btn.ghost{background:#f6f9fb;color:var(--ink)}
.ep-btn:disabled{opacity:.6;cursor:wait}
.ep-link{border:0;background:none;color:var(--brand);font-size:12.5px;font-weight:600;min-height:44px;padding:0 4px;cursor:pointer}
.ep-result{margin-top:12px}
.ep-score{display:grid;grid-template-columns:1fr;gap:10px;padding:14px;border-radius:14px;border:1px solid #dbe9f2;background:linear-gradient(135deg,#f4f9fc,#fff)}
@media(min-width:600px){.ep-score{grid-template-columns:auto 1fr auto;align-items:center}}
.ep-score b{font-size:26px;color:var(--brand);line-height:1}
.ep-score b small{font-size:12px;color:var(--muted);font-weight:600}
.ep-score span{font-size:12px;color:var(--muted)}
.ep-bar{height:7px;border-radius:99px;background:#e6edf3;overflow:hidden}
.ep-bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--brand),var(--accent))}
.ep-source{display:inline-block;margin-top:5px;padding:3px 7px;border-radius:6px;background:#eaf3f8;color:var(--brand);font-size:10.5px;font-weight:700}
.ep-comment{margin-top:10px;font-size:13px;line-height:1.7;color:#395062;background:#f7fafc;border-left:3px solid var(--brand2);border-radius:8px;padding:10px 12px}
.ep-points{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.ep-point{border:1px solid var(--line);border-radius:11px;padding:10px 12px;background:#fff}
.ep-point.full{border-color:#cfe7d8;background:#f6fcf8}
.ep-point.partial{border-color:#f3dfbd;background:#fffbf3}
.ep-point.none{border-color:#f4d4d0;background:#fff8f7}
.ep-point-head{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:700;color:var(--muted)}
.ep-picon{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:800;background:#e9eef2;color:#43596a}
.ep-point.full .ep-picon{background:#d9f2e3;color:#177a45}
.ep-point.partial .ep-picon{background:#fbe8c8;color:#a25d0e}
.ep-point.none .ep-picon{background:#f8dcd7;color:#b03a2e}
.ep-pt{margin-left:auto;color:var(--ink)}
.ep-ptext{font-size:13px;line-height:1.65;color:var(--ink);margin-top:5px}
.ep-pnote{font-size:12px;line-height:1.55;color:var(--muted);margin-top:4px}
.ep-refcard{overflow-wrap:anywhere;word-break:break-word;border:1px solid var(--line);border-radius:14px;background:#fbfcfd;padding:14px}
.ep-refcard h4{font-size:13px;margin:0 0 8px;color:var(--brand)}
.ep-refcard ol{margin:0;padding-left:20px;font-size:13px;line-height:1.7;color:#334c5f}
.ep-cfg{border:1px dashed var(--line);border-radius:12px;padding:12px;margin-top:12px;background:#fafcfd}
.ep-cfg label{display:block;font-size:11.5px;font-weight:700;color:var(--muted);margin:8px 0 4px}
.ep-cfg input{width:100%;min-height:40px;border:1px solid var(--line);border-radius:9px;padding:0 10px;font-size:14px;background:#fff;color:var(--ink)}
.ep-cfg-note{font-size:11.5px;line-height:1.6;color:var(--muted);margin-top:8px}
.ep-toast{position:fixed;left:50%;bottom:86px;transform:translate(-50%,12px);background:#16384e;color:#fff;font-size:13px;padding:9px 14px;border-radius:10px;opacity:0;pointer-events:none;transition:.2s;z-index:1000;max-width:80vw;text-align:center}
.ep-toast.show{opacity:1;transform:translate(-50%,0)}
.ep-loading{font-size:13px;color:var(--muted);padding:10px 0}
.ep-empty{font-size:13px;line-height:1.8;color:var(--muted);text-align:center;padding:18px 8px}
@media(max-width:520px){
  .ep-hero{padding:16px 14px;border-radius:16px}
  .ep-hero h2{font-size:19px;margin:6px 0 4px}
  .ep-hero p{font-size:12.5px;line-height:1.6}
  .ep-stats{grid-template-columns:repeat(4,1fr);gap:6px;margin-top:12px}
  .ep-stat{padding:7px 8px;border-radius:9px}
  .ep-stat b{font-size:17px}
  .ep-stat span{font-size:10px;line-height:1.3}
  .ep-panel{padding:13px}
  .ep-card{padding:13px}
  .ep-q{font-size:16px}
  .ep-textarea{min-height:170px}
  .ep-actions{grid-template-columns:1fr 1fr}
  .ep-btn.primary{grid-column:1/-1}
  .ep-muted{display:none}
}


.ep-refans{overflow-wrap:anywhere;word-break:break-word;margin:8px 0 10px;padding:11px 12px;border-left:3px solid var(--brand2);background:#fff;border-radius:8px;font-size:14px;line-height:1.85;color:#2c4053;white-space:pre-wrap}

焊缝固态相变","type":"term","q":"熔滴过渡","ans":"焊条（焊丝）端部熔化的金属以滴状脱离焊丝端部、穿过电弧空间向熔池转移的过程。分为短路过渡、颗粒状过渡、喷射过渡等。","id":"q290","orig":-1},{"ch":"第三章","chname":"熔池凝固和焊缝固态相变","type":"term","q":"短路过渡","ans":"熔滴与熔池接触发生短路，靠短路电流的热量使熔滴颈缩断开而过渡的熔滴过渡形式。电弧稳定、飞溅小，适于薄板和全位置焊接。","id":"q291","orig":-1},{"ch":"第三章","chname":"熔池凝固和焊缝固态相变","type":"term","q":"喷射过渡","ans":"在一定电流（临界电流）以上，熔滴以细小液滴高速、稳定地沿轴向过渡的形式。电弧稳定、飞溅小、熔深大。","id":"q292","orig":-1},{"ch":"第三章","chname":"熔池凝固和焊缝固态相变","type":"term","q":"柱状晶","ans":"熔池结晶时，晶粒沿最大散热方向（垂直于熔合线方向）择优长大的柱状晶体。柱状晶越发达，焊缝塑韧性通常越低，且易产生中心偏析和热裂纹。","id":"q293","orig":-1,"figKey":"vc","figcap":"熔池俯视：熔合线 θ=90°、vc=0；中心 θ=0°、vc=v；焊速增大使柱状晶趋向垂直中心线。"},{"ch":"第三章","chname":"熔池凝固和焊缝固态相变","type":"term","q":"显微偏析","ans":"晶粒内部或晶界处化学成分不均匀的现象，产生于凝固过程中溶质再分配。严重时会导致晶界低熔点共晶和热裂纹。","id":"q294","orig":-1},{"ch":"第三章","chname":"熔池凝固和焊缝固态相变","type":"term","q":"成分过冷","ans":"合金凝固时，由于溶质富集使固液界面前沿液相的实际温度低于平衡液相线温度而产生的过冷现象。其他条件相同时，成分过冷增大，结晶形态由平面晶向胞状晶、树枝晶、等轴晶发展。","id":"q295","orig":-1,"figKey":"solidification","figcap":"成分过冷增大时结晶形态：平面→胞状→胞状树枝→树枝→等轴。"},{"ch":"第三章","chname":"熔池凝固和焊缝固态相变","type":"term","q":"非自发形核","ans":"熔池结晶时以现成表面（半熔化母材晶粒表面、悬浮质点等）为核心进行形核的方式。熔池结晶以非自发形核为主。","id":"q296","orig":-1},{"ch":"第四章","chname":"焊接热影响区的组织和性能","type":"mcq","q":"热影响区（HAZ）又称（　）","options":["熔合区","焊缝区","过热区","近缝区"],"ans":"D","id":"q72","orig":72,"ansText":"近缝区"},{"ch":"第四章","chname":"焊接热影响区的组织和性能","type":"mcq","q":"手工电弧焊时相变温度以上的高温停留时间约为（　）","options":["0.01～0.1s","30～100s","1～5min","4～20s"],"ans":"D","id":"q73","orig":73,"ansText":"4～20s"},{"ch":"第四章","chname":"焊接热影响区的组织和性能","type":"mcq","q":"埋弧自动焊时高温停留时间约为（　）","options":["4～20s","30～100s","1～2h","数秒"],"ans":"B","id":"q74","orig":74,"ansText":"30～100s"},{"ch":"第四章","chname":"焊接热影响区的组织和性能","type":"mcq","q":"焊接加热速度比热处理加热速度（　）","options":["略快","快几十至几百倍","基本相同","更慢"],"ans":"B","id":"q75","orig":75,"ansText":"快几十至几百倍"},{"ch":"第四章","chname":"焊接热影响区的组织和性能","type":"mcq","q":"加热速度增大时，扩散相变滞后，Ac1、Ac3及（Ac3-Ac1）将如何变化？","options":["降低","无规律","不变","升高"],"ans":"D","id":"q76","orig":76,"ans 再次加热（消除应力热处理或多层焊后层间再次受热）时，在热影响区粗晶区产生的沿晶裂纹，与沉淀强化元素（Cr、Mo、V等）和拘束应力有关。","id":"q305","orig":-1},{"ch":"第五章","chname":"焊接裂纹","type":"term","q":"层状撕裂","ans":"厚板T形、十字和角接接头在焊接收缩应力（z 向拉应力）作用下，沿轧制方向平行于板面的夹杂物（MnS 等）界面产生的阶梯状撕裂，宏观断口呈台阶状。","id":"q306","orig":-1},{"ch":"第五章","chname":"焊接裂纹","type":"term","q":"液化裂纹","ans":"焊接热循环作用下，母材或焊道中沿晶界分布的低熔点共晶（或晶界偏析物）重新熔化形成液态薄膜，在收缩应力作用下沿晶界开裂产生的裂纹，属热裂纹。","id":"q307","orig":-1,"figKey":"hot_crack","figcap":"液化裂纹：晶界低熔点共晶在焊接热循环下重新熔化，受拉应力开裂。"},{"ch":"第五章","chname":"焊接裂纹","type":"term","q":"应力腐蚀裂纹","ans":"焊接接头在腐蚀介质与拉应力共同作用下产生的延迟开裂。多发生在敏感材料与特定介质组合（如奥氏体不锈钢的Cl⁻环境）。","id":"q308","orig":-1},{"ch":"第五章","chname":"焊接裂纹","type":"term","q":"氢白点（鱼眼）","ans":"钢中氢含量过高时，氢在缺陷处聚集形成分子氢并产生高内压，使局部塑性下降；在焊缝断口上表现为圆形银白色斑点（白点/鱼眼），中心常有小气孔或夹渣。","id":"q309","orig":-1,"figKey":"hydrogen","figcap":"氢的存在形式与危害：扩散氢→氢脆/白点、H2 气孔、冷裂纹。"},{"ch":"第六章","chname":"钎焊","type":"fill","q":"钎焊通过液态钎料在母材表面或间隙中润湿、铺展、____填缝，凝固结晶后实现原子间结合。","ans":"毛细流动","id":"q203","orig":-1},{"ch":"第六章","chname":"钎焊","type":"mcq","q":"下列不属于钎焊基本过程的是（　）","options":["钎剂熔化及填缝","钎料熔化及填满钎缝","钎料同母材的相互作用","母材自身的固态相变"],"ans":"D","id":"q204","orig":-1,"ansText":"母材自身的固态相变"},{"ch":"第六章","chname":"钎焊","type":"mcq","q":"下列不属于钎焊优点的是（　）","options":["加热温度较低、对母材组织和性能影响小","工件变形小、易保证尺寸精度","生产率高、可一次焊成多条钎缝","接头强度总是高于母材"],"ans":"D","id":"q205","orig":-1,"ansText":"接头强度总是高于母材"},{"ch":"第六章","chname":"钎焊","type":"mcq","q":"润湿与不润湿的分界线是润湿角θ（　）","options":["=0°","=180°","=45°","=90°"],"ans":"D","id":"q206","orig":-1,"ansText":"=90°"},{"ch":"第六章","chname":"钎焊","type":"mcq","q":"大多数钎焊系统的润湿角θ取值范围为（　），θ小适于薄的接头。","options":["45~90°","10~45°","90~135°","0~5°"],"ans":"B","id":"q207","orig":-1,"ansText":"10~45°"},{"ch":"第六章","chname":"钎焊","type":"mcq","q":"下列不属于影响钎料毛细流动因素的是（　）","options":["毛细管驱动力","熔化金属的密度和黏度","接头几何形状","母材抗拉强度等级"],"ans":"D","id":"q208","orig":-1,"ansText":"母材抗拉强度等级"},{"ch":"第六章","chname":"钎焊","type":"mcq","q":"接头间隙对钎焊接头强度的影响：间隙较小时（　）","options":["强度低，易开裂","强度高，可超过母材","与母材强度无关","必然产生裂纹"],"ans":"B","id":"q209","orig":-1,"ansText":"强度高，可超过母材"},{"ch":"第六章","chname":"钎焊","type":"mcq","q":"按钎料熔点分类，软钎焊温度低于（　），硬钎焊高于该温度。","options":["450℃","550℃","800℃","950℃"],"ans":"A","id":"q210","orig":-1,"ansText":"450℃"},{"ch":"第六章","chname":"钎焊","type":"mcq","q":"下列不属于按热源种类和加热方法分类的钎焊方法是（　）","options":["火焰钎焊","炉中钎焊","感应钎焊","钎剂钎焊"],"ans":"D","id":"q211","orig":-1,"ansText":"钎剂钎焊"},{"ch":"第六章","chname":"钎焊","type":"mcq","q":"按接头形式特点分类，依靠毛细作用使液态钎料填缝的钎焊是（　）","options":["扩散钎焊","非毛细钎焊","毛细钎焊","接触反应钎焊"],"ans":"C","id":"q212","orig":-1,"ansText":"毛细钎焊"},{"ch":"第六章","chname":"钎焊","type":"mcq","q":"下列不属于火焰钎焊特点的是（　）","options":["在空气中完成、通常需要使用钎剂","设备初期投资低、操作技术容易掌握","可加工任何数量的接头","适用于高活性母材"],"ans":"D","id":"q213","orig":-1,"ansText":"适用于高活性母材"},{"ch":"第六章","chname":"钎焊","type":"fill","q":"按熔化温度和接头强度分类，熔点Tm>950℃的钎料称为____钎料。","ans":"高温","id":"q214","orig":-1},{"ch":"第六章","chname":"钎焊","type":"mcq","q":"下列不属于对钎料基本要求的是（　）","options":["熔点适当","润湿铺展好，能填满间隙","能与母材溶解扩散、冶金结合","熔点越高越好"],"ans":"D","id":"q215","orig":-1,"ansText":"熔点越高越好"},{"ch":"第六章","chname":"钎焊","type":"mcq","q":"下列不属于钎焊接头缺陷类型的是（　）","options":["钎缝不致密性","母材自裂","溶蚀","冷裂纹"],"ans":"D","id":"q216","orig":-1,"ansText":"冷裂纹"},{"ch":"第六章","chname":"钎焊","type":"mcq","q":"母材向钎料中溶解过度、在表面出现溶坑的钎焊缺陷是（　）","options":["母材自裂","未填满","溶蚀","气孔"],"ans":"C","id":"q217","orig":-1,"ansText":"溶蚀"},{"ch":"第六章","chname":"钎焊","type":"fill","q":"钎缝不致密性缺陷（气孔、夹渣、未填满）会降低密封性、降低接头强度和导电性，并____潮气造成接头腐蚀。","ans":"吸收（吸附）","id":"q218","orig":-1},{"ch":"第六章","chname":"钎焊","type":"term","q":"钎焊","ans":"利用熔点比母材低的钎料，加热熔化后润湿并填充母材间隙，靠液态钎料与固态母材之间的相互扩散形成钎焊接头的焊接方法。母材不熔化。","id":"q310","orig":-1,"figKey":"brazing","figcap":"钎焊靠钎料润湿、毛细填缝和冶金结合，母材不熔化。"},{"ch":"第六章","chname":"钎焊","type":"term","q":"润湿角（润湿性）","ans":"液态钎料在母材表面铺展时，钎料液滴与母材表面之间的接触角θ。θ越小，润湿铺展性越好（θ<90°为润湿）。","id":"q311","orig":-1,"figKey":"brazing","figcap":"润湿角 θ<90° 为润湿，θ 越小铺展越好；θ>90° 不润湿。"},{"ch":"第六章","chname":"钎焊","type":"term","q":"毛细作用（毛细现象）","ans":"液态钎料在母材间隙中依靠表面张力上升、填充间隙的现象。间隙越小毛细作用越强，但过小会阻碍钎料流动。","id":"q312","orig":-1,"figKey":"brazing","figcap":"毛细作用：间隙越小毛细压力越大，但间隙过小/钎料不足会填不满。"},{"ch":"第六章","chname":"钎焊","type":"term","q":"钎剂","ans":"钎焊时使用的能清除母材表面氧化物、保护母材和钎料不被氧化、并改善钎料润湿性的辅助材料（如硼砂、硼酸等）。","id":"q313","orig":-1},{"ch":"第六章","chname":"钎焊","type":"term","q":"钎料","ans":"钎焊时用于填充接头间隙、形成钎缝的金属或合金（熔点低于母材），如银基、铜基、铝基钎料。选择时需与母材匹配并考虑润湿性和强度。","id":"q314","orig":-1},{"id":"w01","ch":"第一章","chname":"第一章 焊接化学冶金","type":"essay","q":"分别叙述硫和磷对焊接的危害性及其控制措施。","ans":"硫：① 以 FeS 形式存在，液态互溶、固态基本不溶，偏析于晶界；与 Fe 形成 Fe+FeS 低熔点共晶（985℃），与 FeO 形成 Fe+FeO 共晶（940℃），高镍合金还有 NiS+Ni 共晶（644℃）。结晶后期晶界液膜在拉应力下开裂，即热裂纹（热脆）；C↑ 促进偏析。② 控制：限制母材、焊丝、药皮、焊剂含硫；冶金脱硫用 Mn（[FeS]+[Mn]→(MnS)+[Fe]，MnS 熔点 1610℃ 入渣，降温有利），或用 CaO/MgO 碱性氧化物脱硫。\n磷：① 以 Fe3P/Fe2P 存在，固态基本不溶，晶界形成 Fe+Fe3P 共晶（1050℃）或 Fe+Ni3P 共晶（880℃），引起冷脆和热裂，P 偏析严重。② 控制：限制来源；脱磷两步——先使 P 氧化成 P2O5，再与 CaO 生成稳定磷酸钙入渣（2[Fe3P]+5(FeO)+3CaO→(CaO)3·P2O5+11[Fe]）。碱性渣、低氢焊条有利于脱硫脱磷；同时控制 C、Ni 等促进偏析的元素。","anstext":"硫：① 以 FeS 形式存在，液态互溶、固态基本不溶，偏析于晶界；与 Fe 形成 Fe+FeS 低熔点共晶（985℃），与 FeO 形成 Fe+FeO 共晶（940℃），高镍合金还有 NiS+Ni 共晶（644℃）。结晶后期晶界液膜在拉应力下开裂，即热裂纹（热脆）；C↑ 促进偏析。② 控制：限制母材、焊丝、药皮、焊剂含硫；冶金脱硫用 Mn（[FeS]+[Mn]→(MnS)+[Fe]，MnS 熔点 1610℃ 入渣，降温有利），或用 CaO/MgO 碱性氧化物脱硫。\n磷：① 以 Fe3P/Fe2P 存在，固态基本不溶，晶界形成 Fe+Fe3P 共晶（1050℃）或 Fe+Ni3P 共晶（880℃），引起冷脆和热裂，P 偏析严重。② 控制：限制来源；脱磷两步——先使 P 氧化成 P2O5，再与 CaO 生成稳定磷酸钙入渣（2[Fe3P]+5(FeO)+3CaO→(CaO)3·P2O5+11[Fe]）。碱性渣、低氢焊条有利于脱硫脱磷；同时控制 C、Ni 等促进偏析的元素。","src":"真题","srcnote":"期中试题·简答1","full":10,"pts":[{"t":"硫以 FeS 形式偏析于晶界，形成 Fe+FeS（985℃）、Fe+FeO（940℃）低熔点共晶，结晶后期晶界液膜在拉应力下开裂，产生热裂纹（热脆）。","k":["FeS","985","940","热裂纹","晶界"]},{"t":"控硫：限制母材、焊丝、药皮、焊剂含硫；用 Mn 脱硫生成 MnS 入渣（[FeS]+[Mn]→(MnS)+[Fe]），或用 CaO/MgO 碱性氧化物脱硫。","k":["Mn","MnS","CaO","限制"]},{"t":"磷以 Fe3P/Fe2P 偏析于晶界，形成 Fe+Fe3P（1050℃）、Fe+Ni3P（880℃）低熔点共晶，引起冷脆和热裂。","k":["Fe3P","1050","880","冷脆","热裂"]},{"t":"控磷：限制来源；脱磷分两步，先使 P 氧化成 P2O5，再与 CaO 生成稳定磷酸钙入渣。","k":["P2O5","CaO","两步","脱磷"]},{"t":"碱性渣、低氢焊条有利于脱硫脱磷；C、Ni 等促进偏析的元素应控制。","k":["碱性","低氢","C","Ni"]}],"figKey":"hot_crack","figcap":"硫、磷在晶界形成低熔点共晶液膜，结晶后期受拉应力→热裂纹；图中标出 Fe+FeS 985℃、Fe+Fe3P 1050℃。","basis":"CHAP1 §3 硫、磷的危害；期中试题 简答1","orig":-1},{"id":"w02","ch":"第二章","chname":"第二章 焊接材料","type":"essay","q":"对比说明酸性焊条对焊缝金属的净化作用。","ans":"酸性焊条以 E4303（J422）为代表，渣系 TiO2-CaO-SiO2，B1=0.76，属酸性，气渣联合保护。其熔渣氧化性较强、FeO 活度高，扩散脱氧能力弱；酸性氧化物多，自由氧离子少，脱硫脱磷能力弱，主要靠 Mn 脱硫，脱磷靠 FeO+CaO 但效果有限；CaF2 少，去氢能力弱。因此焊缝中 O、H、S、P 含量较高，塑韧性较低。\n碱性焊条以 E5015（J507）为代表，渣系 CaF2-CaO-SiO2，B1=1.89，属碱性，氧化性小；CaO 等碱性氧化物脱硫脱磷强，CaF2 与 H/水反应生成 HF 去氢；焊缝 O、H、S、P 低，净化作用强，塑韧性好。\n结论：酸性焊条对焊缝金属的净化作用明显弱于碱性焊条；但酸性焊条稳弧、脱渣、成形好，成本低，一般结构常用；重要结构用碱性低氢焊条。","anstext":"酸性焊条以 E4303（J422）为代表，渣系 TiO2-CaO-SiO2，B1=0.76，属酸性，气渣联合保护。其熔渣氧化性较强、FeO 活度高，扩散脱氧能力弱；酸性氧化物多，自由氧离子少，脱硫脱磷能力弱，主要靠 Mn 脱硫，脱磷靠 FeO+CaO 但效果有限；CaF2 少，去氢能力弱。因此焊缝中 O、H、S、P 含量较高，塑韧性较低。\n碱性焊条以 E5015（J507）为代表，渣系 CaF2-CaO-SiO2，B1=1.89，属碱性，氧化性小；CaO 等碱性氧化物脱硫脱磷强，CaF2 与 H/水反应生成 HF 去氢；焊缝 O、H、S、P 低，净化作用强，塑韧性好。\n结论：酸性焊条对焊缝金属的净化作用明显弱于碱性焊条；但酸性焊条稳弧、脱渣、成形好，成本低，一般结构常用；重要结构用碱性低氢焊条。","src":"真题","srcnote":"期中试题·简答2 / 练习题2","full":15,"pts":[{"t":"酸性焊条以 E4303（J422）为代表，渣系 TiO2-CaO-SiO2，B1=0.76，属酸性，气渣联合保护。","k":["E4303","TiO2","0.76","酸性","气渣联合"]},{"t":"熔渣氧化性较强、FeO 活度高，扩散脱氧能力弱；酸性氧化物多，自由氧离子少，脱硫脱磷能力弱。","k":["氧化性","FeO","脱氧","脱硫","脱磷"]},{"t":"碱性焊条以 E5015（J507）为代表，B1=1.89，CaO 等碱性氧化物脱硫脱磷强，CaF2 与 H/水生成 HF 去氢。","k":["E5015","1.89","CaO","CaF2","HF"]},{"t":"碱性焊条焊缝 O、H、S、P 低，净化作用强，塑韧性好；酸性焊条焊缝 O、H、S、P 较高，塑韧性较低。","k":["O","H","S","P","塑韧性"]},{"t":"结论：酸性焊条净化作用明显弱于碱性焊条；但酸性焊条稳弧、脱渣、成形好，一般结构常用，重要结构用碱性低氢焊条。","k":["净化作用弱","工艺性","稳弧","重要结构"]}],"figKey":"acidbase","figcap":"酸性 E4303 与碱性 E5015 的渣系、碱度、氧化性、脱硫脱磷、去氢和塑韧性对比。","basis":"CHAP2 §1 典型焊条；期中试题 简答2；练习题2","orig":-1},{"id":"w03","ch":"第三章","chname":"第三章 熔池凝固和焊缝固态相变","type":"essay","q":"根据 16Mn 钢焊缝化学成分和冷却条件的不同，其固态相变组织可能有哪些？各自特征如何？","ans":"16Mn 为低合金高强钢（C≈0.16%、Mn≈1.4%），焊缝为低合金钢焊缝，固态相变可能出现铁素体、珠光体、贝氏体、马氏体四类组织，以铁素体为主。\n① 铁素体：先共析铁素体 PF（>750℃，沿原奥氏体晶界细条/块状）；侧板条铁素体 FSP（700~550℃，由晶界向晶内板条状，无碳贝氏体）；针状铁素体 AF（约500℃，晶内针状、以质点为核心放射状）；细晶铁素体 FGF（<500℃，晶内细小，450℃左右可转上贝氏体）。\n② 珠光体：Ar1~550℃ 扩散型转变，F+Fe3C 层状；焊接非平衡冷却时量少，慢冷/预热/后热时增多。\n③ 贝氏体：上贝氏体 Bu（550~500℃，羽毛状，条状 F 间夹渗碳体）；下贝氏体 BL（450℃~Ms，针状，强韧）；M-A 组元为富碳马氏体+残余奥氏体。\n④ 马氏体：含碳高或合金复杂、快冷到 Ms 以下；板条马氏体（低碳低合金，位错亚结构，强韧）；片状马氏体（C≥0.4%，孪晶，脆）。\n16Mn 常规焊态以 PF+FSP+AF+FGF 为主，少量 P；冷速加快→B 增多；更快→M；慢冷/预热→P 增多。","anstext":"16Mn 为低合金高强钢（C≈0.16%、Mn≈1.4%），焊缝为低合金钢焊缝，固态相变可能出现铁素体、珠光体、贝氏体、马氏体四类组织，以铁素体为主。\n① 铁素体：先共析铁素体 PF（>750℃，沿原奥氏体晶界细条/块状）；侧板条铁素体 FSP（700~550℃，由晶界向晶内板条状，无碳贝氏体）；针状铁素体 AF（约500℃，晶内针状、以质点为核心放射状）；细晶铁素体 FGF（<500℃，晶内细小，450℃左右可转上贝氏体）。\n② 珠光体：Ar1~550℃ 扩散型转变，F+Fe3C 层状；焊接非平衡冷却时量少，慢冷/预热/后热时增多。\n③ 贝氏体：上贝氏体 Bu（550~500℃，羽毛状，条状 F 间夹渗碳体）；下贝氏体 BL（450℃~Ms，针状，强韧）；M-A 组元为富碳马氏体+残余奥氏体。\n④ 马氏体：含碳高或合金复杂、快冷到 Ms 以下；板条马氏体（低碳低合金，位错亚结构，强韧）；片状马氏体（C≥0.4%，孪晶，脆）。\n16Mn 常规焊态以 PF+FSP+AF+FGF 为主，少量 P；冷速加快→B 增多；更快→M；慢冷/预热→P 增多。","src":"真题","srcnote":"期中试题·简答3","full":15,"pts":[{"t":"16Mn 为低合金高强钢（C≈0.16%、Mn≈1.4%），焊缝可能出现铁素体、珠光体、贝氏体、马氏体四类组织，以铁素体为主。","k":["16Mn","低合金","铁素体","珠光体","贝氏体","马氏体"]},{"t":"铁素体四类：PF（>750℃晶界）、FSP（700~550℃侧板条/无碳贝氏体）、AF（约500℃晶内针状）、FGF（<500℃细晶/贝氏铁素体）。","k":["PF","FSP","AF","FGF","750","500"]},{"t":"珠光体：Ar1~550℃扩散型转变，F+Fe3C 层状；焊接非平衡冷却时量少，慢冷/预热/后热时增多。","k":["珠光体","Ar1","550","层状","慢冷"]},{"t":"贝氏体：上贝 550~500℃羽毛状；下贝 450℃~Ms 针状强韧；M-A 组元为富碳马氏体+残余奥氏体。","k":["上贝","下贝","羽毛","针状","M-A","Ms"]},{"t":"马氏体：含碳高或合金复杂、快冷到 Ms 以下；板条马氏体（位错、强韧），片状马氏体（C≥0.4%、孪晶、脆）。","k":["马氏体","板条","片状","0.4","位错","孪晶"]}],"figKey":"cct","figcap":"16Mn 低合金钢焊缝 CCT 示意：冷速↑，组织由 F+P→B→M 转变；常规焊态以 PF+FSP+AF+FGF 为主。","basis":"CHAP3 §2 焊缝固态相变；期中试题 简答3","orig":-1},{"id":"w04","ch":"第二章","chname":"第二章 焊接材料","type":"essay","q":"解释焊条型号 E5515-N5 P U H10 的含义。","ans":"E5515-N5 P U H10：E—焊条；55—熔敷金属抗拉强度最小值 550MPa；15—药皮为碱性，适用于全位置焊接，直流反接；-N5—熔敷金属化学成分分类代号；P—焊后状态代号，P 为热处理态（无标记为焊态，AP 为焊态/焊后热处理态均可）；U—可选附加代号，规定温度下冲击吸收能量≥47J；H10—可选附加代号，熔敷金属扩散氢≤10mL/100g。","anstext":"E5515-N5 P U H10：E—焊条；55—熔敷金属抗拉强度最小值 550MPa；15—药皮为碱性，适用于全位置焊接，直流反接；-N5—熔敷金属化学成分分类代号；P—焊后状态代号，P 为热处理态（无标记为焊态，AP 为焊态/焊后热处理态均可）；U—可选附加代号，规定温度下冲击吸收能量≥47J；H10—可选附加代号，熔敷金属扩散氢≤10mL/100g。","src":"真题","srcnote":"期中试题·简答4(1)","full":6,"pts":[{"t":"E 表示焊条；55 表示熔敷金属抗拉强度最小值 550MPa。","k":["E","焊条","55","550"]},{"t":"15 表示药皮为碱性、适用于全位置焊接、直流反接；-N5 表示熔敷金属化学成分分类代号。","k":["15","碱性","全位置","直流反接","N5","化学成分"]},{"t":"P 表示焊后状态（P=热处理态，无标记=焊态，AP=两种状态均可）；U 表示规定温度下冲击吸收能量≥47J；H10 表示扩散氢≤10mL/100g。","k":["P","热处理","U","47","H10","10"]}],"figKey":"e5515","figcap":"按 GB/T 5117 逐段读焊条型号：E / 55 / 15 / -N5 / P / U / H10。","basis":"CHAP2 §1 焊条型号图；期中试题 简答4(1)","orig":-1},{"id":"w05","ch":"第二章","chname":"第二章 焊接材料","type":"essay","q":"分析 E4303（J422）焊条的冶金性能。","ans":"E4303（J422）为钛钙型酸性焊条，渣系 TiO2-CaO-SiO2，B1=0.76，气渣联合保护，抗拉强度≥430MPa，全位置焊接。\n冶金性能：① 氧化性较强，熔渣中 FeO 活度高，扩散脱氧弱；靠 Mn 先期+沉淀脱氧、Si 沉淀脱氧、C 脱氧，并有 Si/Mn 还原过渡。② 脱硫主要靠 Mn（[FeS]+[Mn]→[Fe]+(MnS)；[FeS]+(MnO)→[FeO]+(MnS)）；脱磷靠 P 氧化成 P2O5 后与 CaO 生成 3CaO·P2O5/4CaO·P2O5 入渣，能力有限。③ 合金化：锰铁主要脱氧脱硫，Mo、V、W 不易氧化、过渡好。④ 气孔敏感性：熔渣氧化性↑→CO 气孔↑；还原性↑→H2 气孔↑。\n性能：工艺性好，稳弧、飞溅小、脱渣易、成形美观，发尘量少；但焊缝 O、S、P 较高，塑韧性低于碱性焊条。用于一般低碳钢/低合金钢结构；重要结构应选 E5015 等碱性低氢焊条。","anstext":"E4303（J422）为钛钙型酸性焊条，渣系 TiO2-CaO-SiO2，B1=0.76，气渣联合保护，抗拉强度≥430MPa，全位置焊接。\n冶金性能：① 氧化性较强，熔渣中 FeO 活度高，扩散脱氧弱；靠 Mn 先期+沉淀脱氧、Si 沉淀脱氧、C 脱氧，并有 Si/Mn 还原过渡。② 脱硫主要靠 Mn（[FeS]+[Mn]→[Fe]+(MnS)；[FeS]+(MnO)→[FeO]+(MnS)）；脱磷靠 P 氧化成 P2O5 后与 CaO 生成 3CaO·P2O5/4CaO·P2O5 入渣，能力有限。③ 合金化：锰铁主要脱氧脱硫，Mo、V、W 不易氧化、过渡好。④ 气孔敏感性：熔渣氧化性↑→CO 气孔↑；还原性↑→H2 气孔↑。\n性能：工艺性好，稳弧、飞溅小、脱渣易、成形美观，发尘量少；但焊缝 O、S、P 较高，塑韧性低于碱性焊条。用于一般低碳钢/低合金钢结构；重要结构应选 E5015 等碱性低氢焊条。","src":"真题","srcnote":"期中试题·简答4(2)","full":15,"pts":[{"t":"E4303（J422）为钛钙型酸性焊条，渣系 TiO2-CaO-SiO2，B1=0.76，气渣联合保护，抗拉强度≥430MPa，全位置焊接。","k":["E4303","钛钙","TiO2","0.76","430","全位置"]},{"t":"氧化性较强、FeO 活度高，扩散脱氧弱；靠 Mn 先期+沉淀脱氧、Si 沉淀脱氧、C 脱氧，并有 Si/Mn 还原过渡。","k":["氧化性","FeO","Mn","Si","C","还原"]},{"t":"脱硫主要靠 Mn；脱磷靠 P 氧化成 P2O5 后与 CaO 生成磷酸钙入渣，能力有限。","k":["Mn","脱硫","P2O5","CaO","脱磷"]},{"t":"合金化：锰铁主要脱氧脱硫，Mo、V、W 不易氧化、过渡好；熔渣氧化性↑→CO 气孔↑，还原性↑→H2 气孔↑。","k":["Mo","V","W","CO","H2"]},{"t":"工艺性好：稳弧、飞溅小、脱渣易、成形美观、发尘少；但焊缝 O、S、P 较高，塑韧性低于碱性焊条，用于一般结构。","k":["工艺性","稳弧","脱渣","塑韧性","一般结构"]}],"figKey":"acidbase","figcap":"酸性 E4303（J422）与碱性 E5015（J507）的净化能力和工艺性对比。","basis":"CHAP2 §1 E4303；期中试题 简答4(2)","orig":-1},{"id":"w06","ch":"第一章","chname":"第一章 焊接化学冶金","type":"essay","q":"简述 Mn、Si、Nb、V、Mo 五种元素对焊缝性能的影响。","ans":"① Mn：脱氧、脱硫；使硫以 MnS 代替低熔点 FeS 薄膜，改善硫化物形态；固溶强化，提高强度。Mn/S 比需按含碳量控制，过量 Mn 会增加淬硬倾向。\n② Si：脱氧剂，固溶强化，δ 相形成元素，利于消除结晶裂纹；但 Si>0.4% 易形成低熔点硅酸盐夹杂，热裂倾向增大；Si 还降低氢在钢中的溶解度。\n③ Nb：强碳化物形成元素，形成比 Fe3C 更稳定的 NbC，细化晶粒、沉淀强化、提高强度；但增加再热裂纹敏感性。\n④ V：强碳化物形成元素，V(C,N) 细化晶粒、沉淀强化；V+N→VN 可消除氮的时效脆化；同样增加再热裂纹敏感性。\n⑤ Mo：碳化物形成元素，提高淬透性、热强性和抗回火软化能力；Mo、V、W 不易氧化、过渡系数高；但增加再热裂纹敏感性。\n总纲：微量合金化以细化晶粒+沉淀强化为主；Nb、V、Mo 会增加再热裂纹敏感性、应控制，Si 控≤0.4%，Mn/S 比按 C 匹配。","anstext":"① Mn：脱氧、脱硫；使硫以 MnS 代替低熔点 FeS 薄膜，改善硫化物形态；固溶强化，提高强度。Mn/S 比需按含碳量控制，过量 Mn 会增加淬硬倾向。\n② Si：脱氧剂，固溶强化，δ 相形成元素，利于消除结晶裂纹；但 Si>0.4% 易形成低熔点硅酸盐夹杂，热裂倾向增大；Si 还降低氢在钢中的溶解度。\n③ Nb：强碳化物形成元素，形成比 Fe3C 更稳定的 NbC，细化晶粒、沉淀强化、提高强度；但增加再热裂纹敏感性。\n④ V：强碳化物形成元素，V(C,N) 细化晶粒、沉淀强化；V+N→VN 可消除氮的时效脆化；同样增加再热裂纹敏感性。\n⑤ Mo：碳化物形成元素，提高淬透性、热强性和抗回火软化能力；Mo、V、W 不易氧化、过渡系数高；但增加再热裂纹敏感性。\n总纲：微量合金化以细化晶粒+沉淀强化为主；Nb、V、Mo 会增加再热裂纹敏感性、应控制，Si 控≤0.4%，Mn/S 比按 C 匹配。","src":"真题","srcnote":"期中试题·简答5","full":15,"pts":[{"t":"Mn：脱氧、脱硫，使硫以 MnS 代替低熔点 FeS 薄膜，改善硫化物形态，提高强度；Mn/S 比按 C 控制，过量增加淬硬倾向。","k":["Mn","脱氧","脱硫","MnS","Mn/S","淬硬"]},{"t":"Si：脱氧、固溶强化、δ 相形成，利于抗热裂；但 Si>0.4% 易形成低熔点硅酸盐夹杂，热裂↑，并降低 H 溶解度。","k":["Si","脱氧","δ","0.4","硅酸盐","热裂"]},{"t":"Nb：强碳化物形成元素，NbC 比 Fe3C 稳定，细化晶粒、沉淀强化、提高强度；但增加再热裂纹敏感性。","k":["Nb","NbC","细化晶粒","沉淀强化","再热裂纹"]},{"t":"V：强碳化物形成元素，V(C,N) 细化晶粒、沉淀强化；V+N→VN 消除氮时效脆化；增加再热裂纹敏感性。","k":["V","V(C,N)","细化晶粒","VN","再热裂纹"]},{"t":"Mo：碳化物形成元素，提高淬透性、热强性、抗回火软化；Mo/V/W 不易氧化、过渡系数高；增加再热裂纹敏感性。","k":["Mo","淬透性","热强性","回火","再热裂纹"]}],"figKey":"alloy","figcap":"五种元素的主作用与注意点：Mn/Si 偏净化与固溶，Nb/V/Mo 偏细化晶粒/沉淀强化，但都需防再热裂纹。","basis":"CHAP1 §3/§4、CHAP5 再热裂纹；期中试题 简答5","orig":-1},{"id":"w07","ch":"第二章","chname":"第二章 焊接材料","type":"essay","q":"焊条工艺性能包括哪几个方面？影响因素有哪些？","ans":"焊条工艺性能包括：① 电弧稳定性——不断弧、不飘移、抗磁偏吹；稳弧剂含 K/Na 低电离位元素，CaF2 电离势高会降低稳弧性。② 焊缝成形——表面光滑、波纹细密、几何尺寸和余高合格、无咬边；受熔渣凝固温度、粘度、表面张力影响（1500℃ 粘度 0.1~0.2Pa·s，表面张力 0.3~0.4N/m）。③ 全位置焊接性——立、仰、横焊时熔滴和熔渣不下流；短渣（凝固温度范围窄）有利，氧化铁型长渣不适应。④ 飞溅——粘度↑、电流↑、药皮水分↑、电压↑、交流、大颗粒过渡均增大飞溅。⑤ 脱渣性——熔渣与金属线膨胀系数差越大越好；氧化性太强难脱；渣松脆易脱；钛型最好、低氢最差。⑥ 熔化速度——用熔化系数 αp；考虑飞溅用熔敷系数 αH=αp(1-ψ)。⑦ 药皮发红——后半段药皮温升过高发红开裂脱落，与焊芯电阻、熔化系数、电阻热有关。⑧ 焊接烟尘——锰中毒、氟中毒；低氢焊条烟尘含氟10%以上。","anstext":"焊条工艺性能包括：① 电弧稳定性——不断弧、不飘移、抗磁偏吹；稳弧剂含 K/Na 低电离位元素，CaF2 电离势高会降低稳弧性。② 焊缝成形——表面光滑、波纹细密、几何尺寸和余高合格、无咬边；受熔渣凝固温度、粘度、表面张力影响（1500℃ 粘度 0.1~0.2Pa·s，表面张力 0.3~0.4N/m）。③ 全位置焊接性——立、仰、横焊时熔滴和熔渣不下流；短渣（凝固温度范围窄）有利，氧化铁型长渣不适应。④ 飞溅——粘度↑、电流↑、药皮水分↑、电压↑、交流、大颗粒过渡均增大飞溅。⑤ 脱渣性——熔渣与金属线膨胀系数差越大越好；氧化性太强难脱；渣松脆易脱；钛型最好、低氢最差。⑥ 熔化速度——用熔化系数 αp；考虑飞溅用熔敷系数 αH=αp(1-ψ)。⑦ 药皮发红——后半段药皮温升过高发红开裂脱落，与焊芯电阻、熔化系数、电阻热有关。⑧ 焊接烟尘——锰中毒、氟中毒；低氢焊条烟尘含氟10%以上。","src":"课后","srcnote":"复习题2-1 / 练习题6","full":10,"pts":[{"t":"电弧稳定性：不断弧、不飘移、抗磁偏吹；稳弧剂含 K/Na 低电离位元素，CaF2 电离势高会降低稳弧性。","k":["电弧稳定性","稳弧剂","K","Na","CaF2"]},{"t":"焊缝成形与全位置焊接性：熔渣凝固温度、粘度、表面张力决定成形；短渣（凝固温度范围窄）适应立/仰/横焊，氧化铁型长渣不适应。","k":["焊缝成形","粘度","表面张力","短渣","全位置"]},{"t":"飞溅、脱渣性、熔化速度：粘度↑/电流↑/水分↑/电压↑/交流/大颗粒过渡使飞溅↑；线膨胀系数差大、渣松脆易脱渣；用 αp、αH=αp(1-ψ) 表征熔化/熔敷。","k":["飞溅","脱渣","αp","αH","线膨胀"]},{"t":"药皮发红与焊接烟尘：后半段药皮温升过高发红开裂；焊芯电阻大、熔化系数小、电阻热多；烟尘有锰中毒、氟中毒，低氢焊条烟尘含氟10%以上。","k":["药皮发红","电阻","烟尘","锰","氟"]}],"figKey":"coating","figcap":"药皮七类组分与焊条工艺性能的关系；稳弧、造渣、造气、脱氧、合金、粘结、增塑共同决定工艺与冶金性能。","basis":"CHAP2 §1 焊条工艺性能；复习题2-1 / 练习题6","orig":-1},{"id":"w08","ch":"第一章","chname":"第一章 焊接化学冶金","type":"essay","q":"简述焊缝金属的脱氧途径。","ans":"① 先期脱氧：药皮固态加热阶段，Al、Ti、Mn 等对氧亲和力大，先与药皮中高价氧化物/碳酸盐分解产物反应，如 Fe2O3+Mn→MnO+2FeO、2CaCO3+Ti→2CaO+TiO2+2CO；Al、Ti 大部分烧损，产物进入熔渣。\n② 沉淀脱氧：熔滴和熔池中，脱氧剂与 [FeO] 直接反应，产物上浮入渣：[Mn]+[FeO]→[Fe]+(MnO)；[Si]+2[FeO]→2[Fe]+(SiO2)；Mn-Si 联合时 (MnO)+(SiO2)→(MnO·SiO2)，密度小、熔点低，易上浮。\n③ 扩散脱氧：[FeO]→(FeO)，温度降低有利，主要在熔池后部；酸性渣中 SiO2、TiO2 与 FeO 生成复合物，降低 FeO 活度，有利于扩散脱氧；碱性渣 FeO 活度高，扩散脱氧较差。\n实际以先期+沉淀为主，扩散为辅。","anstext":"① 先期脱氧：药皮固态加热阶段，Al、Ti、Mn 等对氧亲和力大，先与药皮中高价氧化物/碳酸盐分解产物反应，如 Fe2O3+Mn→MnO+2FeO、2CaCO3+Ti→2CaO+TiO2+2CO；Al、Ti 大部分烧损，产物进入熔渣。\n② 沉淀脱氧：熔滴和熔池中，脱氧剂与 [FeO] 直接反应，产物上浮入渣：[Mn]+[FeO]→[Fe]+(MnO)；[Si]+2[FeO]→2[Fe]+(SiO2)；Mn-Si 联合时 (MnO)+(SiO2)→(MnO·SiO2)，密度小、熔点低，易上浮。\n③ 扩散脱氧：[FeO]→(FeO)，温度降低有利，主要在熔池后部；酸性渣中 SiO2、TiO2 与 FeO 生成复合物，降低 FeO 活度，有利于扩散脱氧；碱性渣 FeO 活度高，扩散脱氧较差。\n实际以先期+沉淀为主，扩散为辅。","src":"课后","srcnote":"复习题2-2 / 练习题7","full":6,"pts":[{"t":"先期脱氧：药皮固态加热阶段，Al、Ti、Mn 与高价氧化物/碳酸盐分解产物反应，Al、Ti 大部分烧损。","k":["先期脱氧","药皮","Al","Ti","烧损"]},{"t":"沉淀脱氧：熔滴和熔池中，[Mn]/[Si] 与 [FeO] 直接反应，生成 MnO、SiO2 或 MnO·SiO2 上浮入渣。","k":["沉淀脱氧","Mn","Si","FeO","上浮"]},{"t":"扩散脱氧：[FeO]→(FeO)，降温有利；酸性渣 SiO2/TiO2 降低 FeO 活度，有利于扩散脱氧；碱性渣 FeO 活度高，效果差。","k":["扩散脱氧","酸性渣","FeO活度","碱性渣"]}],"figKey":"deox","figcap":"三条脱氧途径按反应区排列：药皮反应区先期→熔滴/熔池沉淀→熔池后部扩散。","basis":"CHAP1 §3 脱氧；复习题2-2 / 练习题7","orig":-1},{"id":"w09","ch":"第三章","chname":"第三章 熔池凝固和焊缝固态相变","type":"essay","q":"说明焊接速度对结晶速度和结晶方向的影响。","ans":"结晶线速度 vc=v cosθ，θ 为 vc 与焊接速度 v 的夹角。熔合线处 θ=90°，vc=0；熔池中心 θ=0°，vc=v 最大。\n焊接速度 v 增大→θ 增大→柱状晶成长方向趋向垂直于焊缝中心线，焊缝中心易产生热裂纹；v 减小→θ 减小→柱状晶偏向焊接方向，熔合线附近为胞状/胞状树枝晶，中心为较细的胞状树枝晶，抗裂性改善。\n实际焊接通过调节焊速控制柱状晶方向和组织。","anstext":"结晶线速度 vc=v cosθ，θ 为 vc 与焊接速度 v 的夹角。熔合线处 θ=90°，vc=0；熔池中心 θ=0°，vc=v 最大。\n焊接速度 v 增大→θ 增大→柱状晶成长方向趋向垂直于焊缝中心线，焊缝中心易产生热裂纹；v 减小→θ 减小→柱状晶偏向焊接方向，熔合线附近为胞状/胞状树枝晶，中心为较细的胞状树枝晶，抗裂性改善。\n实际焊接通过调节焊速控制柱状晶方向和组织。","src":"课后","srcnote":"复习题2-3 / 练习题8","full":6,"pts":[{"t":"结晶线速度 vc=v cosθ，θ 为 vc 与焊接速度 v 的夹角；熔合线 θ=90°，vc=0；熔池中心 θ=0°，vc=v 最大。","k":["vc","cos","熔合线","90","中心"]},{"t":"焊速 v 增大→θ 增大→柱状晶趋向垂直于焊缝中心线，焊缝中心易产生热裂纹。","k":["焊速","θ","柱状晶","垂直","热裂纹"]},{"t":"v 减小→θ 减小→柱状晶偏向焊接方向，熔合线附近胞状/胞状树枝，中心为较细的胞状树枝晶，抗裂性改善。","k":["减小","偏向","胞状","抗裂"]}],"figKey":"vc","figcap":"熔池俯视：熔合线 θ=90°、vc=0；中心 θ=0°、vc=v。焊速增大使柱状晶趋向垂直中心线。","basis":"CHAP3 §1 结晶线速度；复习题2-3 / 练习题8","orig":-1},{"id":"w10","ch":"第三章","chname":"第三章 熔池凝固和焊缝固态相变","type":"essay","q":"焊接气孔有哪些危害？如何防治？","ans":"危害：气孔减小承载截面积；成串/密集气孔比单个气孔危险；承载面积减小 10% 时疲劳强度可下降约 50%；气孔周围应力集中，降低塑韧性、致密性和耐蚀/密封性。\n类型：H2 气孔多在表面，断面喇叭口/螺钉状、内壁光滑；N2 气孔多在表面，蜂窝状成堆；CO 气孔在内部，条虫/蠕虫状，沿柱状晶分布。\n机理：液态金属过饱和气体→生核→长大→上浮；θ<90° 易浮出，θ>90° 且结晶速度大时残留；R 大、粘度大、气泡半径小都不利上浮。\n冶金防治：清理铁锈/油污/水分，焊条焊剂烘干；控制熔渣氧化性（氧化性大 CO↑，还原性大 H2↑）；CaF2、SiO2 降低氢气孔；脱氧脱氮。\n工艺防治：合适电流/电压/焊速；加强保护防 N2；直流反接优于正接/交流；短弧、摆动、焊前清理。","anstext":"危害：气孔减小承载截面积；成串/密集气孔比单个气孔危险；承载面积减小 10% 时疲劳强度可下降约 50%；气孔周围应力集中，降低塑韧性、致密性和耐蚀/密封性。\n类型：H2 气孔多在表面，断面喇叭口/螺钉状、内壁光滑；N2 气孔多在表面，蜂窝状成堆；CO 气孔在内部，条虫/蠕虫状，沿柱状晶分布。\n机理：液态金属过饱和气体→生核→长大→上浮；θ<90° 易浮出，θ>90° 且结晶速度大时残留；R 大、粘度大、气泡半径小都不利上浮。\n冶金防治：清理铁锈/油污/水分，焊条焊剂烘干；控制熔渣氧化性（氧化性大 CO↑，还原性大 H2↑）；CaF2、SiO2 降低氢气孔；脱氧脱氮。\n工艺防治：合适电流/电压/焊速；加强保护 ch","figcap":"易淬火钢 HAZ：完全淬火区（粗大 M）→不完全淬火区（M+F）→回火区（软化）→母材。","basis":"CHAP4 §3 易淬火钢 HAZ；复习题2-5 / 练习题10","orig":-1},{"id":"w12","ch":"第二章","chname":"第二章 焊接材料","type":"essay","q":"按功能划分，举例说明焊条药皮有哪些组成？","ans":"按功能分七类：① 稳弧剂——含低电离位元素，如 K2CO3、大理石、长石、金红石；② 造渣剂——钛铁矿、金红石、大理石、石英砂、长石、云母、萤石；③ 造气剂——木粉、淀粉、大理石、菱苦土；④ 脱氧剂——锰铁、钛铁、硅铁、铝粉；⑤ 合金剂——锰铁、硅铁、钼铁；⑥ 粘结剂——钠水玻璃、钾钠水玻璃；⑦ 增塑剂——白泥、云母、钛白粉、糊精。\n药皮作用：机械保护、冶金处理（脱氧、脱硫磷、去氢、合金化）、改善工艺性能。","anstext":"按功能分七类：① 稳弧剂——含低电离位元素，如 K2CO3、大理石、长石、金红石；② 造渣剂——钛铁矿、金红石、大理石、石英砂、长石、云母、萤石；③ 造气剂——木粉、淀粉、大理石、菱苦土；④ 脱氧剂——锰铁、钛铁、硅铁、铝粉；⑤ 合金剂——锰铁、硅铁、钼铁；⑥ 粘结剂——钠水玻璃、钾钠水玻璃；⑦ 增塑剂——白泥、云母、钛白粉、糊精。\n药皮作用：机械保护、冶金处理（脱氧、脱硫磷、去氢、合金化）、改善工艺性能。","src":"课后","srcnote":"练习题1","full":12,"pts":[{"t":"稳弧剂：含低电离位元素，如 K2CO3、大理石、长石、金红石。","k":["稳弧剂","K2CO3","长石","金红石"]},{"t":"造渣剂：钛铁矿、金红石、大理石、石英砂、长石、云母、萤石。","k":["造渣剂","钛铁矿","石英砂","萤石"]},{"t":"造气剂：木粉、淀粉、大理石、菱苦土。","k":["造气剂","木粉","淀粉","大理石"]},{"t":"脱氧剂与合金剂：锰铁、钛铁、硅铁、铝粉；锰铁、硅铁、钼铁。","k":["脱氧剂","锰铁","钛铁","硅铁","合金剂","钼铁"]},{"t":"粘结剂与增塑剂：钠水玻璃、钾钠水玻璃；白泥、云母、钛白粉、糊精。","k":["粘结剂","水玻璃","增塑剂","白泥","糊精"]},{"t":"药皮作用：机械保护、冶金处理（脱氧、脱硫磷、去氢、合金化）、改善工艺性能。","k":["机械保护","冶金处理","脱氧","合金化","工艺性能"]}],"figKey":"coating","figcap":"焊条药皮七类组分：稳弧、造渣、造气、脱氧、合金、粘结、增塑。","basis":"CHAP2 §1 药皮组成；练习题1","orig":-1},{"id":"w13","ch":"第一章","chname":"第一章 焊接化学冶金","type":"essay","q":"论述氧化性气体对金属的氧化作用。","ans":"焊接区氧化性气体主要有 O2、CO2、H2O，以及活性熔渣。判断方向：{pO2}>pO2* 氧化，=平衡，<还原。\n① 自由氧：Fe+1/2O2→FeO；C+1/2O2→CO；Si、Mn 氧化生成 SiO2、MnO，可能夹渣。\n② CO2：CO2+[Fe]→CO+[FeO]，温度升高反应向右，氧化性增强；可用 Si、Mn 脱氧；CO 不溶于液态金属，可能形成 CO 气孔。\n③ H2O：H2O+[Fe]→H2+[FeO]，温度升高氧化性增强，同时增氢，兼有氢气孔/冷裂纹风险。\n后果：强度、塑韧性下降；CO 气孔、飞溅；有益合金元素烧损。控制：限制氧源（烘干、清理、保护），冶金脱氧（Mn、Si、Ti、Al），合适 I/U（U↑ 含氧↑，I↑ 含氧↓）。","anstext":"焊接区氧化性气体主要有 O2、CO2、H2O，以及活性熔渣。判断方向：{pO2}>pO2* 氧化，=平衡，<还原。\n① 自由氧：Fe+1/2O2→FeO；C+1/2O2→CO；Si、Mn 氧化生成 SiO2、MnO，可能夹渣。\n② CO2：CO2+[Fe]→CO+[FeO]，温度升高反应向右，氧化性增强；可用 Si、Mn 脱氧；CO 不溶于液态金属，可能形成 CO 气孔。\n③ H2O：H2O+[Fe]→H2+[FeO]，温度升高氧化性增强，同时增氢，兼有氢气孔/冷裂纹风险。\n后果：强度、塑韧性下降；CO 气孔、飞溅；有益合金元素烧损。控制：限制氧源（烘干、清理、保护），冶金脱氧（Mn、Si、Ti、Al），合适 I/U（U↑ 含氧↑，I↑ 含氧↓）。","src":"课后","srcnote":"练习题3","full":8,"pts":[{"t":"氧化性气体主要有 O2、CO2、H2O 及活性熔渣；判据：{pO2}>pO2* 氧化，=平衡，<还原。","k":["O2","CO2","H2O","pO2","氧化"]},{"t":"自由氧：Fe+1/2O2→FeO；C+1/2O2→CO；Si、Mn 氧化生成 SiO2、MnO，可能夹渣。","k":["Fe","O2","CO","Si","Mn"]},{"t":"CO2：CO2+[Fe]→CO+[FeO]，T↑ 向右、氧化性↑；可用 Si、Mn 脱氧；CO 不溶于液态金属→CO 气孔。","k":["CO2","CO","FeO","气孔"]},{"t":"H2O：H2O+[Fe]→H2+[FeO]，T↑ 氧化性↑，同时增氢；后果：强度塑韧性↓、CO 气孔/飞溅、合金烧损；控制：限制氧源、冶金脱氧、合适 I/U。","k":["H2O","H2","增氢","塑韧性","脱氧"]}],"figKey":"oxidation","figcap":"氧化判据与 O2、CO2、H2O 三条氧化路径；H2O 同时增氢，CO2 可能带来 CO 气孔。","basis":"CHAP1 §2 氧的作用；练习题3","orig":-1},{"id":"w14","ch":"第一章","chname":"第一章 焊接化学冶金","type":"essay","q":"论述氢对焊接质量的影响及控制措施。","ans":"来源：药皮/焊剂/药芯水分、含氢有机物、空气水分、焊丝和工件表面油锈水。\n存在形式：扩散氢（原子/质子，可自由扩散）；残余氢（分子，聚集于晶格缺陷/裂纹/夹杂边缘，不能自由扩散）；总氢=扩散氢+残余氢，放置时间延长扩散氢减少、残余氢增多。\n危害：① 氢脆——室温附近塑性严重下降，加载快时不明显；② 白点/鱼眼——直径 0.5~3mm，中心有气孔/夹渣，外围塑性断裂痕迹，碳钢及 Cr/Ni/Mo 合金化焊缝敏感；③ 气孔——H2 表面喇叭口；④ 冷裂纹/延迟裂纹——三要素 H+M+R。\n控制：限制氢源（烘干：有机物≤200℃、碳酸盐≤450℃；清理油锈）；冶金（CaF2 与 H 生成 HF、控制氧化势、脱氢处理）；工艺参数；焊后脱氢 350℃×1h 或 250℃×6h；重要焊缝选奥氏体焊缝（D 最小）。","anstext":"来源：药皮/焊剂/药芯水分、含氢有机物、空气水分、焊丝和工件表面油锈水。\n存在形式：扩散氢（原子/质子，可自由扩散）；残余氢（分子，聚集于晶格缺陷/裂纹/夹杂边缘，不能自由扩散）；总氢=扩散氢+残余氢，放置时间延长扩散氢减少、残余氢增多。\n危害：① 氢脆——室温附近塑性严重下降，加载快时不明显；② 白点/鱼眼——直径 0.5~3mm，中心有气孔/夹渣，外围塑性断裂痕迹，碳钢及 Cr/Ni/Mo 合金化焊缝敏感；③ 气孔——H2 表面喇叭口；④ 冷裂纹/延迟裂纹——三要素 H+M+R。\n控制：限制氢源（烘干：有机物≤200℃、碳酸盐≤450℃；清理油锈）；冶金（CaF2 与 H 生成 HF、控制氧化势、脱氢处理）；工艺参数；焊后脱氢 350℃×1h 或 250℃×6h；重要焊缝选奥氏体焊缝（D 最小）。","src":"课后","srcnote":"练习题4","full":10,"pts":[{"t":"氢源：药皮/焊剂/药芯水分、含氢有机物、空气水分、焊丝和工件表面油锈水。","k":["药皮","焊剂","水分","有机物","油锈"]},{"t":"存在形式：扩散氢（原子/质子，可自由扩散）；残余氢（分子，聚集于缺陷，不能自由扩散）；总氢=扩散+残余。","k":["扩散氢","残余氢","总氢","缺陷"]},{"t":"危害：氢脆（室温塑性↓）；白点/鱼眼（0.5~3mm，中心气孔/夹渣）；H2 气孔；冷裂纹/延迟裂纹（H+M+R）。","k":["氢脆","白点","鱼眼","气孔","冷裂纹","H","M","R"]},{"t":"控制：限制氢源（烘干：有机物≤200℃、碳酸盐≤450℃；清理油锈）；CaF2 与 H 生成 HF；控制氧化势、脱氢处理。","k":["烘干","200","450","CaF2","HF","脱氢"]},{"t":"焊后脱氢 350℃×1h 或 250℃×6h；重要焊缝选奥氏体焊缝（D 最小）。","k":["350","1h","250","6h","奥氏体"]}],"figKey":"hydrogen","figcap":"氢源→扩散氢→氢脆/白点、H2 气孔、冷裂纹（H+M+R）；下方为烘干、CaF2 去氢和焊后脱氢措施。","basis":"CHAP1 §2 氢；练习题4","orig":-1},{"id":"w15","ch":"第一章","chname":"第一章 焊接化学冶金","type":"essay","q":"焊缝金属合金化的目的是什么？","ans":"① 补偿合金元素在焊接过程中的烧损、蒸发和飞溅损失；② 消除焊接缺陷、改善组织和性能——脱氧、细化晶粒、提高强度塑韧性、抗裂性；③ 获得具有特殊性能的堆焊金属，如耐磨、耐蚀、耐热。\n方式：合金焊丝/带极、药芯焊丝/药芯焊条、合金药皮/焊剂、合金粉末。\n过渡系数 η=熔敷金属中某合金含量/焊接材料中该合金总量；元素越活泼、沸点越低，η 越小；合金含量↑、粒度↑、药皮氧化势↓、Kb↓、I↓、氩弧焊，η 增大。","anstext":"① 补偿合金元素在焊接过程中的烧损、蒸发和飞溅损失；② 消除焊接缺陷、改善组织和性能——脱氧、细化晶粒、提高强度塑韧性、抗裂性；③ 获得具有特殊性能的堆焊金属，如耐磨、耐蚀、耐热。\n方式：合金焊丝/带极、药芯焊丝/药芯焊条、合金药皮/焊剂、合金粉末。\n过渡系数 η=熔敷金属中某合金含量/焊接材料中该合金总量；元素越活泼、沸点越低，η 越小；合金含量↑、粒度↑、药皮氧化势↓、Kb↓、I↓、氩弧焊，η 增大。","src":"课后","srcnote":"练习题5","full":6,"pts":[{"t":"补偿合金元素在焊接过程中的烧损、蒸发和飞溅损失。","k":["补偿","烧损","蒸发","飞溅"]},{"t":"消除焊接缺陷、改善组织和性能：脱氧、细化晶粒、提高强度塑韧性、抗裂性。","k":["脱氧","细化晶粒","强度","塑韧性","抗裂"]},{"t":"获得特殊性能堆焊金属（耐磨、耐蚀、耐热）；方式有合金焊丝/带极、药芯焊丝/药芯焊条、合金药皮/焊剂、合金粉末。","k":["耐磨","耐蚀","耐热","焊丝","药芯","药皮","粉末"]}],"figKey":"alloy_route","figcap":"四条合金化路径：合金焊丝/带极、药芯焊丝/药芯焊条、合金药皮/焊剂、合金粉末。","basis":"CHAP1 §4 合金过渡；练习题5","orig":-1},{"id":"w16","ch":"第四章","chname":"第四章 焊接热影响区的组织和性能","type":"essay","q":"焊接热循环对被焊金属近缝区的组织、性能有何影响？","ans":"热循环四参数：加热速度 ωH、最高温度 Tm、相变温度以上停留时间 tH、冷却速度 ωc（常用 t8/5）。\n① ωH 大→扩散相变滞后，Ac1、Ac3 及 Ac3-Ac1 升高，A 均质化不完全；② Tm 高→近缝区晶粒长大，过热区粗晶；③ tH 长→有利于 A 均质化，但温度过高、时间过长会晶粒严重长大；④ ωc 大→易得 M/B 硬组织，冷裂敏感性↑；ωc 小→晶粒粗大、软化。\n结果：HAZ 形成熔合区、过热区、正火区、不完全重结晶区的组织梯度；熔合区、过热区最薄弱；需控制线能量、预热、后热。","anstext":"热循环四参数：加热速度 ωH、最高温度 Tm、相变温度以上停留时间 tH、冷却速度 ωc（常用 t8/5）。\n① ωH 大→扩散相变滞后，Ac1、Ac3 及 Ac3-Ac1 升高，A 均质化不完全；② Tm 高→近缝区晶粒长大，过热区粗晶；③ tH 长→有利于 A 均质化，但温度过高、时间过长会晶粒严重长大；④ ωc 大→易得 M/B 硬组织，冷裂敏感性↑；ωc 小→晶粒粗大、软化。\n结果：HAZ 形成熔合区、过热区、正火区、不完全重结晶区的组织梯度；熔合区、过热区最薄弱；需控制线能量、预热、后热。","src":"课件","srcnote":"CHAP4 思考题1","full":10,"pts":[{"t":"热循环四参数：加热速度 ωH、最高温度 Tm、相变温度以上停留时间 tH、冷却速度 ωc（常用 t8/5）。","k":["ωH","Tm","tH","ωc","t8/5"]},{"t":"ωH 大→扩散相变滞后，Ac1、Ac3 及 Ac3-Ac1 升高，A 均质化不完全。","k":["加热速度","Ac1","Ac3","均质化"]},{"t":"Tm 高→近缝区晶粒长大，过热区粗晶；tH 长→有利 A 均质化，但温度过高、时间过长会晶粒严重长大。","k":["Tm","晶粒长大","过热区","tH"]},{"t":"ωc 大→易得 M/B 硬组织，冷裂敏感性↑；ωc 小→晶粒粗大、软化。","k":["冷却速度","马氏体","贝氏体","冷裂","软化"]},{"t":"结果：HAZ 形成熔合区、过热区、正火区、不完全重结晶区的组织梯度；熔合区、过热区最薄弱；需控制线能量、预热、后热。","k":["熔合区","过热区","正火区","不完全重结晶区","线能量","预热"]}],"figKey":"thermal","figcap":"焊接热循环四参数 ωH、Tm、tH、ωc；它们共同决定 HAZ 的晶粒尺寸、相变充分程度和冷却后组织。","basis":"CHAP4 §1/§3、思考题1","orig":-1},{"id":"w17","ch":"第四章","chname":"第四章 焊接热影响区的组织和性能","type":"essay","q":"低合金钢焊接时，HAZ 粗晶区奥氏体的均质化程度对冷却时相变有何影响？","ans":"低合金钢 HAZ 粗晶区加热温度高、奥氏体晶粒粗大；均质化程度取决于加热速度、峰值温度、高温停留时间及碳化物溶解。\n① 均质化程度高：A 中 C 和合金元素分布均匀，A 稳定性高、淬透性大，CCT 右移，冷却时易形成 M/B，硬度高、冷裂敏感性大。\n② 均质化不完全：存在富碳/贫碳区，局部 Ms 不同，相变温度范围宽，组织不均匀，可能出现块状 F、M-A 组元。\n③ 焊接快速加热：Cr、W、Mo、V 等碳化物形成元素未充分溶解，A 稳定性降低（40Cr CCT 左移、淬硬倾向↓）；45钢无碳化物溶解且晶粒粗化，CCT 右移、淬硬倾向↑。\n结果：同一粗晶区因均质化差异可得到不同 M/B/F 比例，性能不均。","anstext":"低合金钢 HAZ 粗晶区加热温度高、奥氏体晶粒粗大；均质化程度取决于加热速度、峰值温度、高温停留时间及碳化物溶解。\n① 均质化程度高：A 中 C 和合金元素分布均匀，A 稳定性高、淬透性大，CCT 右移，冷却时易形成 M/B，硬度高、冷裂敏感性大。\n② 均质化不完全：存在富碳/贫碳区，局部 Ms 不同，相变温度范围宽，组织不均匀，可能出现块状 F、M-A 组元。\n③ 焊接快速加热：Cr、W、Mo、V 等碳化物形成元素未充分溶解，A 稳定性降低（40Cr CCT 左移、淬硬倾向↓）；45钢无碳化物溶解且晶粒粗化，CCT 右移、淬硬倾向↑。\n结果：同一粗晶区因均质化差异可得到不同 M/B/F 比例，性能不均。","src":"课件","srcnote":"CHAP4 思考题2","full":6,"pts":[{"t":"粗晶区加热温度高、A 晶粒粗大；均质化程度取决于加热速度、峰值温度、高温停留时间及碳化物溶解。","k":["粗晶区","晶粒粗大","加热速度","峰值温度","碳化物"]},{"t":"均质化程度高→A 中 C/合金元素分布均匀，A 稳定性高、淬透性大，CCT 右移，易形成 M/B。","k":["均质化","稳定性","淬透性","CCT","马氏体","贝氏体"]},{"t":"均质化不完全→富碳/贫碳区，局部 Ms 不同，相变温度范围宽，组织不均匀，可能出现块状 F、M-A 组元；Cr/W/Mo/V 未充分溶解时 A 稳定性降低，40Cr CCT 左移，45钢 CCT 右移。","k":["不完全","富碳","Ms","M-A","40Cr","45"]}],"figKey":"haz_low","figcap":"HAZ 由熔合线向外温度递减；粗晶区靠近熔合线，峰值温度最高、晶粒最粗。","basis":"CHAP4 §2、思考题2","orig":-1},{"id":"w18","ch":"第四章","chname":"第四章 焊接热影响区的组织和性能","type":"essay","q":"探讨低合金钢焊接 HAZ 受应力应变时对相变的影响。","ans":"焊接 HAZ 在加热/冷却过程中受周围金属约束，产生热应力、组织应力和拘束应力，并伴随塑性应变。\n① 应力：拉应力促进马氏体相变、使 Ms 升高，压应力抑制相变；三向拉应力促进裂纹形核扩展。\n② 应变：塑性变形增加位错和空位密度，为相变提供形核位置、加速扩散，使相变温度区间变化；大应变还可诱发动态再结晶/软化。\n③ 焊接条件下应力应变与相变耦合：相变伴随体积膨胀可松弛部分热应力；但粗晶区+M+H+R 叠加时冷裂敏感性增大。\n结论：HAZ 组织转变不是单纯温度过程，应力应变会改变相变动力学、组织形态和裂纹倾向。","anstext":"焊接 HAZ 在加热/冷却过程中受周围金属约束，产生热应力、组织应力和拘束应力，并伴随塑性应变。\n① 应力：拉应力促进马氏体相变、使 Ms 升高，压应力抑制相变；三向拉应力促进裂纹形核扩展。\n② 应变：塑性变形增加位错和空位密度，为相变提供形核位置、加速扩散，使相变温度区间变化；大应变还可诱发动态再结晶/软化。\n③ 焊接条件下应力应变与相变耦合：相变伴随体积膨胀可松弛部分热应力；但粗晶区+M+H+R 叠加时冷裂敏感性增大。\n结论：HAZ 组织转变不是单纯温度过程，应力应变会改变相变动力学、组织形态和裂纹倾向。","src":"课件","srcnote":"CHAP4 思考题3","full":6,"pts":[{"t":"HAZ 受周围金属约束，产生热应力、组织应力、拘束应力，并伴随塑性应变。","k":["热应力","组织应力","拘束应力","塑性应变"]},{"t":"拉应力促进马氏体相变、使 Ms 升高，压应力抑制相变；三向拉应力促进裂纹形核扩展。","k":["拉应力","马氏体","Ms","压应力","裂纹"]},{"t":"塑性变形增加位错/空位密度，为相变提供形核位置、加速扩散，改变相变温度区间；相变体积膨胀可松弛部分热应力，但粗晶区+M+H+R 叠加时冷裂敏感性增大。","k":["位错","空位","形核","扩散","体积膨胀","冷裂"]}],"figKey":"haz_quench","figcap":"易淬火钢 HAZ 的完全淬火区、不完全淬火区和回火区；应力应变会改变这些区的相变动力学和裂纹倾向。","basis":"CHAP4 §2 应力应变、思考题3","orig":-1},{"id":"w19","ch":"第四章","chname":"第四章 焊接热影响区的组织和性能","type":"essay","q":"焊接条件下组织转变与热处理条件下组织转变有何不同？","ans":"① 加热速度快（几十~几百倍）：扩散相变滞后，Ac1、Ac3 及 Ac3-Ac1 升高，A 均质化不完全；热处理加热慢，相变接近平衡。\n② 加热温度高（高 100~200℃）：近缝区晶粒粗大；热处理温度较低、晶粒控制好。\n③ 高温停留短（手弧 4~20s、埋弧 30~100s）：扩散、碳化物溶解、A 均质化不充分；热处理保温时间长，组织均匀。\n④ 冷却快、非平衡：易得 M/B 等淬硬组织；热处理可控制冷却得 F+P/贝氏体等平衡/近平衡组织。\n⑤ 局部加热+复杂应力：组织转变在应力应变下进行，HAZ 组织梯度大；热处理整体加热，组织均匀、应力小。\n典型：45钢焊接 CCT 右移、淬硬↑；40Cr 焊接 CCT 左移、淬硬↓。","anstext":"① 加热速度快（几十~几百倍）：扩散相变滞后，Ac1、Ac3 及 Ac3-Ac1 升高，A 均质化不完全；热处理加热慢，相变接近平衡。\n② 加热温度高（高 100~200℃）：近缝区晶粒粗大；热处理温度较低、晶粒控制好。\n③ 高温停留短（手弧 4~20s、埋弧 30~100s）：扩散、碳化物溶解、A 均质化不充分；热处理保温时间长，组织均匀。\n④ 冷却快、非平衡：易得 M/B 等淬硬组织；热处理可控制冷却得 F+P/贝氏体等平衡/近平衡组织。\n⑤ 局部加热+复杂应力：组织转变在应力应变下进行，HAZ 组织梯度大；热处理整体加热，组织均匀、应力小。\n典型：45钢焊接 CCT 右移、淬硬↑；40Cr 焊接 CCT 左移、淬硬↓。","src":"课件","srcnote":"CHAP4 思考题4","full":8,"pts":[{"t":"加热速度快（几十~几百倍）：扩散相变滞后，Ac1、Ac3 及 Ac3-Ac1 升高，A 均质化不完全；热处理加热慢，接近平衡。","k":["加热速度快","Ac1","Ac3","均质化","平衡"]},{"t":"加热温度高（高100~200℃）：近缝区晶粒粗大；热处理温度较低、晶粒控制好。","k":["温度高","100","200","晶粒粗大"]},{"t":"高温停留短（手弧4~20s、埋弧30~100s）：扩散、碳化物溶解、A 均质化不充分；热处理保温时间长、组织均匀。","k":["停留时间","4","20","30","100","保温"]},{"t":"冷却快、非平衡：易得 M/B 淬硬组织；局部加热+复杂应力使 HAZ 组织梯度大；45钢 CCT 右移、40Cr CCT 左移。","k":["冷却快","马氏体","贝氏体","应力","45","40Cr"]}],"figKey":"cct","figcap":"焊接 CCT 与热处理 CCT 的差异：焊接加热快、停留短、冷却非平衡，CCT 曲线和淬硬倾向随钢种不同而偏移。","basis":"CHAP4 §2 组织转变特点、思考题4","orig":-1},{"ch":"增材制造","chname":"增材制造技术","type":"mcq","q":"与传统切削的材料去除和模具成形的材料变形相比，增材制造的本质特征是（　）","options":["利用模具使材料成形","用刀具去除多余材料","自下 me":"增材制造技术","type":"mcq","q":"SLM用金属粉末含氧量过高时，主要危害是（　）","options":["提高粉末流动性","降低液态金属润湿性，导致分层和裂纹","使激光波长变短","使粉末密度无限增大"],"ans":"B","id":"mz23","orig":-1,"ansText":"降低液态金属润湿性，导致分层和裂纹"},{"ch":"增材制造","chname":"增材制造技术","type":"mcq","q":"SLM工艺流程的正确顺序是（　）","options":["模型准备→材料准备→加工→工作腔准备→后处理","加工→材料准备→模型准备→工作腔准备→后处理","材料准备→工作腔准备→模型准备→加工→后处理","后处理→材料准备→工作腔准备→模型准备→加工"],"ans":"C","id":"mz24","orig":-1,"ansText":"材料准备→工作腔准备→模型准备→加工→后处理"},{"ch":"增材制造","chname":"增材制造技术","type":"fill","q":"增材制造依据三维CAD设计数据，采用离散材料逐层累加制造实体零件，是一种“____”的材料累加制造过程。","ans":"自下而上","id":"fz01","orig":-1},{"ch":"增材制造","chname":"增材制造技术","type":"fill","q":"从加工过程中材料量的变化看，制造技术可分为材料去除（减材制造）、材料成形（等材制造）和____。","ans":"增材制造","id":"fz02","orig":-1},{"ch":"增材制造","chname":"增材制造技术","type":"fill","q":"增材制造的工作过程可划分为数据处理和____两个阶段。","ans":"叠层制作","id":"fz03","orig":-1},{"ch":"增材制造","chname":"增材制造技术","type":"fill","q":"光固化法国际上通称stereo lithography，简称____。","ans":"SL（或SLA）","id":"fz04","orig":-1},{"ch":"增材制造","chname":"增材制造技术","type":"fill","q":"光固化系统光源主要采用波长为____nm的紫外光。","ans":"325~355","id":"fz05","orig":-1},{"ch":"增材制造","chname":"增材制造技术","type":"fill","q":"光固化成形全过程一般分为前处理、分层叠加成形和____三个主要步骤。","ans":"后处理","id":"fz06","orig":-1},{"ch":"增材制造","chname":"增材制造技术","type":"fill","q":"紫外光照射光固化树脂时，被照射部分发生____反应而固化。","ans":"聚合","id":"fz07","orig":-1},{"ch":"增材制造","chname":"增材制造技术","type":"fill","q":"SLM利用高能激光将金属粉末____后快速冷却凝固，得到高致密度、高精度零件。","ans":"完全熔化","id":"fz08","orig":-1},{"ch":"增材制造","chname":"增材制造技术","type":"fill","q":"用于SLM成形的金属粉末，其氧含量一般要求在____ppm以下。","ans":"1000","id":"fz09","orig":-1},{"ch":"增材制造","chname":"增材制造技术","type":"fill","q":"SLM技术适合采用____组分体系级配，以达到较高的铺粉致密度。","ans":"二","id":"fz10","orig":-1},{"ch":"增材制造","chname":"增材制造技术","type":"fill","q":"激光波长越____，金属对激光的吸收率越高。","ans":"短","id":"fz11","orig":-1},{"ch":"增材制造","chname":"增材制造技术","type":"fill","q":"SLM工艺流程包括材料准备、工作腔准备、模型准备、加工及____。","ans":"零件后处理","id":"fz12","orig":-1},{"ch":"增材制造","chname":"增材制造技术","type":"term","q":"增材制造","ans":"依据三维CAD设计数据，采用液体、粉末、丝等离散材料逐层累加制造实体零件的制造技术；与传统减材、等材制造不同，是“自下而上”的材料累加过程。","id":"tz01","orig":-1},{"ch":"增材制造","chname":"增材制造技术","type":"term","q":"光固化法（SLA）","ans":"利用光能的化学和热作用使液态光敏树脂固化，控制光能形状逐层固化树脂、堆积成形三维实体的方法；国际上通称stereolithography（SL），常按设备名称称为SLA法。","id":"tz02","orig":-1},{"ch":"增材制造","chname":"增材制造技术","type":"term","q":"层间台阶效应","ans":"光固化成形中因分层制造在制件曲面留下的台阶状痕迹，SLA制件表面一般约为0.05～0.1mm，需通过打磨等后处理改善表面质量。","id":"tz03","orig":-1},{"ch":"增材制造","chname":"增材制造技术","type":"term","q":"激光选区熔化（SLM）","ans":"利用高能激光热源将金属粉末完全熔化后快速冷却凝固，逐层成形高致密度、高精度金属零部件的增材制造技术。","id":"tz04","orig":-1},{"ch":"增材制造","chname":"增材制造技术","type":"term","q":"振实密度","ans":"粉末经振动摇实后的密度。SLM铺粉时铺粉辊有振动和轻压作用，采用振实密度比松装密度更合理；铺粉密度越高，成形件致密度通常越高。","id":"tz05","orig":-1},{"ch":"增材制造","chname":"增材制造技术","type":"term","q":"粒径分布","ans":"不同粒径颗粒在粉末中所占的分量。SLM可通过二组分体系级配优化粒径分布，提高铺粉致密度和成形件致密度。","id":"tz06","orig":-1},{"id":"ez01","ch":"增材制造","chname":"增材制造技术","type":"essay","q":"增材制造的定义是什么？它与减材制造、等材制造有何区别？工作过程分为哪两个阶段？","ans":"增材制造是依据三维CAD设计数据，采用液体、粉末、丝等离散材料逐层累加制造实体零件的制造技术，是一种“自下而上”的材料累加过程。与减材制造利用刀具或电化学方法去除毛坯材料、等材制造利用模具使液体或固体材料成形不同，增材制造以材料逐层累加为本质特征。其工作过程分为两个阶段：数据处理阶段对三维CAD模型进行分层“切片”，把三维数据分解为若干二维轮廓数据；叠层制作阶段按二维数据逐层制作与分层厚度相同的薄片实体，并将薄片自下而上叠加成三维实体。","anstext":"增材制造是依据三维CAD设计数据，采用液体、粉末、丝等离散材料逐层累加制造实体零件的制造技术，是一种“自下而上”的材料累加过程。与减材制造利用刀具或电化学方法去除毛坯材料、等材制造利用模具使液体或固体材料成形不同，增材制造以材料逐层累加为本质特征。其工作过程分为两个阶段：数据处理阶段对三维CAD模型进行分层“切片”，把三维数据分解为若干二维轮廓数据；叠层制作阶段按二维数据逐层制作与分层厚度相同的薄片实体，并将薄片自下而上叠加成三维实体。","src":"课件","srcnote":"第四章 增材制造技术 4.1.1/4.1.2","full":8,"pts":[{"t":"增材制造依据三维CAD设计数据，采用液体、粉末、丝等离散材料逐层累加制造实体零件，是“自下而上”的材料累加过程。","k":["三维CAD","离散材料","逐层累加","自下而上"]},{"t":"减材制造是材料去除，等材制造是通过模具使材料成形（材料变形）；增材制造是材料逐层累加，三者材料量变化方式不同。","k":["减材制造","材料去除","等材制造","模具","增材制造"]},{"t":"工作过程分两个阶段：数据处理——对三维CAD模型分层切片，分解为二维轮廓数据；叠层制作——按二维数据逐层制作薄片并叠加成三维实体。","k":["数据处理","切片","二维轮廓","叠层制作","三维实体"]}],"basis":"第四章 4.1 增材制造概念与工作过程","orig":-1},{"id":"ez02","ch":"增材制造","chname":"增材制造技术","type":"essay","q":"光固化成形的工作原理是什么？成形全过程包括哪些步骤？后处理为什么必须排出残留树脂？","ans":"光固化法利用光能的化学和热作用使液态光敏树脂固化，控制光能的形状逐层固化树脂，堆积成形出所需的三维实体零件；国际上通称stereolithography（SL），也常称为SLA法。成形全过程分为前处理、分层叠加成形和后处理：前处理包括三维模型构造、模型近似处理、选择成形方向、切片处理和生成支撑结构；分层叠加成形由模型断面逐层制作并叠加；后处理包括取出制件、排出未固化树脂、表面清洗、后固化、去除支撑、机械加工和打磨。必须排出残留树脂，是因为残留树脂会在后固化或储存过程中发生暗反应，固化收缩并引起制件变形；内部封闭时应设计排液孔或成形后钻孔排液。SLA制件表面还会留下约0.05～0.1mm的层间台阶，需要打磨。","anstext":"光固化法利用光能的化学和热作用使液态光敏树脂固化，控制光能的形状逐层固化树脂，堆积成形出所需的三维实体零件；国际上通称stereolithography（SL），也常称为SLA法。成形全过程分为前处理、分层叠加成形和后处理：前处理包括三维模型构造、模型近似处理、选择成形方向、切片处理和生成支撑结构；分层叠加成形由模型断面逐层制作并叠加；后处理包括取出制件、排出未固化树脂、表面清洗、后固化、去除支撑、机械加工和打磨。必须排出残留树脂，是因为残留树脂会在后固化或储存过程中发生暗反应，固化收缩并引起制件变形；内部封闭时应设计排液孔或成形后钻孔排液。SLA制件表面还会留下约0.05～0.1mm的层间台阶，需要打磨。","src":"课件","srcnote":"第四章 增材制造技术 4.2.1/4.2.3","full":10,"pts":[{"t":"利用光能的化学和热作用使液态光敏树脂固化，控制光能形状逐层固化树脂，堆积成形三维实体；国际上通称stereolithography（SL/SLA）。","k":["光能","光敏树脂","固化","逐层","SLA"]},{"t":"全过程分前处理、分层叠加成形、后处理：前处理包括建模、近似处理、选择成形方向、切片、生成支撑；分层叠加由模型断面逐层制作并叠加。","k":["前处理","分层叠加","后处理","切片","支撑"]},{"t":"后处理包括取出制件、排出未固化树脂、表面清洗、后固化、去除支撑、机械加工和打磨；层间台阶约0.05~0.1mm。","k":["排出","清洗","后固化","去支撑","打磨","0.05"]},{"t":"必须排出残留树脂，因为残留树脂在后固化或储存中发生暗反应，固化收缩引起制件变形；内部封闭时需在设计时开排液孔或成形后钻孔。","k":["暗反应","收缩","变形","排液孔"]}],"basis":"第四章 4.2 光固化制造技术","orig":-1},{"id":"ez03","ch":"增材制造","chname":"增材制造技术","type":"essay","q":"SLM对金属粉末有哪些主要要求？粉末的球形度、粒径分布、流动性和含氧量如何影响成形质量？","ans":"SLM对金属粉末的堆积特性、粒径分布、颗粒形状、流动性、含氧量和激光吸收率均有较严格的要求。铺粉时宜采用振实密度；颗粒球形度增加、表面更光滑时，粉末床孔隙率降低。气雾化粉末接近球形，旋转电极法制备的粉末球形度更高、表面更光洁、孔隙率更低。采用二组分体系级配可提高铺粉致密度；旋转电极粉末颗粒间以滚动摩擦为主，流动性好，与气雾化粉混合可利用滚珠效应改善流动性。粉末含氧量一般要求≤1000ppm；表面氧化膜会降低液态金属与基板或已凝固部分的润湿性，导致制件分层和裂纹、降低致密度。激光波长越短，金属对激光的吸收率越高。","anstext":"SLM对金属粉末的堆积特性、粒径分布、颗粒形状、流动性、含氧量和激光吸收率均有较严格的要求。铺粉时宜采用振实密度；颗粒球形度增加、表面更光滑时，粉末床孔隙率降低。气雾化粉末接近球形，旋转电极法制备的粉末球形度更高、表面更光洁、孔隙率更低。采用二组分体系级配可提高铺粉致密度；旋转电极粉末颗粒间以滚动摩擦为主，流动性好，与气雾化粉混合可利用滚珠效应改善流动性。粉末含氧量一般要求≤1000ppm；表面氧化膜会降低液态金属与基板或已凝固部分的润湿性，导致制件分层和裂纹、降低致密度。激光波长越短，金属对激光的吸收率越高。","src":"课件","srcnote":"第四章 增材制造技术 4.3.1/4.3.2","full":10,"pts":[{"t":"SLM对粉末的堆积特性、粒径分布、颗粒形状、流动性、含氧量和激光吸收率均有较严格要求。","k":["堆积特性","粒径分布","颗粒形状","流动性","含氧量","吸收率"]},{"t":"铺粉宜用振实密度；球形度增加、表面更光滑时孔隙率降低；气雾化粉接近球形，旋转电极粉球形度更高、表面更光洁、孔隙率更低。","k":["振实密度","球形度","孔隙率","气雾化","旋转电极"]},{"t":"采用二组分粒径级配可提高铺粉致密度；旋转电极粉滚动摩擦小、流动性好，混合后可利用滚珠效应改善流动性。","k":["二组分","级配","流动性","滚珠效应"]},{"t":"粉末含氧量一般要求≤1000ppm；氧化膜降低液态金属与基板/已凝固部分的润湿性，导致分层和裂纹、降低致密度；激光波长越短，金属吸收率越高。","k":["1000ppm","氧化膜","润湿性","分层","裂纹","波长"]}],"basis":"第四章 4.3 激光选区熔化技术","orig":-1},{"id":"ez04","ch":"增材制造","chname":"增材制造技术","type":"essay","q":"增材制造技术有哪些主要特点和局限？其发展趋势是什么？","ans":"增材制造的主要特点：适合复杂结构的快速制造，把三维实体加工变为若干二维平面加工，可制造传统方法难加工甚至无法加工的结构；适合个性化定制和小批量生产；适合高附加值产品的制造。主要局限：技术成熟度低于传统机加工、铸锻焊和模具工艺；材料种类有限、制件精度较低；加工速率较低、零件尺寸受限（最大约2m）、成本高、稳定性差；目前难以替代传统制造工艺，而是传统技术的发展和补充。发展趋势：由快速原型向功能零件制造发展；由常规尺度制造向微纳和大型化等多尺度制造拓展；由工业应用型向日常消费型发展。","anstext":"增材制造的主要特点：适合复杂结构的快速制造，把三维实体加工变为若干二维平面加工，可制造传统方法难加工甚至无法加工的结构；适合个性化定制和小批量生产；适合高附加值产品的制造。主要局限：技术成熟度低于传统机加工、铸锻焊和模具工艺；材料种类有限、制件精度较低；加工速率较低、零件尺寸受限（最大约2m）、成本高、稳定性差；目前难以替代传统制造工艺，而是传统技术的发展和补充。发展趋势：由快速原型向功能零件制造发展；由常规尺度制造向微纳和大型化等多尺度制造拓展；由工业应用型向日常消费型发展。","src":"课件","srcnote":"第四章 增材制造技术 4.1.3/4.1.6","full":10,"pts":[{"t":"特点：适合复杂结构快速制造，将三维加工变为二维平面加工，可制造传统方法难加工或无法加工的结构；适合个性化定制和小批量；适合高附加值产品。","k":["复杂结构","二维平面","个性化","小批量","高附加值"]},{"t":"局限：技术成熟度低于传统机加工、铸锻焊和模具工艺；材料种类有限、制件精度较低；加工速率低、尺寸受限、成本高、稳定性差。","k":["成熟度","材料种类","精度","尺寸","成本","稳定性"]},{"t":"增材制造目前难以替代传统制造工艺，而是传统技术的发展和补充。","k":["难以替代","补充"]},{"t":"趋势：由快速原型向功能零件制造发展；由常规尺度向微纳和大型化等多尺度拓展；由工业应用型向日常消费型发展。","k":["快速原型","功能零件","微纳","大型化","日常消费"]}],"basis":"第四章 4.1 增材制造特点与发展趋势","orig":-1}]
const SPEED_DATA = ["焊冶是“再熔炼”，普冶是“提炼”；原材料和目的均不同。","焊条加热三大热源：电阻热、电弧热、化学反应热（仅占1%～3%，可忽略）。","碱性焊条以短路过渡+大颗粒过渡为主，酸性焊条以细颗粒过渡+附壁过渡为主。","保护方式五种：渣保护、气保护、气渣联合保护、真空保护、自保护。","反应区三段：药皮（先蒸发水分）→熔滴（1800～2400℃、10³～10⁴cm²/kg、0.01～0.1s）→熔池（1600～1900℃、3～130cm²/kg、3～8s）。","氮源空气、氢源水分；控氮靠保护+Ti/Al/Zr，控氢靠烘干+氟化物，控氧靠工艺+冶金。","氢脆是暂态现象（可时效消除）；氢白点（鱼眼）直径0.5～3mm；氢致冷裂纹三要素：H、M、R。","熔渣碱度B＞1碱性、B＜1酸性；CaF2降粘度、降表面张力；表面张力金属键最大。","脱氧三步：先期（药皮固态加热，Al、Ti大量烧损）→沉淀（熔滴与熔池）→扩散（降温、酸性渣有利）。","硫害热裂（Fe+FeS共晶985℃），磷害冷脆热裂（Fe+Fe3P共晶1050℃）；脱硫常用Mn。","合金过渡系数η：元素越活泼越低、沸点低越低；Kb↑η↓；I↑η↓；氩弧焊η较大。","E4303（J422）钛钙型酸性、气渣联合保护；E5015（J507）低氢型碱性、塑韧性好、用于重要结构。","药皮“七剂”：稳弧、造渣、造气、脱氧、合金、粘结、增塑。","立、仰、横焊要“短渣”——凝固温度范围窄、快速凝固；氧化铁型长渣不行。","飞溅影响因素：粘度↑、电流↑、水分↑、电压↑、交流＞直流、大颗粒过渡。","焊剂=焊条药皮、焊丝=焊条焊芯；焊剂三种制造方法：熔炼、粘结（陶质，400℃以下）、烧结（400～1000℃）。","焊剂质量：含水量≤0.10%、机械夹杂物≤0.30%、S≤0.060%、P≤0.080%。","熔池凝固五特点：过热度大、过冷度大、烧损大、结晶速度快、运动态结晶。","结晶五形态随成分过冷增大：平面→胞状→胞状树枝→树枝→等轴。","偏析三种：显微（枝晶间）、区域（杂质推向中心）、层状（结晶潜热周期性变化）。","气孔三兄弟：氢-表面喇叭口、氮-表面蜂窝成堆、CO-内部条虫沿柱状晶。","铁素体四类：PF晶界、FSP侧板条（无碳贝氏体）、AF针状（500℃）、FGF细晶（贝氏铁素体）。","上贝羽毛状、下贝针状强韧；板条马氏体位错、片状马氏体孪晶（C≥0.4%）。","焊接缺欠六类：裂纹、孔穴、固体夹杂、未熔合及未焊透、形状和尺寸不良、其他；裂纹最危险、绝对不允许存在。","热循环四参数：加热速度、最高温度、相变以上停留时间、冷却速度（t8/5等）。","手工焊高温停留4～20s、埋弧自动焊30～100s；加热快几十到几百倍、温度高100～200℃。","45钢CCT右移（淬硬↑，无碳化物溶解+组织粗化）；40Cr CCT左移（淬硬↓，Cr未充分溶入奥氏体）。","不易淬火钢HAZ分区：熔合区（窄）、过热区（韧性低）、相变重结晶区（细）、不完全重结晶区（不均）。","碳当量公式适用性：CE(IIW)适用σb=400～700MPa，Ceq(WES)适用σb=500～1000MPa，Pcm适用C≤0.17%。","HAZ脆化六类：粗晶、组织、析出、热应变时效（动应变时效200～400℃）、氢、石墨；M-A组元是组织脆化主因之一。","动应变时效脆化在200～400℃；调质钢回火温度越低、焊后软化越严重。","增材制造：三维CAD→分层切片→离散材料逐层累加，是“自下而上”的材料累加；与减材、等材并列。","五种常规增材制造：SLA 1986 Hull；LOM 1988 Feygin；SLS 1989 Deckard；FDM 1992 Crump；3DP 1993 Sachs。","光固化：紫外光325~355nm使光敏树脂聚合；XY扫描便宜且可大幅面但慢，振镜快但贵、范围小；后处理排残树脂防暗反应变形，层间台阶0.05~0.1mm。","SLM粉末：铺粉用振实密度；球形度↑孔隙率↓；气雾化粉近球形、旋转电极粉更光洁；二组分体系级配；氧≤1000ppm；短波长吸收率高。","SLM流程：材料准备→工作腔准备→模型准备（STL切片）→加工→后处理；优点细晶高致密，缺点球化/翘曲/裂纹、尺寸受限、参数复杂。"];
